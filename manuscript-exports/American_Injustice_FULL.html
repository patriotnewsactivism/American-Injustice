<p>Which of those two categories East's December 7, 2021 decision falls into cannot be determined from the record available. What can be done, and has been done consistently across every chapter that touches a commitment, arrest, or detention in my life, is to lay out the timing plainly and let the reader draw their own conclusion, informed by everything else already established about East's credibility on matters directly relevant to this case: a sheriff who would later be shown, through his own contradictory sworn testimony about video preservation practices detailed in Chapters 10 and 13, to have told two different courts two incompatible things about the same category of evidence.</p>
<p>This would not be the last time a Mississippi official sought my commitment. A second commitment, sought by Susan Beard in February 2022 and detailed at the start of Part III, would follow within roughly two months — meaning that in the space of a single winter, two separate officials, invoking the same general statutory mechanism, would seek to have me involuntarily confined. Two commitments within ten weeks of each other, sought by two different people, is either evidence of a genuine and worsening crisis, or evidence that commitment had become, for at least some officials in my orbit, a reliably available tool whenever the ordinary channels of legal conflict reached an impasse. Both readings are laid out here because the record does not conclusively establish which is correct, and because — as stated at the top of this chapter — that is exactly the kind of claim this account has tried consistently not to overstate.</p>
<p>A pattern is emerging by the end of Part II, and it is worth naming plainly before moving into Part III, where the second, separate aggravated stalking case against me takes shape. Nearly everything I've described from 2017 through 2021 ends the same way: I raise or act on a documented grievance against Lafayette County's institutions — a bill of sale the state's own charge contradicts, a duress-signed order, a missing federal form, an unexplained judge swap — and the institutional response is not correction, but escalation: a longer bond, a blocked car, a barred courthouse, a psychiatric hold. This does not, on its own, prove bad faith in any single instance. It does establish, across five years and multiple separate officials, a consistent institutional reflex worth carrying forward into Part III, where in 2022 the stakes rise again — a second aggravated stalking charge, built this time not on a twelve-day-old rifle purchase but on the very restraining order I signed under duress back in Chapter 5, still sitting on the books five years later, waiting.</p></section><section class="chapter"><p class="cnum">Chapter 17</p><h1>A Son Born In Confinement</h1><p>On February 9, 2022, I drove to the Lafayette County Sheriff's Department to request the financial records of the Lafayette County Law Enforcement Officers Association — a 501(c)(3) nonprofit I would later confirm through public IRS records was co-founded, in 2000, by Sheriff Joey East himself alongside Deputy Sheriff Scott Mills. I spoke with both men in person, around 2:45 in the afternoon, and asked to see the organization's financial reporting — not out of idle curiosity, but because a nonprofit run by the two men most central to my own legal troubles, disclosing nothing to the public for over twenty years, was exactly the kind of thing I believed deserved scrutiny. I was told it would take approximately a week to a week and a half to produce the records. The very next day, February 10, 2022, I was taken into custody and involuntarily committed for the second time — this affidavit executed by Susan Beard rather than Sheriff Joey East. I said, on camera, the same day I made the request: "it's a little bit more than a coincidence that on two separate occasions, the day after certain information is sought, I end up getting committed." I am not writing that observation into this book with the benefit of hindsight — I said it in real time, before I had any way of knowing it would happen a third time in the pattern this book documents elsewhere.</p>
<p>I have since confirmed the substance of what I suspected that day. Public IRS filing records show the Lafayette County Law Enforcement Officers Association, EIN 31-1703483, has never once filed a full Form 990 or Form 990-EZ in the entire period covered by ProPublica's Nonprofit Explorer database, which indexes filings back to 2011. Its current IRS filing-requirement code is the one reserved for organizations reporting gross receipts under the small-organization threshold — the tier that requires only a Form 990-N "e-Postcard," which discloses no revenue, no expenses, and no officer compensation to the public. For at least fourteen years, an organization co-founded and controlled by the sheriff who sought my first commitment has never been required to show anyone a number. I don't know what, if anything, that filing pattern is hiding. I know only that I asked to see it, and that the next day I was no longer in a position to keep asking.</p>
<p>Eight days after I was recommitted, on February 17, 2022, my son Ethan was born by emergency cesarean section — while I myself remained physically confined under that same commitment within a psychiatric facility.</p>
<p>Some facts carry a weight that requires no narrative exaggeration to be understood. I was not present for the emergency birth of my son Ethan because the state of Mississippi held me in physical custody at a mental health facility. Whatever medical or legal justification was offered for that detention — Susan Beard's underlying affidavit is absent from accessible court records, making its specific clinical claims impossible to analyze directly — the practical result was absolute: I missed the birth of my own child under high-risk surgical circumstances, confined by the same state apparatus that had already committed me three months earlier, in December 2021, within twenty-four hours of an intense confrontation over judicial record irregularities in Lafayette County.</p>
<p>To understand what it means to be held under an involuntary civil commitment during a family medical emergency requires examining the administrative mechanics of Mississippi's commitment statutes. Under Mississippi Code § 41-21-61 and its companion provisions, the civil commitment process begins when an interested party, family member, or law enforcement officer signs a sworn affidavit alleging that an individual poses a substantial likelihood of physical harm to himself or others, or is in need of immediate treatment. Once that affidavit is filed with the chancery court, the machinery of state power moves with extraordinary speed. Law enforcement or court officers execute a detention order, taking the individual into physical custody and transporting him to a holding center or psychiatric facility for mandatory clinical evaluation by designated medical professionals.</p>
<p>During this mandatory evaluation window, the committed individual possesses no operational freedom or personal agency. Mobility is restricted entirely to locked medical wards, personal communications are monitored or restricted, and all normal legal, professional, and personal responsibilities are involuntarily suspended. There are no temporary passes granted for medical emergencies involving immediate family members, no administrative furloughs to stand beside a spouse undergoing major surgical procedures, and no emergency procedural mechanisms allowing a detainee to challenge the necessity of his ongoing physical restraint in real time before a judge. When my wife was rushed into emergency surgery for a C-section on February 17, 2022, I was barred from leaving the facility grounds. I could not hold her hand in the operating room, I could not consult with the medical staff, and I could not hold my newborn son Ethan in his first moments of life.</p>
<p>The psychological toll of that enforced absence is difficult to quantify. Involuntary commitment does not merely restrict physical movement; it strips a person of agency at the precise moment when duty, affection, and natural instinct demand presence. Sitting inside a locked facility while an emergency surgical procedure takes place miles away creates a sense of profound powerlessness. The state's administrative apparatus functions with cold indifference to personal milestones, treating a father's presence at his child's birth as entirely subordinate to the procedural mechanics of civil detention. Every hour spent pacing a locked corridor, waiting for word through short phone calls or relayed messages from medical staff, reinforced the reality that state power had effectively separated me from my family at a moment of maximum vulnerability.</p>
<p>Two involuntary commitments within ninety days — December 2021 and February 2022 — both landing at moments of acute legal or personal consequence, form a pattern that demands rigorous and balanced scrutiny. Commitments do not occur in a vacuum, and my documented conduct throughout late 2021 and early 2022 — the aggressive public confrontations, the escalating court filings, the drone incident with a minor present detailed across Part II, and the visible signs of personal strain — reflects the actions of a man living under relentless legal, personal, and financial pressure.</p>
<p>A reader sympathetic to local institutions and law enforcement agencies could make a coherent argument regarding these events. From an institutional perspective, two psychiatric commitments in rapid succession represent the predictable outcome of an unaddressed mental health crisis. If the underlying behavioral instability, volatile public confrontations, and perceived threats that prompted Sheriff Joey East's December 2021 affidavit had not been resolved, a second commitment in February 2022 was not an act of state malice, but rather the standard protective response of a civil commitment framework responding to an ongoing situation.</p>
<p>Conversely, an observer examining these events through the lens of my documented disputes with Lafayette County officials could draw a strikingly different conclusion. The December 2021 commitment was initiated directly by Sheriff Joey East within hours of my challenging judicial record discrepancies in open court. The February 2022 commitment was executed days before the birth of my child, effectively neutralizing my ability to engage in public advocacy or legal defense during a critical window of time. From this critical viewpoint, the state apparatus demonstrated remarkable speed and vigilance when using psychiatric detention to remove a persistent critic from the public square, while showing complete indifference toward the missing evidence, spoliated records, and procedural violations that I had repeatedly brought to light.</p>
<p>Both interpretations draw from documented events, and I will not attempt to resolve definitively which narrative is complete. What can be stated without qualification is the human cost exacted by these institutional actions, regardless of the underlying clinical motivations: a mother forced to undergo emergency surgical delivery without her husband present, a newborn infant Ethan entering the world without his father to welcome him, and a father left in a locked facility, forced to process the arrival of his son through the cold, distant realities of state custody.</p>
<p>Once I was finally released from confinement, the experience of being twice committed, combined with the loss of such a foundational personal moment, crystallized my resolve to challenge the institutional machinery that had governed my life for five years. I turned away from purely defensive maneuvers in state court. On April 6, 2022, roughly seven weeks after missing my son Ethan's birth, I filed my first federal civil rights lawsuit against Lafayette County and the network of officials whose actions had defined this entire ordeal.</p></section><section class="chapter"><p class="cnum">Chapter 18</p><h1>The Federal Lawsuit</h1><p>On April 6, 2022, I filed my first federal civil rights lawsuit against Lafayette County and the network of local officials who populate every stage of this conflict — docketed as Reardon v. Lafayette County MS et al., case 3:22-CV-50-SA-JMV, in the United States District Court for the Northern District of Mississippi, assigned to District Judge Sharion Aycock. I filed the complaint pro se, without legal representation, roughly seven weeks after missing the emergency cesarean birth of my son Ethan while detained under Susan Beard's February 9 involuntary commitment affidavit, and approximately four and a half years after the twelve-day rifle impossibility in 2017 that initiated my conflict with Lafayette County's law enforcement apparatus.</p>
<p>Looking back at the trajectory of my legal battles, there is a compelling case to be made that filing this federal action was the single most strategic decision I made across this entire timeline. At the same time, there is an equally persuasive argument that, from a procedural standpoint, the lawsuit was structurally doomed to fail from the moment it hit the federal docket. Both conclusions are accurate, and understanding why requires examining how federal civil rights litigation functions for a self-represented litigant.</p>
<p>The argument for the lawsuit's central importance rests on the structural limits of state court proceedings. For nearly five years, my interaction with Mississippi state courts had been almost entirely defensive. In state court, a citizen accused of a crime or targeted by protective orders is confined to reacting within the narrow boundaries of criminal defense or domestic law. State court offered virtually no procedural mechanism to hold municipal institutions, law enforcement agencies, or individual officers accountable for systemic misconduct. It provided, at best, a forum to challenge specific criminal charges or contest evidentiary rulings, but it could not address the overarching pattern of retaliatory arrests, spoliated digital evidence, contradictory sworn testimony, and strategically timed psychiatric commitments documented across Parts I and II.</p>
<p>Filing a federal civil rights complaint under Title 42, United States Code, Section 1983 represented my first formal attempt to shift from defense to offense. Section 1983 was enacted by Congress during Reconstruction specifically to provide a federal remedy against state and local officials who, under color of state law, deprive individuals of rights, privileges, or immunities secured by the United States Constitution. By filing in federal court and naming Lafayette County alongside its law enforcement personnel as civil defendants, I sought to force the local institutional apparatus to answer for five years of continuous actions in a federal forum governed by federal constitutional standards. Moreover, a federal civil rights action opened the potential for federal discovery mechanisms — subpoenas, depositions under oath, and mandatory production of internal law enforcement communications — that had been consistently denied or restricted in local state court proceedings.</p>
<p>For a citizen without a law degree, preparing and filing a pro se federal lawsuit represents an immense procedural undertaking. Navigating the Federal Rules of Civil Procedure requires mastering strict technical requirements: drafting a complaint under Rule 8(a) that presents a concise yet factually detailed statement of claims, structuring individual counts against specific defendants, satisfying service of process rules under Rule 4, and managing filing fee requirements or submitting an in forma pauperis application under 28 U.S.C. § 1915. Translating five years of complex, multi-agency interactions, criminal charges, spoliated evidence, and involuntary commitments into formal legal pleadings without legal training is a daunting task, especially while dealing with severe financial strain and the emotional weight of missing my son's birth.</p>
<p>The legal hurdles facing a pro se Section 1983 complaint against local government entities and law enforcement officers are extraordinary, explaining why the suit faced steep structural headwinds from its inception. Federal civil rights jurisprudence is heavily guarded by doctrines designed to protect public officials and municipal entities from civil liability, creating formidable barriers for any self-represented litigant.</p>
<p>First, individual law enforcement officers and county officials are shielded by the doctrine of qualified immunity. Under established Supreme Court precedent, qualified immunity protects government officials from liability for civil damages unless a plaintiff can demonstrate that the officer's conduct violated a clearly established statutory or constitutional right that every reasonable official would have known. Overcoming qualified immunity requires precise legal argument, detailed factual pleadings, and direct citations to controlling judicial precedent — standards that present immense challenges for a layperson navigating federal procedure independently.</p>
<p>Second, asserting liability against Lafayette County itself required satisfying the rigorous municipal liability standards established in Monell v. Department of Social Services, 436 U.S. 658 (1978). Under Monell, a local government entity cannot be held vicariously liable under Section 1983 merely because one of its employees committed a constitutional violation under the doctrine of respondeat superior. Instead, a plaintiff must prove that an official municipal policy, custom, or widespread practice was the moving force behind the constitutional deprivation. Establishing Monell liability requires showing a persistent, widespread pattern of unconstitutional conduct that local policymakers knew of and ignored, or an explicit policy that directly authorized the violation — a threshold that demands sophisticated legal framing and extensive pre-suit factual investigation.</p>
<p>Third, federal pleading standards under Bell Atlantic Corp. v. Twombly, 550 U.S. 544 (2007), and Ashcroft v. Iqbal, 556 U.S. 662 (2009), require a complaint to contain sufficient factual matter, accepted as true, to state a claim for relief that is plausible on its face. Generalized assertions of conspiracy, retaliatory motive, or institutional corruption are routinely dismissed under Twombly and Iqbal as mere legal conclusions. Drafted while I was experiencing severe personal strain, financial hardship, and the emotional aftermath of missing my son Ethan's birth, my pro se complaint struggled to organize years of complex interactions into the strict pleading structure required by federal courts.</p>
<p>The procedural outcome is recorded plainly: on June 28, 2023, approximately fourteen months after it was filed, Judge Aycock dismissed the case with prejudice. In federal litigation, a dismissal with prejudice is a final, adverse disposition that precludes a plaintiff from ever refiling the same claims. Accessible court files do not detail the exhaustive legal analysis behind Judge Aycock's dismissal, and no speculation is offered here as to whether the ruling resulted primarily from procedural pleading deficiencies, the formidable protections of qualified immunity and Monell, or judicial impatience with a pro se litigant presenting a voluminous narrative.</p>
<p>What can be stated directly is that a judicial dismissal with prejudice does not rewrite history or erase the factual events documented across preceding chapters. The spoliated dashcam videos, the contradictory sworn testimony of law enforcement officers, the duress-signed restraining order, and the psychiatric detentions remain documented historical realities, regardless of whether a federal court determined that my self-drafted Section 1983 complaint met the technical threshold to proceed to trial.</p>
<p>The outcome of the 2022 pro se lawsuit offers a stark lesson regarding the structure of the legal system: the vast difference between an unrepresented citizen trying to articulate a complex history of state abuse, and an experienced civil rights attorney navigating the same facts through formal judicial channels. Nearly three years later, when Jacob Howard of the MacArthur Justice Center took up a related post-conviction matter on my behalf, the result was fundamentally different — culminating in a full judicial vacatur detailed in Part IV. The lesson embedded in that contrast is not that my grievances lacked factual substance in 2022, but rather that the bridge between a documented injustice and a legally enforceable remedy almost always requires specialized legal representation — a resource rarely accessible to pro se, financially depleted litigants standing alone against state power.</p>
<p>Two months after filing this federal complaint, on June 28, 2022, I walked into a building associated with the 2017 Tannehill restraining order — the same duress-signed order from Chapter 5 — for a scheduled child-custody hearing. What happened next is the subject of the next chapter, and it is the moment where the signature I gave under duress in a Lafayette County jail cell in 2017 finally, five years later, came due.</p></section><section class="chapter"><p class="cnum">Chapter 19</p><h1>The June 2022 Arrest: Case B</h1><p>On June 28, 2022, I walked toward the entrance of the Lafayette County Chancery Court, expecting to attend a routine, scheduled child-custody hearing involving my children. I have described this building as "Oxford City Hall" in some earlier accounts, but the federal magistrate's report and recommendation in Reardon v. Osteen identifies it as the Chancery Court, and my own federal civil complaint, filed that same day, June 28, 2022, names "Lafayette County Chancery Court" specifically as a defendant — corroboration I did not have when I first wrote this scene. I am correcting the record to Chancery Court here. It does not change what happened next: I was arrested for aggravated stalking, a second time, five years after the first.</p>
<p>To step out of a vehicle holding papers prepared for a domestic relations hearing and end up in handcuffs moments later is a disorienting collapse of legal categories. In my mind, June 28 was meant to be about my children and my parental rights—a continuation of the long family court struggle that had run parallel to my criminal cases for years. In the eyes of the law enforcement officers waiting for me, however, my physical presence near that building was not a father attending court, but the commission of a brand-new felony. The sudden transition from domestic litigant to criminal suspect, carried out in full view of court personnel, brought back the immediate, sickening shock of my original 2017 arrest. Five years after my first experience in a Lafayette County jail cell, I found myself placed under arrest once again, stripped of my freedom, and processed into custody on a fresh charge.</p>
<p>It is critical to establish at the outset what this new arrest represented: this was Case B, a second, entirely separate aggravated stalking prosecution, distinct from the original 2017 Lynch case detailed in Chapter 5. While the 2017 case had centered on allegations surrounding the Lynch family and the twelve-day rifle impossibility, Case B arose from a completely separate legal instrument and a different set of alleged contacts. The two cases were legally independent, with Case B carrying its own separate indictment, its own docket number, and its own severe sentencing exposure under Mississippi law.</p>
<p>To understand why entering a building for a routine custody hearing produced a felony-adjacent arrest requires returning to a piece of paper already introduced twice: the 2017-CV-217 restraining order I signed, under my attorney Brennan Horan's advice, while in jail on the original Lynch stalking charge in Chapter 5. I signed that order without contesting its terms, understanding it, by my own account, as simply the fastest way out of a cell. I never substantively challenged it afterward. It sat on the books, largely dormant, for five years.</p>
<p>When I signed order 2017-CV-217 in 2017, I was locked inside a county cell, desperate to secure my release. My attorney, Brennan Horan, advised me that agreeing to the civil restraining order was the price of admission for my freedom. What Horan failed to disclose was his own family connection to the local political establishment, a clear conflict of interest that compromised his fidelity to my defense. More critically, Horan gave no warning whatsoever that by signing an uncontested civil order to end a temporary stay in jail, I was signing a document that would remain active on the court dockets indefinitely, quietly accumulating statutory weight until it could be deployed against me years down the road. For five years, order 2017-CV-217 remained passive, an unexploded shell sitting quietly in the background of my life while I attempted to rebuild my existence and pursue custody of my children.</p>
<p>The legal mechanism that turned that dormant order into a second felony arrest lies in the specific statutory architecture of Mississippi's criminal code. Mississippi's aggravated stalking statute contains an enhancement provision: a defendant with a qualifying prior stalking-related conviction or order within a lookback window — I describe this window as roughly seven years — faces an elevated charge for conduct that might otherwise be treated as a lesser offense, or not charged at all. The 2017 Lynch conviction sat on my record. The 2017-CV-217 Tannehill order sat, still nominally in force, alongside it. When I entered a building the order's terms restricted me from, or was perceived by the officials present to have done so, the combination of the standing order and the prior conviction transformed what might otherwise have been, at most, a minor contempt matter into a new, standalone aggravated stalking charge — Case B, distinct from the original 2017 Lynch case, and carrying its own sentencing exposure independent of anything that happened in 2017.</p>
<p>For a lay reader trying to grasp how the legal machinery operated against me on June 28, 2022, it helps to understand how stalking-enhancement statutes function as statutory ratchets. Under standard criminal law, entering a public building in technical violation of a civil restraining order might ordinarily constitute civil contempt or, at most, a minor misdemeanor trespass. However, Mississippi's enhancement framework functions like a set of interlocking legal gears. The statutory scheme takes three separate elements—a prior criminal conviction on the defendant's record, a standing civil protective order, and a new allegation of restricted physical presence or contact—and locks them together to automatically elevate the new conduct into a high-tier felony prosecution.</p>
<p>In my situation, the statutory ratchet operated with mechanical precision. The first gear was the 2017 Lynch conviction, which established the required predicate of a prior stalking-related conviction within the seven-year statutory lookback window. The second gear was the 2017-CV-217 Tannehill restraining order, which provided the standing judicial restriction on my movements and presence. The third gear was my physical arrival at the building on June 28, 2022, for my scheduled custody hearing. The moment those three gears engaged, the statute automatically escalated what should have been, at absolute most, a civil boundary dispute or a minor contempt hearing into a brand-new, standalone felony charge of aggravated stalking. The legal framework did not require proof of new threats or violent behavior; the mere combination of the prior record, the standing order, and my physical presence was sufficient under the enhancement statute to expose me to years of potential prison time in a state penitentiary.</p>
<p>It is worth stating plainly what this chapter's title signals, and what the narrative has been building toward since Chapter 5: the order that made this second arrest possible was signed under conditions already called duress here, on the advice of an attorney with an undisclosed family connection to the local political establishment, when I was told at the time that signing was simply the price of getting out of a cell. Nobody involved in that 2017 transaction — not Horan, not the court, not myself in the moment — appears to have contemplated, or at least documented contemplating, that an uncontested order signed to end a jail stay would become, five years later, the legal foundation for an entirely new felony-adjacent prosecution. If that consequence was foreseeable to anyone advising me in 2017, it was not foreseeable to me, and the record does not establish that Horan warned me of it.</p>
<p>This does not mean the June 2022 arrest was unlawful, or that the underlying statute's enhancement structure is itself improper — repeat-offense sentencing enhancements are a common, constitutionally unremarkable feature of stalking and domestic-violence statutes nationwide, designed precisely to escalate consequences for people who continue a pattern of conduct after an initial intervention. The argument here is narrower: applying that enhancement structure to an order obtained under the specific circumstances documented in Chapter 5 — a duress signature, no substantive contest, an attorney with an unaddressed conflict of interest — raises a fairness question distinct from whether the statute itself is sound. A sentencing enhancement premised on a defendant's knowing, voluntary acceptance of a prior order's terms functions very differently, as a matter of basic fairness, than one premised on an order signed under the kind of pressure documented since Chapter 5.</p>
<p>When a sentencing enhancement operates as intended by the legislature, it presumes that the defendant was fully warned during the prior proceeding, was represented by unconflicted counsel, and voluntarily accepted the terms of the protective order with full awareness of the legal consequences of a future violation. But when the predicate order was extracted from a jailed, unrepresented or conflict-encumbered defendant who signed merely to escape immediate incarceration, the enhancement mechanism is stripped of its moral and procedural integrity. In my case, using the 2017-CV-217 duress order as the statutory predicate for Case B meant that a coercive transaction forced upon me in a jail cell five years earlier was transformed into the primary legal engine used to threaten me with long-term felony imprisonment.</p>
<p>The next chapter follows what happened after this second arrest: a guilty plea entered on September 30, 2022, five years of suspended probation, and a banishment order removing me from Lafayette County entirely — the harshest single consequence I would face across this entire timeline, and the one that set in motion the revocation examined against the certified transcript in Chapter 21, that would ultimately send me into roughly a year of Mississippi custody.</p></section><section class="chapter"><p class="cnum">Chapter 20</p><h1>The Guilty Plea And Banishment</h1><p>On September 30, 2022, I pled guilty to the second aggravated stalking charge detailed in the previous chapter — Case B, the Tannehill-order case. The sentence: five years of suspended, unsupervised probation, and banishment from Lafayette County for the same five-year term, with forty-five days to vacate the county entirely. The deadline to leave was November 14, 2022.</p>
<p>It is worth sitting with the word "banishment" for a moment before moving past it, because it is not a word used loosely here, and it is not a word that appears often in ordinary American criminal sentencing. Exclusion orders — conditions barring a defendant from a specific geographic area as a term of probation — do exist in American law, and courts have upheld them in narrower circumstances, typically tied to a specific, ongoing safety concern involving an identifiable victim or location, and typically time-limited and proportional to that concern. A five-year, county-wide banishment, covering the entirety of Lafayette County rather than a specific address or a specific person's residence, is a considerably broader remedy than the ordinary exclusion-order case law contemplates, and it raises a question that cannot be resolved here as a matter of Mississippi sentencing law but is entitled to be flagged as unusual: banishing a man from an entire county, rather than restricting him from a specific person or property, functions less like a narrowly tailored protective measure and more like an exile — a punishment aimed at removing a person from a community's field of vision, not merely at protecting a specific individual from a specific risk.</p>
<p>To understand the legal severity of banishment requires recognizing how rarely such sweeping geographic exclusions are sanctioned in modern American jurisprudence. Modern courts have traditionally viewed county-wide or state-wide banishment with deep skepticism, recognizing that expelling a citizen from an entire jurisdiction risks violating fundamental constitutional rights, including the right to travel, the right to association, and the right of access to local courts. While narrow probation conditions prohibiting a defendant from approaching a specific home, workplace, or school are standard tools of domestic protection, expelling a person from an entire county transforms a protective order into territorial expulsion. It effectively dumps the individual beyond the county border while cutting him off from the civic, commercial, and legal institutions necessary to conduct his daily life.</p>
<p>I accepted this plea. The available record does not establish precisely what calculation went into that decision — whether it reflected a genuine acknowledgment of wrongdoing, a pragmatic assessment that a five-year suspended sentence with unsupervised probation was preferable to the risk of trial on an enhanced charge carrying real prison exposure, or some combination of both. Guilty pleas in the American criminal system are entered for all of these reasons simultaneously, far more often than popular understanding of "guilty" as a pure admission of factual wrongdoing would suggest, and my plea is not treated here as dispositive proof of anything beyond the fact that, in September 2022, facing the specific charge and exposure detailed in the previous chapter, I decided a plea was my best available option.</p>
<p>When a defendant stands in a Mississippi courtroom facing an enhanced felony charge carrying years of potential state prison time, the pressure to negotiate is overwhelming. In my posture on September 30, 2022, accepting a five-year suspended sentence with unsupervised probation seemed to offer an immediate alternative to the catastrophic risk of trial under an enhancement statute that locked prior records and new presence together. Unsupervised probation meant I would not be subject to routine check-ins or drug screenings, and a suspended sentence meant I would avoid immediate prison walls. But the hidden sting of the agreement was the banishment clause. By embedding an entire county exclusion into the terms of probation, the court created a sentence that was structurally unstable from the moment it was entered—a legal setup where any presence within Lafayette County, no matter how necessary or legitimate, could be seized upon as a probation violation.</p>
<p>Shortly after entering that plea, I filed — pro se, without a lawyer's help — a Motion to Withdraw Guilty Plea. I argued two things at once: that both attorneys appointed to represent me across the case had been ineffective, and that I was not, in fact, guilty of aggravated stalking. Weeks later, in a written order filed November 14, 2022 — the same day, as it happens, that my forty-five-day banishment window expired — Judge Kent E. Smith, the same judge who had taken my plea on September 30, denied the motion. He applied the standard set by Strickland v. Washington, the Supreme Court case governing ineffective-assistance claims, which requires a defendant to show both that his counsel's performance was deficient and that the deficiency prejudiced the outcome. Judge Smith found neither showing made. He pointed to the plea colloquy itself — the back-and-forth questioning a court conducts before accepting a guilty plea — in which I had told the court I understood the charges, had discussed my defenses with counsel, and was entering the plea voluntarily. He also noted that I had undergone a mental evaluation, stipulated to by my own counsel, that found me competent. The motion is worth including here not because it changes anything about the underlying facts of Case B, but because it documents something true and worth stating plainly: within weeks of pleading guilty, I was already trying to fight my way back out of it, through the correct legal channel, and a court engaged with that attempt seriously rather than ignoring it. The attempt failed. It is part of the record regardless.</p>
<p>What followed the plea is where this chapter's real weight sits. Banishment from Lafayette County meant banishment from the place where my children lived, where the custody arrangements this entire saga has orbited around were centered, and where — as the reader has seen across seventeen chapters — nearly every significant event in my adult life had played out. A forty-five-day window to vacate an entire county is not a gentle transition; it is a forced, compressed relocation, imposed on me, whose ongoing custody disputes gave me concrete, practical reasons to need to remain physically near the county I was being told to leave.</p>
<p>For a father engaged in active domestic litigation over his children, county-wide banishment is a devastating blow. Lafayette County was not merely a set of municipal boundaries on a map; it was the precise geographic location where my children resided, where Chancery Court dockets held jurisdiction over my parental rights, and where every meaningful legal and personal tie I possessed had been rooted for years. To be ordered to leave Lafayette County was to be severed from physical proximity to my children and forced to conduct complex custody litigation from beyond the county line. The forty-five-day window provided by the court was presented as a grace period to wind down my affairs, but in practice, attempting to dismantle a life, arrange long-distance living accommodations, and settle pending court matters in six weeks under the constant threat of incarceration was a crushing, chaotic ordeal.</p>
<p>On October 28, 2022, roughly two weeks before the November 14 deadline, I visited the FBI's Oxford office — a visit I had, by my own account and by testimony detailed in the next chapter, notified relevant parties about beforehand. That visit would be treated, by the officials who prosecuted the revocation that followed, as a violation of the banishment order, despite the fact that the forty-five-day grace period had not yet technically expired. Whether a pre-notified visit to a federal law enforcement office, made within a grace period explicitly designed to allow for the practical business of winding down a life in a county before departing it, should have been treated as a violation at all is a question taken up directly in the next chapter — because the answer to that question turned, almost entirely, on the sworn testimony of a single deputy whose credibility has already been called into question once before, in Chapter 11, over her own contradictory account of a traffic stop eighteen months earlier.</p>
<p>The timing and nature of the October 28 FBI visit demonstrate the bad-faith, premature enforcement that characterized how local authorities managed my sentence. The court had explicitly established November 14, 2022, as the deadline to vacate Lafayette County, giving me a forty-five-day window to handle my affairs. When I walked into the FBI office in Oxford on October 28—a federal facility, to report matters involving law enforcement misconduct—I was operating squarely within that designated grace period, and I had taken the precaution of notifying authorities beforehand. Yet local law enforcement officials did not wait for the November 14 deadline to pass. Instead, they seized upon a pre-notified visit to federal authorities made two weeks prior to the expiration date, treating it as an immediate, criminal violation of my banishment terms. This eagerness to declare a violation before the grace period had even elapsed provides compelling evidence of premature, bad-faith enforcement—a rush to trigger revocation and send me to prison before I could even complete the forced departure from the county.</p>
<p>That deputy is Kandi Beavers. The next chapter is about what she told a Mississippi court on November 3, 2022, and about the recorded phone call that stands here as evidence that what she told the court was false.</p></section><section class="chapter"><p class="cnum">Chapter 21</p><h1>Revocation: What Beavers Actually Said</h1><p>On November 3, 2022, I stood in a Lafayette County courtroom in front of Circuit Judge Gray Tollison and represented myself. The court asked me twice whether I understood the risk of waiving counsel. I said I did, and I waived it. Assistant District Attorney Tiffany Kilpatrick prosecuted. The State called two witnesses. The first was Deputy Kandi Beavers.</p>
<p>I want to slow this chapter down and do something I have not always done when I've talked about that hearing. I want to put on the page exactly what she said, word for word, from the certified court reporter's transcript — not my memory of it, not the version that appears in the complaints I later filed with the Department of Justice, not the version I have said out loud on livestreams. The transcript is twenty-five pages. I have read every one of them. Some of what is in there is worse than I remembered. Some of it is narrower. Both matter, and a book that only prints the first half is a book its subject can dismantle in an afternoon.</p>
<p>Start with the paper. The written order that came out of that hearing states the ground for revocation in language worth quoting exactly: I had violated the terms of my post-release supervision "by appearing in Lafayette County not at his residence or prior approved court business." That is the official, on-paper basis for taking a year of my life. It says nothing about the FBI visit specifically, nothing about notice given in advance, nothing about the grace period. It is a finding that I was present in the county outside an approved purpose — broad enough to cover almost anything I might have done there.</p>
<p>Beavers has appeared in this book once already. In Chapter 11 she is the deputy who initiated the February 2021 traffic stop that became my DUI conviction — a conviction I have never disputed — and the officer whose department produced no dashcam and no bodycam, and whose sheriff later gave sworn testimony that the sallyport footage of my field sobriety test was never preserved despite timely requests. That was eighteen months before this hearing. The two incidents are separate, and I am not going to merge them. The earlier stop does not make her testimony here false, and her testimony here does not retroactively taint that stop. What is fair to say is this: the same deputy's account carried decisive weight at two of the highest-stakes turns in my entire record, a year and a half apart. That is worth naming rather than waving past.</p>
<p>Here is her direct examination, from the transcript.</p>
<p>She testified that on October 28, 2022, I called the Sheriff's Department "advising that he needed to come into the City of Oxford to meet with an FBI agent" before lunch. She testified that she "reported it to Sheriff Joey East and a phone call was made to the FBI Building." She testified that the FBI told them "Mr. Reardon did not have an appointment."</p>
<p>Then Kilpatrick asked her this:</p>
<p><em>"Okay, so he lied?"</em></p>
<p>And Beavers answered:</p>
<p><em>"Yes."</em></p>
<p>I objected on the record. The court overruled me, and gave the reason: the rules of evidence do not apply at revocation hearings.</p>
<p>Sit with the architecture of that for a second, because the architecture is the story. A prosecutor asked a sworn deputy to render a verdict on my honesty. The deputy said yes. The factual predicate for that yes was not anything the deputy witnessed — it was a statement someone at the FBI building made over the telephone to somebody at the Sheriff's Department, relayed to the court through her mouth. It is hearsay stacked on hearsay, and it was admissible only because a revocation hearing is a proceeding in which the ordinary rules that keep hearsay out of a courtroom are switched off. I was standing there without a lawyer. I raised the objection anyway. It was overruled for a reason that was legally correct and practically devastating: in this room, the safeguards do not apply to you.</p>
<p>Now here is the part I have to be straight about, because I have not always been.</p>
<p>On cross-examination — my own cross-examination, conducted by me, with no law degree, in a room where I was the defendant — I got Beavers to confirm three things under oath. She confirmed that I called the Sheriff's Department in advance, as my banishment order's notification condition required. She confirmed that she asked me who the FBI agent was. And she confirmed that I told her that was "not the Sheriff's department business to know."</p>
<p>She did not deny that I called ahead. She confirmed it. From my own questioning.</p>
<p>That matters, because in the complaints I filed with the DOJ Office of Inspector General in February and April of 2025, I wrote that Beavers "falsely testified that I had entered the FBI office without permission and without a lawful purpose, despite clear audio recordings proving otherwise." I have said versions of that sentence in public many times. Read against the actual transcript, that sentence is broader than what she actually swore. She never testified I gave no notice. The dispute she testified to is narrower than the one I have described: not whether I contacted the Sheriff's Department beforehand, but whether I had a scheduled appointment with a federal agent when I got there.</p>
<p>I am correcting that here, in my own book, about my own filing, because a claim that overshoots is a claim the other side gets to knock down — and once they knock it down, they get to act like everything next to it fell too. I would rather hand you the narrower version and have it hold.</p>
<p>So take the narrower version. It is still indefensible.</p>
<p>I called ahead. She admits I called ahead. I told the Sheriff's Department where I was going and why, which is exactly what the order required of me. What I declined to do — and I would decline again — was hand the Lafayette County Sheriff's Department the name of the federal agent I was going to see, when the entire reason I was walking into an FBI office was to report misconduct by law enforcement in Holly Springs and in Lafayette County. That refusal is not a violation of anything. There is no condition anywhere in my sentence requiring me to disclose the identity of a federal agent to the local department I intend to complain about. It is, in fact, the only sane thing to do in that situation.</p>
<p>And on the strength of a telephone call somebody made to the FBI building — the contents of which nobody from the FBI ever came into that courtroom to confirm, under oath, subject to cross-examination — a prosecutor asked a deputy whether I had lied, and the deputy said yes, and it went into the record of a proceeding where I could not keep it out.</p>
<p>I did not lie. I went to the FBI's Oxford office on a walk-in basis. Walking in without an appointment is not a lie about having an appointment. It is a description of how a citizen reports a crime to the federal government.</p>
<p><strong>And I have the call.</strong></p>
<p>I wrote an earlier draft of this chapter saying the October 28 recording was not in the evidence archive, that what existed was my description of it, and that a description is not a document. That was true when I wrote it. It is not true now. The recording was found, and it is not the call I expected — it is better.</p>
<p>It is my call to the FBI.</p>
<p>Here is what happens on it. I telephone the Oxford FBI office and say I need to speak to an agent about corruption in the Holly Springs Police Department, that I have video, body-cam footage and audio. Then I explain the problem that makes this whole chapter possible:</p>
<p>&gt; <em>"I'm actually banished from the city of Oxford... I've got to get permission to come into the City, and I know y'all are in the city."</em></p>
<p>And so I ask — explicitly, in as many words:</p>
<p>&gt; <em>"Basically I need to make an appointment with y'all to come in there, if somebody can set a time with me."</em></p>
<p>The answer I got, from the FBI, on my own recording, before any of this happened:</p>
<p>&gt; <strong>"We do walk-ins as opposed to a phone call."</strong></p>
<p>And then — this is the sentence I nearly lost, because the first transcription of this call garbled it and a second, cleaner copy of the same audio turned up in the same folder — I tell the FBI <strong>why</strong> I need a set time:</p>
<p>&gt; <em>"...so I can let Oxford know, or let Lafayette County Sheriff's Department know, and come in there."</em></p>
<p>Read that again. On October 28, 2022, on the telephone with a federal agency, before I had spoken to anybody at the Sheriff's Department, I said out loud that I wanted an appointment time <strong>so that I could notify them.</strong> That is not a man evading a notification condition. That is a man organizing his day around one.</p>
<p>The FBI gave me their hours — <em>"any time between the hours of 8 to 4 Monday through Friday would be fine"</em> — and then, when I asked whether there was a lunch period when nobody would be there, told me it varied, and that <em>"if you could come before 12 would be perfect."</em></p>
<p>I asked for an appointment. The FBI told me they do not do appointments. Then the same person gave me a window — <em>"I would say if you could come before 12 would be perfect"</em> — and I said I would load the evidence onto a jump drive and drive up.</p>
<p>I drove up. Nobody came out. There is a second recording, from the parking lot, of me saying <em>"I came all the way up here to speak with the FBI and now nobody's here,"</em> and repeating the exchange to whoever would listen: <em>"I specifically said this to that guy — can I not make an appointment so that everybody or somebody could be there? He said we don't do appointments, we do walk-ins."</em> I swore, and then I apologized to the staff member for swearing, because none of it was her fault.</p>
<p>Now put that beside what happened in the courtroom six days later.</p>
<p>The Sheriff's Department called the FBI building. The FBI told them <strong>Mr. Reardon did not have an appointment.</strong> A prosecutor took that answer and asked a sworn deputy, <em>"Okay, so he lied?"</em> The deputy said <em>"Yes."</em> And a year of my life came off the back of it.</p>
<p><strong>I did not have an appointment because the FBI told me they do not give them.</strong> That is not a technicality and it is not my characterization. It is on a recording I made before I had any reason to think it would ever matter, and the person saying it works for the Federal Bureau of Investigation.</p>
<p>There is one more thing in that recording that I did not notice until I set the two documents side by side, and it is the kind of detail that cannot be manufactured. Beavers testified — under oath, from the State's side of the room — that I called saying I needed to come into Oxford to meet an FBI agent <strong>before lunch</strong>.</p>
<p>The FBI staffer on my recording told me: <strong>"before 12 would be perfect."</strong></p>
<p>Two sources. One of them mine, one of them hostile. Neither aware of the other. Same detail.</p>
<p>She was telling the truth about the time. The State just attached the wrong conclusion to it.</p>
<p>I want to be exact about one limit, because I have been exact about every other one in this book. <strong>This is the call to the FBI, not the call to the Sheriff's Department.</strong> It does not, by itself, prove what I said to Beavers on the phone that morning — that remains my account. What it does is make the question moot. The State did not need to know what I told Beavers to know that the appointment I supposedly lied about was one the FBI does not issue to anybody.</p>
<p>There is a further layer to this, and I am going to flag its evidentiary status carefully rather than let it sit next to the transcript as though it carried the same weight.</p>
<p>On a recorded call nine months later — the August 2023 call to Chief Deputy Mills that closes this chapter — I described what I had said to Beavers on October 28 in more detail than I gave at the hearing:</p>
<p>&gt; <em>"I've got the call recording showing that I told everything to Candace correct back on the 28th of October, regarding my need to go to the FBI office to report an issue. I even told her, specifically verbatim on the call, that they said that they don't do appointments, that they do walk-ins only, and that we had agreed that I'd come up there within the next hour and a half's time."</em></p>
<p>If that is accurate, it does not merely rebut the appointment point. It inverts it. It would mean I told the Lafayette County Sheriff's Department, in advance and on a recorded line, that the FBI's Oxford office does not take appointments and takes walk-ins only — the very fact that was later presented to a court as evidence I had lied. It would mean the department was told the truth about the appointment before the visit, and then testified about the absence of an appointment afterward as though it were a discovery.</p>
<p>Here is the honest part. <strong>The recording of my call to the Sheriff's Department that morning is still not in the evidence archive behind this book</strong> — the call recovered above is the one to the FBI, not the one to Beavers. What exists on this specific point is me, on tape in August 2023, telling a chief deputy what is on it.</p>
<p>I have learned exactly what that distinction is worth. Two chapters back I described a bill of sale from memory for nine years before the page itself turned up — and when it did, it said precisely what I had said it said, down to the serial number. I may well be right about this one too. But "I have a recording that proves it" is not the same class of thing as a recording, and after everything this book has said about the difference between an allegation and a document, I am not going to blur that line in my own favor on the one page where it would help me most.</p>
<p>So take it at its actual weight: it is my account, given contemporaneously to a hostile audience with no reason to indulge me, of a recording I say exists. The certified transcript is what carries this chapter. This would finish it.</p>
<p>There is one more thing in that transcript that changes how this chapter has to be written, and it cuts against the way I have told this story for years.</p>
<p>Judge Tollison's ruling does not rest on the lie.</p>
<p>He found, by a preponderance of the evidence, that I violated the banishment condition of my September 30, 2022 aggravated-stalking sentence by being present in Lafayette County and in Oxford without authorization on October 28, at the FBI building, and again on October 31, at a residence identified in the record as "Shelby's Place." His stated basis is physical presence in the county. He does not turn on, and does not so much as mention, whether Beavers's account of the appointment detail was truthful. Then he took four years of the five-year suspended sentence and suspended them again, leaving one year to serve, followed by four years of unsupervised probation, banishment continued, court costs of $592.50. My motion to withdraw my guilty plea, which I had filed the day before the State moved to revoke, was not addressed at that hearing at all.</p>
<p>For a long time I described this as "perjury sent me to prison for a year." That is not what the transcript shows, and I am not going to keep saying it. The revocation rested on presence, and I do not dispute that I was physically in Oxford on both of those dates. I was.</p>
<p>But look at what that actually means, because it is worse than the version I was telling, not better.</p>
<p>If the court's ruling never needed the lie, then the lie was gratuitous. Nobody had to ask whether I was a liar in order to revoke me. The State could have stood up, established that I was present in the county on two dates outside the approved exceptions, and sat down. The revocation would have come out the same. Instead a prosecutor took a detour to put on the permanent record — in a proceeding with the evidentiary safeguards switched off, against a man representing himself — that a sworn deputy had branded me a liar, on hearsay, about something that was not a lie.</p>
<p>That answer follows me. It is in a certified transcript filed as Doc. 26 in cause 36CI1:22-cr-00358-GFT, and then filed again in 2024 as an exhibit to a Lafayette County civil action. Every prosecutor, probation officer, and magistrate who ever pulls my file finds a deputy saying <em>yes</em> to <em>so he lied?</em> and no accompanying page explaining that the thing I supposedly lied about was walking into a federal building without an appointment.</p>
<p>That is what a record is for. Not to be true. To be there.</p>
<p>I ended that hearing by telling Judge Tollison, on the record, "You are a corrupt judge." I said it. It is in the transcript. I am not editing it out, and I am not pretending it was strategically wise. I had just watched a year come off my life in an afternoon.</p>
<p>Nine months later, three days after I walked out of custody, I picked up a telephone and tried to do something about the <em>yes</em>.</p>
<p>On August 4, 2023, I called the Lafayette County Sheriff's Department. I recorded it, the way I record everything now, which is the only reason I can give you this exchange instead of my memory of it.</p>
<p>I started with the switchboard, asking a simple question: who handles internal affairs complaints here? The woman who answered gave me an honest answer, and it is worth reading twice, because she was not being cagey. She was just describing her workplace.</p>
<p><em>"It's going to be one of our higher-ups. It would be Sheriff, Major, or Scott, I would think."</em></p>
<p>Sheriff, Major, or Scott. Joey East, Alan Wilburn, Scott Mills. Three of the four men who came to arrest me in May of 2017. The complaint I wanted to file was against their deputy, about testimony given at a hearing prosecuted by their district attorney's office, arising from an arrest their department made. And the entire menu of people authorized to receive that complaint was those three men.</p>
<p>I said so on the call, before I was even transferred: <em>"There's a conflict of interest involving the sheriff... that's where I kind of shy away from internal affairs anyways because I kind of feel like the process is biased within the department."</em></p>
<p>They put me through to Scott Mills.</p>
<p>I started laying it out — the testimony, the <em>"so he lied?"</em> answer, the fact that I had called the Sheriff's Department in advance on October 28 and told them exactly where I was going and why. I said I had that call on tape. I got about four sentences in.</p>
<p><em>"Hold up, hold up, hold up."</em></p>
<p>And then:</p>
<p><em>"If you want to file a complaint, come file a complaint... I want you to come up here and file a complaint on a real complaint, and we'll look into it. <strong>I'm not sitting here listening to you.</strong> You give your version of this and that. I mean, come and file a complaint if you've got a complaint."</em></p>
<p><em>I'm not sitting here listening to you.</em></p>
<p>For years I have described this call as Mills declining to take the complaint by phone and insisting I come in person — as a routing decision, a bureaucratic obstacle, an unreasonable formality. That is not what is on the tape. On the tape, the Chief Deputy of the Lafayette County Sheriff's Department interrupted a man in the middle of alleging that one of his deputies gave false testimony in a proceeding that cost that man a year of his liberty, and told him he was not going to sit there and listen. He did not ask what the testimony was. He did not ask what was on the recording. He did not ask which deputy. He announced that hearing it was not something he intended to do.</p>
<p>I said the only thing there was to say: <em>"Do you really think I'm that stupid to come into Lafayette County and file a complaint in person?"</em></p>
<p>Understand what was actually being asked of me. I had been out of a Mississippi jail cell for seventy-two hours. I was under a banishment order forbidding me from being in Lafayette County. And the sole avenue offered for accusing a Lafayette County deputy of lying under oath was to physically enter the Lafayette County Sheriff's Department — into a building where, if things went sideways, the people deciding whether my presence was authorized would be the same people I had come to accuse.</p>
<p>That is not a complaint process. That is a toll booth with a trapdoor.</p>
<p>I called back and asked to be transferred to Mills again. We never finished the conversation.</p>
<p>The recording keeps running for a few seconds after I hang up, and it catches what I said to nobody, alone, in my own car, three days out of a year in custody:</p>
<p><em>"What a chicken shit son of a bitch."</em></p>
<p>I am not putting that in to be crude. I am putting it in because it is the most honest thing on the tape, and because every polished sentence I have written about institutional accountability in the last nine years is downstream of a man sitting in a parked car saying that out loud with no one listening.</p>
<p>And this county has already shown what it does when asked to investigate itself. In the Metro Narcotics scandal, Sheriff East was simultaneously a signatory on a lockbox with missing funds and one of the officials responsible for finding out where the funds went.</p>
<p>So the complaint was never filed. The <em>yes</em> stayed in the record. And seven days after that phone call with Scott Mills, I was arrested in Galveston, Texas, at two in the morning, having just finished driving there.</p>
<p>For years I have called what happened next retaliation, and for years the honest answer to "prove it" was that I couldn't — I had a six-day gap and a theory. That is no longer where the record stands. In the early morning hours after that arrest, while I sat in a Texas holding cell, three telephone calls were recorded. I have them now. One of them is Deputy Kandi Beavers, at four minutes past four in the morning, calling Galveston Police from Mississippi and asking to be put through to the officer who arrested me, by name.</p>
<p>That call is the next chapter but one, and it does not need any of my theories to do its work.</p></section><section class="chapter"><p class="cnum">Chapter 22</p><h1>A Year In Mississippi Custody</h1><p>I was released from Mississippi custody on August 1, 2023, roughly a year after the November 3, 2022 revocation hearing detailed in the previous chapter. This chapter is deliberately the shortest in Part III, not because the year it covers was uneventful, but because the available record does not include a detailed, date-by-date account of that custodial year, and no texture is manufactured here where none is documented.</p>
<p>What can be said plainly is the shape of the year, viewed from its two endpoints. It began with a revocation that rested formally on my presence in Lafayette County and rested, in the room, on a deputy answering <em>yes</em> when a prosecutor asked whether I had lied — about a walk-in visit to an FBI office I had given the Sheriff's Department advance notice of, as Chapter 21 sets out from the certified transcript. It ended with a release on August 1, 2023, three days before I would attempt to report that same deputy to her own department, in the August 4 call detailed in Chapter 21 — a call that itself preceded, by seven days, the Galveston, Texas arrest that opens Part IV.</p>
<p>It started on a road, three days after I walked into an FBI office and nobody came out to meet me.</p>
<p>I was driving home from a city hall meeting when the lights came on behind me. I had the camera running, the way I always did by then, so I do not have to reconstruct this from memory.</p>
<p>The officer opened with the tag on my car, which was a pretext and we both knew it. Then he came to it straight:</p>
<p>&gt; <em>"There was paperwork that was issued today and I just wanted to talk to you about it and give it to you, and I figured coming from me would be the best."</em></p>
<p>He showed it to me. An order of holding, out of the Circuit Court of Lafayette County. <em>"It's a revocation hearing and you're going to have a hearing on it tomorrow morning, and I'm going to need you to come with us tonight."</em></p>
<p>I said the only thing there was to say. <em>"I've done nothing wrong. I just came from Holly Springs."</em></p>
<p>He did not argue with me and he did not put anything on me. He offered to let me get out and read the document myself — <em>"if you want to get out, I'd be happy to let you look at it."</em> When I asked whether I could at least take my car home, he explained, apologetically, that once they had made contact he could not let me drive off, and then he tried to help me solve it: leave it here, get someone to come for it, he wouldn't mind arranging something. I told him my wife was out in Hernando and my kids were at the house.</p>
<p>I am putting all of that in because it is true and because this book keeps a second ledger. That man did his job decently. He told me what was happening, he offered me the paper, and he worried about my car and my children. Nothing in the year that followed is his fault.</p>
<p><strong>But look at what he told me: the hearing was the next morning.</strong></p>
<p>That single fact is the answer to the question the previous chapter leaves hanging, and I have never given it the weight it deserves. Everyone who hears this story asks the same thing: <em>if you had a recording that contradicted her, why didn't you play it?</em></p>
<p>Because I was taken off a road at night and put in a cell, and the hearing was at two o'clock the following afternoon, and my recordings were not in the cell with me. I asked for time. <strong>The court would not continue it.</strong></p>
<p>So the proceeding that took a year of my life went forward with the deputy's account of the October 28 call in the room and the actual October 28 call sitting on a device I could not reach. That is not a close evidentiary call that went against me. That is a man being asked to disprove a characterization of a recording while separated from the recording, on roughly eighteen hours' notice, without counsel.</p>
<p>A year is a long time to spend in custody on the strength of a hearing that took an afternoon. It is worth naming, plainly, what that year cost, independent of any of the surrounding legal maneuvering documented across twenty chapters: a year away from children whose custody arrangements had already been the subject of five years of litigation; a year in which the banishment order forcing me out of Lafayette County remained in force regardless of what happened to the revocation that sent me into custody; and a year that would ultimately be vacated — not immediately, and not without a fight, but vacated nonetheless, first in part in June 2024 and then fully, alongside the underlying 2022 stalking-case plea itself, on January 21, 2025, through the work of the MacArthur Justice Center's Jacob Howard, detailed in Part IV.</p>
<p>That eventual vacatur matters enormously to how this chapter, and this entire Part, should be read. A sentence that is later fully vacated by a court reviewing the same record laid out here — the duress-signed order, the questionable testimony behind the revocation, the disproportionate scope of the banishment itself — is not a footnote to this story. It is closer to a confirmation, arriving years after the fact, that the system's own internal review process eventually reached something close to the conclusion I've been building toward since Chapter 5: that a signature obtained under duress in 2017 should never have been allowed to metastasize, five years later, into a felony-adjacent conviction and a year of custody decided in a single afternoon, on eighteen hours' notice, while the recording that bore on it sat somewhere I could not reach.</p>
<p>One more document belongs in this chapter, discovered only recently and not previously part of this account. On August 17, 2023 — just six days after the Galveston, Texas arrest that opens Part IV, and less than three weeks after my release from the year of custody this chapter covers — the State of Mississippi filed a bench warrant and a Petition to Revoke Suspended Sentence, signed by Assistant District Attorney Steven Patrick Jubera, under the same 2022 stalking case cause number. The petition cited the Galveston felony DUI arrest as grounds and asked the court to revoke the entire remaining four years of my suspended sentence — not just the one year I had already served, but the whole balance still hanging over me. This was a second, separate Mississippi legal consequence, layered directly on top of the Galveston case itself, and it followed within days of the very perjury complaint detailed in the previous chapter — the one Chief Deputy Mills declined to take over the phone. Whether that petition ever reached a hearing before the January 2025 vacatur made the entire underlying sentence moot is not established in the documents I have. What is established is the sequence: a stonewalled complaint against a deputy on August 4, an arrest in another state seven days later, and a filing six days after that seeking to convert the remainder of a five-year suspended sentence into real time — three institutional actions, stacked one on top of the next, in the space of thirteen days.</p>
<p>None of that vacatur had happened yet, in August 2023, when I walked out of Mississippi custody. What happened next, within days, is the subject of Part IV — beginning not with vindication, but with one more arrest, in a different state, seven days after the complaint I was trying, at that exact moment, to get someone to take seriously -- and, as Chapter 23 sets out from the recordings, with two Lafayette County officers on the phone to the arresting department before dawn.</p></section><section class="chapter"><p class="cnum">Chapter 23</p><h1>Release, And Galveston</h1><p>I walked out of Mississippi custody on August 1, 2023, after roughly a year of continuous detention and incarceration detailed in the previous chapter. Stepping through those heavy steel doors into the humid August air was not an arrival at genuine freedom; it was merely a transition into a different phase of an ongoing, systemic struggle. A full year of my life had been swallowed whole by a probation revocation that, as the previous chapters set out, rested formally on my physical presence in Lafayette County — and rested, in the room, on a sworn deputy answering <em>yes</em> when a prosecutor asked whether I had lied, about a thing that was not a lie, in a proceeding where the rules of evidence had been switched off. The heavy physical and emotional weight of that year spent in a concrete cell did not dissipate upon my physical release. Instead, it sharpened into an urgent, inescapable imperative: I needed to place the documented truth on the official record before the institution that had jailed me could bury it.</p>
<p>Three days after my release, on August 4, 2023, I picked up the telephone and called the Lafayette County Sheriff's Department. I asked for executive leadership and was connected directly with Chief Deputy Scott Mills. I told him plainly and calmly why I was calling: I was formally initiating an internal affairs complaint against Deputy Kandi Beavers over her testimony at my revocation hearing. I cited the recordings showing that I had given the Sheriff's Department advance notice of my visit to the Federal Bureau of Investigation, exactly as my banishment order required, and I said what I still say: that answering <em>yes</em> to <em>so he lied?</em> — on the strength of a phone call to the FBI building that nobody from the FBI ever came to court to confirm — put a false characterization of me into a permanent court record. I offered to transmit the audio recording immediately via secure electronic transmission, along with certified transcripts and detailed supporting documentation, so that an immediate internal affairs investigation could be opened into her sworn statements under oath.</p>
<p>Chapter 21 gives that call in full, from the recording, and it is worth carrying one line of it across into this chapter, because this chapter is about what happened seven days later. Mills did not weigh the complaint and route it. He interrupted me four sentences in — <em>"Hold up, hold up, hold up"</em> — and said: <em>"I'm not sitting here listening to you."</em> Then he told me that if I had a complaint I could come up there and file it in person.</p>
<p>I refused that requirement immediately and unconditionally. Walking back into the physical headquarters of the very law enforcement agency that had spent years targeting, arresting, and prosecuting me, simply to hand physical evidence of official perjury to the direct superiors of the deputy I was accusing, was a safety and liberty risk no rational person in my position would undertake. A law enforcement department investigating its own deputy's sworn dishonesty through a mandatory walk-in complaint process is not a neutral, trustworthy, or objective forum.</p>
<p>My refusal was grounded in an acute, hard-earned awareness of self-investigation bias—a structural flaw already documented playing out in Lafayette County in a remarkably similar form during the Metro Narcotics scandal. In that high-profile investigation, Sheriff F.D. "Buddy" East was both a designated signatory to a missing-funds lockbox and one of the primary law enforcement officials tasked with investigating his own department's financial shortfall. Expecting a police agency to impartially police its own core actors when confronted with internal corruption is a proven administrative illusion. Requiring an accuser to walk into the building controlled by the accused officers creates an immediate environment of intimidation, surveillance, and coercion designed to deter formal accountability and protect department personnel from outside scrutiny.</p>
<p>Between those two events I did the other thing a journalist does, and it is the part of this story I have never put in writing properly.</p>
<p>Days after I got out, I published the recordings. I laid the October 28 call over the certified transcript of Beavers's testimony, lined up so that a viewer could read what she swore and hear what had actually been said, in the same minute. Then I put it out.</p>
<p>It moved fast. I have given the number as forty thousand views in one telling and fifty thousand in another, within about a week — I do not have the analytics in front of me and I am not going to pretend to a figure I cannot produce. What is not in dispute is that a lot of people watched it in a short time.</p>
<p>That is the fact I want standing here, before the arrest, because everything I have ever said about what happened next depends on it. A woman testified against me. I went to prison for a year. I came out, and within days I put her testimony and the recording side by side in front of tens of thousands of people, and then I called her department and tried to file a complaint and was told to come in person and told, four sentences in, that nobody was going to sit there and listen to me.</p>
<p>Seven days after that telephone conversation with Scott Mills, I drove to Texas.</p>
<p>And I should say why I was going, because the manuscript has never made that clear either and the absence of a reason has let this look like a man wandering into trouble. I was driving to Galveston to meet other journalists. I had received anonymous tips about racial profiling by law enforcement there, and that is what I went to look at. I was working. I was on the road the whole of August 10, and I rolled into Galveston at two o'clock in the morning on August 11, 2023. I was pulled over and arrested within minutes of arriving, on a felony DWI charge.</p>
<p>Fix that clock in your head, because the rest of this chapter runs on it. I arrived at 2 a.m. By 2:41 a.m. — forty-one minutes later — a Lafayette County sergeant in Mississippi was on the telephone with the Galveston Police Department about me.</p>
<p>For years, this is where I had to stop and admit I could not prove the next sentence. I had a seven-day gap and a conviction in my gut. I would say the arrest was retaliation, and the honest answer to <em>prove it</em> was that I had a calendar and nothing else — no emails, no phone logs, no inter-agency memo. I said so in print and I meant it.</p>
<p>That is no longer where this stands, and the reason is that while I sat in a Texas holding cell, the telephone calls coming into Galveston Police that night were being recorded. I have three of them.</p>
<p>The first is at <strong>2:41 in the morning</strong>. A man calls in and identifies himself: <em>"Hoby James, I work with the Sheriffs Department in Mississippi... Lafayette County Sheriffs Office."</em> He explains that he had watched my arrest unfold, live, on a YouTube stream. Five minutes later he calls back, this time as <em>"Sergeant James."</em> Roughly a thousand miles from Oxford, in the middle of the night, a Lafayette County sergeant was watching me get arrested on a livestream and picking up the phone about it.</p>
<p>The second is at <strong>3:44</strong>. This one is Galveston personnel talking among themselves, and it is the most legally consequential ninety seconds of the entire night. They are looking for a prior Mississippi conviction — not because one has been produced, but because they need one to exist. Listen to the logic in the officer's own words:</p>
<p>&gt; <em>"They said he was [D]WI'd last year for conviction, but I'm not seeing him on C[C]H... if he has one from last year, it's convicted, and they can give me the conviction date and the cause number and the court and stuff, <strong>this will be a felony</strong>."</em></p>
<p>Then he reads my Mississippi record aloud, hunting for it, and cannot find it: <em>"2022. Inmate intake... but there's no charge affiliated with that 2022 cycle six."</em> An intake entry with no charge attached to it. Nothing that qualifies.</p>
