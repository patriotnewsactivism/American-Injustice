<p>It is worth being precise about what the surveillance record does and does not show, because the gap matters more than a simple "no footage exists" would suggest. An RTCC technician who reviewed the footage confirmed that the video captured me at the security screening checkpoint, attempting — per the technician's own characterization — to bypass the scanner after being told I could not enter with a lighter and vape in my pocket. What the same footage did not capture was the physical altercation itself, which the technician stated occurred outside the camera's field of view. In other words, the system recorded the prelude and lost the moment that mattered, leaving the adjudication of what actually happened in that gap to rest entirely on the sworn statements of two witnesses — Vidal and Savage — who worked for the same security company as the man accused of causing the injury. An affidavit built on eyewitness accounts from an accused party's own coworkers is not automatically false. But it is precisely the kind of evidentiary structure that ordinarily invites independent scrutiny before a court accepts it as a sufficient basis for probable cause, and no indication exists in the available record that any such independent scrutiny occurred here. The city's own Real Time Crime Center cameras — the network of surveillance infrastructure New Orleans maintains specifically to monitor incidents like this one — did not capture the actual altercation. I do not know why. I do not have evidence establishing that this gap in coverage was deliberate, and I will not speculate that it was. What I can say is that the same city that operates an extensive real-time camera network happened not to have footage of the specific moment a security guard struck a man hard enough to require hospital transport, and that the absence of that footage left the incident to be adjudicated almost entirely on the word of the guard's own coworkers and the officers who took their statements at face value.</p>
<p>Jerome Ard, the man who wielded the flashlight, was never charged with anything.</p>
<p>I have, across twenty-nine prior chapters, tried consistently to hold institutional misconduct to a standard independent of whether I am a sympathetic figure in any given episode — and this chapter is one of the clearest examples of why that standard matters. Whatever a reader thinks of my broader pattern of confrontational First Amendment auditing, documented honestly in Oxford, Lafayette, and Aberdeen, nothing in that pattern justifies a security guard striking me hard enough to split my head open with a metal object, and nothing in that pattern explains why the resulting legal process treated the injured party as the aggressor while the man who caused the injury walked away with no charges at all. A split scalp, a hospital transport, a destroyed phone, and an arrest warrant for the victim rather than the assailant — sworn out by an officer relying on the assailant's own coworkers as witnesses — is, on its face, one of the starkest examples of institutional failure documented here, independent of anything else I have described about my own conduct elsewhere.</p>
<p>The next chapter follows what happened when I tried to get access to the records that might have clarified what actually occurred that day — and what New Orleans's public records office did instead.</p></section><section class="chapter"><p class="cnum">Chapter 33</p><h1>The Records Cover-Up</h1><p>On November 17, 2025, five days after Jerome Ard struck me with a metal flashlight at New Orleans City Hall, I filed a public records request through the city's NextRequest system, seeking footage and documentation of the incident. It was assigned request number 25-21253. On December 10, 2025, the city denied it.</p>
<p>To understand why this administrative denial was far more than a routine bureaucratic refusal, a lay reader must first understand what the NextRequest platform actually is and how municipal governments utilize it to control public information. NextRequest is a specialized enterprise software portal utilized by hundreds of municipal governments, law enforcement agencies, and state departments across the United States to manage, track, route, and fulfill public records requests under state freedom of information statutes. Rather than submitting physical paper applications directly to a police precinct records desk or municipal city clerk, citizens submit requests through a centralized web interface. When a citizen submits a request, the software assigns an official tracking number—in this instance, request number 25-21253—timestamps the exact minute of filing, establishes automated statutory countdown clocks for compliance deadlines, and routes the submission internally to designated departmental custodians, such as the New Orleans Police Department Records Division or the City Attorney's Office. The platform provides internal software tools for legal staff to evaluate records, apply redactions, calculate copying or search fees, and issue formal electronic denial notices. While marketed under the guise of municipal efficiency and modern transparency, in practice such centralized systems provide municipal authorities with a controlled digital bottleneck through which public access can be delayed, restricted, or entirely shielded.</p>
<p>I did not wait passively for that portal to run its course. The same day I filed request 25-21253, I addressed it specifically to the city's Real-Time Crime Center — the RTCC, the unit that maintains the network of cameras covering downtown New Orleans, including the sidewalk and lobby outside City Hall — and I itemized exactly what I wanted rather than asking generally for "footage of the incident." I asked, by name, for: all RTCC camera footage covering the front entrance sidewalks, the public lobby, and the security screening area; all City Hall interior security camera footage for the same window; all audio, 911 call logs, CAD entries, and dispatch traffic between 9:00 and 10:30 a.m.; all incident reports, written statements, and security logs generated by City Hall security personnel; all NOPD body-worn camera footage from responding officers; and all radio communications referencing the incident. I cited Louisiana's public records law broadly, under R.S. 44:1 et seq. — the same title the city would later use a narrower provision from, R.S. 44:3(1), to deny me. I gave my contact information as a journalist, under my byline, and asked for electronic delivery. None of that specificity changed the outcome. It is worth stating plainly here because it forecloses the easiest excuse an agency has for a denial — that the requester didn't know what to ask for, or asked too broadly to be actionable. I asked for exactly what existed, in six enumerated categories, addressed to the unit that held it, and was refused anyway.</p>
<p>When the city issued its formal denial of request 25-21253 on December 10, 2025, it cited Louisiana Revised Statute 44:3(1), the statutory provision of Louisiana's public records law that exempts records connected to an active criminal investigation or prosecution from disclosure. Under Title 44 of the Louisiana Revised Statutes—the state's Public Records Law—Section 3(A)(1) explicitly provides that records held by law enforcement, prosecutorial, or investigative agencies that pertain to pending criminal litigation or active criminal investigations are exempt from public inspection until the final disposition of the case or criminal prosecution. In ordinary, legitimate law enforcement operations, the policy rationale behind LA RS 44:3(1) is standard and understandable: the exemption is designed to protect active criminal investigations from public interference, safeguard confidential informant identities, prevent the spoliation or destruction of evidence, and prevent criminal defendants from using civil public records laws to obtain pre-trial discovery outside the structured rules of criminal procedure set forth in the Louisiana Code of Criminal Procedure.</p>
<p>In this instance, however, the active prosecution being cited to justify the denial was the charge against me — the charge sworn out by Officer Junious Grady, based on statements from the assailant's own coworkers, detailed in the previous chapter. In other words: the city used the existence of a criminal case against the person who was struck, a case built on the word of the striking party's own colleagues, as the legal basis for withholding footage and records that might have shown what actually happened to me.</p>
<p>This is worth sitting with as its own discrete mechanism, separate from the assault itself, because it is one of the cleanest examples of how a legitimate-sounding legal exemption can be deployed to produce an outcome the exemption was never designed to protect. Records exemptions tied to active criminal investigations exist for sound reasons — to prevent a defendant's public records requests from being used to obtain a preview of the state's evidence against him, or to protect an ongoing investigation from premature disclosure. Applying that same exemption to withhold records of an assault against the person now facing the charge, when the underlying question is whether that person was actually the aggressor or the victim, inverts the exemption's purpose: instead of protecting an investigation's integrity, it protects the outcome of a process the previous chapter has already shown rested on the assailant's own coworkers' account.</p>
<p>Spelled out directly for a lay reader, this arrangement creates what legal scholars and administrative analysts recognize as a classic bootstrapping problem—a self-generating, circular feedback loop where law enforcement constructs the very legal shield used to hide its own initial misconduct. The sequence operates through a precise, self-protective administrative cycle: First, an assault occurs on public property, where I am struck with a metal flashlight by Jerome Ard at City Hall. Second, instead of conducting an objective investigation, Officer Junious Grady accepts unsworn, self-serving statements exclusively from Ard's fellow municipal employees and swears out an affidavit charging me with simple battery, effectively transforming the victim into the accused. Third, when I submit NextRequest 25-21253 seeking municipal security camera footage and police body-worn camera video to prove that I was the victim of an unprovoked attack, the city invokes LA RS 44:3(1), asserting that because a criminal charge is now pending against me, all underlying video and documentary records are legally exempt from public disclosure until the criminal case reaches final disposition.</p>
<p>Through this circular logic, law enforcement manufactures a bogus charge against the victim, which automatically triggers a statutory disclosure exemption under LA RS 44:3(1), which is then deployed to lock away the video evidence that would prove the charge is false and expose the assault. The system feeds on its own administrative fiction, bootstrapping an initial investigatory failure into an unassailable fortress of statutory secrecy.</p>
<p>Only a redacted report was eventually released, and only after I paid a $25 fee. The city insisted on collecting this $25 fee before releasing any paperwork whatsoever, and when the document was finally delivered, it was heavily blacked out, stripping away critical details and completely omitting all video and audio media.</p>
<p>I did not stop at the records portal. Two days after the denial — on November 14, 2025, before I even had the formal denial in hand — I picked up the phone and called every office in the city that might plausibly help me: the NOPD non-emergency line, the Mayor's office, NOPD's own Public Integrity Division, and the City Attorney's office. I recorded all four calls. What they show, laid end to end, is not one agency stonewalling me — it is four different offices, each with a narrow, technically accurate answer for why the problem belonged to someone else.</p>
<p>The first call went to NOPD's non-emergency line. The person who answered was a call-center operator, not a sworn officer — she said so herself: "this is a call center, we're not officers here." I asked about the department's own Victim Witness Assistance Program, the office that exists specifically to help crime victims navigate exactly the kind of situation I was in. She looked it up in her own internal contact directory and could not find a phone number for it — a program that populates near the top of a Google search for "New Orleans Police Department" did not exist, as far as she could tell, inside NOPD's own call-routing system. She gave me the general district line, 504-658-6030, and told me I could reach other districts by changing the last digit or two. I told her, on the recording, "policy without implementation is just not good." I still think that is the most accurate one-line summary of this entire chapter.</p>
<p>The second call went to the Mayor's office. It was a Friday, and the staffer who answered — she identified herself only as "Officer Christian" — told me plainly that she was the only person there: "I'm the only one here right now. Everyone is gone for the weekend." I told her I was a journalist, and I told her what had happened. She confirmed something worth stating cleanly for the record: Allied Universal, Ard's employer, "are not a part of the city. That's just a contract that the city has with that security company" — meaning the guard who struck me was a private contractor, not a municipal employee, a distinction that matters enormously for who can ultimately be held liable. She also volunteered, unprompted, what she understood the guard's stated justification for the confrontation to have been in the first place: that I could not enter City Hall because I had a pack of cigarettes, a lighter, and a vape pen in my pocket. I told her that was absolutely ridiculous, and I still think it is. When I later asked the City Attorney's office whether any actual ordinance, posted rule, or written policy bars a visitor from carrying a lighter or a vape pen into City Hall, nobody could point to one. Christian herself allowed that the guard "may have been instructed from their company to say that" — meaning even the Mayor's own staff could not confirm the prohibition was real, only that it may have been company policy rather than city law. On that same call, I described what happened after the flashlight struck me: the guard picked my phone up off the ground and slammed it back down, destroying it along with my camera equipment, all of it live-streamed, all of it on video. I told her I lay bleeding on the sidewalk until paramedics arrived and took me to the hospital, and that on scene, I repeatedly told the responding officers I wanted charges placed against the guard — and that, in my account, they did everything they could to hinder that instead, while working to find something, anything, to hang over my head to make me the one at fault. I told her I had already sent the city a notice of claim naming Allied Universal, the guard personally, and the city itself as civilly liable, on top of whatever criminal liability applied to Ard. I told her, "I've seen a lot of things, but what happened Tuesday sure does go right to the top of the list." She said the communications team would have more, and to follow up Monday.</p>
<p>The third call went to NOPD's Public Integrity Division, the unit meant to investigate misconduct inside the department itself. A staffer identified as Ms. Parks answered. I told her I had already called every district precinct directly and no one had answered. When I asked how the Victim Witness Assistance Program actually worked, she put me on hold — and transferred me to a voicemail box for Detective Sonya Pollard, whose recorded greeting announced her assignment plainly: "Domestic violence. Detective Sonya Pollard. Record your message at the tone." A request about a public records denial tied to an assault by a security guard at City Hall had been routed, by the department's own internal transfer system, to a domestic-violence detective's answering machine. I don't think Ms. Parks did that maliciously. I think it is simply what happens when a department has no real infrastructure behind a program it advertises publicly, so every call meant for it lands wherever the person answering the phone happens to guess it belongs. I ended that call the way I mean it to read here: "God, I just love the government… They're always there to help you, you know? They're always there to help you. So knowledgeable. Everybody's on the same page."</p>
<p>The fourth call reached the City Attorney's office directly, and a staffer named Tana Scoby — the same Tana Scoby whose name appears on the records-request denial itself, with an email address I have and will put on the record here, tana.scoby@nola.gov — answered. Her position, stated plainly and on tape, was this: "I don't have any knowledge of that. We don't have knowledge of that." She explained her office sits on the fifth floor and is "in meetings all day and hearings all day," which was her account of why the assault four days earlier had not reached her desk. She drew a jurisdictional line that is, on its face, accurate as far as it goes: "the city attorney's office tends to civil matters, not criminal matters. If you were assaulted by someone, that's not something we handle." But she also confirmed, in the same breath, that if the city itself were sued over what its contracted security guard did at City Hall, "it would come to us. That's correct." That is the whole contradiction in one sentence: the office that will defend the city if I sue it is the same office that says it has no role, no knowledge, and no responsibility to look into what happened before that lawsuit ever gets filed. When I asked her directly whether any written policy, ordinance, or posted rule prohibits a visitor from entering City Hall with cigarettes, a vape pen, or a lighter — the guard's stated reason for confronting me in the first place — she could not cite one: "I'm not sure. You would have to read the ordinance on the muni code." Nobody I spoke to across four calls, in four different city offices, could tell me what rule I had supposedly broken to trigger the confrontation that ended with my head split open on a public sidewalk. I told her I considered the entry bar itself a prior restraint, and I asked her to place a pre-litigation hold on the evidence, not just treat my notice of claim as a formality. She offered only to help route a formal records request — the same NextRequest system that had already denied me five days earlier, using the very charge these calls were about as its justification.</p>
<p>A staffer in the City Attorney's office, identified in the available record as Tana Scoby, claimed ignorance when questioned about the handling of the request — there is not enough information here to characterize that claim as either credible or evasive, and I record it plainly as Scoby's own stated position, without further comment. What the four Nov. 14 calls add to that position is texture, not contradiction: an office that says it didn't know, sitting inside a city government where the mayor's own staff, the department's own non-emergency line, and the department's own internal-affairs division each had a different half-answer, and none of them had the whole one.</p>
<p>Separately, the NOPD's own Public Integrity unit, under Sergeant Davis, opened an investigation into the incident — but limited its scope to NOPD's own conduct in handling the case, not to the underlying question of whether Ard's assault itself, or my arrest that followed it, was properly investigated in the first place.</p>
<p>That scoping decision deserves its own scrutiny. An internal affairs unit investigating only whether its own department's paperwork and procedures were followed correctly, while declining to examine whether the underlying arrest of an assault victim was itself justified, produces exactly the kind of narrow, self-protective review I have criticized elsewhere — most directly, the Lafayette County Sheriff's Department's own internal-affairs process detailed in Chapter 23, where Chief Deputy Scott Mills's insistence on an in-person complaint against Deputy Kandi Beavers effectively functioned as a barrier to accountability rather than a path to it. Just as Chief Deputy Mills erected a procedural hurdle in Lafayette County to deter formal grievances against Deputy Beavers, Sergeant Davis and New Orleans's Public Integrity review of this incident followed the same basic shape: an investigation narrow enough to protect the department's process without ever reaching the substantive question of whether I was wrongly arrested for having been assaulted. By insulating the core misconduct from substantive review, internal affairs transforms itself from an oversight body into an administrative buffer designed to shield institutional actors from accountability.</p>
<p>There is one more document worth putting into the record here, because it independently proves the bootstrapping problem described above rather than just arguing it. When I was arrested during the January 2026 ice storm — the subject of the next chapter — the pretrial services agency that processed me produced a Public Safety Assessment. Buried in its own "Current Charges" section is a single administrative line that states the offense date for the simple battery charge against me as November 12, 2025, at 2:35 p.m. That is not the date of my arrest in January. It is the date of the assault. The government's own pretrial paperwork, filled out by an intake specialist with no stake in the underlying dispute, records as a plain administrative fact that I was charged with battery for an act that occurred on the day I was the one struck with a flashlight. I do not need to argue that point rhetorically. The document argues it for me.</p>
<p>The next chapter follows what happened roughly seven weeks after the denial of this public records request, when I — during an ice storm, at a Red Cross warming shelter, in a different city entirely — was taken back into custody on the charge the denial had helped shield from scrutiny.</p></section><section class="chapter"><p class="cnum">Chapter 34</p><h1>Retaliatory Arrest In An Ice Storm</h1><p>On January 28, 2026, severe winter weather paralyzed southern Louisiana. Sub-freezing temperatures and hazardous ice had transformed roads into dangerous hazards, driving residents indoors. I had traveled westward from New Orleans to Lafayette, seeking refuge from the bitter cold at a Red Cross emergency warming location. Inside the shelter, the atmosphere was dense with the quiet exhaustion of people seeking basic survival: unhoused citizens, stranded travelers, and local residents huddled together on folding chairs, surrounded by the smell of damp winter coats and hot coffee. It was a facility dedicated entirely to relief and protection from a dangerous natural element.</p>
<p>That sanctuary was broken when law enforcement officers entered the shelter. They were not there to assist with disaster relief or check on shelter conditions. They were there for me. Surrounded by individuals seeking escape from freezing weather, I was confronted, ordered to stand, and placed in handcuffs in the middle of the shelter floor. The physical experience was a study in contrasts: the sudden bite of cold steel handcuffs against wrists already numb from freezing temperatures, and the emotional weight of being seized in a public refuge designed to keep vulnerable human beings safe from harm.</p>
<p>To understand why officers appeared at a Red Cross shelter in Lafayette to execute a misdemeanor warrant from Orleans Parish, one must look at the broader mechanism of law enforcement tracking established months earlier. As detailed in Chapter 28, a BOLO ("Be On the Look Out") record had been generated and circulated across federal and local systems, ensuring my location was continuously monitored across parish lines. The promptness with which law enforcement identified my presence at an emergency weather shelter 135 miles from New Orleans demonstrates that this tracking apparatus was actively functioning. The timing was not accidental. Arresting a person at an emergency weather shelter for a months-old misdemeanor charge is not a routine public-safety response; it is the action of a system that knew where I was and chose that specific moment of physical vulnerability to execute an arrest.</p>
<p>This chapter uses the word "retaliatory" deliberately, where I have otherwise tried to reserve that designation for situations where the record actually supports it. Here, the cause-and-effect relationship connects directly back to the records cover-up detailed in Chapter 33. On November 17, 2025, five days after I was struck in the head with a metal flashlight by Allied Universal security guard Jerome Ard at New Orleans City Hall, I filed NextRequest 25-21253 seeking security video of the assault. On December 10, 2025, the city denied that request under Louisiana Revised Statute 44:3(1), citing an "active criminal investigation or prosecution." The active prosecution cited to withhold the video evidence was the simple battery charge sworn out by Officer Junious Grady — a charge built on the statements of Ard's own coworkers, turning the injured victim into the accused.</p>
<p>The records denial in Chapter 33 and the ice-storm arrest in this chapter are two halves of the same institutional dynamic. The bogus charge was created to protect the security guard who split my scalp, the charge was then used as legal justification under LA R.S. 44:3(1) to withhold public records that would have exposed what happened at City Hall, and finally, that same shielded charge was held like a loaded weapon until law enforcement chose to deploy it against me during a winter storm in Lafayette. The prosecution created the cover-up, and the cover-up sustained the arrest.</p>
<p>Following my arrest in Lafayette, I was held in local custody for approximately six days while extradition arrangements were processed across parish lines. Extradition during an ice storm carries its own physical and mental toll. Transferred between holding facilities and loaded into a law enforcement transport vehicle, I spent hours shackled at the wrists and ankles, traveling southeast along icy stretches of Interstate 10 across the Atchafalaya Basin back toward Orleans Parish. The physical discomfort of cold transport vans, steel restraints pressing against skin in sub-freezing weather, and the anxiety of being returned to the very jurisdiction whose police department had charged me for being assaulted created an atmosphere of intense isolation.</p>
<p>Upon arrival in New Orleans, I was brought to the Orleans Parish Central Lockup facility at 2800 Perdido Street for formal booking. The booking process was conducted by Officer McIver, badge number 00625. I was fingerprinted, photographed, stripped of my personal belongings, and processed into the facility's system. Officer McIver recorded the formal charge: simple battery — the exact misdemeanor charge arising from the November 12, 2025 incident in which Allied Universal guard Jerome Ard had struck me with a flashlight, split my scalp open, destroyed my mobile phone, and required my transport to Tulane Medical Center.</p>
<p>Judicial authorities set my bond at $100 cash. A $100 cash bond is a modest financial figure, representing the lowest monetary tier typically assigned in municipal misdemeanor cases. In the institutional language of the court system, setting a $100 bond is an explicit acknowledgement that the underlying offense is minor and that the defendant requires minimal financial incentive to return to court. I had cash available in my personal property intake to pay the $100 bond immediately, which should have resulted in my prompt release from custody following booking.</p>
<p>Instead, jail administration created an artificial barrier to my release. Facility personnel falsely informed me that I could not post the $100 cash bond or be discharged without presenting a valid Louisiana driver's license. Under Louisiana law and local court rules, presenting a state driver's license is not a mandatory legal prerequisite for posting a cash bond on a misdemeanor charge, particularly for an out-of-state resident or someone posting full cash bail. Yet jail staff insisted on this non-existent requirement.</p>
<p>The human reality of being trapped behind a false administrative requirement is deeply frustrating. For two to three additional days beyond what the $100 cash bond required, I remained locked in a cell at 2800 Perdido Street while my money sat in a property envelope just beyond the bars. Every hour spent in a cold concrete cell under those conditions was entirely unnecessary — a period of forced detention created not by a judge's order or statutory mandate, but by jail personnel enforcing a rule that did not exist in law.</p>
<p>During my processing at 2800 Perdido Street, a formal pretrial risk assessment was conducted. For a lay reader, a pretrial risk assessment is an objective, algorithmic scoring tool — such as the Public Safety Assessment (PSA) or state risk evaluation rubrics — used by courts to evaluate a defendant's risk before trial. The tool analyzes objective background factors, including prior criminal history, court appearance record, age, and current charge severity, to place the defendant into a specific risk classification tier.</p>
<p>The assessment evaluated my background and placed me at Pretrial Risk Level 1 — the lowest risk tier available in the system. In practical terms, a Risk Level 1 rating is an official institutional certification that a defendant poses the lowest possible risk of failing to appear for court dates and the lowest possible risk of committing any new offense while awaiting trial. It is the system's own standardized tool declaring that the individual requires no special conditions, high bail, or extended detention to ensure public safety or court appearance.</p>
<p>The contradiction between this official classification and my actual treatment reveals how administrative systems operate in practice. On paper, the court system's validated risk-assessment tool rated me at Risk Level 1 — certifying that I was neither a flight risk nor a danger to the community. In reality, the jail administration kept me locked in a cell for two to three extra days based on a fabricated driver's license requirement. The system's objective evaluation declared I should be released, yet its frontline bureaucracy manufactured an informal pretext to keep me detained.</p>
<p>When jail officials finally processed my release from 2800 Perdido Street, the physical ordeal was far from over. I walked out of the facility into the cold air with my personal property returned in a plastic bag, but I was completely stranded. My vehicle was parked in Lafayette — roughly 150 miles away — where I had been taken into custody six days earlier at the Red Cross warming shelter. Law enforcement had forcibly transported me across the state to Orleans Parish, but upon release, they provided no transportation, travel voucher, or assistance to return me to where I had been seized.</p>
<p>Navigating from the lockup at 2800 Perdido Street required making my way to the Greyhound bus terminal at the Union Passenger Terminal in downtown New Orleans. Upon arriving at the station, I discovered the next available bus traveling west toward Lafayette would not depart for approximately six hours.</p>
<p>What followed was a six-hour wait in a drafty bus terminal, physically exhausted, shivering from the cold, and drained after days of continuous custody. Sitting on a wooden bench with my belongings, surrounded by bus announcements and passing commuters, the weight of the entire ordeal settled in. This logistical abandonment — leaving a released defendant 150 miles from his vehicle with no transit arrangements and a six-hour wait in a station — illustrates the cumulative, grinding character of institutional friction. Institutional harm is rarely defined solely by a single dramatic event like an assault or an arrest. It is equally defined by the accumulation of small, punitive burdens: an unfounded charge, a transfer across state highways, a fabricated documentation rule, and a cold six-hour wait on a station bench 150 miles from home.</p>
<p>The charge was ultimately dismissed on April 16 and 17, 2026, in Orleans Parish Criminal District Court, case number M625048, by Assistant District Attorney Trishawn Payne-Jones. The disposition code recorded on the case: 433 — "Refused, Law Enforcement Issue."</p>
<p>That disposition code carries profound legal significance. In prosecutor case-tracking terminology, Disposition Code 433 is not a technical dismissal based on a missing witness or a speedy-trial deadline. It is an explicit administrative statement by the district attorney's office that prosecution is being formally refused because of underlying problems with law enforcement's handling of the case. In an eight-year history of navigating court dockets, this entry stands as one of the most direct official admissions in the public record: the prosecutor's office itself concluded that the problem with this prosecution was not my conduct, but law enforcement's handling of it.</p>
<p>Read together, the three chapters devoted to the New Orleans matter — Chapter 32, Chapter 33, and Chapter 34 — trace a single continuous failure from beginning to end: a man struck with a flashlight, an investigation that protected my assailant, a records request denied using the resulting charge against me as pretext, and finally an arrest of that same wrongly-charged victim at an ice-storm shelter, before a prosecutor's own office quietly closed the file five months later with a disposition code amounting to an institutional shrug.</p>
<p>The next chapter turns to a different state entirely, and a different kind of confrontation — one that began, as so many have, with my exercising my right to speak on a public sidewalk, and ended with a federal courthouse arrest that a U.S. Marshal had predicted, almost to the month, a full year in advance.</p></section><section class="chapter"><p class="cnum">Chapter 35</p><h1>Reardon V. State: The Reversal</h1><p>On February 24, 2026, the Mississippi Court of Appeals decided Reardon v. State, case number 2024-KM-00839-COA. I won. The court reversed a June 28, 2024 dismissal that had gone against me, in a ruling where the State's own counsel on appeal was attorney Bela J. Chain III.</p>
<p>I remember sitting at my desk when the decision appeared on the Mississippi judicial portal's electronic docket in Jackson. Scrolling down the official docket entries, my eyes locked onto the opinion rendered under case number 2024-KM-00839-COA. After years of drafting pro se briefs, calculating rigid statutory deadlines, and confronting persistent opposition from state prosecutors, reading the single word "REVERSED" at the head of the Court of Appeals' written decision brought a moment of profound, quiet clarity. Attorney Bela J. Chain III had represented the State of Mississippi on appeal, advocating to affirm the circuit court's June 28, 2024 order of dismissal. Yet when the appellate judges evaluated the underlying record, they rejected the State's position and ruled in my favor. For a pro se litigant fighting against the institutional weight of the state's legal apparatus, that written opinion was an authoritative judicial declaration that the lower court's dismissal was legally erroneous.</p>
<p>This chapter closes Part IV, and it earns that position because of what it does to a piece of the record already encountered once, in the Busby dossier detailed earlier: Circuit Clerk Jeff Busby's own contradictory sworn statements about the status of my DUI-case appeal.</p>
<p>To recap briefly: on March 25, 2024, Busby wrote a letter stating that no properly filed appeal was pending, referencing five specific DUI-related cause numbers: 9290609, 9290610, 9291197, 9291198, and 9291202. On November 12, 2025, in a sworn federal affidavit filed as Exhibit A to his motion to dismiss in Reardon v. Osteen (ECF Doc 46-1), Busby swore that he had never provided the Galveston, Texas district attorney's office with information about my DUI appeal status. Chapter 15 already flagged the tension between those two statements: a 2024 letter that itself constitutes exactly the kind of information Busby would later swear, under oath in 2025, that he never provided.</p>
<p>To understand why the February 2026 ruling creates such a direct contradiction with Busby's affidavit, it helps to examine the timeline logic clearly for any lay reader following how official records move between jurisdictions. On March 25, 2024, Busby issued an official letter specifically cataloging those five DUI cause numbers—9290609, 9290610, 9291197, 9291198, and 9291202—and asserting that no valid appeal remained active on the Lafayette County dockets. That letter was a formal administrative document created by the elected Circuit Clerk of Lafayette County that directly addressed the legal posture of my DUI cases and admitted an appeal had been a subject of clerk recordkeeping. Yet a year and a half later, when named as a defendant in my federal civil rights suit in Texas (Reardon v. Osteen), Busby executed a sworn federal affidavit on November 12, 2025 (ECF Doc 46-1), swearing under penalty of perjury that he had never provided Galveston prosecutors or law enforcement with information concerning my DUI appeal status. The March 25, 2024 letter proves he did provide that information, directly contradicting his 2025 sworn affidavit.</p>
<p>The February 24, 2026 reversal in Reardon v. State adds a third data point to that contradiction, and it is the one that resolves the ambiguity most decisively. If the Mississippi Court of Appeals was still actively reversing a dismissal related to this matter in February 2026 — more than three months after Busby's November 2025 federal affidavit, and nearly two years after his March 2024 letter — then the underlying appellate status of my case was neither settled nor closed at either of the earlier points where Busby made his representations. A clerk's office swearing, in November 2025, to a settled understanding of an appeal's status, when that same appeal was still live enough to produce a reversal from the state's own Court of Appeals three months later, is difficult to reconcile with the plain, contemporaneous record of the appellate docket — a docket Busby's own office, as the circuit clerk's office of record, would ordinarily be expected to track with more precision than either of his sworn or written statements reflected.</p>
<p>The timeline logic laid bare by these three events reveals the full scope of the inconsistency. In March 2024, Busby's letter acknowledges and addresses the status of cause numbers 9290609, 9290610, 9291197, 9291198, and 9291202, claiming no appeal was properly pending. In November 2025, Busby swears under oath in federal court that he never gave Galveston authorities information about my appeal status. And on February 24, 2026, the Mississippi Court of Appeals rules in 2024-KM-00839-COA that the June 28, 2024 dismissal was legally erroneous and reverses it. The Court of Appeals' 2026 ruling proves the appeal genuinely was unresolved and active in the appellate system, corroborating the underlying premise of the 2024 letter—that an appeal was being actively litigated—while fatally undercutting the 2025 sworn affidavit's blanket denial that appeal status information was ever discussed or transmitted.</p>
<p>None of this proves Busby lied under oath in November 2025 — proving perjury requires establishing not just that a statement was false, but that the person making it knew it was false at the time, and the available record does not include that level of proof regarding Busby's state of mind. What can be said plainly is that three separate points in the record — a 2024 letter, a 2025 sworn affidavit, and a 2026 appellate reversal — cannot all be reconciled into a single, consistent account of what Busby knew and when he knew it, and the burden of explaining that inconsistency belongs to Busby's office, not to me.</p>
<p>Navigating these administrative contradictions was one of the most demanding aspects of prosecuting my cases pro se. As a self-represented litigant, I was required to follow every technical procedural rule, calculate exact filing dates, and serve every motion properly. Yet institutional officers could issue written letters claiming an appeal was non-existent, execute sworn federal affidavits denying they had shared appeal status information, and watch as the state Court of Appeals ultimately confirmed that the appeal was valid and that the circuit court's dismissal was wrong.</p>
<p>The reversal itself stands as its own, independent vindication, separate from what it reveals about Busby's earlier statements. A Mississippi appellate court, reviewing the same underlying DUI-case record referenced throughout the 2020-2022 account, concluded that the June 28, 2024 dismissal against me was wrong and reversed it. Combined with the January 21, 2025 full vacatur of the 2022 stalking conviction detailed in the previous chapter, and the June 2024 vacatur of the probation-violation sentence detailed in Chapter 25, this reversal completes a run of three separate, independent judicial and appellate findings across roughly twenty months — June 2024, January 2025, and February 2026 — each concluding that a different piece of the case documented since Chapter 4 should not have stood as it did.</p>
<p>Looking back across those twenty months provides a stark sense of vindication. In June 2024, the court vacated the probation-violation sentence that had restricted my freedom. On January 21, 2025, a court ordered the full vacatur of the 2022 stalking conviction that local officials had used to label me a convict. And on February 24, 2026, the Mississippi Court of Appeals handed down its decision in 2024-KM-00839-COA, reversing the June 28, 2024 dismissal and defeating the State's defense led by attorney Bela J. Chain III. Three distinct courts, reviewing three distinct proceedings over twenty months, each determined that Lafayette County's actions against me were legally unsustainable.</p>
<p>That is not a coincidence worth treating lightly. Three separate courts, addressing three separate procedural postures, arriving at three separate conclusions that something in Lafayette County's handling of my cases had gone wrong, is a pattern the earlier chapters predicted long before any of these rulings existed — built, chapter by chapter, on a bill of sale that predated an alleged threat by twelve days and testimony a recorded phone call contradicted.</p>
<p>Part V turns to what came next, once I was living in Utah, free of Mississippi's courts for the first time in nearly eight years: a new front, opening in 2025, in a different state and eventually before a federal court, that would show the same patterns documented across these twenty-six chapters were not unique to Lafayette County, Mississippi at all. Standing in Utah, looking out at the snow-capped Wasatch Range, I was physically removed from North Mississippi for the first time in nearly a decade. The mountain landscape was a world away from the red-clay hills of Lafayette County, but the legal battle was far from over. As Part V details, when Galveston authorities and federal courts in Texas entered the picture in Reardon v. Osteen, the exact same administrative maneuvers, conflicting affidavits, and official overreach that had characterized Lafayette County's actions crossed state lines, proving that the struggle for accountability was far larger than a single county court.</p></section><section class="chapter"><p class="cnum">Chapter 36</p><h1>The Union County Thread</h1><p>On April 15, 2026, Board of Supervisors President CJ Bright confronted me on a public sidewalk in Union County, Mississippi, during a First Amendment audit — the same broad category of activity documented since Chapter 12's Oxford U.S. Attorney's Office confrontation and Chapter 30's Lafayette courthouse arrest. On camera, Bright admitted he could not legally stop me from doing what I was doing. That admission, captured on tape by the person it was made to, is one of the more remarkable pieces of documentary evidence — a sitting county official acknowledging, on the record, the very right the rest of this chapter shows Union County's institutions proceeding to violate anyway.</p>
<p>On April 20, minutes before I spoke, the Union County Board of Supervisors issued a preemptive warning at that same meeting: any obscenity or vulgarity during public comment would result in immediate removal from the room. I was arrested for using a single profane word during public comment under that warning — the charge was Public Profanity, Mississippi Code § 97-29-47. Alongside that arrest, a "phantom" hold was placed on me by the Mississippi Department of Corrections — phantom because it had no underlying legal basis. My own account of what happened next is not internally consistent, and I would rather say so than paper over it: one version I have states the hold's origin was admitted and a release order signed on April 24, during a court appearance; a timeline summary of the same events I also produced states April 21. I do not have the charging affidavit or the actual release order in front of me to settle which date is correct, so I am naming the discrepancy rather than picking one and calling it fact.</p>
<p>A rule announced minutes before I spoke, and then used within minutes to arrest me for the exact category of speech it had just been written to target, is difficult to read as anything other than a restriction built for one specific critic rather than genuine order at that meeting. A hold with no legal basis, placed on me immediately afterward, reads the same way — an attempt to hold me in custody by whatever mechanism was available, with the underlying legal justification worked out, or in this case not worked out at all, after the fact. It is the same institutional reflex identified at the close of Part II: a documented grievance or confrontation, followed not by engagement with its substance but by escalating containment.</p>
<p>On May 5, appearing pro se in Union County Justice Court on the profanity charge, I raised the Supremacy Clause of the United States Constitution — the argument that a federal constitutional protection overrides a local vulgarity statute. The presiding judge, whose name does not appear in any account I have of this and whom I am not going to guess at, answered from the bench: "I don't give a rat's ass about that." A judge presiding over a public-profanity prosecution used profanity himself, from the bench, to dismiss the one argument that went to whether the statute could constitutionally reach me at all. The contrast speaks for itself. I filed nine motions that day — one of them a twenty-four-page memorandum of law citing thirty-two Supreme Court cases, and a tenth, a motion for the judge's recusal, five days later on May 10 — a volume and density of citation that reflects, whatever one thinks of the underlying merits, a considerably more sophisticated pro se litigant than the one who filed the early, uncounseled motions detailed in Chapters 17 and 24.</p>
<p>On June 1, a separate and distinct arrest, I was taken in for carrying a sign reading "FUCK CITY HALL" into the Justice Court and the county courthouse, this time on a charge of Disturbing the Peace under Mississippi Code § 97-35-13 — a different statute from the profanity charge six weeks earlier, not a second telling of the same arrest. Before doing so, I reportedly asked deputies whether Investigator Adam Fitz — spelled variously as Fitts in the available record — "had big enough balls to arrest me again." Sheriff Jimmy Edwards made the arrest personally, telling me on camera, "You wanted it, you gonna get it," and separately, "I'm gonna keep arresting you." When I told him the Supreme Court had already decided this exact question in 1971 — Cohen v. California, a jacket reading "Fuck the Draft" worn into a courthouse, conviction reversed — his answer was: "I don't know that." My phone was seized without a warrant. The sworn affidavit behind this arrest has real problems on its face: its charge line reads "Disturbance of a Business" while the body of that same document alleges Disturbing the Peace; it carries no case number, no docket number, no notary stamp, and no clerk stamp that I can find anywhere in my copy of it. It also states that courthouse employees were "fearful of what he might be capable of doing" without alleging a single threat, anywhere in the document, that would justify that fear. The sign's language is recorded plainly here rather than softened, and a profane sign carried into a courthouse remains a materially different act from simply speaking or filming on a public sidewalk — an escalation worth naming without excusing, even while the institutional overreach surrounding it still gets documented in the same breath. I did not stop at the courthouse steps with it, either — I carried the sign directly into an active courtroom, where I encountered my procedural advisor, Mark McClinton, and showed it to him; his presence there that day is confirmed, not in question. What I am flagging deliberately is something narrower: I do not know whether this is the same Mark McClinton who surfaces in an October 2022 phone call elsewhere in this record. I have checked my own memory directly on that specific question and it is not there. A second name attached to this same June 1 incident, a "Chad Mood," also appears in my own records from this period, and I cannot place who he is or which of these two fronts, 2022 or 2026, he actually belongs to. I am naming both as permanent unknowns rather than open leads.</p>
<p>Three days later, on June 4, I drove to the Thomas G. Abernethy Federal Building in Aberdeen, Mississippi — a third arrest, in a different city, county, and agency from the two above, and the reason I went there was specific: I intended to file an emergency federal civil rights complaint seeking to restrain the Union County sheriff and the other officials named throughout this chapter, more than one hundred pages across six documents. Security demanded photo identification, a requirement the available record does not establish as an actual federal mandate for entering a public federal building lobby. After a twenty-minute delay attributed to waiting on an individual identified only as "Mr. Lipshutz," whose role remains unclear, officers outside asked me directly: "If I don't give my ID, will I go to jail?" The answer: "Probably." I identified myself under that threat and was arrested anyway. Police Chief D. Shumpert arrived and made the arrest, relying solely on building security's account that I had "caused a disturbance." My car was searched and towed from the federal lot; my phone was seized. The resulting prosecution was routed to municipal court rather than federal court — a jurisdictional choice whose full significance is hard to pin down, beyond noting that it kept the matter out of the federal system whose own agents had, per the previous chapter's evidence, predicted almost exactly this outcome nearly a year earlier.</p>
<p>I want to close out that complaint's own fate plainly rather than leave it dangling: as of this writing, I never did file it. I was stopped at the door of the one building where I could have, and I never got a second run at it — because from Aberdeen I went on to Galveston, and Galveston is where the next chapter's events took over. That is not a coincidence I am asserting caused anything; it is simply the honest order of things. A complaint meant to stop a pattern of retaliation instead got swallowed by the next round of it.</p>
<p>Two days later, on June 6, I published my own account of the incident under my own byline. The following day, June 7, an Aberdeen Police Captain identified in the available record by the initials "SRQ" Lee texted the article to colleagues with the caption: "Watch the video with us in it. Lol."</p>
<p>That single text message closes this chapter more effectively than any summary could. A police captain, forwarding a published account of his own department's conduct to colleagues, treating it as a joke rather than a concern, captures precisely the institutional culture traced across eight years and multiple states: officials who do not merely fail to see their own conduct as a problem, but find it genuinely funny that someone documented it. The next chapter returns to the federal case followed since Chapter 28, and to the parallel civil rights litigation — Reardon v. Osteen — where a federal magistrate's own findings would, in July 2026, formally validate large parts of what I have spent thirty-three chapters documenting.</p></section><section class="chapter"><p class="cnum">Chapter 37</p><h1>Reardon V. Osteen: The Objections</h1><p>On July 14, 2026, a federal magistrate judge entered a Report and Recommendation in Reardon v. Osteen — the consolidated federal civil rights lawsuit, filed in the Southern District of Texas before Judge Jeffrey V. Brown and referred to Magistrate Judge Andrew M. Edison, that names the Galveston officials from Chapter 24's affidavit contradiction alongside Circuit Clerk Jeff Busby and Deputy Kandi Beavers from Mississippi as co-defendants in a single pro se action. That R&amp;R resolved seven separate motions at once, and it marks the moment where a federal court, for the first time in this entire eight-year saga, formally engaged with — and in one specific instance, validated — the credibility findings built chapter by chapter since Part I.</p>
<p>The R&amp;R recommended granting the motions to dismiss filed by Busby, by the Galveston defendants (the City, Officer Osteen, and Sergeant Doraty), and by Beavers, largely on jurisdictional and procedural grounds not worth relitigating in detail here — pro se civil rights complaints against officials in multiple states, filed as a single consolidated action, face exactly the kind of personal-jurisdiction and claim-construction hurdles already examined in Chapter 25's discussion of my earlier, unsuccessful 2022 federal lawsuit. The R&amp;R also recommended denying my motion for a temporary restraining order connected to a June 22, 2026 vehicle seizure — the towing of a 2016 Mitsubishi Outlander after I was cop-watching at a Galveston Walgreens, held twenty-two hours, and towed to a lot where a supervisor identified as "Ray" told me: "Stand in line, that's what happens to people like you."</p>
<p>What makes this R&amp;R more than another chapter in a string of procedural setbacks, however, is not a buried footnote. It is Magistrate Judge Edison's own words, stated plainly in the body of a thirty-three page opinion, comparing Osteen's sworn blood-warrant affidavit against Osteen's own later testimony before Judge Tollison — the same contradiction examined in full in Chapter 24. After walking through the affidavit's "moderate odor of alcohol" and "dilated" pupils against Osteen's revocation-hearing testimony that he "could not smell alcohol" and that my pupils were "pinpoint," Edison wrote: "I take no pleasure in this result. The record shows that Osteen lied to Judge Tollison. That is disturbing." A federal magistrate judge did not imply a contradiction. He used the word lied, in a written federal order, about a police officer's sworn testimony.</p>
<p>Edison went further on a second claim in the same case. On the towing and auctioning of my vehicle after the arrest, he did not merely find the question close — he ruled outright: "Because it was unreasonable to impound Reardon's vehicle, Reardon has stated a constitutional claim for unreasonable seizure." A federal judge found, as a matter of law, that my Fourth Amendment rights were violated.</p>
<p>Both findings should have been the end of the government's case. Neither was. On the lie, Edison still recommended dismissal of the malicious-prosecution claim, reasoning that independent probable cause existed for the underlying DWI arrest — a failure to maintain a single lane, a refused field sobriety test — regardless of what Osteen said about alcohol, so the lie, however "disturbing" in his own word, did not defeat the legal elements the claim required. On the seizure, having found an actual constitutional violation, Edison still recommended qualified immunity for Osteen and Doraty, because I could not point him to a prior case with sufficiently similar facts — citing Degenhardt v. Bintliff, a Fifth Circuit decision that itself postdates my August 2023 arrest by more than a year. A citizen can prove an officer lied under oath and still lose. A citizen can have a federal judge rule his rights were violated and still get nothing for it. Both of those sentences are now part of the permanent record of this case, in a sitting federal magistrate's own words, and I want them read exactly that plainly.</p>
<p>I, still pro se, filed nine objections to this R&amp;R on July 28, 2026 — precisely on the fourteen-day deadline, file-stamped that same day by Clerk of Court Nathan Ochsner. Six of those objections, plus a ninth, proceed under Federal Rule of Civil Procedure 72(b), which governs de novo review of dispositive recommendations: qualified immunity on the vehicle-seizure claim, argued through the "obviousness" doctrine the Supreme Court articulated in Hope v. Pelzer — a doctrine holding that a right can be clearly established for qualified-immunity purposes even without a prior case presenting identical facts, if the unlawfulness of the conduct would have been obvious to any reasonable officer. This framing matters because the magistrate's own R&amp;R twice cited Degenhardt v. Bintliff, a Fifth Circuit decision that postdates my August 2023 arrest — meaning the "clearly established law" question genuinely turns on which legal framework the reviewing court applies, not on a settled, uncontested body of precedent. "Clearly established law," in qualified-immunity doctrine, is the standard that determines whether a government official can be held personally liable for a constitutional violation: an official is immune from suit unless the right they violated was so clearly defined by existing case law that any reasonable officer in their position would have understood their conduct was unlawful. Ordinarily, that requires pointing to a prior case with closely similar facts. Hope v. Pelzer's "obviousness" doctrine is the narrow exception — it allows a right to count as clearly established even without a factually identical precedent, if the unlawfulness would have been obvious to any reasonable officer regardless. That distinction is the entire fight in this objection, because the alternative case the magistrate's R&amp;R relied on, Degenhardt v. Bintliff, was decided after my own arrest — meaning it could not have given fair notice to the officers involved in August 2023, and my objection argues the obviousness doctrine should apply instead.</p>
<p>My objections also concede, while reserving the right to amend, my First Amendment retaliation, excessive force, and Doraty-related claims — "leave to amend" being a request that, even where a claim is being dismissed, the court allow it to be refiled in a corrected form rather than closing the door permanently — and reserve the Busby personal-jurisdiction question for further briefing. The choice of review standard matters practically, not just procedurally: Rule 72(b)'s de novo review means the district judge considers those six-plus-one objections completely fresh, giving no deference at all to the magistrate's reasoning, while Rule 72(a)'s clear-error standard, governing the remaining two objections, means the district judge will only overturn the magistrate's ruling if it was clearly wrong — a considerably harder bar to clear. Two further objections proceed under Rule 72(a)'s more deferential clear-error standard, addressing the motion to strike and sanctions request and the denial of leave to file a supplemental complaint — with the June 22, 2026 second vehicle seizure to be refiled as an entirely separate action rather than folded into this one.</p>
<p>The single most important objection is the third — and I want to be exact about what it actually asked for, because I did not use it to relitigate probable cause. It asks the district court to formally preserve, on the appellate record, both the magistrate's own finding — quoting Edison directly, "the record shows that Osteen lied to Judge Tollison. That is disturbing" — and the government's own paragraph-14 concession, and it requests a narrow Franks hearing limited to that materiality question. In the same objection, in my own words filed with the court, I told Judge Brown that "the R&amp;R's independent-probable-cause analysis is substantive" — I was not asking him to overturn Edison's probable-cause finding. I was asking him not to let a documented finding that a police officer lied simply vanish from the record because the underlying claim happened to fail on other grounds. That is a materially different, and considerably more modest, request than "reverse the dismissal" — and it is worth being honest about that distinction, because it makes what happened next even harder to justify: even a request that limited got the same silent, one-sentence treatment as everything else.</p>
<p>How the district court would rule on these objections was not known when the paragraph above was first drafted. It is known now, and I have since obtained copies of both governing documents from the docket: the Order Adopting Magistrate Judge's Memorandum and Recommendation (Dkt. 93) and the Final Judgment (Dkt. 94), both signed by Judge Jeffrey Vincent Brown and entered August 10, 2026. Judge Brown's order states, in full, that the court "has carefully considered the objections; the memorandum and recommendation; the pleadings; and the record," and "accepts Judge Edison's memorandum and recommendation and adopts it as the opinion of the court" — all nine of my objections, rejected without individual discussion of any of them. The order grants the three pending motions to dismiss (Busby, the Galveston defendants, and Beavers), sua sponte dismisses Hoby James, Galveston County, and the Doe defendants for failure to state a claim, declines supplemental jurisdiction over my state-law claims, and denies my request for injunctive relief connected to the June 22 vehicle seizure. The Final Judgment that followed is one paragraph long: the matter is dismissed, and it is final.</p>
<p>The order gives exactly one piece of its own reasoning beyond simply adopting the magistrate's recommendation wholesale, and it concerns my request for leave to amend a third time. The court noted that Magistrate Judge Edison had already granted me leave to file a second amended complaint in April 2026 — five months after the original amended-pleading deadline — and concluded: "The court will not permit Reardon to file a third amended complaint." That is the entirety of the district judge's own independent analysis in a fourteen-page procedural history spanning seven resolved motions. Whether the nine specific legal arguments in my objections — including the Hope v. Pelzer "obviousness" doctrine argument and the Osteen paragraph-14 concession — were rejected on their merits or simply swept in by the blanket adoption of the magistrate's recommendation is not something the order itself answers. It says the R&amp;R is adopted "in its entirety." It does not say why, beyond the one paragraph about amendment, any of the nine objections specifically fail.</p>
<p>A federal civil rights case that spent thirteen months documenting, among other things, a records-and-communication failure at the center of the underlying Galveston arrest itself has now closed with a two-page order and a one-paragraph judgment. The bill of sale, the paragraph-14 concession, the Degenhardt-postdates-the-arrest argument — none of it earns a sentence of individual analysis in the document that ends the case. That is not, on its own, proof of anything improper; district courts are not required to write an opinion addressing every objection individually, and adopting a magistrate's recommendation without separate discussion is common practice, not evidence of bias. I am naming the fact plainly rather than either inflating it into more than it is or letting it pass unremarked: the case is over at this level, the appeal clock runs from August 10, 2026, and everything that follows in this book's account of it depends on what a federal appellate court eventually says about the nine questions the district court did not individually answer.</p>
<p>The next and final chapter of Part V turns to the event this Part has been building toward: my sentencing in the federal courthouse case, held August 7, 2026, and what actually happened when the ruling I had been waiting years for finally arrived.</p></section><section class="chapter"><p class="cnum">Chapter 38</p><h1>Sentencing</h1><p>I was sentenced on Friday, August 7, 2026, in the federal courthouse case detailed across Chapters 27 through 29 — the case arising from my August 25, 2025 arrest at the John M. Shaw United States Courthouse in Lafayette, Louisiana, and the January 16, 2026 guilty verdict that followed my December 2025 bench trial. The hearing took place at the Lake Charles Division of the U.S. District Court for the Western District of Louisiana, conducted by video teleconference — I appeared from Our Daily Bread, a missionary organization in Galveston, Texas, that hosted the call for me that day.</p>
<p>The government asked for unsupervised probation of up to five years, with a condition barring me from federal courthouses except when personally filing a lawsuit. I asked for the opposite: time served, or the full thirty-day statutory maximum in place of any probation at all. I told the court plainly that I would rather serve every remaining day of a finite sentence than accept an indefinite condition on my right to walk into a public building and do my job.</p>
<p>I delivered that argument myself, reading from a prepared allocution. I identified myself as a Marine Corps veteran and the founder of We the People News, and framed the case not as a dispute over a locked door but as the completion of a surveillance campaign that began two months before any charge existed. I read into the record the June 24 and June 26, 2025 emails a deputy U.S. marshal had sent to court-staff addresses under the subject line "First Amendment Auditor Matthew Rearen," and the results of the FOIA request that took the Marshals Service nearly two months to answer — fourteen redacted pages, delivered three days before my arrest, confirming that alert bulletins carrying my name, photograph, driver's license number, date of birth, height, and weight had circulated to marshals and court security officers in Mississippi and Louisiana. I read Magistrate Judge Carol B. Whitehurst's November 2025 recusal order into the record — "an objective and reasonable observer could believe the undersigned is predisposed to find Rearen guilty of the offense later charged" — and pointed out that the government had, weeks later, moved to seal the very communications that recusal order was based on. I argued that the government's own admission, on the sealed trial record, that it failed to preserve the courthouse lobby's surveillance footage meant the only video evidence used to convict me was the product of the First Amendment activity the case was ostensibly not about. I described the arrest itself — Deputy U.S. Marshal Hayden Nugent telling me to move my equipment, my complying, and being arrested anyway; the camera and gimbal destroyed on the ground; a knee or knuckles into my chest in the holding cell; a threatened felony charge when I pulled away; a heart rate paramedics clocked between 140 and 160 beats a minute, which marshals and paramedics on scene suggested I was faking to avoid custody. I described being shackled and driven to a parish jail booking desk where the deputy receiving me admitted, when asked, that there was no charge — only, in his words, a hold for the U.S. Marshals.</p>
<p>I owe the record one clarification to my own allocution, made here rather than left standing uncorrected: "destroyed" overstated it, and I want to be precise instead of dramatic. The camera and gimbal were introduced at trial as government exhibits — meaning they existed intact enough to be logged, marked, and shown to the court, not smashed to pieces. The court's own findings after that two-day trial, with the arrest video in evidence, describe me refusing Deputy Nugent's order, being warned, and being arrested after a countdown — they make no finding of a fall, a struggle, or physical damage. But intact enough to sit on an evidence table is not the same as undamaged. A gimbal is a precision instrument built around sensitive stabilization sensors, and mine did not work correctly afterward — the kind of internal damage a chain-of-custody exhibit photo would never show. What I said in the moment, "destroyed on the ground," was my own overstatement under real physical and emotional stress; what I can actually stand behind is that the equipment was damaged and stopped functioning as it had before, on my own account, not the court's finding. I am printing both the overstatement and the correction rather than let either one stand alone.</p>
<p>I drew a direct line from that condition to the two banishments described in earlier chapters — the 2017 exclusion from Lafayette County and the 2022 exclusion that followed it, the second of which became the pretext for a revocation built on testimony I maintain was perjured, and cost me a year in custody and my presence at my son's birth. I told the court I recognized the pattern because I had already lived it, and that I would not give the government another chance to use a geographic-access condition as a trip wire. I stated for the record that I did not consent to any probation condition restricting my presence in public buildings, my recording, or my speech, and that if the court intended to impose one anyway, it would do so over my objection and without my consent.</p>
<p>The court did not fully agree with me, but did not fully agree with the government either. The sentence imposed was time served — credited toward, not substituted for, a possible future revocation — plus two years of unsupervised probation. The courthouse-access condition survived, but narrower than the government's own request: barred from the John M. Shaw courthouse and any federal courthouse in the state of Louisiana specifically, not nationwide, unless conducting legitimate business, in which case two business days' notice to the U.S. Marshals Service is required. No fine was imposed and the special assessment was waived; the court found me financially unable to pay either.</p>
<p>The condition's own wording did the vagueness objection's work before Talbot ever spoke. The court barred me from the John M. Shaw courthouse, or any other federal courthouse within the state of Louisiana, or upon any grounds adjacent thereto owned or leased by the United States government or any of its departments or agencies — a sentence that opens narrow, widens to the whole state, and then widens again with a clause that drops the state limitation entirely before the exception clause finally narrows it back down. Read closely afterward, the most defensible interpretation ties that last clause back to the Louisiana courthouses specifically, not to federal property everywhere. Heard once, live, over a video link, in the middle of a ninety-minute hearing, it did not read that way at all — it read like a nationwide ban with a two-word Louisiana carve-out that might or might not still apply. Talbot objected on the record that "legitimate business" was impermissibly vague — the government's own answer, that the standard was the same one any accredited journalist already follows when declining to film inside courthouse corridors, was enough for the court to overrule the objection and let the language stand. But the deeper vagueness was never in "legitimate business" at all. It was in the sentence that came before it, and it was confusing enough that even careful, contemporaneous listening left me unsure, in the moment, what the condition actually covered — which is itself the plainest evidence that the objection Talbot made was the right one, whatever the court's ruling on it.</p>
<p>A sidebar midway through the hearing produced the exchange that will likely matter most on appeal. The court's initial phrasing — sentencing me "to the time served thus far" and then, separately, imposing probation — reads, and was heard by me, as two sentences stacked on top of each other. Brought back on the record after a private conference, the court clarified that this was not the intent: the time-served credit only becomes operative if the probation is later revoked, at which point I would face resentencing on the original charge, capped at the same thirty-day statutory maximum, with credit for time already served against it. I pressed for a direct answer on whether the court could hold me longer than thirty days across a full violation-and-revocation cycle. The court declined to answer what it characterized as a hypothetical, and directed me to my attorney. The government's own explanation for why it would not answer — that my own conduct on the day of any future violation could expose me to entirely new charges, making any general answer impossible to give responsibly — was, on its own terms, reasonable. It was also, from my side of the video link, not an answer, and the record now shows me saying so plainly, on the record, before the hearing closed.</p>
<p>Rule 58(g)(2)'s fourteen-day appeal clock began running at entry of the written judgment the court indicated would follow within days of the hearing. The plan documented in Chapter 37 — a Notice of Appeal paired with a motion to unseal the trial transcript and lift the protective order governing the marshal-communications testimony — proceeds from here, built around the same spoliation and structural due-process argument already laid out: not a request that a reviewing court resolve how much protection courthouse-lobby recording deserves, but whether I received a fair trial on a complete evidentiary record, when the record's own gaps are the government's making.</p>
<p>What the hearing did not resolve — what no one in that video call, including the court itself, appeared able to resolve in the moment — was how a two-year probationary period squares with a thirty-day statutory ceiling if it is ever tested. That unresolved question, more than the courthouse-access condition itself, is what I carry out of Lake Charles and into the appeal.</p>
<p>A second, quieter worry sits underneath it. Standard federal probation carries a mandatory condition that the probationer commit no new federal, state, or local crime during the probationary term — required by statute for every person on federal probation, not something added because of who I am or what I do for a living. But I have spent the better part of a decade being arrested by state and local officers on charges that were later dismissed, reversed, or vacated outright — the 2017 Lynch case, the 2022 Union County arrests, the Galveston DWI that collapsed to a 0.00 blood-alcohol result, the New Orleans battery charge disposed of as a law-enforcement error, the Mississippi Court of Appeals reversal that came down as recently as February 2026. Given that record, and given the documented BOLO alerts already circulating my name to marshals and court security officers across two states before this case ever began, the fear that a future pretextual arrest anywhere could be used to trigger a federal probation violation is not an abstract one for me. It is the same fear, arrived at from a different angle, that produced my allocution in the first place: that an indefinite condition, once attached to my name, becomes a lever other people can pull. What actually limits that lever — a revocation still requires the government to prove, at a hearing, that a new offense was actually committed, not merely alleged — is real, but it is a legal safeguard I will have to rely on being enforced correctly by the same system that has, by my own experience and by several since-reversed dockets, not always gotten that right the first time.</p>
<h3>The Call After</h3>
<p>A few days after the hearing, my attorney Dustin Talbot called to walk me through what had actually landed in the official docket. He'd filed the Notice of Appeal. Because there was no district judge assigned to a case that had run its entire life before a magistrate, the clerk's office had to assign one for the appeal — and briefly assigned Judge David Joseph, sitting in the Lafayette courthouse. Judge Joseph recused himself without being asked. I told Talbot I was glad of that, and I meant it; whatever else is true about this case, a judge who steps aside on his own, before anyone raises the question, is doing something right. As of that call, no replacement judge had been assigned yet.</p>
<p>Talbot also confirmed something I'd wanted on the record: he had ordered every transcript that matters — the spoliation hearing, both days of the bench trial, the First Amendment motion hearing, and the sentencing hearing itself. He told me the whole appellate process would likely run close to six months from there: transcripts first, then a briefing schedule from whichever district judge inherits the case, then his opening brief roughly three weeks after the transcripts are filed.</p>
