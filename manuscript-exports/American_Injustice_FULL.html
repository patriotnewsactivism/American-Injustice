<p>Here is the specific chain I laid out for the Inspector General. Lafayette County Sheriff's Deputy Kandi Beavers testified that I had entered the FBI office without permission and without a lawful purpose. I have audio recordings that contradict that. Assistant District Attorney Tiffany Kilpatrick used that testimony to petition for my probation to be revoked — while she was campaigning for Lafayette County Judge, using my case, by my reading, as a piece of that campaign. I cited the FBI's duty to investigate under 18 U.S.C. § 241 (conspiracy against rights), § 242 (deprivation of rights under color of law), and § 1503 (obstruction of justice), and asked the OIG to open an independent investigation into the Bureau's inaction, pursue discipline against the personnel who let it slide, and refer the underlying conduct to the DOJ's Civil Rights Division.</p>
<p>I said in that letter, and I'll say it again here, that the FBI's refusal to act didn't just fail to help me — it enabled a wrongful prosecution to go forward on testimony that audio recordings I already had in hand contradicted. I attached the recordings, the transcripts, the court documents. I asked for a case number. I never got one. No acknowledgment, no docket, nothing. By the time I recorded a second video on this a year later, I'd filed a second complaint. That one went unanswered too.</p>
<p>The same footage that accompanies this complaint captures the night it actually cost me my freedom. Not long after that Oxford visit, a Lafayette County deputy pulled me over on a routine stop — an expired tag, he said — and the stop was cordial, almost apologetic. He told me he'd never had a bad experience with me "besides everything that's going on." Then he told me the real reason: there was a circuit court order holding me for a revocation hearing the next morning, and he needed to take me in that night. I told him I'd done nothing wrong, that I'd just come from Holly Springs. He said he understood. I asked to have my wife, out in Hernando with our kids, come get my car. He let me make the call. Then he took me to jail.</p>
<p>On a separate recorded call that same period, I phoned the FBI directly and told the operator I needed to speak to an agent about corruption inside the Holly Springs Police Department — corruption I said started at the top and that I had on video and audio. The operator told me the Bureau generally handled that kind of thing through in-person walk-ins, not phone calls. I explained why a walk-in wasn't simple for me anymore: Lafayette County had banished me from the city of Oxford, and I needed permission just to enter it.</p>
<p>I don't have an independent finding that Deputy Beavers's testimony was false, or that ADA Kilpatrick's timing with her own judicial campaign was anything other than coincidence — those are my allegations, laid out with the evidence I have, not a court's conclusion. What I do have, on the record and unanswered, is a federal complaint naming specific statutes, specific officials, and specific recordings, sent to the one office in the country whose job is to investigate exactly this kind of thing. Silence is an answer too. It's just not the one the law promises.</p></section><section class="chapter"><p class="cnum">Chapter 27</p><h1>Layton, Utah</h1><p>Eighteen hundred miles is the number I keep coming back to.</p>
<p>That is roughly the distance from Oxford, Mississippi to Layton, Utah — a small city north of Salt Lake, up against the Wasatch Front, where I had never lived, knew nobody, and had no history of any kind. In January 2025 a Mississippi court fully vacated the 2022 conviction, the probation, and the five-year banishment that had governed the previous three years of my life. Chapter 26 covers what that took. What it meant in practical terms was that for the first time since 2017 I could choose where to be.</p>
<p>I chose the farthest place I could think of that I had no connection to. That was the entire theory. Go somewhere nobody has a file on you and start over.</p>
<p>I moved into a rented address in Layton late on the night of <strong>February 1, 2025</strong>.</p>
<p>I want to be precise about what "late on February 1" means, because it turns out to matter more than anything else in this chapter. I moved in at night. I had not given the address to anyone. It was not on a driver's license — I had not changed one. It was not on a voter registration, a utility account in my legal name, a mail-forwarding order, or any government form of any kind. I had not told my family. I had not written it down anywhere public. I swore later, under penalty of perjury in federal court, to a detail that sounds like a rhetorical flourish and is not: <strong>I had not yet memorized it myself.</strong> I was still reading it off the lease when I needed it.</p>
<p>I also want to be straightforward about something I did on purpose, because the other side made a great deal of it and they were entitled to. When I started filing public-records requests in Utah, I filed them as <strong>"Don Matthews."</strong> That is the name I have used publicly as a journalist for years. It is not a legal name change. Utah's public-records statute is called GRAMA — the Government Records Access and Management Act — and my position was and is that a records request does not require you to prove who you are, because the records belong to the public regardless of which member of the public is asking. Layton's position was that they wanted government-issued identification. That fight is most of the middle of this chapter, and I lost more of it than I won.</p>
<h3>February 3: the bank</h3>
<p>Two days after I moved in, I did what I do. I went downtown with a camera.</p>
<p>On <strong>February 3, 2025</strong> I conducted a First Amendment audit at a Zions Bank branch in Layton — standing in a publicly accessible area, filming, waiting to see what happens. What happened is that somebody called the police and Layton officers responded.</p>
<p>And here is the part I have to write first, before any of the rest of it, because it is true and because everything I am about to allege depends on my being the kind of person who reports the whole record: <strong>those officers were fine.</strong> They were professional. The encounter went nowhere. I said so at the time, on camera. I gave them a pass. I have no complaint about the two Layton patrol officers who answered that call and I am not making one.</p>
<p>I put the video on YouTube, the way I put everything on YouTube.</p>
<h3>February 5, 8:09 a.m.</h3>
<p>Two days after that — four days after I had moved in — a police captain in Mississippi sat down and wrote an email about me to four officials in Layton City, Utah.</p>
<p>I am not characterizing this email. I have it. It is a verbatim exhibit to a federal complaint, and this is what it says. <strong>Captain Hildon Sessums</strong> of the Oxford, Mississippi Police Department introduces himself as <em>"a Captain with the Oxford, MS, Police Department and a graduate of the FBI National Academy."</em> He describes me as <em>"a former Oxford resident, a convicted felon, and a persistent issue for our department."</em> He explains how I came to his attention: <em>"we discovered a YouTube video in which he conducted a 'First Amendment audit' at Zions Bank in Layton."</em> He attaches links to two <em>Oxford Eagle</em> articles and a WREG piece about me.</p>
<p>And then he gives them my street address in Layton, Utah, and describes where it came from in three words: <strong>"from our research."</strong></p>
<p>Timestamp on that email: <strong>February 5, 2025, 8:09 a.m.</strong></p>
<p>I had been living at that address for <strong>four days</strong>. At night.</p>
<h3>February 5, 9:46 a.m.</h3>
<p>Ninety-seven minutes later, <strong>Lieutenant Riley Richins</strong> of the Layton Police Department forwarded Sessums's email inside Layton City.</p>
<p>Not to a supervisor. Not to an intelligence unit. He forwarded it to the department's <strong>"PD Sworn," "PD Records," and "PD Dispatch"</strong> distribution lists — and to roughly <strong>130 individually named laytoncity.org addresses</strong> on top of that. When I later pleaded this case in federal court I named the recipients as <strong>John Does 1 through 139</strong>, and I want to be careful here about who those people are: they are the people the email was <em>sent to</em>. They are not participants in anything. Most of them almost certainly opened it, read one line about a new guy in town, and forgot it existed. I have never suggested otherwise and I am not suggesting it now.</p>
<p>Richins's email says I <em>"moved from Oxford, Mississippi, to Layton City"</em> and that <em>"Oxford PD has reported Reardon as a persistent issue."</em> It then makes two factual statements about my record.</p>
<p>The first: that <em>"in 2017, Reardon was arrested for stalking the Mayor in Lafayette County."</em></p>
<p>That is false. It is not a shading or a compression. The 2017 aggravated stalking charge — the one this entire book opens with, the one that produced the twelve days, the bond, the covenant not to sue — involved an alleged private individual. It did not involve a mayor. It has never involved a mayor. Chapters 1 through 4 are the documented account of what that charge actually was, and no version of it contains a mayor.</p>
<p>The second: that in 2022 I <em>"was arrested and charged with aggravated stalking when he violated the restraining order by walking into the City Hall with a video camera."</em> That one is closer to the shape of what happened, and Chapters 16 through 19 give it properly.</p>
<p>So: one substantially accurate statement and one flatly false one, sent to a hundred and thirty-nine people in the city I had lived in for four days, ninety-seven minutes after a police captain eighteen hundred miles away decided to write about me.</p>
<p>And now the part of Richins's email that a dishonest book would leave out. In the same message, he tells his department that when Layton officers handled the Zions Bank encounter, they <em>"responded and handled the situation professionally"</em> and that <em>"Reardon was even appreciative of their professionalism and gave our Officers a 'Pass'."</em></p>
<p>That is a materially fairer email than the one I described in my complaint. When I drafted that complaint I characterized the forward as straightforwardly hostile, and reading it again, it isn't. He passed along bad information — including one specific falsehood — but he also went out of his way to tell a hundred and thirty-nine colleagues that I had treated their officers decently. I do not get to quote the first half and bury the second. That is precisely the thing I have spent this entire book accusing the State of Mississippi of doing to me.</p>
<h3>What I can prove, and what I only believe</h3>
<p>Here is the line, and I am going to hold it the way I have demanded the State hold it about me.</p>
<p><strong>What is documented:</strong> that Sessums sent that email, that it contained my undisclosed Layton address on February 5, that he attributed it to "our research," and that Richins forwarded it to roughly a hundred and thirty-nine city addresses ninety-seven minutes later. Both emails are verbatim exhibits. Nobody disputes their existence.</p>
<p><strong>What I swore:</strong> that no lawful public-records search could have produced that address in four days, because it did not exist in any searchable record. I swore that under penalty of perjury, and I stand on it. It is still, formally, an inference about someone else's conduct — a very strong one, in my view — and not a proven fact.</p>
<p><strong>What I believe and cannot show:</strong> I have said publicly, and I still think, that the FBI is where the address came from. My reasoning is that Sessums identifies himself, in his own signature block, as a <strong>graduate of the FBI National Academy</strong>, and that struck me as the connection.</p>
<p>I have to be honest about how thin that is, and it costs me nothing to be, because the four-day window is strong enough on its own. The FBI National Academy is a professional development program at Quantico for state and local police commanders — a roughly ten-week course that thousands of American law enforcement leaders have completed. It is a credential and a network. <strong>It is not employment with the FBI and it does not come with access to federal databases.</strong> Sessums having attended it does not establish that anybody at the FBI gave him anything. I believed it then and some part of me believes it now, and I am telling you plainly that I have no evidence for it whatsoever. It is a hunch about a mechanism. The thing I actually have is a timeline, and the timeline is the case.</p>
<p>Four days. At night. Not memorized.</p>
<h3>The records fight, and the man I was wrong about</h3>
<p>On <strong>February 12, 2025</strong>, I went to Layton City Hall as Don Matthews to get the body-camera footage and reports from the Zions Bank stop. That whole visit is recorded — City Hall, then the police department, then back to City Hall, then a phone call, then a sit-down with the city prosecutor. I have the transcripts.</p>
<p>The city prosecutor is <strong>Mark Arrington</strong>, and I named him as a defendant, and the recordings of him do not support the way I characterized him in my complaint.</p>
<p>On that tape, Arrington is measured and substantive from beginning to end. He walks me through Layton's fee schedule — ten dollars a report, thirty dollars a CD. He explains their redaction practice for minors' information. He gives me an actual reasoned explanation for why the city asks for identification on records requests, and when I push back on it with a Fourth Amendment argument and a press-credential argument, he engages with the argument rather than dismissing me. We do not resolve it. He does not stonewall me either.</p>
<p>My complaint later described this relationship in considerably more adversarial terms than the recording supports. I am correcting that here rather than letting the pleading stand as the account.</p>
<h3>February 21: the call, and the voicemail I left</h3>
<p>On <strong>February 21, 2025</strong>, I called Arrington to press him on one question: how did you figure out who I was?</p>
<p>His answer, in his own words on the recording: <em>"I told you I was Don... I saw the video, it's like an hour and 12 minutes, you're walking around downtown, you got an AR-15, you got your flag... So then I typed in Oxford, Mississippi, Matthew Reardon."</em></p>
<p>In other words, he watched my own video, in which I had supplied the Mississippi connection myself, and then ran a search. Not a database. Not a records system. <strong>YouTube.</strong> That is his unsworn account and nothing independently verifies it, but it is coherent, it is checkable against the video, and it does not require anybody to have done anything improper.</p>
<p>Then he stepped away from the phone and did not come back, and I left him a voicemail. Here is what I said on it:</p>
<p>&gt; <em>"Glad to see you're going to waste the city's fucking resources to run illegal searches on somebody completely full of shit... your qualified immunity will not survive this."</em></p>
<p>That is me. That is verbatim. Nobody made me say it and I am not going to launder it out of my own book.</p>
<p>I was wrong about the searches — by his account, which I have no basis to reject, there were no illegal searches, there was a YouTube video I had published myself. And I was talking to the one municipal official in this entire chapter who had actually sat down with me for an hour and explained his reasoning. I do not think a man in my position, four days into a new city and freshly doxxed to a hundred and thirty-nine people, is required to be gracious. But the record should show which of us was the hostile party on that call, and it was me.</p>
<p>(A small oddity worth flagging so nobody thinks it's a typo later: his own voicemail greeting says <em>"You've reached Mark <strong>Harrington</strong>, Layton City Prosecutor."</em> Every document in the case says <strong>Arrington</strong>. I have never resolved it and I am not going to guess.)</p>
<h3>March 5: the mayor</h3>
<p>On <strong>March 5, 2025</strong>, <strong>Mayor Joy Petro</strong> of Layton called me back.</p>
<p>I want this on the record clearly, because there is a version of this chapter where every official is a villain and that version would be a lie: <strong>Joy Petro did her job.</strong> She took my complaint about the inconsistent identification requirement seriously, she agreed it was a legitimate concern, and she told me she had raised it with the city manager to get the policy fixed. She had also gone and asked Arrington directly how he identified me.</p>
<p>She explained something about Layton's structure that I did not know and that limited what she could do: Layton operates under a <strong>"weak mayor"</strong> form of government. The mayor cannot hire, fire, or discipline city staff. That authority belongs to the city manager. So when I asked her to investigate a city employee, she was telling me the truth when she said she had no power to.</p>
<p>There is one genuine discrepancy in her call and I am not going to smooth it over. Reporting back on what Arrington had told her, she said: <em>"he did investigate and he says that... he did what was on time. He did not go in and use any of that crap... he got on Facebook, I guess, and looked that way."</em></p>
<p><strong>Facebook.</strong> Two weeks earlier, Arrington had told me on a recorded line that it was a YouTube video and a search engine.</p>
<p>I do not know what to make of that and I am not going to pretend I do. It may be nothing — a mayor loosely paraphrasing a conversation, "I guess" doing real work in that sentence. It is hearsay of Arrington filtered through Petro, and neither account is sworn. But they are two different answers to the only question I was asking, and both of them came from the same man's mouth by way of two different routes. I noticed it then. I am noting it now. That is as far as the record takes me.</p>
<h3>March 27: Oxford</h3>
<p>On <strong>March 27, 2025</strong>, I called <strong>Chief Jeff McCutchen</strong> of the Oxford Police Department — Sessums's boss — and recorded it.</p>
<p>I laid out the timeline for him: the move-in date, the four days, the address in an email over his captain's signature. What I have alleged, in a signed federal pleading, is that McCutchen <strong>did not deny it, did not offer any explanation for how the address could have been obtained, and refused to open an internal investigation.</strong></p>
<p>That allegation is the entire factual basis for the count I brought against the City of Oxford itself — the theory that a department which is told its captain did something like this, and declines to look, has made a choice. It is also, I have to say plainly, <strong>my characterization of a call whose recording is not in this archive.</strong> McCutchen's actual words are not available for you to check against mine. Chapter 12 credits him for things he got right in an earlier part of this story, and that stands too.</p>
<h3>March 31: two things happen</h3>
<p>On <strong>March 31, 2025</strong>, I filed a federal civil rights lawsuit in the United States District Court for the District of Utah: <strong><em>Reardon v. City of Layton, Utah, et al.</strong></em>, No. <strong>1:25-cv-00041</strong>.</p>
<p>Ten counts — First, Fourth, and Fourteenth Amendment claims under § 1983, civil conspiracy under §§ 1983 and 1985, defamation, invasion of privacy, intentional infliction of emotional distress, municipal liability, and GRAMA violations. Nine named defendants plus the Does: the <strong>City of Layton</strong> and <strong>Layton Police Department</strong>; the <strong>City of Oxford, Mississippi</strong> and <strong>Oxford Police Department</strong>; <strong>Captain Hildon Sessums</strong>; <strong>Chief Jeff McCutchen</strong>; <strong>Lieutenant Riley Richins</strong>; <strong>Mark Arrington</strong>; and <strong>John Does 1–139</strong>. Pro se. Jury demanded.</p>
<p>The same day, I drove to the FBI's Salt Lake City Field Office with an affidavit about Sessums in my hand, intending to hand-deliver it.</p>
<p>By my sworn account: the agents would not accept the affidavit and would not discuss it. They demanded identification for a background check as a precondition to talking to me. I refused, on Fourth Amendment grounds. Two agents then ordered me out of the visitor parking lot under threat of arrest for trespassing — describing it as FBI-owned private property — and one of them walked around my car recording my license plate.</p>
<p>That is a sworn declaration and it is <strong>entirely uncorroborated</strong>. There is no body camera, no witness, no FBI-side account anywhere in this archive. It is my word about what happened in a parking lot.</p>
<p>The pattern I saw in it was the one from October 28, 2022 in Oxford, Mississippi — walking into an FBI office to report police misconduct and walking back out having accomplished nothing, except that on that occasion the visit itself was later used as the basis for taking a year of my life. Chapters 20 through 22 are that story. I filed both incidents with the DOJ Office of Inspector General, the Utah one as an amendment on April 10, 2025.</p>
<h3>The stay</h3>
<p>Also on March 31 — the day I filed — <strong>Magistrate Judge Jared C. Bennett</strong> entered an order.</p>
<p>It temporarily granted my application to proceed <em>in forma pauperis</em>, ordered the complaint screened under 28 U.S.C. § 1915(e)(2), <strong>tolled the time to serve the complaint "until further order of the court,"</strong> and barred me from filing anything further while screening was pending.</p>
<p>I need to explain what that means, because it is the whole ending of this chapter and it is not intuitive.</p>
<p>When you are poor and you sue pro se, the court reviews your complaint before anyone has to respond to it, to weed out cases that are frivolous on their face. That is the screening. While screening is pending, service is tolled — meaning the defendants are not served, do not know they have been sued in any official sense, and have no obligation to do anything. Nothing happens until the judge finishes screening.</p>
<p>So the case sat.</p>
<p>On <strong>April 9</strong> I filed a Motion to Lift Stay Due to Continuing Harm, with a sworn declaration attached. On <strong>April 15</strong> I filed an Emergency Renewed Motion to Lift Stay. <strong>Neither motion drew any substantive response of any kind.</strong> No ruling on the IFP application. No ruling on either motion. No screening order. The docket simply did not move.</p>
<p>On <strong>April 23</strong> I moved to rescind my consent to magistrate jurisdiction and to recuse Judge Bennett under 28 U.S.C. § 455, arguing that a month of total silence on two emergency motions created an appearance of bias. That same day the clerk issued a Notice of Non-Consent, and the case was randomly reassigned to <strong>District Judge David Barlow</strong> — the case number changing from 1:25-cv-00041-JCB to 1:25-cv-00041-DBB.</p>
<p>I would like to tell you that I won that motion. <strong>I did not.</strong> Withdrawing consent to a magistrate triggers automatic reassignment to a district judge under the local rules. It happens mechanically, by operation of the rule, the same day, without anyone evaluating anything. <strong>No judge ever ruled on whether Bennett was biased.</strong> The reassignment was not a finding. It was a clerk following a procedure.</p>
<h3>April 25: I dismissed my own case</h3>
<p>On <strong>April 25, 2025</strong>, I filed a document titled <em>"Plaintiff's Notice of Voluntary Dismissal Without Prejudice and Constitutional Objection to Prolonged Judicial Indifference."</em></p>
<p>Rule 41(a)(1)(A)(i) lets a plaintiff walk away from his own case, once, without needing anyone's permission — but only <em>before</em> the other side answers. I qualified for it. I qualified for it for the reason stated in paragraph 6 of my own notice, and that paragraph is the truest thing in the filing:</p>
<p>&gt; <em>"No Defendant has filed an answer or responsive pleading because no Defendant was ever served — solely due to this Court and the assigned Judge's failure to authorize service after staying the case for screening."</em></p>
<p>Twenty-five days from filing to dismissal. In that time the court never lifted the stay, never screened the complaint, never ruled on my poverty application, and never ruled on either emergency motion. <strong>Not one of the nine defendants was ever served.</strong> Not one of them ever answered. Not one of the allegations in this chapter — not the four-day window, not the false stalking claim, not the refusal to investigate — was ever tested by any court, any discovery process, or any adversarial proceeding of any kind.</p>
<p>I reserved the right to refile in any court of competent jurisdiction, to amend and add parties, and to pursue judicial misconduct complaints under 28 U.S.C. § 351.</p>
<p>And I put a footnote at the end making an argument I still think is right: that withholding service authorization in <em>in forma pauperis</em> civil rights cases functions as a procedural bottleneck that effectively denies access to the courts, and that it falls hardest on exactly the people the statute was written to let in — indigent plaintiffs without lawyers. A screening process designed to protect defendants from frivolous suits, run slowly enough, becomes indistinguishable from a decision on the merits that nobody has to write down or defend.</p>
<p>The signature block on that filing is undated. I noticed that only later. I do not know whether it means anything.</p>
<h3>What this chapter is, and is not</h3>
<p>Sixteen months have passed. <strong>I never refiled it.</strong></p>
<p>Not because I decided the case was weak. I still think the four-day window is the strongest single factual thing in this entire book — a cleaner, harder, more checkable fact than almost anything in the Mississippi chapters, precisely because it does not depend on anyone believing me about anything. It depends on a lease date and an email timestamp.</p>
<p>I never refiled it because my hands were already more than full. By the summer of 2025 I was in Lafayette, Louisiana, and the next chapters are what happened there, and there has not been a month since when I had the room to carry a second federal case eighteen hundred miles away by myself. I still believe I have time. That is my own assessment of my own case, and whether it is right is a question for a lawyer and not for this book.</p>
<p>So here is what you should take out of this chapter, stated as plainly as I know how.</p>
<p>Two emails exist. Their contents are not in dispute, because they are reproduced verbatim as exhibits in a federal court file. A Mississippi police captain had my undisclosed Utah address four days after I moved into it and told a Utah police department he got it "from our research." A Utah lieutenant forwarded that to a hundred and thirty-nine city addresses within two hours, including a statement about my 2017 arrest that is simply not true. Those things happened.</p>
<p>Everything else in this chapter — how the address was obtained, what the FBI did or didn't do, what Chief McCutchen said on a call I recorded and cannot show you, whether any of it amounted to a conspiracy against my civil rights — is <strong>my allegation, never tested, never answered, never adjudicated, and abandoned by me before anyone had to respond to it.</strong></p>
<p>The city prosecutor I sued was, on the tapes, more reasonable than my complaint said he was. The mayor I complained to took the complaint seriously and fixed what she had the power to fix. The lieutenant who forwarded the email also told his colleagues I had treated their officers well. The patrol officers who answered the Zions Bank call did nothing wrong at all.</p>
<p>And I was the one cursing into a voicemail.</p>
<p>I moved to Utah to find out whether it was possible to be somewhere that Oxford, Mississippi could not reach.</p>
<p>It took four days to get the answer.</p></section><section class="chapter"><p class="cnum">Chapter 28</p><h1>The Bolo: Two Months Before</h1><p>On June 23, 2025, at approximately 4:00 PM, I was recording inside the lobby of the John M. Shaw United States Courthouse in Lafayette, Louisiana. The heavy glass entrance doors of the Lafayette courthouse open into a high-ceilinged, sterile lobby where tiled floors amplify every footstep and court security officers in dark uniforms stand behind magnetometer screening checkpoints, watching every visitor with practiced suspicion. On that humid summer afternoon, I stepped inside carrying my recording equipment, my intention clear: to document the public space of a federal building. Within minutes of raising my camera, court personnel and security officers converged on me in the lobby. I was asked to leave and refused. I stood my ground in the public lobby, asserting my constitutional right to film in a government facility accessible to the public. I was not arrested. Instead, the building management and security administration made a bizarre, unprecedented tactical decision: the building closed early that day — at 4:48 PM — specifically, per the court record, to force me out without an arrest.</p>
<p>That detail matters more than it might first appear. A federal courthouse closing nearly an hour ahead of its normal schedule, locking its public entrances and flushing court staff, attorneys, and visitors out onto the sidewalk forty-eight minutes early rather than having its own security simply remove or arrest a non-compliant visitor on the spot, is not the behavior of officials who believed they had a clean, immediate basis to act. As I stood watching staff lock the doors behind me, the absurdity of the moment was striking. It reads far more like officials who wanted me gone but were not yet prepared, on June 23, 2025, to make an arrest they were confident would hold up under legal scrutiny in a federal courtroom.</p>
<p>What happened next removes any doubt about how seriously federal law enforcement was tracking me by this point, more than two months before the arrest that opens the federal case detailed in the next chapter. The following day, June 24, 2025, the Supervisory Deputy U.S. Marshal for the Western District of Louisiana circulated an internal report titled "1st Amendment Auditor Matthew Reardon" to court staff at lawd.uscourts.gov, to U.S. Attorney's office personnel, to Constellis — the private court security contractor that staffs the building's screening stations — and to General Services Administration staff.</p>
<p>Two days after that, on June 26, a second incident occurred, this one involving an unnamed companion of mine. We returned to the same Lafayette lobby, cameras ready. During this encounter, a Supervisory Deputy U.S. Marshal stepped into my personal space and touched my back to redirect me toward a posted sign, prompting my own recorded response: "Don't put your hands on me, motherfucker, that's assault." The recording continues with the marshal asking me, apparently apropos of nothing connected to any actual courthouse security concern, whether I had been drinking — to which I replied, "I haven't had a drink in 5 years motherfucker," adding that I had "been with [redacted] all day." That exchange is worth flagging on its own: a federal officer's unprompted question about alcohol consumption, directed at a man engaged in nothing more than recording in a courthouse lobby, previews almost exactly the same alcohol-related credibility dynamic detailed two years earlier in Chapter 24 regarding Officer Osteen's Galveston affidavit — a recurring pattern in which officials across multiple jurisdictions appear to reach for alcohol-related suspicion as a way of framing my conduct, independent of whether any actual evidence supports it.</p>
<p>The same recording captures my companion challenging two DEA agents — present that day on unrelated official business, and mistakenly drawn into the encounter simply by being nearby — for their badge numbers, and a marshal referencing me "stalking a public official in Oxford, MS," to which I replied, "it's my ass." That phrase, whatever one makes of its crudeness, captures something true about how I experienced the incident in the moment: a federal officer, engaged in what was ostensibly a First Amendment auditing encounter about courthouse access in southern Louisiana, was independently aware of and referencing an entirely separate Mississippi state matter, suggesting information about me had already been shared across the specific agencies I am documenting here. Both incidents were consolidated into a single Field Operational Report, USM Form 210, dated July 16, 2025 — nearly three weeks after the second incident occurred, an unusually long gap for what the report itself treated as significant enough to warrant formal consolidation and onward circulation. In federal law enforcement practice, a Form 210 is an official intelligence tool used by the U.S. Marshals Service to document threat assessments, operational encounters, and subject profiles; holding and consolidating these entries weeks after the fact demonstrates how administrative documentation was being methodically constructed into a multi-jurisdictional intelligence file.</p>
<p>To understand the full mechanism of what was taking shape behind the scenes, one must understand what a BOLO or District Alert Notice actually represents in federal law enforcement procedure. In standard police terminology, a BOLO — "Be On the LookOut" — is an operational alert designed to disseminate descriptive data, photographs, and tactical instructions across law enforcement channels regarding individuals of interest. When issued within the federal judiciary security structure, a BOLO or District Alert Notice instructs court security officers, federal marshals, and building managers to heighten surveillance, alter screening posture, and immediately report sightings of the designated subject to district command.</p>
<p>On June 27, 2025, a "District Alert Notice" went out from the U.S. Marshals Service's Northern District of Mississippi office to district court security officers and staff.</p>
<p>I have never obtained a signed name on that June 27 notice or the emails preceding it — the FOIA production that surfaced them redacted the sender line. In October 2025, working the other side of the story for the video reporting that became Chapter 31's protective-order material, I called the U.S. Marshals Service office in Oxford directly and asked to speak to the supervisory deputy marshal there. The person answering the phone gave me a name: William Donald. I want to be precise about what that is and is not. Nobody on that call confirmed Donald personally drafted or sent the June 2025 alert notices, and I am not asserting he did. What I have is a title — supervisory deputy U.S. Marshal, Northern District of Mississippi, Oxford office — and a name attached to that title four months later. It belongs in this book as a lead for anyone with subpoena power that I do not have, not as an identified author of the documents above. It described me as banished from Oxford, Mississippi until September 30, 2027 — a reference to the five-year banishment order detailed in Chapter 20, still in force at the time — labeled me a "1st Amendment auditor," instructed recipients to monitor and notify on my movements, and included a physical description alongside three photographs: one showing me in a tactical vest with a rifle, one a selfie, and one a booking mugshot. The notice was marked Law Enforcement Sensitive.</p>
<p>Subsequent documentary disclosure through USMS FOIA PA-000412 confirmed that these lookout alerts and BOLO notifications were actively distributed to Mississippi and Louisiana authorities as early as June 2025 — two full months before my eventual August 25 arrest. FOIA PA-000412 provided concrete proof that federal authorities were not merely reacting to local events as they occurred, but were actively transmitting law enforcement intelligence files, tactical photos, and tracking directives across state lines between the Northern District of Mississippi and the Western District of Louisiana. A same-day email from June 27 specified that BOLO activity connected to me was, at that point, confirmed only across Mississippi and Louisiana — not Texas, not Utah, despite my own later suspicion that the pattern extended further. A June 30, 2025 follow-up communication predicted, with some specificity, that I would "show in Greenville or Aberdeen sooner than later" — a prediction that would not be borne out for nearly a year, until the June 4, 2026 Aberdeen federal courthouse arrest detailed in Chapter 34, but a prediction nonetheless, made almost exactly a year in advance, by federal officials who had clearly built a working profile of my habits and likely destinations.</p>
<p>When a law enforcement agency distributes a BOLO featuring photographs of a subject in a tactical vest armed with a rifle alongside mugshots, and attaches the label "1st Amendment auditor," it fundamentally alters the psychological and operational posture of every officer who encounters that subject. Front-line security personnel, including private Constellis guards and U.S. Marshals, are no longer observing an ordinary citizen exercising constitutional rights in a public lobby; they are pre-conditioned by official directives to perceive every gesture, every camera angle, and every verbal challenge through the lens of a pre-identified security threat. The BOLO creates an operational atmosphere primed for confrontation long before any camera starts rolling.</p>
<p>The core fact here bears restating plainly, because it is the single most important piece of context for understanding everything that follows in Part V: by the time I was arrested at the same Lafayette courthouse on August 25, 2025 — the event detailed in the next chapter — federal law enforcement across at least two states had been actively tracking, discussing, and predicting my movements for a full two months. Whatever happened on August 25, 2025 did not happen in a vacuum, and it did not happen because federal officials were reacting, in the moment, to an isolated incident from a stranger. It happened after a sustained, multi-agency, multi-state surveillance and information-sharing effort specifically targeting a man these same documents repeatedly labeled, not as a security threat in the conventional sense, but as a "1st Amendment auditor" — a description of an activity that is, whatever one thinks of its wisdom as a practice, protected expression under the same Constitution these federal officials had sworn to uphold.</p>
<p>This is the documentary foundation of the selective-enforcement and entrapment argument that runs through the entirety of Part V, and it is worth stating plainly what it does and does not prove. It does not prove that my August 25 conduct, detailed next, was lawful — that is a separate legal question taken up honestly in the following chapters, including the parts of my own conduct that day worth reporting plainly rather than omitting. What the BOLO evidence does prove is that whatever happened on August 25, 2025 happened to a man federal law enforcement had already spent two months watching, discussing, and predicting — a fact any fair assessment of proportionality, selective enforcement, and entrapment in the events that follow has to reckon with directly.</p></section><section class="chapter"><p class="cnum">Chapter 29</p><h1>The Governor'S Mansion</h1><p>Six weeks after the BOLO, and seven weeks before Lafayette, I stood on a public sidewalk in Jackson, Mississippi, outside the Governor's Mansion, holding a sign.</p>
<p>It was <strong>July 3, 2025</strong> — the day before Independence Day, which I would like to tell you was deliberate and which I am fairly sure was. I was livestreaming. And I should say what I was actually there about, because "protesting" is a word that lets a reader skip past the substance.</p>
<p><strong>Two days earlier, on July 1, a batch of new Mississippi laws had taken effect.</strong> One of them required a person to pay <strong>twenty-five dollars a day for a permit</strong> — to panhandle. I had spent that morning talking about it with <strong>Jeff Gray</strong>, another auditor who works this same ground.</p>
<p>Think about what that statute is. The Supreme Court has held that <strong>panhandling is protected First Amendment activity</strong> — asking a stranger for help is speech. Mississippi's answer was not to ban it outright, because it cannot. Mississippi's answer was to put a <strong>twenty-five-dollar-a-day price tag on it</strong>, and charge that price to the one category of person in the state guaranteed not to have twenty-five dollars. A right you have to rent by the day, at a rate calibrated to the people least able to pay it, is not a right. It is a permission slip with a fee schedule.</p>
<p>Tate Reeves signed it.</p>
<p>So that is the first reason I was on that sidewalk. There is a second one, and it is personal, and I will come to it — but I want the record to show that I did not drive to Jackson because of my own case. I drove there because of a law about homeless people.</p>
<p>I called the stream <strong>"National Fuck the Governor Day."</strong> I am putting that in this book in my own words rather than letting someone else put it in theirs. It is exactly the register you think it is, and it tells you something true about how I was operating in the summer of 2025.</p>
<p>I want to be straightforward about the sign, because everything in this chapter turns on it and because being cute about it would be dishonest.</p>
<p>The sign said <strong>FUCK THE GOVERNOR.</strong></p>
<p>Three words. No qualifier, no argument, no policy citation — just the plainest available statement that a citizen holds a public official in contempt. I am not going to dress that up as something more dignified than it was, and I am not going to apologize for it either, because the entire point of the First Amendment is that it does not exist to protect the signs everybody likes. A sign that everyone agrees with is not a test of anything.</p>
<p>There is a line here, and it is not a subtle one. <em>Kill the governor</em> is a threat and a crime and would have gotten me arrested by lunchtime in any state in the union. <em>Fuck the governor</em> is an opinion. In 1971 the Supreme Court decided <em>Cohen v. California</em> over a jacket that said <strong>Fuck the Draft</strong>, worn into a Los Angeles courthouse, and Justice Harlan wrote the sentence that has been doing the work in cases like mine for fifty-five years: <em>one man's vulgarity is another's lyric.</em> The state does not get to pick the register in which you are permitted to object to it.</p>
<p>That is what I was holding. That is all I was holding.</p>
<h3>The second reason</h3>
<p>Here is the personal part, and it is the reason I picked <em>that</em> sidewalk and not some other one.</p>
<p><strong>Tate Reeves signed the governor's warrant that took me out of Texas.</strong></p>
<p>In 2023, sitting in the Galveston County Jail on the felony DWI charge that Chapters 22 and 23 take apart, I was extradited to Mississippi on a probation-revocation hold — <strong>about two weeks before I was due to go to trial in Galveston.</strong> The instrument that moved me was a governor's warrant, bearing the <strong>seal of the State of Mississippi</strong>, signed by the governor and countersigned by the Secretary of State, whose whole legal function is to certify that the supporting papers from the demanding state are <strong>authentic</strong>.</p>
<p>I have the document. It is one page, signed at the Capitol in Jackson on <strong>November 9, 2023</strong>, addressed to Governor Greg Abbott of Texas, with the <strong>Great Seal of the State of Mississippi</strong> on it. And I am going to do something here that I would like the State of Mississippi to try once, which is to read a document out loud and then correct my own account of it where the two do not match.</p>
<p>Here is the operative sentence:</p>
<p>&gt; <em>"I, Tate Reeves, Governor of the State of Mississippi, do hereby certify that <strong>the annexed papers are duly authenticated under Mississippi law</strong> and present that MATTHEW OLIVER REARDON... stands charged in CITY OF OXFORD, COUNTY OF LAFAYETTE, MISSISSIPPI, with the crime of VIOLATION OF THE TERMS OF HIS PROBATION IN CONNECTION WITH A CONVICTION in Cause No: LK22-358..."</em></p>
<p>And here is the one I have spent two years describing:</p>
<p>&gt; <em>"It has been represented to me that the fugitive <strong>was in Mississippi at the time of the alleged offense(s), and thereafter fled from Mississippi and has taken refuge in your State</strong> and is presently in the custody of the GALVESTON COUNTY JAIL, 5700 AVENUE, GALVESTON, TEXAS 77551."</em></p>
<p>I have said on camera, more than once, that this warrant carried a fictitious cause number, a fictitious charge, and a recital that I was on probation for possession of a controlled substance.</p>
<p><strong>Two of those three are wrong, and I am leaving the correction in the text.</strong> The cause number on it is LK22-358, and that is the real number — it is the same one on the State's own motion to revoke. The charge on it is violation of probation, which is what I was actually taken back for. A book that demands the state show its work does not get to hide its own, so there it is: I overstated it.</p>
<p><strong>The third one is not wrong. It is worse than I said.</strong></p>
<p>The governor's warrant is a cover sheet. Its entire legal function is to certify <strong>the annexed papers</strong> — the packet from Mississippi that Texas is being asked to rely on. So I went and got one of the annexed papers.</p>
<p>Here is the <strong>bench warrant</strong>, Cause No. LK22-358, signed by a Lafayette County Circuit Court judge on <strong>August 17, 2023</strong>, commanding the Sheriff to bring me in:</p>
<p>&gt; <em>"...to answer the charge of <strong>Violation of Probation on the original charge of Possession of a controlled substance</strong> filed by the District Attorney..."</em></p>
<p><strong>I have never been charged with possession of a controlled substance in my life.</strong> My original charge — the one everybody in this story knows, the one the State's own motion to revoke recites in its first paragraph — was <strong>aggravated stalking</strong>. There is no version of my record in which those two things are confusable.</p>
<p>So the sequence is this. A judge signed a bench warrant naming a crime I was never charged with. That warrant went into a packet. <strong>Tate Reeves certified the packet as "duly authenticated under Mississippi law." Michael Watson, the Secretary of State, countersigned it. The Great Seal went on it.</strong> And a Texas jail handed me over on the strength of it.</p>
<p>Not one of them read the paper underneath the seal. That is the finding, and it is narrower and more specific than "they forged a document" — which is exactly why it is harder to argue with.</p>
<p>And there is a second thing wrong with that page, independent of anything underneath it.</p>
<p>Read the fugitive recital against what actually happened. I did not flee anywhere. I walked out of Mississippi custody on August 1, 2023, drove to Texas in the open with a camera running, and was arrested there ten days later. By the time this warrant was signed I had been sitting in the Galveston County Jail — <strong>at the address printed on the warrant itself</strong> — for three months. There is no flight in this story. There is no refuge. Somebody filled in the blanks on a form built for a man who runs, and two officials put a seal on it without anyone noticing that the form does not describe the person it names.</p>
<p>That is the finding, and it is smaller than the one I have been making and harder to wave off. Not <em>the state forged a document</em>. <strong>The state used a template, nobody read it, and the Great Seal of Mississippi went on a sentence that isn't true about me.</strong></p>
<p>One more line worth sitting with. The warrant directs that I be delivered to a specific person, by name: <strong>Sheriff Joey East, Lafayette County Sheriff's Department.</strong> After everything in the preceding twenty-seven chapters, the instrument that took me out of Texas ends by handing me back to him personally.</p>
<p><strong>What I still need, and do not have:</strong> the rest of the annexed packet, and the September 30, 2022 Judgment itself. I have the bench warrant. I do not have everything that travelled with it.</p>
<p>Both of those things — a fee on the speech of the homeless, and a seal on a warrant nobody read — are the same act performed at different altitudes. Paperwork used as a weapon, by people who never expected anyone to actually read the paperwork.</p>
<h3>What happened</h3>
<p>A Mississippi Highway Patrol trooper came at me.</p>
<p>Here is what he said, from my own live audio: <strong>"Go the fuck across the street. You understand me?"</strong></p>
<p>I asked whether that was under threat of arrest.</p>
<p><strong>"Yeah, you're under threat of arrest."</strong></p>
<p>I asked him if he knew what the First Amendment was.</p>
<p><strong>"I don't give a fuck what the first—"</strong></p>
<p>He did not finish the sentence. He did not need to.</p>
<p>Then he charged me. He knocked my camera phone off my gimbal, and he stepped on it.</p>
<p>I asked for his name and badge number. He refused. I asked again. He refused again. I asked for a supervisor, and a supervisor came, and the supervisor did not take my name, did not take my complaint, and did not make him identify himself.</p>
<p>I am not going to pretend I was gracious about it, because the recording exists and anyone can hear me. Here is what I sound like on that tape: <strong>"What's your name and badge number? Tyrant."</strong> And: <strong>"I have a First Amendment right to be on the sidewalk. I'm on the fucking sidewalk. Do something about it."</strong> And after he put his hands on me: <strong>"Get the fuck off—"</strong></p>
<p>Then, over and over, six times: <strong>"I want charges placed on him. I want charges on him. I want charges on him now."</strong></p>
<p>I stand by the demand and I am not especially proud of the delivery. Both of those things are in the recording and both of them belong in this book. A reader who hears me swearing at a state trooper for the first time in the government's brief, rather than here, has every reason to discount everything else I've told them.</p>
<h3>The part that matters</h3>
<p>The confrontation is not the story. The story is what happened next.</p>
<p>Two more troopers and the supervisor got hold of him. They had him — physically restrained, by his own colleagues, in front of a camera.</p>
<p><strong>And he tried to break loose and come at me again.</strong></p>
<p>That is the sentence I want left standing. Not the profanity, not the sign, not who said what first. A sworn Mississippi Highway Patrol trooper, being held back by three other officers of his own agency, on video, in front of the Governor's Mansion, <strong>fought them to get to a man with a camera.</strong> It looked, and I have described it exactly this way ever since, like a football player coming through the line.</p>
<p>Whatever you think of my sign — and you are entitled to think it was crude, because it was — that is not a proportionate response to it. That is not any kind of response to it. That is a man who lost control of himself in public while wearing a badge, and whose own colleagues could see it clearly enough to grab him.</p>
<h3>What I asked for, and what I got</h3>
<p>I made three demands publicly, and I made them by name.</p>
<p><strong>To Governor Tate Reeves:</strong> issue a statement. Say plainly that violence against peaceful protest is not Mississippi policy. I said then and I say now — <em>silence is complicity, and inaction is permission.</em></p>
<p><strong>To the Mississippi Attorney General:</strong> I submitted a sworn criminal affidavit, under penalty of perjury, for assault and battery by a sworn officer of the state. Acknowledge it, or step aside and appoint a special counsel. As I put it: your job is not to defend the badge, it is to defend the law.</p>
<p><strong>To the United States Department of Justice:</strong> open a pattern-and-practice investigation, under federal law, into the Mississippi Highway Patrol.</p>
<p>Here is what I got.</p>
<p>I called the governor's office. I was told that any questions for the governor's office needed to be put in writing, by email, to their press people. I said what seemed obvious to me — that I am not only a member of the press but the actual victim of the thing I was calling about, and that I would like to speak to a human being. They would not do it. Everything in writing. Nothing live. Nothing that couldn't be routed, reviewed, and drafted by committee before anyone had to say a word out loud.</p>
<p>From the Attorney General's office, nothing. That is not new. I have been to that office, by my own count, more times than I can usefully number over the preceding eight years, and I have never once gotten a substantive response. I have come to believe the reason is structural rather than personal: to act on any of it would require the state to concede it was wrong the first time, and states do not like to do that.</p>
<p>From the Department of Justice, nothing. Not a denial. Not a case number. Not a returned call. I have left voicemails explaining why it mattered. I have never had one returned.</p>
<h3>The day after</h3>
<p>On July 4 I did something that in hindsight I think was the most useful thing I did that week.</p>
<p>I drove to a police department — not the Highway Patrol, a municipal department with no stake in any of this — and I asked them a hypothetical. I deliberately did not tell them the man in the story was a state trooper, or that it had happened outside the Governor's Mansion. I just described it: I'm filming on a public sidewalk, someone comes up, tells me to get off the sidewalk, charges at me, punches me, knocks the camera off my gimbal, steps on the phone. <strong>What crimes is that?</strong></p>
<p>The answer came back without hesitation, and it is worth setting out because it is what the law looks like when nobody knows whose ox is being gored:</p>
<p>Mississippi has no separate battery charge. What it has is <strong>aggravated assault</strong> — a felony, depending on injury — and <strong>simple assault</strong>. On the facts as I described them, absent serious bodily injury, that is <strong>simple assault</strong>. The destruction of the phone is <strong>malicious mischief</strong>, because there was intent to destroy property. And the officer told me, plainly: <em>we would allow you to sign charges for the simple assault as well as sign charges for the malicious mischief.</em> From there it goes to a public-cause hearing in front of a judge; a felony would go to a grand jury.</p>
<p>He also volunteered a charge I hadn't thought to ask about — <strong>simple assault by physical fear</strong>, which covers a person who comes at you with a balled fist and the stated intention of hurting you without necessarily landing the blow.</p>
<p>So: a police department, given the facts and not the names, said there were two chargeable offenses and that they would let a citizen sign the affidavit.</p>
<p>No charges were ever brought against that trooper.</p>
<h3>What this does and does not establish</h3>
<p>I have to hold the line here the same way I have asked the state to hold it about me for eight years.</p>
<p><strong>What is documented:</strong> my own live audio, published by me, of a Mississippi trooper telling me to get off a public sidewalk under threat of arrest, saying he did not care what the First Amendment was, refusing to identify himself, and being physically restrained by three colleagues while trying to get back to me. That footage exists and it has been watched by a great many people — I have used the figure of close to a hundred thousand and I cannot document it precisely, so treat it as my estimate rather than an analytic.</p>
<p><strong>What is not documented, here:</strong> any incident report, any internal affairs file, any disciplinary outcome, and <strong>the trooper's name.</strong> He would not give it, nobody made him, and I have never learned it. I am not going to guess at it in print, and I would ask any reader who thinks they know it not to guess either. A man is entitled to be accused by name or not at all, and I do not have his name.</p>
<p><strong>What no court has ever said:</strong> anything. There was no prosecution, no civil suit filed on this incident, and no finding by anyone. A civil rights attorney I later interviewed read the footage as raising First, Fourth, and Fourteenth Amendment claims and pointed toward the federal side rather than the state, on the practical theory that state courts are, in her words, <em>"a little bit more biased toward their own."</em> That is one lawyer's opinion, offered on a podcast, expressly not as legal advice and expressly from outside Mississippi. It is not a ruling and I am not dressing it up as one.</p>
<p>What I am left with is a video, a sworn affidavit nobody acknowledged, three demands nobody answered, and a police department in another town that looked at the same facts with the names filed off and said <em>yes, that's two crimes, you can sign the charges.</em></p>
<p>Seven weeks later I walked into a federal courthouse in Lafayette, Louisiana, and the next chapter is what happened there.</p></section><section class="chapter"><p class="cnum">Chapter 30</p><h1>Lafayette: August 25</h1><p>On August 25, 2025, I was arrested at the John M. Shaw United States Courthouse in Lafayette, Louisiana — the same building where the two-month surveillance pattern detailed in Chapter 28 had begun. I was charged with violating 41 CFR § 102-74.390(b), a federal regulation governing conduct on General Services Administration property, arrested by Deputy U.S. Marshal Hayden Nugent. It was my fourth documented visit to that courthouse.</p>
<p>To understand the legal basis of the charge, a lay reader needs a clear explanation of what 41 CFR § 102-74.390(b) actually is and how it functions on federal property. Title 41 of the Code of Federal Regulations contains the administrative rules governing public contracts and property management across the federal government. Within Part 102-74, Subpart C outlines the specific rules of conduct enforced across all real property under the authority and custody of the General Services Administration. Section 102-74.390 addresses "Disturbances" on federal property. Subsection (b) prohibits any person from engaging in disorderly conduct, creating loud or unusual noise or nuisances, obstructing the usual use of entrances, foyers, lobbies, corridors, offices, elevators, stairways, or parking lots, or otherwise impeding or disturbing the proper performance of official duties by government employees.</p>
<p>In practice, 41 CFR § 102-74.390(b) is the primary federal misdemeanor tool used by U.S. Marshals and Federal Protective Service officers to enforce order inside federal courthouses and administrative complexes. Carrying criminal penalties of up to thirty days' imprisonment alongside monetary fines, the regulation grants federal law enforcement broad administrative discretion. When encounters with citizens recording in public lobbies escalate, officers frequently invoke subsection (b) as a flexible enforcement tool, converting administrative facility rules into federal misdemeanor charges by citing lobby obstruction, raised voices, or failure to comply with security instructions.</p>
<p>That is the charge. Before I describe how I came to be arrested under it, I have to describe what I was doing and saying that morning, because I broadcast all of it myself, live, and it is the single most damaging body of evidence in this book. If a reader learns it from the government's brief instead of from me, nothing else I say here deserves to be believed.</p>
<p>I did not go to Lafayette that morning to quietly document a federal building. I opened the livestream by telling my audience they were "tuning in live for National Fuck the US Marshals Day." I returned to the phrase again and again through the broadcast. I signed off segments with it: "Happy National Fuck the US Marshals Day." That was my own name for the day — my framing, chosen in advance, announced to an audience, on the morning I was arrested at a federal courthouse.</p>
<p>The register did not improve from there. To a federal officer who told me what I could and could not do, I said: "What gives you the authority to tell me a damn thing? You need to keep on stepping. And I mean it, buddy. I ain't playing your games." I told an officer, repeatedly, "You might want to go 108" — radio code for returning to service. I was ordering a federal officer to leave. I said, of another, "I'm going to make you look like an idiot today."</p>
<p>And I said this, on camera, to a federal officer, hours before I was taken into custody: "You put hands on me, I'm going to defend myself. I'm telling you that right now. All right. You're going to get sprayed down."</p>
<p>I framed it conditionally. I framed it as self-defense — <em>if</em> you put hands on me. That framing is real and I am not going to pretend I said something I did not say. But it needs to be stated plainly for what it also was: a stated threat to deploy chemical force against a federal officer, made on a live broadcast, by a man who was about to be charged with a federal offense inside that officer's building. There is no reading of that sentence that makes it the language of a neutral observer. I said it. It is on my own recording. I published it myself.</p>
<p>That is the man who walked up to the courthouse that day. Now here is what happened when he got there — and the reason I have never been able to let this go.</p>
<p>The doors had been locked to me. I said so out loud as it was happening: "But you locked the doors on me. But y'all lock the doors on me." And then, from the sidewalk, still streaming, I watched a marshal wave me in.</p>
<p>"Y'all want me to come in? Hey, they're trying to wave me in the courthouse. So, he just waved me in. Should I accept the invitation? I think I should accept the invitation."</p>
<p>I accepted it. I walked through doors that had been closed to me, because a federal officer gestured me through them. The greeting inside was not a warning to leave. It was recognition: "Well, look who it is." And then, in terms, what the invitation had been for: "Hey, man. Look, I'm going tell you one time. Can't be in here to report — be arrested."</p>
<p>I walked back out. Seconds later, still on the recording, I named what I thought had just happened: "That's entrapment and violation of my First Amendment rights."</p>
<p>I want to be careful here, because I am not a lawyer and entrapment is a legal term with a specific and demanding meaning that I was not applying with any precision in that moment. I said the word. I am quoting myself saying it. I am not asking the reader to accept it as a legal conclusion, and no court has ever found one.</p>
<p>But strip the label off and look at the sequence. A building whose doors were locked to me. An officer who waved me through them. A greeting that showed I was expected. And an immediate statement that being inside to report meant arrest. Whatever the correct legal name for that is, it is not a citizen wandering unbidden into a federal building and disrupting it.</p>
<p>I was audibly torn about what to do with it, and that is on the recording too — twice: "There's a big part of me that wants to go back in and take the arrest." And later, outside, all but daring them: "I'll take the arrest. I'll take the arrest right here. Yes, sir. Come on with it. Come on with it."</p>
<p>I went back. I carried my recording equipment in and set up a camera on a metal tripod in the lobby, near an entrance doorway and the security passageway leading toward the court screening station. I adjusted the legs to stabilize it and kept the livestream running. Deputy U.S. Marshal Hayden Nugent approached and told me to move the equipment, questioning my presence and my setup. I did not shift the tripod and I did not de-escalate. I turned to the camera and said the sentence that became the centerpiece of the government's case: "now they just asked for it."</p>
<p>Nugent moved in. He ordered me to turn around, took my arms, and secured handcuffs behind my back. Security personnel confiscated the camera gear and the tripod. Handcuffed in a public lobby in front of onlookers, I felt the steel close on my wrists — a sharp physical punctuation mark at the end of two months of surveillance I had not been able to see. I was walked past the metal detectors, through the security doors, and into the U.S. Marshals holding facility inside the courthouse.</p>
<p>This chapter demands the same discipline as every other episode in this book where institutional overreach and my own escalating conduct sit side by side, and it demands more of it here than anywhere else, because this is the arrest I was convicted on. The trial record — covered fully in the next chapter — establishes that what I did that day went well beyond recording in a public lobby. It shows a tripod positioned so that it blocked an emergency exit. It shows crude, confrontational language directed at a federal officer. It shows my own livestream, in my own words, framing the confrontation as something the government "asked for."</p>
<p>And it sits alongside everything I said before I ever walked in: the name I gave the broadcast, the order to a federal officer to go back in service, the promise that he would get sprayed down.</p>
<p>Both things are true at once, and I am not going to let either soften the other for the sake of a cleaner argument. A tripod blocking an emergency exit in a federal courthouse is a legitimate security concern, entirely independent of any question about the government's prior surveillance of me. Crude language directed at a federal officer is not a crime, but it is not admirable either. A stated threat of pepper spray, however conditional, is the kind of thing that makes an officer's caution reasonable rather than sinister. And "now they just asked for it" is not the language of a passive documentarian caught in an overreaching arrest. It is the language of a man who understood in the moment that he was pushing toward a confrontation, and who said so on tape.</p>
<p>What none of that undercuts — what it cannot undercut — is the two-month documentary record set out in Chapter 28. A defendant's poor judgment at the moment of arrest does not retroactively justify, or even address, the question of why federal law enforcement across two states had already spent two months circulating my photograph, labeling me a "1st Amendment auditor," and predicting my movements before this incident existed to be predicted. Those are two separate questions, answered by two separate bodies of evidence, and both deserve an answer instead of one being used to bury the other. My conduct that day was not blameless. The government's response to me was shaped by an apparatus built and aimed at me well before August 25 gave it a specific incident to act on.</p>
<p>There is one more parallel, flagged earlier in Chapter 12: the basic shape of what happened in Lafayette in August 2025 — a federal building, a camera, an escalating confrontation with federal personnel who chose engagement over de-escalation — had already played out once before, at the Oxford U.S. Attorney's Office in July 2021, four years earlier and four hundred miles away, with lower stakes and no arrest. That parallel does not prove a coordinated multi-year campaign against me. It does establish that this pattern of confrontation, traced now across two states and eight years, was new to neither side by 2025.</p>
<p>I was found guilty following a bench trial roughly four months later. The next chapter covers that trial, the verdict, and the spoliation issue that stands as the strongest available ground for appeal.</p></section><section class="chapter"><p class="cnum">Chapter 31</p><h1>Trial And Verdict</h1><p>My bench trial on the August 25, 2025 courthouse charge was held December 15 and 16, 2025, before Judge LeBlanc. The verdict came down January 16, 2026: guilty. On July 16, 2026, a First Amendment motion to dismiss was denied, the court characterizing the courthouse lobby as a "nonpublic forum" — a legal classification that substantially narrows the constitutional protection available to speech and recording activity conducted there, regardless of how that activity might be protected on a public sidewalk or in a traditional public forum.</p>
<p>A bench trial is one in which the judge alone decides both the facts and the law — there is no jury. Defendants are entitled to a jury trial for most federal offenses, but for certain misdemeanors, and in cases where a defendant waives that right, a single judge hears the evidence and renders the verdict directly. There is no available record here establishing why this case proceeded as a bench trial rather than a jury trial, and none is speculated. What matters for a reader trying to understand what happened next is simply that Judge LeBlanc was the sole finder of fact as well as the sole arbiter of law — the same person who ruled on the First Amendment motion also weighed the evidence and reached the guilty verdict.</p>
<p>The "nonpublic forum" classification is a term of art from First Amendment doctrine describing government property that is not, and has never been, opened up for general public expressive activity — a category distinct from a "traditional public forum" like a sidewalk or park, and from a "designated public forum," which is government property the government has deliberately opened to speech. In a nonpublic forum, the government can restrict speech and recording based on reasonable, viewpoint-neutral rules tied to the property's actual function, without facing the strict scrutiny that would apply on a public sidewalk. A federal courthouse lobby can, as a matter of settled First Amendment doctrine, be treated as a nonpublic forum, subject to reasonable, content-neutral restrictions the government would not be permitted to impose on a public street. That doctrine exists for legitimate reasons — courthouses are working government facilities with security concerns a public park does not share — and nothing here disputes that Judge LeBlanc's classification was legally available to him. What follows instead is the strongest available challenge to the verdict, a challenge grounded not in the strength of my First Amendment claim on its own terms, but in a due-process and evidentiary problem that matters regardless of how the forum question is resolved.</p>
<p>Two events in the run-up to trial deserve their own place here, because both bear directly on how seriously the pre-arrest surveillance detailed in Chapter 28 should be taken by anyone evaluating this case. On October 15, 2025, the government filed a protective order motion seeking to restrict communications between U.S. Marshals and court staff regarding me going forward. The framing of that motion matters: it did not deny that such communications had occurred — the BOLO evidence and the June 2025 emails detailed in Chapter 28 make any such denial untenable — it sought only to restrict them prospectively. A motion to restrict future marshal-judge communications about a defendant, filed by the same government that had already generated the surveillance record documented here, reads less like a denial that a problem existed and more like an implicit acknowledgment that the existing pattern of communication needed to stop.</p>
<p>Then, on November 12, 2025, Magistrate Judge Carol B. Whitehurst recused herself from the case, citing an appearance of bias. The available record does not establish the specific factual basis Judge Whitehurst cited for that recusal, and none is speculated here. What can be said is that a sitting federal magistrate judge, presiding over this exact case, concluded independently that the appearance of bias was serious enough to warrant stepping aside — a judicial determination reached entirely independent of anything argued here, and one that sits uncomfortably close in time to the protective-order motion the government itself had just filed a month earlier. Two separate signals, a month apart, both suggesting that whatever had happened between marshals and court staff regarding me was serious enough to require formal institutional correction — arriving well before the bench trial itself, detailed below, had even begun.</p>
<p>The sealed trial record — portions of which can be discussed here, and portions of which remain under a gag order I am complying with through my August 7, 2026 sentencing, per my own explicit decision to challenge that order through a post-sentencing motion to unseal rather than risk contempt by speaking now — establishes that the government admitted it failed to preserve all of the courthouse lobby's surveillance footage from August 25, 2025. The defense's argument, based on the footage that does survive and on testimony given at trial described here only in the terms already made public through the court record, is that the missing footage would have shown federal marshals actively waving me toward the specific door I was later convicted of obstructing — footage that, if it exists in the form the defense contends, would transform the entire character of the encounter from a defendant obstructing a court facility into my being directed toward the exact location that became the basis for my conviction, by the same officials who then arrested me for being there.</p>
<p>This is, in the vocabulary of federal constitutional law, potentially both a Brady violation — the suppression of evidence favorable to a defendant — and a claim under California v. Trombetta and Arizona v. Youngblood, the line of Supreme Court cases governing a defendant's due process rights when the government fails to preserve potentially exculpatory evidence. The appellate strategy I and my advisors have developed treats this spoliation argument as considerably stronger than a pure First Amendment retaliation claim standing alone — not because the First Amendment issues are meritless, but because a structural due-process argument grounded in missing evidence does not require a reviewing court to resolve the harder, more doctrinally contested question of how much First Amendment protection courthouse-lobby recording deserves. It only requires the court to determine whether the government's failure to preserve potentially exculpatory footage, footage the defense contends would show the very obstruction charge being manufactured by the government's own personnel, deprived me of a fair trial.</p>
<p>This chapter closes on the same note struck consistently since Chapter 28: two things are true simultaneously. My own conduct on August 25, 2025 — the tripod, the language, the livestream caption — was not blameless, on any honest accounting. And the trial that convicted me rests on a foundation that cannot be verified as complete, because the government itself has admitted the foundation is missing pieces, pieces the defense contends would have changed the entire narrative of what happened that day. A conviction obtained on an incomplete evidentiary record, against a defendant federal law enforcement had already been tracking for two months before the incident that produced the charge, is not automatically an unjust conviction — but it is not a clean one either, and it is the conviction I will be sentenced on August 7, 2026, the event that closes this Part and my reporting on the federal case.</p>
<p>Before reaching that sentencing, though, the story turns to two other fronts that opened while the federal case was still working its way toward trial: a brutal assault at New Orleans City Hall in November 2025, and a separate, ongoing confrontation with officials in Union County, Mississippi that would not begin until the following spring.</p></section><section class="chapter"><p class="cnum">Chapter 32</p><h1>The New Orleans Assault</h1><p>On November 12, 2025, while the federal courthouse case detailed in the previous two chapters was still pending, I was struck in the head with a metal flashlight by Allied Universal security guard Jerome Ard, at New Orleans City Hall. The blow split my head open. I was transported to Tulane Medical Center. My phone was destroyed in the encounter — a detail worth flagging without editorializing, given how central my own recordings have been to nearly every other chapter of vindication in my experience.</p>
<p>What happened afterward is where this chapter's real weight sits, because it establishes a pattern now visible, in different forms, across multiple states and multiple years: an official account constructed to protect the person who inflicted harm, rather than the person who suffered it. NOPD Officer Junious Grady swore out the affidavit supporting an arrest — not of Ard, the man who struck me with a flashlight hard enough to split my scalp, but of me. That affidavit relied on statements from Ard's own Allied Universal coworkers, identified in the available record as Vidal and Savage — colleagues of the man who inflicted the injury, not independent witnesses. A separate NOPD officer, Victor Paz, badge number 26091, declared in his own report that I was "the aggressor," and his affidavit was countersigned by a supervisor, Alfred Harris, badge ID 16511, whose review consisted of approving the affidavit as submitted rather than independently verifying its account. The warrant against me was signed the same day, at 3:34 PM, by Judge Juana Marine Lombard.</p>
