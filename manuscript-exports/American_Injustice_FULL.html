</div></section><section class="chapter"><h1>A Note From The Author</h1><p>I need to tell you how this book was built before you read a word of it, because the way it was built is the only reason you should believe any of it.</p>
<p>I am Matthew Oliver Reardon. I write under the name Don Matthews. Everything in these pages happened to me, and I am the least reliable narrator available for it — I was angry for most of it, drunk for some of it, and wrong about pieces of it for years. So I did not write this book from memory. I wrote it from paper.</p>
<p>Every factual claim here traces back to a primary source: a court filing, a police report, a transcript, an order, a recording. Where I quote a document, I read the document — not a summary of it, not a machine transcription of it, the actual page. Where the only source for something is me, this book says so in the sentence, not in a footnote you will never turn to. And where I could not find the paper, I say that too. There is an appendix at the back that lists, plainly, the twelve most important documents this book does not have, including a charging affidavit that would settle a central question and a covenant not to sue that may have quietly extinguished half my legal life. An appendix that hides its gaps is worse than no appendix at all.</p>
<p>I want to be direct about the discipline that governs the rest of these pages, because it will occasionally make me look bad and I need you to understand that this is on purpose.</p>
<p>Two things are true in this story at the same time.</p>
<p>The first is that institutions in Mississippi, Texas, Utah and Louisiana did things to me that were unlawful, retaliatory, or both — and I can prove a great deal of it. The second is that I made a considerable amount of it worse. I was armed inside a city hall meeting and pointed at seated officials while calling them Cultural Marxists. I posted things while drunk and upset that a lawyer later put in front of a judge, and he was not wrong to say I had written them. I called a bar owner a bitch on a livestream over a tray of chicken wings and asked my viewers to boycott her business. I swore at the mother of my child on her own front step on Father's Day. I named a broadcast after an obscenity directed at the United States Marshals Service and told a federal officer he would get sprayed down, hours before those same marshals arrested me in a federal courthouse.</p>
<p>None of that is in this book because a lawyer made me put it there. It is here because a book that leaves it out is a book that gets destroyed the first time somebody produces the video — and because the disproportion is the entire point. A refused conversation and a thrown-away tray of chicken wings became a felony charge carrying a hundred-and-fifty-thousand-dollar bond. You cannot see how enormous that is unless I first show you how small I was.</p>
<p>The same rule applies to the people in these pages. I have been careful about names, and I have been more careful about the ones I leave out. Children are not named here, and nothing about their health or their lives appears. A woman serving twenty-four years under Mississippi's habitual-offender statute is discussed but not identified; her case is not mine to publish. A court clerk who was kind to me on a recorded phone call is "a court clerk." Bystanders stay bystanders. Where I believe an official did something wrong, I name him and show you the document. Where I only suspect it, I tell you I only suspect it, and I have removed more accusations from this manuscript than I have kept.</p>
<p>There is one subject I cannot write about at all. A federal court has entered an order restricting discussion of testimony given in a sealed hearing in my own criminal case. I have not seen a reason to test the edges of that order, and I have not asked this book to. Where that dispute has to be described, it is described only from the public docket, and there are places where you will feel me stop short. That is not coyness. That is a court order, and I am obeying it.</p>
<p>Finally, the thing I did not expect to have to say. In 2017 I fought for states' rights, for a state flag, and for monuments, and I believed the people I was fighting were the radicals. By 2023 I had told a federal court, in writing, that I no longer advocate for states' rights at all — and that the reason is the State itself. What happened in between is this book. I did not set out to write a conversion narrative and I am not asking you to share my politics, then or now. I am asking you to notice that the thing that changed my mind was not an argument. It was nine years of documents.</p>
<p>Read the documents. That is all I have ever asked anyone to do.</p>
<p><em>— M.O.R.</em></p></section><section class="chapter"><p class="cnum">Prologue</p><h1>The First Domino</h1><p>Before Oxford. Before the flag. Before any of the names in this book had reason to know mine, there was Parris Island.</p>
<p>I processed through MEPS in December of 2007 and shipped to the recruit depot in January of 2008, one more twenty-year-old among the thousands who pass through those gates every year to be broken down and rebuilt into something the Marine Corps could use. Thirteen weeks of it — the yellow footprints, the drill instructors pitched to strip away whatever softness you walked in with, the rifle range, the Crucible's fifty-four sleepless hours. I graduated a Marine at the end of March 2008. I was proud of it. I am still proud of it. Nothing that follows in this book changes that.</p>
<p>Boot camp isn't where a Marine learns to fight. That comes next, at Marine Combat Training, and for those of us who came through the East Coast pipeline, that meant a training area called Camp Devil Dog, inside the sprawling Camp Lejeune complex in North Carolina, a subbase where recruits fresh out of Parris Island spend a month learning what boot camp doesn't have time to teach: land navigation, machine guns, convoy operations, and — because every Marine, regardless of future job, is a rifleman first — long stretches on ranges and long stretches standing post over the weapons the rest of us were still learning to use.</p>
<p>That is where, in May of 2008, everything actually starts.</p>
<p>I was on a roving post that night, moving through my assigned area at regular intervals, stopping at checkpoints, scanning for anything out of place. In a training environment, the most dangerous thing you usually encounter is boredom. Boredom was not on the schedule that night. The Marine assigned to Armory Watch was Lance Corporal Bradley Foust — not particularly outspoken, not someone you would pick out of a crowd, but not invisible either. Like a lot of us, he carried weight that didn't show on the surface. Armory Watch meant he had access to the weapons; it was a responsibility the Corps took seriously, trusting Marines to guard the tools of the profession from each other as much as from anyone else.</p>
<p>I had just finished checking the eastern perimeter when it happened. No warning signs. No whispered confession. Just the sound — the unmistakable sound of an M16 set to three-round burst. Live rounds, at that hour, in that place, were never part of the plan. I was close enough to hear it. I was close enough to see it. I was close enough to get there fast, and not fast enough to matter. Lance Corporal Bradley Foust had put his rifle in his mouth and pulled the trigger. I do not need to describe what a body looks like after that, and I am not going to, except to say that it is the kind of thing you do not get to unsee, and the smell of cordite in the air next to a friend's body is a smell I can still call up on command, eighteen years later.</p>
<p>Within hours, officers were on scene — not just the on-duty supervisors but higher-ranking men whose boots didn't usually touch that particular stretch of concrete. They secured the scene, sent Marines back to quarters, and by the time the paperwork was finished, it said "training accident." That label mattered. A suicide could mean a family loses death benefits; a training accident preserves them — that was the justification we were given, and it may even have been offered with some genuine mercy toward Foust's family behind it. But in choosing that label, the Marine Corps didn't just spare a family a hard conversation. It rewrote what had happened, in the actual permanent record, before Foust's body had even been removed from the armory. Every obituary that ran his name said "training accident." None of them said suicide, because as far as the official record was concerned, there had been no suicide to report.</p>
<p>I was not the same after that night, and I did not have the tools at twenty to understand why. I started drinking to manage what I couldn't name, because the incident that would have explained the drinking did not, officially, exist. In 2011, the Marine Corps discharged me a year ahead of my contract's end date, citing alcohol rehabilitation failure — misconduct, on paper. What that paperwork could not, and would not, capture is that the alcohol was never the disease. It was the bandage on something the record had already made sure could never be named: post-traumatic stress from witnessing a fellow Marine's suicide that the institution had decided, by policy, never happened. I did not touch alcohol again after 2018, and I am grateful for that every day, but it took a full decade after Camp Devil Dog to get there.</p>
<p>The story could have stopped at a bad discharge and a drinking problem overcome. It didn't, because in 2017 — the same year everything else in this book begins — I filed a Freedom of Information Act request with the Marine Corps, not for closure exactly, but for proof. I wanted the internal record: the after-action reports, the policy file, anything that would show whether the institution itself knew what I knew. I sent that request to Headquarters Marine Corps' records office at Quantico, Virginia — the same base that, not incidentally, has hosted the FBI's National Academy for training federal agents since the early 1970s. I don't offer that fact as evidence of anything beyond itself; I have no proof that any one arm of the federal government coordinated with any other arm of it because of my FOIA request. But I notice it, and I have never been able to stop noticing it, because of what happened next: buried in the pages the Marine Corps sent back was a quiet, unadvertised change to the Corps' own standard operating procedures — made the same month, in May 2008, at Armory Watch posts at Marine Corps training facilities, disallowing live ammunition at that post going forward. Nobody writes a policy change like that in response to a "training accident." You write it in response to a suicide you don't want to happen again. The document didn't say the word. It didn't have to. The policy change was the institution telling on itself.</p>
<p>That FOIA request did not go unnoticed. Emails started arriving afterward — some straightforward denials of additional records, others carrying an unmistakable undertone, the kind you learn to recognize once you've dealt with people in power who want you to stop digging. I cannot prove, and will not claim, a formal chain connecting a 2017 records request about a 2008 Marine Corps death to everything that happened to me in Mississippi starting that same year. What I can say, plainly, because it is true regardless of what caused it: some of the worst institutional pressure of my life began arriving in 2017, in the months immediately following that request, and it has not meaningfully let up since.</p>
<p>I have reached out to Bradley Foust's family more than once over the years. I have not pushed harder than that, because I understand what it means to ask a family that buried a son as an accident nearly two decades ago to reopen that grief on my say-so, and I will not do that without their invitation. But I think about him more than almost anyone else in this book, including myself, because his death — sanitized, reframed, filed away as an accident by an institution that knew better — is the first time I watched official truth and actual truth get separated on purpose, and it would not be the last. Everything that follows, every affidavit that doesn't match a bill of sale, every "gone forever" that turns out to mean "selectively preserved," every obituary-grade euphemism standing in for a harder word — I first learned to recognize that particular shape of lie on a training range in North Carolina in the spring of 2008, standing over a friend who did not get to tell his own story. This book, in more ways than one, is the record he was denied.</p>
<p>You do not need to take my word for any of that. Nearly everything in the chapters that follow is anchored to something that exists independent of me: a bill of sale, a FOIA release, a docket entry, a recorded phone call, a sworn affidavit that contradicts an earlier sworn letter from the same official. Where the record runs out and only my account remains, I say so plainly, in the text — not in a footnote I hope you skip. Call it a claim if you want a single word for it. You will see that word more than once, and should trust it more, not less, for how often it appears.</p>
<p>This is the story of what happens when a government decides a citizen is a problem before he has broken a law, and then spends the better part of a decade making sure the paperwork eventually agrees with them — and what happens, more rarely and more slowly, when some small number of people inside that same system refuse to go along with it: a detective who investigates a false rape report honestly and charges the woman who filed it, a court of appeals that reverses a conviction on the merits two years after everyone had stopped watching, a federal magistrate who names, in her own recommendation, that a Galveston police officer lied under oath.</p>
<p>That is where this book actually starts: not on a courthouse square in Mississippi, but on a training range in North Carolina in the spring of 2008, standing over a friend whose death the record had already decided to call something else.</p>
<p>What follows begins six years later, and a long way from either place, with a daughter born eleven weeks early.</p></section><section class="chapter"><p class="cnum">Chapter 1</p><h1>Lydia, And The Flag Petition</h1><p>My daughter Lydia was born on <strong>August 19, 2014</strong>, eleven weeks early, at twenty-five weeks gestational age, weighing <strong>one pound nine ounces</strong>.</p>
<p>One pound nine ounces is a number that does not mean anything until you have seen it. It is smaller than a bag of sugar. It is a child who fits in two cupped hands with room left over, whose skin is translucent enough that you can see the vessels underneath it, who cannot breathe without a machine deciding when. Her mother is <strong>Phyllis Marie Crowder</strong>. Whatever else is in this book about Phyllis Crowder — and there is a great deal, and almost none of it is kind — she and I stood over the same isolette in 2014 and wanted the same thing.</p>
<p>I am starting here on purpose, and not with the flag or the petition or the sidewalk, because everything that follows in this book has been told about me as though it started with a camera. It did not. It started with a daughter, and with what happened after her mother and I stopped being together.</p>
<p>The relationship ended. I am not going to perform a version of that breakup in which I was the reasonable party throughout, because the record that follows does not support it and I have spent too many pages in this book demanding that other people stop doing exactly that. What I will say is that the end of it did not resolve anything. It converted a private disagreement into a custody case, and a custody case in a small Mississippi county is not a private matter for long.</p>
<p><strong>By 2016 it had lawyers in it.</strong> I retained <strong>Andy Arant</strong> — the attorney this book is dedicated to, who would represent me on and off for years afterward, first in the custody fight against Crowder and later against the Tannehills directly. Across from us was <strong>Rhea Tannehill</strong>.</p>
<p>That is the sentence to hold onto, because of how ordinary it looks. In 2016 the name <em>Tannehill</em> entered my life the way a name enters anyone's life in a county-seat town of thirty thousand people: as opposing counsel in a custody matter. Nothing about it was sinister and nothing about it was personal yet. <strong>The 2017 restraining order that runs through the next eight chapters of this book, the one signed under duress in a jail consultation room, the one that five years later converted a walk into a courthouse into a second felony — all of it traces back to a family-court file opened over a little girl born at one pound nine ounces.</strong></p>
<p>I want to be careful about one thing here, and I would rather flag it than smooth it. This chapter's account of <em>how</em> that relationship ended, and of what was said and done between 2014 and 2016, rests on my own memory. The custody filings themselves are documented and quoted later in this book; the human sequence that produced them is not, and where I have only my own recollection I will say so, here as everywhere else.</p>
<hr>
<p><strong>In September 2016, I was not yet anyone's idea of a First Amendment auditor.</strong></p>
<p>The prologue covers what I brought into that year — the Corps, Camp Devil Dog, the discharge in 2011 under conditions the record classifies as General Under Other Than Honorable, alcohol-related. I am not going to re-litigate it here except to say the obvious: whatever the Corps' internal accounting of me was in 2011, when I filed a Change.org petition in 2016, I filed it the way anyone is supposed to file one. Publicly, under my own name, with a stated purpose, naming the two elected officials with the power to act on it.</p>
<p>That drinking problem was not an abstraction confined to my service record. In November 2014 — three months after Lydia was born — I picked up a DUI conviction in Georgia: one day of confinement, eleven months and twenty-nine days of probation. I was young and dumb and still very much carrying what the Corps had left behind, and I am not going to pretend that conviction belongs to someone else. Separating from the armed forces under administrative conditions, especially when linked to alcohol abuse, leaves an indelible mark on how an individual interacts with authority. The Marine Corps enforces a rigid, uncompromising structure of rank, military justice, and procedural regulations. In uniform, even when facing disciplinary action, the administrative framework operates according to clear written codes under the Uniform Code of Military Justice. Returning to civilian life in North Mississippi, I carried that military expectation of explicit rules and procedural accountability into the public sphere. When I observed public institutions operating with informal favoritism or ignoring statutory display mandates, my instinct was not to stay quiet or look away. My reaction was to invoke formal grievance procedures, expecting civilian administrators to adhere to the rule of law with the same exactness demanded in military service.</p>
<p>The petition was titled "Cut off State Funding to MS City/Municipalities/Schools who refuse to fly MS State Flag." Then-Governor Phil Bryant and then-State Senator Chris McDaniel were named as the decision-makers whose attention the petition sought. By the time it closed, 4,486 people had signed it. Whatever a reader thinks of the underlying position — and reasonable people can and do disagree sharply about what a state flag should or shouldn't depict, and Mississippi's 2020 flag change three-and-a-half years later suggests the country as a whole eventually disagreed with the flag I was defending — the act itself sits squarely inside the tradition the First Amendment exists to protect: petitioning government for redress, in public, by name, through a mechanism designed for exactly that purpose.</p>
<p>To appreciate the political friction generated by that petition, one must understand the environment surrounding Mississippi's 1894 state flag in late 2016. The flag, which incorporated the Confederate battle emblem into its upper canton, was a focal point of intense statewide and national debate. Several local entities, including the City of Oxford and the University of Mississippi, took administrative steps to lower the flag from municipal flagpoles and campus grounds. Under Mississippi Code § 3-3-15, state law set forth guidelines regarding the display of the state flag on official buildings. My petition addressed the statutory funding leverage: it urged Governor Phil Bryant and Senator Chris McDaniel to utilize legislative appropriations to withhold discretionary state funding from municipalities and public institutions that declined to display the official emblem. Whether one supported or opposed the flag itself, drafting an online petition and assembling 4,486 verified signatures was a completely lawful exercise of statutory petition rights. It involved zero physical trespass, zero harassment, and zero disruption of public business.</p>
<p>This matters for reasons that have nothing to do with the merits of the flag debate. It matters because everything that happens to me from May 2017 onward gets narrated, by the officials who arrest me, commit me, and prosecute me, as the story of a man who is inherently disruptive — a "First Amendment auditor" in the pejorative sense the term picked up online, someone whose entire public identity is provocation for its own sake. The petition is the counter-evidence to that narrative, and it predates the narrative by eight months. Before I ever picked up a camera and walked into a courthouse lobby, before any of the arrests, before the aggravated stalking charge that would define the next five years of my life, I was already doing the single most conventional, unthreatening, historically American thing a citizen can do when he disagrees with a government policy: I asked, loudly and publicly, for it to change, and I got several thousand of my neighbors to ask alongside me.</p>
<p>Despite the unassailable legality of the petition, its public impact in Lafayette County generated immediate institutional backlash. In a small university city where municipal officials, county leaders, and law enforcement figures maintain close personal and professional bonds, a high-visibility statewide petition created instant friction. Small-town governance relies heavily on unspoken norms and mutual deference. A private citizen launching statewide political initiatives, targeting state leaders, and demanding statutory accountability disrupts that quiet equilibrium. Almost immediately, county administrators and law enforcement personnel began monitoring my public activities, treating a lawful petitioner as an unruly outsider whose public actions required vigilant surveillance.</p>
<p>This administrative hostility quickly merged with public online harassment, transforming my civic activities into a community spectacle. A YouTube channel operating under the title 'Reardon Watch' (@reardonwatch1008), maintaining a small subscriber base of 24 subs, began airing hostile real-time mocking coverage of my life and public statements. The channel systematically documented my personal and political disputes, uploading an 8-part series titled 'Frank and Marlee's Saga', along with sensationalized videos titled 'Breaking News: Reardon Arrested!', 'The Fireball Rants' parts 1-3, '72-Hour Facebook Ban', and 'Oxford is a Nazi Communist Dictatorship'. This hostile online archiving provides clear proof that my case was already an established local spectacle well before any police handcuffs were clicked behind my back. Local officials and law enforcement officers watched these broadcasts, allowing an online caricature to overshadow the lawful reality of a citizen who had gathered 4,486 signatures on a constitutional petition.</p>
<p>The physical climate on the streets matched this digital escalation. In a recorded telephone call, retired Lt. Col. Lee Morrison described an extraordinary scene on the town square, where an estimated 30-35 law enforcement officers converged on the square while he was filming near his own statute-of-limitations deadline. During that recorded call, Lt. Col. Morrison floated an uncorroborated theory that this massive law enforcement response was designed to protect incoming Mayor Robyn Tannehill politically. While Lt. Col. Morrison's assertion regarding political protection for Mayor Tannehill remains strictly his own unverified claim and personal theory, the physical presence of thirty-five armed officers on a small public square underscored the extreme posture local authorities adopted toward public recording and citizen activism.</p>
<p>There is an earlier data point that belongs in this record too, one I have never publicly connected to the Oxford story before, because it happened five hundred miles away with no camera present: on the night of April 28, 2017 — three days before the flag-petition friction in Lafayette County reached its breaking point, and just days before Oxford — I was at the Five Flags Speedway in Escambia County, Florida, with a Mississippi state flag. An Escambia County Sheriff's deputy told me I had to leave the grandstand area with the flag or be arrested within, in his words, "less than ten seconds." I asked for his badge number, told him not to tread on my First Amendment rights, and offered to move away from the bleachers entirely rather than leave. He refused. The next day, April 29, I called the Escambia County Sheriff's Office, reached a Sergeant Palmer, told him I intended to file a formal complaint and a lawsuit against both the deputy and the department, and recorded the call — a recording I sent that same day to my attorney at the time, Charles E. Yow, II. Palmer's position, recorded on that same call, was that the issue was never really the flag itself but obstructing other patrons' view of the track, and that management had specifically asked the deputy to intervene; we agreed, cordially enough, to let a court decide who was right. I am including this incident not because it proves anything about what happened in Oxford two days later, but because it is honest context a reader deserves: by the time Oxford happened, I had already spent the better part of a week in a running argument with a different law enforcement agency over the exact same underlying question — whether a citizen carrying a flag in a public or semi-public space, and refusing an officer's order to put it away, is exercising a right or committing a provocation. Whatever the honest answer to that question is, Oxford was not the first time I had tested it, and a fair reader should know that going in.</p>
<p>Recovered audio from that period fills in what a bare timeline cannot. Before Oxford, I had already taken the fight to Biloxi, addressing that city's council directly on camera: "I signed up to the Marine Corps in 2007, and not only did I take an oath to protect our country and defend our country from all enemies, both foreign and domestic, I also took the oath to defend our Constitution as well as the flags that our country is standing by... the last time we went to a vote, the overwhelming majority voted in favor of the flag. So I have to ask, why not get into a vote?" That speech, by my own account, drove roughly 10,000 phone calls into Biloxi's city hall — a real, documented instance of the kind of grassroots pressure campaign that would become a recurring feature of my public advocacy, for better and for worse, over the following decade.</p>
<p>The Oxford confrontation that followed is also on tape. I had never spoken to Mayor Pat Patterson before showing up at the May 16, 2017 Board of Aldermen meeting — there was no phone call, no advance notice, no prior run-in between us. I simply walked in expecting to be able to address the board as a citizen. At the meeting itself, when another citizen tried to raise the same objection I intended to raise, I said aloud, on camera, that the mayor had no right to silence a taxpayer in "the taxpayers' house." Afterward, outside the building, I confronted Patterson directly: "Sir, you're one of the ones that voted for the removal of the state flag, and I'd like to get your response to that. Are you a cultural Marxist? Yes or no?" Patterson's recorded response was measured: "You weren't on the agenda, Matt... You're welcome to come speak June 6th." I include his actual words here deliberately, because they read, on the page, as considerably calmer than my own — a useful corrective to any assumption that every official in this story met me with equivalent hostility from the outset. Some, like Patterson in this specific exchange, simply declined to escalate — he told me, correctly, that speaking required being on the agenda, and told me exactly how to fix that for the next meeting.</p>
<p>I did not extend Patterson the same restraint. In the days that followed, I publicly named his likely successor, then-Mayor-elect Robyn Tannehill, calling her a "cultural Marxist" on livestream and stating that I had obtained her personal cell phone number and intended to publish it so that "the people" could call her directly. I also said, on the same recordings, that I believed her husband Rhea Tannehill and "a couple other high-profile business owners in Oxford" were working to silence me — my own claim, offered as "credible intel" I did not identify or substantiate, and treated here as exactly that: an unverified belief I held and broadcast publicly, months before anything resembling the conflict detailed in the chapters ahead had actually begun. Whatever role Rhea Tannehill's firm and Robyn Tannehill's eventual administration actually played in what followed — and later chapters document real, verifiable entanglements between the Tannehill family and my case — it is honest to note that I was already publicly targeting them, by name, on the theory that they were coming after me, before there is any documented evidence that they were.</p>
<p>That same week, in a separate livestream, I described leaving Oxford for what I called a "safe house," citing serious threats against me and stating that Antifa accounts were publishing my information and that of the people helping with my public relations. I also said, on camera, "I got a .45, I'm ready. I got a .40, okay? With the sickest bullets that you could possibly even imagine. And I'm ready." Whether the threats I described were real, exaggerated, or some mixture of both is not something the available record can resolve from outside my own account. What can be said is that within days of a lawful, successful public petition and a lawful, if combative, city council confrontation, I was already describing myself in armed, embattled terms — a posture that, whatever its justification in the moment, previews the escalating rhetoric that runs through the next several chapters and that a fair reader is entitled to weigh for himself.</p>
<p>It is worth sitting with what that petition was not. It was not a courthouse lobby occupation. It was not a livestream confrontation with a federal prosecutor. It was not a drone flown into the side of a building. Those things come later, and they come from me, at a time when my relationship with institutional authority had by then been reshaped, repeatedly and violently, by what those institutions had already done to me. The petition is the baseline — the version of me that existed before Lafayette County Sheriff's deputies decided, in May 2017, that I was a man who needed to be removed from circulation.</p>
<p>The people who would go on to arrest, commit, and prosecute me over the following nine years rarely if ever mention the flag petition. There is a reason for that. A 4,486-signature Change.org petition filed eight months before the first arrest does not fit the narrative that I was, from the outset, an unstable or dangerous man whose subsequent legal troubles were simply the inevitable consequence of who I already was. It fits a very different narrative: that of a civically engaged, occasionally provocative but entirely lawful private citizen who, within a year of exercising my most ordinary First Amendment rights, found myself facing a $150,000 bond on a stalking charge built on an allegation twelve days older than the weapon it accused me of using.</p>
<p>In the Mississippi judicial system, imposing a $150,000 bond on a felony aggravated stalking charge represents a massive deployment of judicial restraint. For an average citizen, satisfying a $150,000 bond requires securing $15,000 in non-refundable bail fees or pledging real estate collateral worth double the bond amount. When such a staggering financial barrier is established based on a sworn law enforcement affidavit alleging an armed offense on May 8—twelve days before the signed, dated bill of sale says I bought the AR-15 on May 20—it serves not as a neutral mechanism to guarantee courtroom attendance, but as a preventative detention measure designed to isolate a vocal citizen from his community.</p>
<p>I am going to ask you to hold two things in mind simultaneously for the next three hundred pages, and it is worth stating the discipline here, at the very start, rather than assuming you will infer it. The first thing is that governments, sheriff's departments, circuit clerks, and mayors' husbands do sometimes target the people who are most inconvenient to them, and that the machinery for doing so — a delayed bond hearing here, a "lost" piece of surveillance footage there, a psychiatric commitment timed to a custody dispute — is not conspiracy-theory material. It shows up, case by case, court filing by court filing, sworn affidavit contradicting sworn affidavit, throughout this story, and it shows up because it happened, not because I say it happened. The second thing, held at the exact same time and given no less weight, is that I am not a uniformly sympathetic figure, and I will not pretend otherwise to make my argument land more cleanly. I have, at various points across this timeline, escalated confrontations I could have de-escalated, said things on camera I cannot take back, and made decisions — coaching a young daughter about a legal dispute, flying a drone with a minor present, leaving a tripod in front of an emergency exit — that a fair-minded reader is entitled to find genuinely troubling, independent of anything the government did to me.</p>
<p>Both of those things are true. The flag petition is where the story of the first one begins, cleanly, with no asterisk required. The second story begins eight months later, on a public sidewalk in Oxford, Mississippi, with a flag in one hand, a camera in the other, and a deputy walking toward me who was not wearing his badge.</p></section><section class="chapter"><p class="cnum">Chapter 2</p><h1>May 1, 2017</h1><p>The video runs a little over a minute, and that single minute is the only push the next ten years of my life needed to start falling.</p>
<p>I stand on public property — the public sidewalk in front of the main Lafayette County Courthouse in Oxford, Mississippi, directly in front of the statue and monument on the courthouse square — holding a video camera at chest height, the way people hold cameras when they have already learned that lowering the camera is the first thing an officer will ask for. I am not shouting. I am not blocking a door. My purpose that afternoon is to send a message of support and protection for that historical monument, and — just as important to me that particular day — for the flag of the State of Mississippi. Standing on a public sidewalk to make that statement is a thing the Constitution of the United States says I am allowed to do, and which several thousand court decisions have said I am allowed to do, and which, in just over a minute's time, is about to get me arrested anyway, because I make the mistake of questioning a deputy's authority and asking him for his badge number.</p>
<p>The brick-paved square surrounding the historic Lafayette County Courthouse was quiet in the afternoon heat, shaded by mature live oaks and lined with white-columned storefronts, upscale boutiques, and the grand porch of City Hall across the street. To a tourist visiting Oxford or an Ole Miss alumnus back in town for a football weekend, the square represents the picture-perfect image of small-town Southern charm and academic prestige. But when you stand on that sidewalk holding a video camera at chest height, the texture of the environment changes instantly. The air grows heavy with institutional friction. You discover quickly that in a county seat of thirty thousand people where political, legal, and commercial power overlap tightly, public space is only truly public so long as your presence conforms to what the local authorities expect. The moment your posture suggests monitoring or dissent rather than tourism, the invisible boundaries of permissible civic presence snap into sharp, hostile enforcement. My elbows were tucked close to my ribs and my hands held the camera rig steady—a physical posture born of Marine Corps muscle memory, calibrated to ensure no officer could credibly claim I had thrust a lens into their face or brandished an object aggressively. Yet even with that disciplined stillness, the simple act of standing on a public sidewalk in support of a historical monument and the state flag was treated by the men wearing badges as an act of intolerable defiance.</p>
<p>And then I saw him: Deputy Timmy Pruitt, walking toward me alone, no other deputies in sight. I noticed something right away — his uniform had a blank patch where his badge should have been. Not dangling from a chain, not tucked in a pocket. Simply absent. I don't know to this day whether that was an oversight or a choice, and I am not going to pretend I do. But a badge is supposed to be an emblem of accountability, and its absence made the next ninety seconds feel wrong before he'd said a single word.</p>
<p>"You know I am audio and video recording, Mr. Pruitt," I said as he approached.</p>
<p>"I don't care. Do you have a permit to be here?"</p>
<p>"Um, the First Amendment actually—"</p>
<p>"Do you have a permit to be here?"</p>
<p>"No," I said plainly.</p>
<p>"All right, you've got to leave."</p>
<p>"Why is that?"</p>
<p>"'Cause you're going to jail if you don't."</p>
<p>"You're telling me I'm going to jail just for standing out here holding the flag, demonstrating?"</p>
<p>"You have to leave," he said again, ignoring the question.</p>
<p>"Okay — can I just ask you a question?"</p>
<p>"I'm going to ask you one more time to leave. If not, I'm gonna take you to jail. Disorderly conduct."</p>
<p>"Okay, I'll leave and take this straight to my attorney then. You can't threaten me over my First Amendment rights."</p>
<p>"Hey, I'm going to tell you right now: leave."</p>
<p>"This city is ass-backwards. Ass-fucking-backwards, y'all see that? Hey, what's your badge number, by the way, Deputy Pruitt?"</p>
<p>"You're under arrest."</p>
<p>"I'm not — I'm leaving. I was asking you — I was leaving."</p>
<p>And just like that, I was in cuffs. I want to own the crude remark about the city before anyone else points it out — it did not help me, it was not necessary, and it is the kind of thing that let a booking officer write down "disorderly conduct" and mean it in more than one direction. It is also true, and both things are true at once, that the arrest itself came only after I asked a uniformed deputy for his badge number, and that the badge number question is, under decades of settled law, protected speech, not an act of disorder.</p>
<p>Pruitt walked me to his cruiser, the Mississippi flag I'd been holding now folded on the passenger seat like contraband instead of the flag of a state. He put me in the back seat without reading me any rights, the door slamming with that hollow metal echo you don't forget, my wrists cuffed tight enough to dig in on every bump between the square and the Sheriff's Department. At intake, my name, date of birth, and charge went into the log without hesitation: Disorderly Conduct. No mention of the First Amendment. No acknowledgment that I had posed no threat and broken no window, blocked no door, raised no fist — held a flag on a public sidewalk and asked a question.</p>
<p>The footage made it online before I'd finished being processed. It moved fast, picked up by First Amendment audit pages and shared well outside Lafayette County, and the public reaction was lopsided in my favor. I was told, in the days after, that Pruitt had been placed on administrative leave — some called it that; some, less charitably, called it a paid vacation while the county decided how to make the story go away. I have no personnel record confirming which word is more accurate, and I am not going to pretend I do.</p>
<p>Here is the detail I did not learn until later: at what I believe was the same hour I was being handcuffed on that sidewalk, my daughter Lydia's mother, Phyllis Crowder, was in the Lafayette County Chancery Court with her attorney, Mona Pittman, filing an emergency petition that would begin restricting when and how I could see my daughter — a petition the court granted the same day without any supporting affidavit or evidence attached, over my later objection. This is not only my recollection years after the fact; I put it in writing, under oath, in a sworn petition to the Mississippi Supreme Court on October 11, 2021, stating plainly that the arrest happened "not only on the same day as the above petitions were filed, but ironically during the same hour." I cannot prove those two things were coordinated, and I am not going to claim a fact I can't back up. What I can say is that it is the first time in this story — though nowhere near the last — that a public arrest and a private family-court maneuver landed on the exact same day, sworn to by me at the time it mattered rather than invented later for a book, and a reader is entitled to decide for themselves how many times that particular coincidence can repeat before it stops looking like coincidence.</p>
<p>There is one more piece of that same stretch of days I need to put on the record, even though it rests on nothing but my own memory of a conversation, because leaving it out would understate how dangerous that period actually felt to live through while it was happening. In the early weeks of May 2017 — around the same days as the arrest itself, before the rifle, before Frank &amp; Marlee's — Crowder told me she had knowledge of a death threat that had been made against me. I don't have a name attached to that warning. I don't have a document, a recording, or anything beyond my own recollection of her telling me, and I am not going to dress that up as more than it is. But I believed her then, and I believe her now, and I think it matters that the woman on the other side of an increasingly hostile custody fight was, in that same week, also the person who told me someone wanted me dead. Whatever else was true about our relationship by that spring, and however much of what follows in this book she and I disagree about, that particular warning is not something I think she had any reason to invent.</p>
<p>For a long time, before I understood the fuller shape of my own story, this is where I — Matthew Oliver Reardon, the man in the video, writing now under the pen name Don Matthews — thought it started. A flag protest in the spring of 2017. A deputy named Timmy Pruitt. A first domino.</p>
<p>It isn't, quite — not the first one, anyway. You've already read the one that actually opens this book. But it is the first domino that Oxford, Mississippi could see, and the one that put Mississippi specifically into motion started eight months earlier still, in September 2016, when I — a private citizen with no law degree, no press credential yet, and no criminal record — started a Change.org petition asking Mississippi cities to lose state funding if they refused to fly the state flag. I named two decision-makers — then-Governor Phil Bryant and then-State-Senator Chris McDaniel — and by the time the petition closed it had 4,486 signatures attached to it. That is not a radical act. That is closer to the most boring, procedurally correct form of American dissent there is: circulate a petition, name the officials who can act on it, wait.</p>
<p>Under established constitutional doctrine, petitioning government officials for a redress of grievances is the foundational mechanism of First Amendment expression. It is the peaceful, orderly process through which citizens voice opposition to state actions without resorting to civil disruption. You do not block traffic on Jackson Avenue; you do not occupy public lobbies; you articulate a statutory demand, assemble signatures from fellow residents, and submit the grievance directly to the elected leaders possessing statutory authority over public funds. In September 2016, I genuinely believed in the integrity of that mechanism. I believed that gathering 4,486 signatures was an exercise in productive civic engagement. What I failed to understand was how small-town political networks and municipal law enforcement leadership interpret such acts. To an administrative establishment accustomed to quiet deference, an unyielding citizen who mobilizes thousands of people around a contentious policy issue is not viewed as a participant in democracy. He is viewed as an administrative hazard—an unpredictable agent who must be monitored, classified, and ultimately neutralized before his challenges disrupt institutional routines.</p>
<p>It matters to start there and not at the flag protest, because the entire architecture of what happened to me over the following nine years rests on a single implicit claim made, at various points, by a sheriff's department, a circuit clerk, a mayor's husband, a U.S. Marshals Service district office, and a federal prosecutor: that I brought this on myself. That a man who behaves the way institutions expect a "compliant citizen" to behave does not get arrested twelve days before the murder weapon in my own case existed. Does not get committed to a psychiatric facility on the say-so of the same sheriff whose department I had just sued. Does not get struck in the head with a metal flashlight at a city hall four states away, denied the security footage of my own beating, and then arrested for it while sheltering from an ice storm.</p>
<p>Long before sheriff's deputies ever placed handcuffs on my wrists on the town square, the entire dispute had already been converted into a hostile, real-time online spectacle. A YouTube channel operating under the title 'Reardon Watch' (@reardonwatch1008), maintaining a small subscriber base of 24 subs, conducted relentless mocking coverage targeting my activities throughout the 2017 saga. The channel's public archive functioned as a digital platform for local schadenfreude, airing an elaborate 8-part series titled 'Frank and Marlee's Saga', along with mocking updates like 'Breaking News: Reardon Arrested!', 'The Fireball Rants' parts 1-3, '72-Hour Facebook Ban', and 'Oxford is a Nazi Communist Dictatorship'. This extensive digital trail demonstrates conclusively that my situation was already an established local spectacle long before formal criminal affidavits were sworn or executed. Local residents, municipal personnel, and law enforcement officers consumed these uploads, observing every social media suspension, every passionate video broadcast, and every interpersonal dispute as public entertainment. In a small community where police officers and court personnel inhabit the same social circles as online commenters, this hostile coverage systematically shaped institutional attitudes. When officers confronted me on public streets, they did not see an individual exercising constitutional rights; they saw the caricatured antagonist depicted across dozens of 'Reardon Watch' uploads.</p>
<p>The sheer scale of police resources deployed against me on the Oxford square reflected an operational posture far beyond routine municipal policing. In a recorded telephone call, retired Lt. Col. Lee Morrison described an astonishing scene he witnessed firsthand: an estimated 30-35 law enforcement officers converging on the town square all at once while he was filming near his own statute-of-limitations deadline. During that recorded call, Lt. Col. Morrison floated his own uncorroborated theory for why such a massive, multi-agency force had descended upon the square—suggesting the overwhelming police response was mounted to protect incoming Mayor Robyn Tannehill politically. It is vital to state explicitly that Lt. Col. Morrison's assertion regarding political protection for Mayor Tannehill remains strictly his own unverified claim and personal theory, unsupported by judicial findings or official documentation. Yet, regardless of whether his political speculation holds water, the physical reality he witnessed and recorded remains undisputed: over thirty armed officers deployed to a small-town public square to surround a single citizen holding a video camera. When an administrative system mobilizes thirty-five officers for a sidewalk filming incident, the objective is no longer routine law enforcement; it is a display of state force intended to signal that public scrutiny will carry an unbearable cost.</p>
<p>Something in that chain has to be true and something in that chain has to be false, and my hardest commitment in telling this story is to say clearly which is which, and to say clearly where nobody actually knows.</p>
<p>Here is what is true, and provably so, independent of anything I say about myself: on May 20, 2017, I bought a rifle. There is a bill of sale. It has a date on it, a seller's name — Larry Watkins, found through the classifieds site Armslist — and a signature. Six days later, on May 26, four senior Lafayette County law enforcement officers — Chief Deputy Scott Mills, Major Alan Wilburn, Lieutenant Jared Bundren, and Sheriff Joey East — arrived to arrest me for aggravated stalking, on an allegation that I had threatened a local restaurant couple with an AR-15 "on or before May 8, 2017." May 8 is twelve days before the rifle existed. That is not a matter of my word against the state's. That is a receipt against a police report, and the receipt wins.</p>
<p>To grasp the full legal weight of that chronological impossibility, one must examine the statutory mechanics of Mississippi criminal procedure. Under Mississippi Code § 97-3-107, aggravated stalking is a felony carrying severe prison sentences, requiring the state to establish a credible threat of death or serious bodily injury made with a deadly weapon. When senior law enforcement officers execute an arrest warrant affidavit, they swear an oath before a magistrate or justice court judge that probable cause rests on concrete, verified facts. When Chief Deputy Scott Mills, Major Alan Wilburn, Lieutenant Jared Bundren, and Sheriff Joey East executed that warrant on May 26, they relied on a sworn factual narrative asserting an armed threat on or before May 8. In a functioning judicial environment governed by the Fourth Amendment, producing an unassailable bill of sale proving the firearm was purchased on May 20 from Larry Watkins via Armslist should have dissolved the prosecution instantly. An arrest affidavit rooted in a chronological impossibility lacks probable cause as a matter of law. Yet in Lafayette County, exposing a twelve-day impossible gap did not trigger a dismissal or an internal investigation into how four high-ranking law enforcement officials swore to a false timeline. Instead, it marked the beginning of years of aggressive litigation designed to preserve the state's posture while keeping me tied up in the court system.</p>
<p>Here is what is also true: I, the same man who owns that exculpatory receipt, have, by my own account and by the account of people who love me, coached my six-year-old daughter about a custody dispute in her mother's home while a recorder ran. Left a tripod in front of a courthouse emergency exit and later crowed on a livestream that "now they just asked for it," language a federal judge would be entitled to read as something between bravado and confession. Flown a drone into the side of a building with my young stepdaughter present. Called a U.S. Marshal a name that got me charged with a federal misdemeanor.</p>
<p>Both of those paragraphs are true at the same time. That tension is not resolved here by picking a side and shading the facts to fit. It is resolved by refusing to pretend the tension isn't there — because the tension is, in fact, the whole point. The American legal system is very good at building an airtight case against a difficult person. It is much worse at asking whether the difficult person was also telling the truth about something the system badly did not want litigated: that a sheriff's department can lose or "selectively preserve" the footage that would clear me, that a circuit clerk can swear two contradictory things eighteen months apart under oath, that a mother of one of my children can report the same fabricated accusation three years running and never once be prosecuted for it until a police detective personally intervenes, that a federal district's Marshals office can circulate a "district alert notice" with my photograph and my rifle in it two months before I am arrested for a crime that alert predicted I would commit, in the city the alert predicted I would commit it in.</p>
<p>Within federal law enforcement structures, the distribution of a "district alert notice" by the U.S. Marshals Service is a potent administrative act. These alerts function as internal law enforcement bulletins, warning officers across jurisdictions that an individual presents a heightened security risk. When such a bulletin is distributed featuring a suspect's photograph and firearm details months prior to an arrest, it establishes an environment of pre-determined hostility. Any officer encountering that individual is conditioned to expect violence, turning routine interactions into high-risk tactical encounters. Furthermore, when exculpatory video surveillance vanishes from police custody, civil rights litigants face the daunting legal barrier of proving spoliation of evidence. Under Federal Rule of Civil Procedure 37(e) and governing constitutional doctrines established in Brady v. Maryland and Arizona v. Youngblood, establishing that law enforcement improperly destroyed or failed to preserve vital video evidence requires demonstrating bad faith—an exceptionally high legal bar when police departments assert routine technical failure or automated system overwriting.</p>
<p>None of that erases the tripod. None of that erases the coaching. It sits next to it. That is what a "layered thesis" means in practice, and it is the discipline held from this page to the last: two honest ledgers, kept open at once, in a story that spans a flag petition, five state court cases, three separate psychiatric commitments, a federal civil rights suit still working its way through a magistrate's recommendation, a 4,000 shortfall in a narcotics unit's lockbox that somehow touches every bad actor in my story at once, and — as of this writing — a federal misdemeanor sentencing scheduled for August 7, 2026, over a courthouse lobby in Lafayette, Louisiana, where the government has already conceded, in writing, that it failed to preserve all of the surveillance footage that would show what actually happened in that lobby before the arrest.</p></section><section class="chapter"><p class="cnum">Chapter 3</p><h1>The Agenda</h1><p>On May 16, 2017, I showed up at a meeting of the Oxford Board of Aldermen wanting to speak. I had never spoken to Mayor Pat Patterson before that night — no phone call, no advance notice, nothing. I simply walked in assuming that showing up was enough. It wasn't. I hadn't put my name on the agenda, and under the board's own procedure, that meant I didn't get the floor that night. Patterson told me so directly, and told me directly how to fix it: put my name on the agenda for the next meeting, the first week of June, and I could speak then. I did exactly that.</p>
<p>I am telling this story in this order, and this plainly, because it would be easy — and dishonest — to write it up as a mayor silencing a citizen, and that is not, on the actual record, quite what happened here. What happened here is closer to the mundane, unglamorous machinery of local governance working the way it's supposed to: a citizen who didn't know the rule, an official who told him the rule, and a path forward that the citizen then took. It is worth stating plainly, this early in the book, because so much of what follows genuinely was institutional hostility dressed up as procedure — and if I let a night that wasn't that get filed under the same heading, I make it easier for a skeptical reader to write off the nights that actually were.</p>
<p>That doesn't mean the night was without friction. When another citizen tried to raise the same objection I'd come to raise, I said aloud, on camera, that the mayor had no right to silence a taxpayer in "the taxpayers' house" — a claim that, applied to a genuine content-neutral agenda rule, oversells what was actually happening. Afterward, outside the building, I confronted Patterson directly: "Sir, you're one of the ones that voted for the removal of the state flag, and I'd like to get your response to that. Are you a cultural Marxist? Yes or no?" Patterson's recorded response was measured: "You weren't on the agenda, Matt... You're welcome to come speak June 6th." Read side by side, his words are calmer than mine, and a fair-minded reader should notice that. A public comment period built around an advance-agenda requirement is a standard, constitutionally unremarkable feature of municipal government — the kind of neutral time-and-manner rule that courts from Perry Education Association v. Perry Local Educators' Association forward have consistently upheld. This chapter is not the story of that rule being weaponized against me. The chapters ahead will show you what it looks like when other rules, in other rooms, actually were.</p>
<p>Three days later, on May 19, I was at Frank &amp; Marlee's, a piano bar in Oxford owned by Todd and Ashley Lynch. What happened inside is disputed in the way that most small, ordinary disagreements are disputed after they've been dragged into a legal case that made them the load-bearing wall of a criminal charge: Ashley Lynch, according to my account, refused to engage with me and threw away food I had already paid for. I left without escalating the confrontation inside the bar. What I did next is not disputed at all, because I did it on camera: I stood outside and did a Facebook Live broadcast calling for a boycott of the business.</p>
<p>The recordings of that night and the days after survive, and they are worth quoting directly rather than paraphrasing, because they show something a summary cannot: how quickly a business dispute escalated, on both sides, into something considerably uglier. On the first livestream, standing outside the bar, I told viewers: "I paid for my wings, and I was eating my wings, and I wanted Ashley to come over and talk to me... She freaking took my tray of wings that I already paid for and tossed them in the garbage." Within the same series of broadcasts that night and the next day, I called for a "complete boycott of Frank and Marley's," asked followers to go photograph the bar's collection of confiscated IDs glued under its glass counter, and — in a later livestream, after Todd Lynch confronted me in person at a different bar — admitted on camera to calling Ashley Lynch a "bitch" to her face, adding, "you damn right you're gonna get called a bitch." I do not soften that admission here. Whatever Ashley Lynch did with my food, calling a business owner a degrading name in the middle of her own establishment is conduct I own, not conduct I am recasting as self-defense.</p>
<p>Todd Lynch's own side of it survives too, in his own words, relayed on one of my broadcasts and in a phone call he placed to me directly that I also recorded. In a message forwarded to me by a mutual acquaintance, Lynch wrote that his wife had told me to talk to her and that I had "yell[ed] at her, bitch, when I tell you to talk to me you talk to me," and that "that is when she took the four or five wings out from in front of him and told him to leave the premises." On the phone call that followed, Lynch told me: "if we are running a business, we do not have time" for customers who use that language toward his wife, and warned that any further public commentary would draw "your formal notice" — a threat of legal action neither of us apparently followed through on. I responded, on that same call, by telling him I had "thrown him to the wolves" and did not care if he sued, since he had "nothing for me to take." Neither of us comes off well in that exchange, and I am including both sides of it rather than only mine.</p>
<p>That Facebook Live broadcast took place on the public sidewalk outside Frank &amp; Marlee's on the Oxford Square. On the video stream, I addressed viewers directly, detailing the treatment I had experienced inside, describing the thrown-away food, and urging local residents and university students not to patronize the establishment. In American constitutional jurisprudence, public calls for commercial boycotts occupy a protected place at the very core of First Amendment expression. The United States Supreme Court established in the landmark Mississippi case NAACP v. Claiborne Hardware Co. (458 U.S. 886, 1982) that peaceful consumer boycotts, public calls for economic pressure, and speech criticizing commercial enterprises on public thoroughfares are fully protected against governmental prohibition or penalization. Standing on a public sidewalk with a smartphone camera, exercising free speech to urge consumers to spend their dollars elsewhere, is as fundamental to American civic discourse as distributing pamphlets or peaceful picketing.</p>
<p>That is the entire underlying conduct that would, seven days later, become the factual predicate for an aggravated stalking arrest carried out by four senior Lafayette County officers. Worth saying plainly, because the charge that eventually followed used language — "threatened," "stalking" — that conjures something far more alarming than what the record actually shows happened at Frank &amp; Marlee's: a customer had a bad interaction with an owner, left, and criticized the business publicly from a public sidewalk. Whatever one thinks of the tactic — and calling for boycotts of businesses whose owners have wronged you is, again, about as protected and commonplace a form of American expression as exists — it is not, on its face, stalking. It does not become stalking later, either. What makes the eventual charge legally indefensible is not a dispute about tone or intent. It's a receipt.</p>
<p>Under Mississippi Code § 97-3-107, criminal stalking requires a willful, malicious, and repeated course of conduct directed at a specific person, or a credible threat made with the intent to place that person in reasonable fear of death, grievous bodily injury, or sexual assault. A single public video calling for a commercial boycott from a public street fails every legal element of that offense. It contained no threats of physical violence, no brandishing of weapons, and no persistent harassment. Yet law enforcement officials and business owners took protected consumer speech and began transforming it into the foundation of a felony indictment.</p>
<p>On May 20, the day after the Frank &amp; Marlee's boycott broadcast, I purchased an AR-15-style rifle from a private seller I found through the classifieds site Armslist.</p>
<p>The seller's name was Larry D. Watkins. He wrote out a receipt by hand, on ruled notebook paper, and I have kept it for nine years. It reads, in full:</p>
<p>&gt; <em>"I Larry D Watkins, am selling this AR-15 Del-ton, serial # S086662, with extra parts &amp; some ammo. To Matthew Reardon, for the amount of 550.00. ON the this Day May 20, 2017."</em></p>
<p>Then his signature, and under it, the date again: <strong>5/20/17</strong>.</p>
<p>Every element of that document is checkable by anyone who cares to check. Del-Ton is a real North Carolina rifle manufacturer. S086662 is a serial number that either matches a Del-Ton rifle or does not. Larry D. Watkins is a real person with a real telephone number who was, at the relevant time, findable through the same classifieds listing I found him through. Five hundred and fifty dollars is what a used AR-15 with extra parts and ammunition cost in Mississippi in 2017. The document does not ask anyone to take my word for anything. It hands over a name, a serial number, a price, and a date, and invites verification.</p>
<p>I want to say clearly what it is and is not, because the moment I overstate it, a prosecutor gets to knock it down and act like everything standing next to it fell too. It is a private handwritten receipt. It is not notarized and not witnessed. Under Mississippi law it doesn't have to be — private firearm sales between law-abiding adult residents are entirely legal, with no waiting period, no registry, and no required documentation of any kind. Most such sales generate no paper at all. This one generated a page because I asked for one, which is a habit that would turn out to matter more than I could have known on a Saturday in May.</p>
<p>And it does not stand alone.</p>
<p>In a livestream from that same week — recorded for an audience with no reason to expect it would ever matter to a criminal charge — I am on camera explaining a 72-hour Facebook suspension I had picked up for asking, in an earlier post, whether anyone had an AR-15 for sale. And I say: <em>"I am down for 72 hours, simply because... I was looking for an AR-15. And I got my fully decked out AR-15 yesterday."</em></p>
<p>Fully decked out. Watkins's receipt says <em>with extra parts &amp; some ammo</em>. He wrote his sentence to close out a Saturday sale. I said mine to explain a Facebook ban to a few dozen people watching a phone. Neither of us was building a defense, because neither of us knew there was going to be a charge. They match anyway.</p>
<p>That is the whole architecture of this book in one paragraph: a document and a recording, made independently, by people with no motive, before the events that would make them matter — set against a sworn police affidavit written afterward by people with every motive, alleging a date that both of them make impossible.</p>
<p>Hold that date. It becomes the single most important piece of paper in my story, and the next chapter is built entirely around what happens when a police department constructs a felony-adjacent stalking case around an allegation that predates the very weapon the allegation depends on.</p>
<p>Before getting there, though, it's worth pausing on May 16 through May 20 as their own small, coherent sequence, because read together they tell a story that has nothing to do with guns or stalking statutes: a citizen shows up to a public meeting without knowing the rules, gets turned away for a night, and gets a clear path back. Three days later I have an unpleasant interaction at a local business and criticize it publicly. The day after that, I buy a rifle — a fact that, on its own, in a state where gun ownership is neither rare nor remarkable, is legally unremarkable. There is no evidence in the record, independent of what would later be alleged, that the rifle purchase was connected to Frank &amp; Marlee's, the Lynches, or anything resembling a threat. It becomes connected only retroactively, in a police report filed six days later, alleging conduct that occurred on a date the rifle did not yet exist.</p>
<p>In standard investigative procedure, when a citizen files a complaint alleging a weapon-based threat, law enforcement officers are legally and ethically obligated to establish the baseline timeline: when was the weapon acquired, where was it located on the date of the alleged offense, and what objective evidence supports the complainant's timeline? In this case, no investigator established when I acquired the rifle at all. Nobody requested the transaction record. Nobody contacted Larry Watkins, whose name and signature were sitting on a page in my possession the entire time. Nobody verified whether the firearm was in my hands on the date alleged in the affidavit. The single question that would have ended the case in an afternoon — <em>when did you get the gun?</em> — was never put to me, never put to the seller, and never answered by anyone before four senior officers swore out a warrant. Instead, independent events were retroactively linked to create an artificial narrative of escalating danger.</p>
<p>The Frank &amp; Marlee's boycott broadcast did not happen in a vacuum, and any honest account of it would be incomplete without noting the hostile, real-time public counter-narrative that grew up alongside it. A YouTube channel calling itself "Reardon Watch" began posting contemporaneous coverage of these events in 2017, eventually accumulating twenty-five videos — an eight-part series titled "The Frank and Marlee's Saga," including entries titled "The Security Camera Footage" and "The Phone Call," alongside mocking titles like "The Fireball Rants," "72-Hr Facebook Ban," and "Oxford is a Nazi Communist Dictatorship." I do not know who operated that channel, and I do not attribute its content to any specific official named elsewhere here — there is no evidence connecting it to Wilburn, Mills, East, or anyone else in an official capacity. What the channel's existence does establish, independent of who ran it, is that my conduct in May 2017 was public enough, and contentious enough, to generate its own dedicated hostile media operation in real time — a detail worth including because it complicates any simple narrative in which I was, in this period, an obscure private citizen picked off quietly by officials with no one watching. Whatever was happening to me in Oxford in May 2017, it was happening in public, watched closely by people on more than one side of the conflict, from the very beginning.</p>
<p>The presence of a dedicated digital campaign like "Reardon Watch" illustrates how modern local conflicts unfold across parallel tracks. While formal legal machinery was being assembled behind closed doors at the sheriff's department, informal digital channels were amplifying public mockery and framing my civic activities as erratic or dangerous. The twenty-five videos functioned as an online echo chamber, curating clips of my livestreams, edit-splicing phone conversations, and circulating mocking commentary throughout the local community. For anyone observing the situation in Oxford during May 2017, this digital footprint created a surrounding atmosphere of controversy that local authorities could exploit to justify extraordinary law enforcement measures.</p>
<p>That retroactive connection — a government looking at a citizen's ordinary, lawful, occasionally abrasive civic and personal conduct and assembling it, after the fact, into a narrative of dangerousness — is the mechanism I return to again and again, in Oxford in 2017 and in Lafayette, Louisiana in 2025, and in Aberdeen, Mississippi in 2026. It rarely announces itself as retaliation. It usually announces itself as a police report, with a date on it, that turns out on close inspection not to add up.</p>
<p>When an administration or law enforcement agency decides that a vocal critic must be neutralized, it seldom invents a conflict out of whole cloth. Instead, it audits the citizen's recent life, selecting mundane, lawful encounters—a municipal comment refusal, a business dispute, a Facebook video, a legal gun purchase—and stitches them together into a sinister mosaic. Each individual act was lawful when committed, but when re-sequenced inside an official incident report, they are presented to a magistrate as proof of a dangerous escalation. That structural mechanism is the common thread connecting my experiences across three different jurisdictions over nearly a decade.</p>
<p>This one didn't add up by twelve days. The next chapter is about the twelve days, and about the four officers who showed up anyway.</p></section><section class="chapter"><p class="cnum">Chapter 4</p><h1>The Setup: Twelve Days</h1><p>On May 24, 2017, I underwent a hair-follicle drug test. The result was positive for marijuana and alcohol. I am not going to bury that fact in a footnote or wait until a "counterargument" section to raise it. It is a genuinely complicating piece of the record, and any honest account of what follows has to hold it in view rather than pretend that I, at the center of this story, was in this period of my life simply an innocent bystander with clean hands. Whatever else is true about the case Lafayette County built against me, this detail is real, and it is mine — marijuana and alcohol, nothing more exotic than that, and I am naming the actual substances plainly rather than letting the fact sit vaguely in the record.</p>
<p>I raise a second fact alongside it, not to excuse my own result but because omitting it would itself be a kind of dishonesty about how selectively this kind of testing gets used. In the same custody proceeding involving Phyllis Crowder, a judge ordered her to undergo her own hair-follicle test. To my knowledge, that test either never happened or its result was never entered into the record — and there was no consequence to her either way. I believe, based on what I knew of her habits at the time, that she would have tested positive for marijuana as well. I cannot prove that belief, and I label it here as exactly what it is: my own suspicion, not a documented fact. What is documented is the asymmetry itself — one parent's court-ordered drug test produced a result that followed him into a felony case file, and the other parent's court-ordered drug test, by the available record, simply never surfaced at all.</p>
<p>Separately, on that same day, Investigator Jarrett (also recorded in some documents as Jared) Bundren reviewed my Facebook page, specifically looking for a threat directed at Todd Lynch. This review is the investigative basis — the paper trail — for what becomes, two days later, an aggravated stalking arrest. It is worth noting what Bundren was doing on May 24: building a case, from social media content, against me after I had criticized a local business owner on a livestream five days earlier. That is a strange, thin foundation for a felony-adjacent stalking charge under ordinary circumstances. It becomes something closer to indefensible once the charge's actual factual allegation comes into view.</p>
<p>During his social media audit on May 24, Investigator Bundren was actively scouring my public digital profile, taking screenshots of posts, video broadcasts, and comment threads. In digital police work, investigators often conduct subjective content reviews, searching for keywords or emotional statements that can be recontextualized as evidence of criminal intent. Bundren was not investigating a physical assault or a reported brandishing incident; he was parsing Facebook posts to manufacture a probable cause affidavit naming Todd Lynch as the alleged target, five days after a public dispute with the business Lynch co-owned with his wife.</p>
<p>I no longer have to leave the Lynches' role unresolved. Bundren's own reporting officer narrative, Complaint No. L17-05138, dated May 30, 2017, surfaced years later through a public-records request and later attached as an exhibit to my own 2020 post-conviction relief motion, states the sequence in his own words: "I was advised that there were a lot of threats on facebook by Matt Reardon, specifically toward Frank and Marlee's and Todd Lynch. I looked at Matt's facebook page and there were several videos and posts of Matt with guns verbally making threats toward Todd and his business. Todd said that he wanted to file charges. After further looking into the threats on facebook and other threats and harassment, Todd filed charges on Matt." Todd Lynch did want this charge pursued, on the documentary record, in the investigating officer's own words. What that same report does not contain is any reference to a specific threat dated on or before May 8, tied to an AR-15, or anything resembling the precise factual theory that the formal Criminal Information charged two months later. The underlying complaint that started this — the one Todd Lynch actually asked Bundren to act on — was about Facebook videos and general harassment. The specific "AR-15, on or before May 8" theory that produced the twelve-day impossibility detailed below appears nowhere in the initiating police narrative; it shows up only in the charging document the District Attorney's office ultimately filed. Todd Lynch wanting to press charges over the Facebook dispute is one fact. A prosecutor's office subsequently building a specific, dated, weapon-based theory that a bill of sale disproves is a separate fact, and the first does not explain or excuse the second.</p>
<p>There is one more figure who belongs in this same window, even though I cannot document what happened with the same precision as the dated filings and recorded calls elsewhere in this chapter. Laura Hood was doing PR work for me during this exact period — a recorded call I placed to her on the night of May 22-23, 2017 survives, and on it she comes across as protective, warning me to watch what I said publicly and to stay away from people spreading rumors against me. By my own account, though, somewhere in the days between May 20 and May 25, 2017, that changed: she turned, and the support I thought I had was, by my own later understanding of it, a front the whole time. I do not have a document or a second recording that pins down the moment of that turn, and I am naming that gap plainly rather than papering over it — this is my own account of what happened, not a documented fact I can point a reader to, and it should be weighed accordingly. I include it anyway because leaving it out would mean pretending I did not, in these twelve days, also lose people I believed were on my side, on top of everything the state itself was building against me.</p>
<p>Also in this same window — the record places it in this same charged period around May 24-25, 2017 — the Tannehill family (the same family whose name recurs later in my story in connection with Oxford's mayor) filed a restraining order against me. That case carries its own docket number, 2017-CV-217, and I call it fraudulent. Rhea Tannehill, I maintain, threatened me in a courthouse hallway during this period, and was physically restrained by Major John Hill — placed firmly in the "not a bad actor" column, since his role here was to prevent an altercation, not cause one. The Tannehill restraining order hearing was held before Judge Glenn Alderson. I return to 2017-CV-217 in Chapter 6, because what happens to it — specifically, how I came to sign it — is inseparable from the conditions of my detention on the charge this chapter is actually about.</p>
