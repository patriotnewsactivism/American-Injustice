<p>The encounter in the Lafayette County Courthouse hallway highlights how volatile the environment had become in late May 2017. As I walked down the marble corridor toward the chancery clerk's office, Rhea Tannehill confronted me, his tone aggressive and his physical posture hostile as he leveled verbal threats. Before the confrontation could escalate into physical violence, Major John Hill stepped between us, physically placing his hands on Tannehill and restraining him to restore order. Major Hill's calm, decisive intervention prevented a physical assault in the middle of the courthouse. That moment stood in stark contrast to the institutional hostility I faced elsewhere: an officer acting purely as a professional peacekeeper, recognizing who was initiating the aggression and stepping in to maintain safety. Yet despite that public hallway confrontation, civil legal petitions were swiftly deployed against me in Chancery Court under docket number 2017-CV-217 before Judge Glenn Alderson, laying the groundwork for further legal leverage.</p>
<p>In an April 2025 video I recorded on this case, I cite a specific date and document for that hallway confrontation: a Lafayette County Sheriff's Office report dated May 30, 2017, which I describe as recording that Rhea Tannehill "attempted to rush" me and "yelled that he would bash [my] head in." I have not independently re-located that report in the files available to me while writing this book, so I am citing it the way I am citing it here — as my own sourced claim from that video, not as a document I am reproducing firsthand — but it is worth setting down because no restraining order was ever sought against Rhea Tannehill over it, while one was sought, granted, and later used against me over conduct the physical evidence disproved.</p>
<p>The same video adds a detail about the restraining order's use that belongs in the record regardless of how the "three police reports" dispute above resolves. According to my own account, on the day of Robyn Tannehill's 2017 mayoral election, I was scheduled to speak at Oxford City Hall. Rhea Tannehill, I say, informed Judge Alderson of this in advance. Alderson's response, on my account, was to extend the restraining order and instruct that I be arrested if I appeared to speak. If that happened as I describe it, a sitting judge preemptively barred a critic of the incoming mayor from speaking at a public City Hall meeting, timed to the mayor's own election day — the kind of prior restraint the U.S. Supreme Court has described as "the most serious and the least tolerable infringement on First Amendment rights" — a phrase that traces to <em>Nebraska Press Assn. v. Stuart</em> (1976), though my own video cited it differently, attributing it to <em>New York Times Co. v. United States</em>, and I have not reconciled that discrepancy here. I am flagging the citation itself rather than asserting it as independently confirmed: this is my own recollection and my own video's framing, not a docket entry I have in hand.</p>
<p>My own conduct toward Rhea Tannehill in this same period does not belong left out of this account simply because it is unflattering. In a livestream from around this stretch of May 2017 — one I later said was broadcast to my main profile by accident, meant only for a private message — I said, referring to Tannehill directly: "You involved my child... I will come after you with every fucking everything in my body... I will see, personally, to the fall of [Rhea] Tannehill. And I promise you that. [Rhea], I am coming for you. I will not stop." I do not know, and the available record does not establish, what specific action by Tannehill I believed had "involved my child" at that moment, and I am not going to construct a justification retroactively. What I can do is set the statement down as I actually made it: a direct, explicit, repeated threat of personal retaliation against an opposing party's attorney, delivered publicly, during the same weeks the state would go on to charge me with felony aggravated stalking against people I had never threatened with anything resembling this language. A fair reader, weighing whether Lafayette County's officials overreacted to me in May 2017, is entitled to weigh this alongside everything else in this chapter — including the fact that whatever they built the actual stalking charge around, it was not this.</p>
<p>What I said about Rhea Tannehill is mine, and I have set it down without a defense. There is no version of this book in which that livestream is Lafayette County's fault.</p>
<p>What I will not do is let it be stretched into something I did not do. Chapter 14 deals with a court document from August 2021 in which a judge wrote that he had "learned that Mr. Reardon had threatened Tannehill Law Firm." <strong>I threatened Rhea Tannehill, a lawyer, on a livestream, in 2017. I did not threaten a law firm.</strong> A firm has staff — receptionists, paralegals, people who have never heard of me. Those are different allegations, and the distance between them is the distance between a man losing his temper at his opponent and a man menacing a workplace.</p>
<p>There is a separate, later thread that bears directly on how the public first came to understand these events, and it belongs here rather than in a later media chapter because it concerns the same week this chapter documents. In a recorded call years afterward, I put the question directly to Rebecca, a publisher at the Oxford Eagle, about the paper's May 2017 coverage of my arrest — coverage I allege was built on unqualified, inaccurate information fed to the paper by Major Alan Wilburn, one of the four officers who would make the May 26 arrest this chapter is about to detail. On the call, when I pressed her, the publisher admitted Major Alan Wilburn fed the paper unqualified, inaccurate information for a May 2017 article, and declined to produce any evidence supporting the article's specific factual claims when confronted. I cannot independently verify what Wilburn told the Oxford Eagle or what the paper printed as a result, and I record this as an unresolved allegation rather than a proven fact — but I flag the allegation because it fits a pattern documented repeatedly in later chapters: officials in this story shaping public narrative through informal channels, well outside of anything that would be subject to cross-examination or documentary scrutiny in a courtroom.</p>
<p>That recorded conversation with Rebecca, the Oxford Eagle publisher, exposed the symbiotic relationship between local law enforcement leadership and small-town media outlets. When a senior officer like Major Alan Wilburn feeds unverified, defamatory allegations to a newspaper publisher, and the paper prints those claims without requiring supporting documentation, official police leaks are transformed into public consensus. When confronted on the recorded call and asked to produce the underlying evidence or source material for the damaging assertions published in May 2017, publisher Rebecca refused to provide a single document, record, or piece of corroborating evidence. This institutional dynamic allows law enforcement to try a citizen in the press long before any evidence is tested in a court of law, poisoning the jury pool and shaping public perception to justify unlawful arrests.</p>
<p>That charge: on May 26, 2017, four senior Lafayette County law enforcement officers — Chief Deputy Scott Mills, Major Alan Wilburn, Lieutenant Jared Bundren, and Sheriff Joey East — arrived and arrested me for aggravated stalking. The allegation, as charged, was that I had threatened Todd and Ashley Lynch with an AR-15 "on or before May 8, 2017."</p>
<p>This was the second time that year a public arrest on the square landed on the exact same day — by my own sworn account, the same hour — as a filing in Crowder's chancery custody case. May 26, 2017 is also the date Crowder, through Mona Pittman, filed her third petition of the year against me, a Petition for Citation of Contempt. I said so under oath in the same October 11, 2021 petition to the Mississippi Supreme Court cited in the Prologue: "not only during the same day but during the same hour much like before, Petitioner is arrested on the Public Square in Oxford, MS." Two coincidences of this specific kind, both sworn to contemporaneously rather than invented later, is where I stop calling it coincidence in my own head — though I still cannot prove coordination, and I am not asserting one here as established fact.</p>
<p>The execution of that arrest was not a routine traffic stop or a peaceful surrender arranged through legal counsel. It was a coordinated tactical ambush near the Oxford Square. I had been lured to a location near the Square under the pretense of a casual meeting. As I sat in the driver's seat of my vehicle, before my hand could even reach for the door handle, my car door was violently wrenched open from the outside.</p>
<p>Four senior figures of Lafayette County law enforcement materialized around my vehicle with coordinated precision: Chief Deputy Scott Mills, Major Alan Wilburn, Lieutenant Jared Bundren, and Oxford Police Chief and Sheriff Joey East. These were not junior patrol deputies responding to a dispatch call. They were the executive leadership of local law enforcement—the decision-makers who normally spent their days behind administrative desks or directing department operations, now personally assembling to execute a physical takedown.</p>
<p>They did not announce their presence or state their authority. They did not inform me of an outstanding warrant, state the nature of the charges, or read me my Miranda rights. Instead, they moved directly to physical force. Hands grabbed me by the shoulders and arms, yanking me bodily out of the vehicle driver's seat and throwing me face-first onto the scorching Mississippi asphalt.</p>
<p>The heat from the sun-baked pavement burned against my skin as a heavy knee was driven violently into the center of my spine, pinning me flat against the ground. My arms were forcibly yanked behind my back, and pair of steel handcuffs was ratcheted tightly around my wrists to the point of acute pain.</p>
<p>"For what?" I shouted into the pavement, struggling to breathe under the weight on my spine.</p>
<p>No immediate answer was given. Only after I was fully restrained, pinned to the ground, and hauled up to my feet did an officer finally utter the words: "You're under arrest."</p>
<p>Each of the four senior officers fulfilled a specific role in that tactical operation: Chief Deputy Scott Mills oversaw the physical restraint and securing of the scene; Major Alan Wilburn maintained perimeter control and physical intimidation; Lieutenant Jared Bundren provided the investigative pretext based on his social media review; and Sheriff Joey East stood by as the commanding authority, lending the full weight of his office to the ambush. The overwhelming show of force against an unarmed citizen on a public street was designed not merely to execute an arrest warrant, but to deliver a message of total institutional dominance.</p>
<p>I did not purchase the AR-15 in question until May 20, 2017 — twelve days after the date the state's own charge alleges I used the weapon to threaten someone. I bought it from a private seller, Larry D. Watkins, found through the classifieds site Armslist.</p>
<p>The bill of sale is reproduced in full in Chapter 3, and it is worth restating the operative line here where the arithmetic happens: <em>"I Larry D Watkins, am selling this AR-15 Del-ton, serial # S086662... To Matthew Reardon, for the amount of 550.00. ON the this Day May 20, 2017."</em> Signed, and dated again beneath the signature: <strong>5/20/17</strong>.</p>
<p>It is a handwritten page, plain and unremarkable on its face — the kind of receipt a private gun sale in Mississippi routinely produces, with no notary, no dealer, and no federal paperwork attached, because Mississippi requires none of those things. Most such sales produce no paper at all.</p>
<p>Two small things about that page I am going to flag rather than smooth over, because this is the document the whole book rests on and I have already been burned once by describing it from memory. First, the serial number: I read it as <strong>S086662</strong>, with a letter S, and a reader looking at the same handwriting could reasonably read that first character as a <strong>5</strong>. I do not want anyone matching it against a manufacturer's record and concluding I invented it over a character I misread. Second, I have said elsewhere that the document was signed by both of us. What is legible on the copy in front of me is <strong>one signature</strong>, the seller's, with the date beneath it. If my counter-signature is on the original, it is not visible here. Neither point changes the date, which is what matters. Both are the kind of detail that gets a witness taken apart on cross, and I would rather take myself apart first.</p>
<p>Set that against the affidavit's <em>"on or before May 8, 2017."</em> Twelve days, in two people's handwriting, pointing in opposite directions.</p>
<p>I am not going to claim more from that page than it can carry. It proves the date of that sale, of that serial number, from that seller. It cannot prove a negative — it cannot establish that no other rifle ever passed through my hands at some earlier point. Nothing in this case ever alleged one did; the state's own charge is built on the specific AR-15 I bought from Watkins, which is precisely why the date is fatal to it. But a receipt is a record of a transaction, not a certificate of everything a man has never owned, and I would rather say that myself than have it said to me.</p>
<p>What the receipt cannot do alone, the recording does. Explaining a 72-hour Facebook suspension I had received for asking, in an earlier post, whether anyone had an AR-15 for sale, I said on camera: <em>"I am down for 72 hours, simply because... I was looking for an AR-15. And I got my fully decked out AR-15 yesterday."</em> That statement was made in real time, for an audience with no reason to expect it would ever matter to a criminal charge.</p>
<p>A document I possess could, in theory, have been written at any time by a man with a reason to want it to say May 20. A livestream from May 21, sitting on a platform's servers with a timestamp I could not edit, complaining about a Facebook ban, is not a document I could have arranged. The two together close the loop that either one alone leaves open.</p>
<p>It is difficult to overstate how clean a piece of exculpatory evidence this is, and how rarely a case like this one produces something this unambiguous. This is not a swearing match between my memory and an officer's memory. It is not a question of who is more credible, or whose account of an ambiguous encounter should be believed. It is a dated commercial transaction record showing that the instrument of the alleged crime did not exist on the date the alleged crime occurred. A charge built on an impossibility does not become less of an impossibility because four officers, rather than one, showed up to make the arrest. If anything, the show of force — a chief deputy, a major, a lieutenant, and the sheriff himself, descending on me over an allegation that a piece of paper in a gun-sale record could have disproven in thirty seconds of investigative diligence — raises the more uncomfortable question returned to again and again in my story: was this ever really about a threat to Todd and Ashley Lynch, or was the boycott broadcast, and the city hall meeting three days before it, and the flag petition eight months before that, the actual reason four of Lafayette County's senior law enforcement officers decided this particular citizen needed to be taken off the street that week?</p>
<p>In criminal jurisprudence, temporal impossibility is a fatal defect in a charging document. When a sworn affidavit alleges that an accused used a specific physical instrument—an AR-15 rifle—to commit a felony offense "on or before May 8, 2017," and the accused did not acquire that instrument until twelve days later, the charge is factually impossible on its own terms. No prosecutor can bridge a twelve-day void where the instrument of the alleged crime was not yet in the defendant's hands.</p>
<p>The state never had to take my word for that. The acquisition date was checkable in May 2017 by anyone with a telephone — a call to the seller, a request for the transaction record, a question put to me at the initial appearance instead of an instruction to remain silent. What makes this a due-process failure is not that the state disbelieved my timeline. It is that no one in the chain appears to have tested it at all before swearing to a contrary one.</p>
<p>The rifle purchase itself deserves one more sentence of scrutiny before this chapter moves on, because a fair reader will have already asked it: why would I buy a rifle, from a private seller, five days after criticizing a local business owner on Facebook Live, if not in connection to some kind of conflict? The honest answer is that the record does not establish any connection between the rifle purchase and Frank &amp; Marlee's at all, and the state's own charge — built around a date twelve days before the purchase — implicitly concedes it can't establish one either. A man buying a gun in Mississippi in May 2017 is, absent some independent evidentiary link, evidence of nothing beyond a gun purchase. The state needed the rifle to exist on May 8 to make its charge work, and it didn't, and that gap is not a technicality. It's the whole case.</p>
<p>What comes next — Judge Carolyn Bell's initial appearance, the $150,000 bond, and the restraining order I signed under conditions my own attorney would later be accused of engineering — is the story of what a justice system does once it has already committed to an arrest that a bill of sale contradicts. It rarely reverses course cleanly. It usually just keeps going.</p></section><section class="chapter"><p class="cnum">Chapter 5</p><h1>$150,000, And An Order Signed Under Duress</h1><p>My initial appearance on the aggravated stalking charge was held on May 30, 2017, before Justice Court Judge Carolyn Bell in Lafayette County, Mississippi. Two things about that hearing matter enough to spend a chapter on them, and both point in the same direction: toward a judicial process that had already decided what it wanted to happen long before the physical evidence was placed on the bench.</p>
<p>The physical setting of the initial appearance carried the immediate, stark weight of pretrial detention. I was transported from the Lafayette County Detention Center in handcuffs and belly chains, escorted by sheriff's deputies, and brought into the courtroom where local law enforcement officers and court staff moved with the easy familiarity of insiders. Under Mississippi criminal procedure, an initial appearance before a justice court judge is supposed to serve as an essential constitutional safeguard. Its legal purpose under Rule 8 of the Mississippi Rules of Criminal Procedure is straightforward: to formally inform the accused of the charges, advise them of their constitutional rights, determine whether probable cause exists, and set a reasonable bail that balances the defendant's right to pretrial liberty against the necessity of ensuring their appearance at trial.</p>
<p>The first matter from that May 30 hearing is procedural, and it is the kind of fact that rarely makes it into a public account of a criminal case because it sounds, out of context, like an unremarkable administrative detail. Judge Bell met privately with sheriff's investigators in chambers before the hearing began. Ex parte contact between a judge and law enforcement investigators, ahead of a hearing where that judge is sitting as an impartial magistrate tasked with weighing the evidence those exact investigators generated, is not a neutral fact pattern. In American constitutional jurisprudence and under Canon 3B(7) of the Mississippi Code of Judicial Conduct, ex parte communications regarding pending or impending proceedings are strictly prohibited precisely because they erode the appearance and reality of judicial neutrality. When a magistrate receives ex parte briefings or arguments from law enforcement behind closed doors, the Fourteenth Amendment's guarantee of due process is compromised before the defendant ever steps into the courtroom. In a properly functioning legal system, such ex parte contact leads to a judge's immediate recusal, not congratulations for administrative efficiency.</p>
<p>During the hearing itself, according to my account, Judge Bell cut me off twice when I attempted to raise the bill of sale — the same twelve-day discrepancy detailed in the previous chapter, which stood as the single most important piece of exculpatory evidence in the entire case. The underlying affidavit filed by law enforcement alleged that I had threatened someone with an AR-15-style rifle on May 8, 2017. Yet the physical bill of sale, signed and dated by the private seller Larry Watkins, established conclusively that I did not acquire or possess that firearm until May 20, 2017 — twelve full days after the alleged offense occurred. Standing before the bench in restraints, attempting to present a physical document that made the core allegation factually impossible, I was silenced. Judge Bell refused to inspect the document, shut down my attempt to place the date discrepancy on the official record, and proceeded as if the written timeline provided by the sheriff's department was unassailable truth.</p>
<p>The outcome of that hearing was a $150,000 bond, set on a charge whose central factual allegation a written receipt already disproved.</p>
<p>To understand the practical impact of a $150,000 bond on an ordinary citizen, one must look at the statutory framework governing bail in Mississippi and the mechanics of the commercial bail industry. Under the Eighth Amendment to the United States Constitution and Section 29 of the Mississippi Constitution of 1890, excessive bail is explicitly prohibited. Bail is not intended to function as pre-trial punishment, nor is it meant to serve as a mechanism for preventive detention in non-violent misdemeanor or felony cases where the accused poses no documented flight risk or threat to public safety. Standard bail-setting factors under Mississippi law—such as local family ties, length of residence in the community, history of court appearances, and the non-violent nature of the alleged offense—all favored a modest, accessible bond. Instead, setting bail at $150,000 for a first-offense non-violent charge meant that securing pretrial release through a commercial bondsman would require a non-refundable cash premium of ten percent—$15,000 cash upfront—alongside substantial real property collateral to secure the remaining ninety percent. For a citizen whose financial resources were already strained by ongoing legal disputes, an unpayable bond operates as a de facto order of indefinite detention, transforming the jail cell into an engine of institutional pressure.</p>
<p>It is worth placing that $150,000 number next to another one that surfaces later in my recollection of my roughly six weeks in jail on this charge: that the same judge set a $10,000 bond, in an unrelated case, for a man accused of rape. That comparison is flagged here as my own claim — it is not independently sourced or docket-verified in the material available to me, and it should be read that way, not as an established fact. But it is worth including precisely because of how it is flagged, not despite it: the honest posture toward a claim like this is neither to suppress it because it cannot be verified, nor to present it as settled because it is damning. It sits in the historical record as something I say happened, worth investigating further, not yet worth citing as proof of anything beyond my own perception of the stark disparity in how pretrial liberty was priced in Lafayette County. Setting a $10,000 bond for a crime involving direct physical violence while imposing a $150,000 bond for a non-violent charge resting on a demonstrably flawed timeline underscores why the initial appearance felt less like a neutral judicial proceeding and more like an enforcement mechanism designed to keep me confined.</p>
<p>The second matter from this period is not a claim requiring a flag. It is close to the most disturbing single fact from that year, and it happened while I was in custody at the Lafayette County Detention Center.</p>
<p>While I was jailed on the Lynch aggravated stalking charge, my defense counsel at the time — Brennan Horan, who had by then taken over from an earlier attorney, William C. Stennett — advised me that signing the Tannehill family's restraining order (case 2017-CV-217, discussed in the previous chapter) without contesting it would help secure my release from jail. I signed it. By my own account, and by the structural reality of the advice itself, I signed it under duress: not because I agreed with its terms, admitted to any wrongdoing, or conceded its underlying factual allegations, but because my attorney presented it to me in a jail consultation room as the only viable path out of a concrete cell.</p>
<p>The environment of a county detention center is systematically designed to wear down a detainee's resistance. Isolated from family, stripped of personal autonomy, facing an exorbitant $150,000 bond set by a judge who refused to hear exculpatory evidence, a defendant is uniquely vulnerable to coercive pressure. When your own defense attorney enters that space and tells you that signing a civil order—which you know to be based on false representations—is the key that will unlock the jail door, the legal distinction between voluntary agreement and institutional coercion vanishes. I signed the document not as an act of free will or concession of truth, but as a desperate submission to conditions designed to make continued resistance functionally impossible.</p>
<p>This detail matters for reasons far beyond the 2017 case itself, and readers should hold onto it, because it resurfaces with enormous consequence five years later. The still-standing 2017-CV-217 restraining order — signed under the coercive conditions just described, never substantively contested or adjudicated on its factual merits — becomes the legal predicate for an enhanced second aggravated stalking charge in June 2022, when I entered a building associated with the order during a scheduled child-custody hearing. Mississippi's aggravated stalking statute, Mississippi Code § 97-3-107, contains severe sentence enhancement provisions that allow prosecutors to elevate a charge to a high-penalty felony when a defendant is alleged to have violated an existing court order or when a qualifying prior order exists within a multi-year lookback window. The civil order I signed in 2017, under defense advice that it was merely the fastest administrative procedure to get out of jail, becomes — half a decade later — one of the load-bearing legal instruments in a second criminal prosecution, one that ultimately sends me to Mississippi Department of Corrections custody for approximately a year.</p>
<p>I want to be precise here about the specific representation, because it is the difference between an attorney giving me bad strategic advice and an attorney lying to me to get a signature. In a draft motion I prepared to challenge the restraining order — under Mississippi Rule of Civil Procedure 60(b)(6), never filed — I alleged that Horan told me specifically that signing the consent order making the Tannehill restraining order permanent would result in the dismissal of the pending Lynch aggravated stalking charge (LK17-295). That never happened. The Lynch prosecution continued in full force regardless of my signature, straight through to the July 6, 2017 guilty plea covered in the previous chapter. If Horan told me that, and I believe he did, it was not simply a miscalculation about how two separate cases in two separate courts would interact. It was a specific, false, and material promise that got me to sign away a contested claim while I sat in a cell with no way to verify it. I want to flag one thing plainly rather than let it stand uncorrected: that same draft cites a supporting affidavit from a named witness, and on review I cannot locate that affidavit as an actual document anywhere in my own files, and I do not independently recall it. I am not including it here. Whatever produced that specific line in the draft, my own memory of Horan's promise is the only thing I am standing on in this book, not a corroborating witness I cannot verify existed.</p>
<p>Brennan Horan's role deserves its own scrutiny, separate from the advice itself. Horan is the brother of a sitting Mississippi state representative, Kevin Horan — a conflict of interest flagged explicitly in the bad-actors accounting of my story. Kevin Horan, a prominent figure in Mississippi state politics and legislative jurisprudence, represented a well-connected family presence within the state's legal establishment. In small-town and regional Mississippi legal practice, political connections between defense attorneys, prosecutors, and legislative figures create an environment where local institutional interests often overshadow zealous individual representation. Whether that family relationship and political alignment shaped the advice given to a client held in custody, facing an unwinnable-sounding bond and an attorney telling him the fastest way out was to sign away his objection to a restraining order he considered fraudulent, is not something the available record answers definitively. What the record does establish is the undeniable chronological and structural sequence: a citizen held in jail under an excessive bond, an attorney whose family maintained deep ties to the regional legal and political establishment, advice to sign a surrender of rights, a signature obtained under explicit institutional duress, and a document that would lie dormant like an unexploded landmine before returning to finish doing its damage five years down the road.</p>
<p>My own account adds two further details to this chapter's picture of Judge Bell, both flagged with appropriate caution since neither rests on independent documentary confirmation. First, I say I filed a formal judicial-misconduct complaint against Judge Bell with the Mississippi Commission on Judicial Performance over her handling of the May 30, 2017 hearing — specifically highlighting the ex parte communication with sheriff's investigators and the refusal to entertain exculpatory evidence — a complaint that, per my own account, was dismissed without producing any public disciplinary action or corrective inquiry. Second, and considerably more striking if accurate, I claim that the same judge, in a separate and unrelated proceeding, set a $10,000 bond for a defendant accused of rape — a tiny fraction of the $150,000 she set for me over an aggravated stalking charge already shown here to have rested on a factual impossibility. That specific comparison cannot be verified against an independent court docket record, and it is not presented as established fact; it is presented as my own claim, worth including precisely because — if true — it would be one of the starkest illustrations available anywhere in my story of Judge Bell's May 2017 conduct, and because a claim this specific and checkable is the kind of thing a diligent reader, or a future researcher with access to Mississippi's county court records, could in principle confirm or refute directly.</p>
<p>There are two more procedural threads worth laying out here, both from that same unfiled draft motion, both worth exactly the weight of an allegation I have made in a document I have not yet filed — not an adjudicated fact. First, Mississippi Rule of Civil Procedure 65(c) requires a security bond before any restraining order can issue, to protect the restrained party if the order later turns out to have been wrongful; my draft motion states that court records obtained in January 2025, and confirmed by Judge Little's law clerk, show no such bond was ever posted in connection with the Tannehill order. Second, the original petition claimed that "numerous people contacted the Oxford Police Department to report Defendant as dangerous." The only three OPD reports involving me from that same window that I have located are a harassment complaint I myself filed against a third party on May 5, a report about harassing phone calls on May 13, and — most directly relevant — a May 25, 2017 report from Sgt. Byron Baker, describing me openly carrying a firearm and concluding the opposite of what the petition claimed: that I was "not presenting himself as a threat to public safety" and was "exercising his legal right to open carry in accordance with Mississippi law." If that report exists as I have described it, a sworn law enforcement finding that I was not a threat, filed one day before the petition asserting the opposite went in front of a judge ex parte, is worth a great deal more than my own characterization of events — but it is still a document from my own unfiled motion, and I want a reader to know that is where it currently sits: assembled, argued, sourced, and not yet tested in a courtroom.</p>
<p>None of this exonerates what comes later. My own conduct in the years between 2017 and 2022 — detailed across the next several chapters — includes genuine escalations I chose, not ones forced on me by court officers or attorneys. But the duress-signed order belongs at the very root of that later chapter, not as a legal excuse for what follows, but as an honest accounting of how the entire machinery was set in motion: not with a genuine crime, but with a bill of sale nobody in authority would listen to, a judge who shut down exculpatory proof, an unpayable bond, and a signature extracted from a captive man whose only alternative was remaining indefinitely behind bars.</p></section><section class="chapter"><p class="cnum">Chapter 6</p><h1>Six Weeks, And The Form That Vanished</h1><p>I spent roughly six weeks in jail on the Lynch aggravated stalking charge, from my May 26, 2017 arrest until early July. During that stretch, and around it, three threads run in parallel, followed here one at a time before they converge.</p>
<p>The first is an FBI interview that should have happened, and by the available record did happen, but whose paper trail did not survive intact. On May 25, 2017 — the day before my arrest, in a sequence of events already thick with activity that week — an FBI interview was arranged for me through Assistant U.S. Attorney Bob Norman, whose email address (bob.norman@usdoj.gov) appears elsewhere in the record of later, unrelated confrontations. The interview's standard paperwork, an FBI Form 302 memorializing what was said, was later reported missing. It helps to understand what a 302 actually is before weighing its absence. An FBI Form 302 is the standard written summary an agent produces after an interview — not a verbatim transcript, and not an audio recording, but the agent's own account of what was said, typically written up after the fact from notes. It is treated as an official record within the Bureau's own files and can be used in later proceedings, but its evidentiary value depends entirely on the document existing and being available for review. When a 302 goes missing, what disappears with it is not the interview itself — that happened, and is not disputed — but any independent documentation of what was actually said in it. Without the form, the only surviving account of that May 25, 2017 conversation is whatever the government later chose to characterize it as, with no contemporaneous record against which that characterization can be checked. A missing 302 is not, on its own, proof of anything sinister; federal recordkeeping fails for mundane reasons far more often than it fails for conspiratorial ones. But a missing 302 from an interview conducted the day before a twelve-day-impossible stalking arrest, in a case already shown to be built on evidence that didn't hold together, earns its place in the record as an open question rather than a settled one. Why the form is missing is not known. It is simply, plainly, gone.</p>
<p>The second thread is the judicial-misconduct complaint I filed against Judge Carolyn Bell — the same judge who set my $150,000 bond and, by my account, cut me off twice when I tried to raise the bill of sale at my initial appearance. That complaint was dismissed. Complaints against sitting judges by defendants in the judges' own courtrooms are dismissed at very high rates across the American legal system generally, for reasons that range from legitimate (most such complaints genuinely lack merit) to structural (judges are, functionally, reviewed by other judges, and the incentives to protect a colleague are real even when unspoken). Which of those explanations applies to Bell's case specifically cannot be said from here. The filing and the dismissal are simply noted, because the more consequential episode from this jail stretch is the one described in the previous chapter: not a complaint that went nowhere, but a signature obtained under conditions already named for what they were.</p>
<p>The third thread is a psychiatric evaluation, conducted after my release, on September 11, 2017, by Dr. Joe Edward Morris. Its finding is directly relevant to how a reader should weigh everything I did and said during this period, including the decisions — signing the Tannehill order, the eventual conduct that shapes the years to come — that might otherwise be read purely as character evidence. Dr. Morris's evaluation found no significant cognitive or psychiatric deficits. It did, notably, cite coercion as a driver of decision-making during that period of my life — a clinical finding that lines up, without straining, with the duress-signature episode from the previous chapter. A man under coercive institutional pressure making decisions shaped by that pressure is not evidence of an unstable mind. It is closer to the ordinary, well-documented human response to being trapped.</p>
<p>It is worth being explicit about what this chapter is not arguing. It is not arguing that my later conduct — the confrontations, the escalations, the choices detailed in Parts II through V — should be excused because of what happened to me in the six weeks covered here. Trauma and institutional pressure explain behavior; they do not retroactively make every subsequent choice someone else's fault. What this chapter does argue, and what the Morris evaluation supports on its own clinical terms, is that the version of me that emerged from this jail stretch was not the same man who filed the flag petition eight months earlier. Something changed, under real and documented pressure, in the spring and summer of 2017. The chapters that follow are, in large part, the story of what I did next — and of a set of institutions that would spend the next several years treating every subsequent escalation as proof I had always been the problem, rather than asking what role they had played in making me one.</p>
<p>Andy Arant — my attorney since 2016, first retained in the custody fight against Crowder and later against the Tannehills directly — is not part of this specific 2017 detention period and should not be confused with Brennan Horan, whose role in the duress-signature episode is documented in the previous chapter. The distinction matters because precision about who did what, and when, is the whole discipline of this narrative, and conflating a longtime trusted attorney with a conflicted 2017 attorney would be exactly the kind of sloppiness worth guarding against from the prologue forward.</p>
<p>The six weeks themselves deserve a word beyond the bare fact of their length. Fighting a criminal case from inside a county jail is a fundamentally different undertaking than fighting one from the outside. Access to an attorney is scheduled around the jail's own logistics, not the defendant's. Reviewing discovery, drafting anything, or simply keeping track of deadlines all depend on whatever access to phones, mail, and visitation the facility allows on a given day. None of that is unique to my case — it is the ordinary condition of pretrial detention in America, documented at length elsewhere by people with far more expertise in criminal-justice reporting than I have. What I can say from direct experience is that those six weeks were the period in which the duress-signed Tannehill order, detailed in the previous chapter, was extracted — and that the conditions under which a defendant is asked to make consequential legal decisions from inside a cell, on a lawyer's timeline rather than his own, are conditions that make coerced decision-making considerably easier to produce than clean, freely-considered decision-making.</p>
<p>By early July 2017 — [manuscript note: verify exact release date against docket, currently unconfirmed in available sources] — I was out of jail, carrying a signed restraining order I had contested nothing about, an FBI interview with no surviving form, a dismissed complaint against the judge who set my bond, and a clinical finding that coercion, not instability, had shaped my choices that spring. Chapter 7 picks up the next front in my life: the false accusation that would come to define my relationship with the mother of my first daughter for the better part of a decade.</p></section><section class="chapter"><p class="cnum">Chapter 7</p><h1>A False Accusation Weaponized</h1><p>Phyllis Marie Crowder is the mother of my oldest daughter, Lydia, born August 19, 2014 — eleven weeks early, at 25 weeks gestational age, weighing one pound nine ounces. I am not going to narrate the weeks that followed in a NICU in any real detail; anyone who has lived through a micro-preemie's first months already knows what those weeks look like, and anyone who hasn't doesn't need me to manufacture the drama of it for them. I will say only that a child who starts life at one pound nine ounces changes, permanently, what custody of that child means to the people fighting over her — on both sides. Whatever else is true about how this chapter treats Crowder, and it does not treat her gently, nothing about our conflict was ever really about a child either of us took lightly.</p>
<p>Crowder and I split up in 2016. That split is where two other names enter this story for the first time, well before the flag, well before Oxford's spring of 2017. Not long after we separated, Crowder retained attorney J. Rhea Tannehill Jr. to represent her in the custody matter that followed — the same Rhea Tannehill whose wife, Robyn Tannehill, would go on to become mayor of Oxford in 2017, and whose own name recurs later in this book across a restraining order, a courthouse hallway confrontation, and years of litigation. At almost exactly the same time, I retained Andy Arant — the same Andy Arant to whom this book is dedicated — to represent me, first against Crowder in that custody fight, and later against the Tannehills directly. I did not know, in 2016, that the attorney my ex-partner had just hired for an ordinary custody dispute would still be a name in my life a decade later, tangled up in a flag protest, a restraining order, and a mayoral administration. I am not asserting that Rhea Tannehill's role as Crowder's custody attorney in 2016 explains anything about what his wife's administration later did to me — I don't have evidence connecting those two things, and I am not going to manufacture one. I am stating the fact plainly because it is true, because it is the first time his name enters this story, and because a reader deserves to have it on the record before deciding for themselves, later, how much weight it carries.</p>
<p>The paper record bears this out precisely. The parties' Joint Complaint to Establish Paternity, Child Custody, and Child Support was filed August 3, 2016, with Crowder represented by "the Honorable J. Rhea Tannehill" and me by "the Honorable Andy T. Arant" — that pairing is stated as fact in a later chancery order, not my own recollection. By May 1, 2017, when Crowder's next petition landed, her attorney of record had changed to Mona T. Pittman — and when I personally served my response and counterclaim on Pittman on May 8, 2017, I learned in the process that her office sat in the basement level of Rhea Tannehill's own office building. I am not asserting a conspiracy from that fact alone; a small-town legal market can produce a landlord-tenant relationship between two attorneys for entirely mundane reasons. I include it because it is verifiable, because it is exactly the kind of fact a reader deserves before deciding how much weight the recurring Tannehill-Pittman-Crowder pattern in this book actually carries.</p>
<p>By the fall of 2018, Crowder and I had already been locked for years in the particular, grinding kind of conflict that custody disputes between parents who cannot stand each other tend to produce — a conflict that was not one-sided, and pretending otherwise would undercut the credibility of everything else in this chapter.</p>
<p>In domestic litigation, especially in small Mississippi counties where legal proceedings drag across seasons without clear resolution, interpersonal friction rarely remains contained within courtrooms. For years, every custody exchange, every text message regarding pickup schedules, and every disagreement over medical care or discipline carried an underlying tension that threatened to spill over into formal legal action. I was not a passive or blameless bystander in this dynamic; my own stubbornness, anger, and insistence on standing my ground contributed directly to the escalating hostility between us. The constant low-grade dread of what allegation or legal motion might land next created an atmosphere of hyper-vigilance, where every interaction had to be documented, saved, and analyzed for potential vulnerability.</p>
<p>On November 25, 2018, Crowder and I had a sexual encounter. This is not, on its face, remarkable — two adults who share a child and have a complicated history are not strangers to each other, and an encounter between them, consensual or not, would ordinarily be a private matter. It becomes relevant here for one specific, documentable reason: text messages between Crowder and me from around this period — the single strongest piece of evidence in this chapter, because they exist independent of either party's later characterization of events — confirm the encounter was consensual on both sides, in both directions, contemporaneously.</p>
<p>For a lay reader trying to understand how criminal allegations intersect with personal disputes, the nature of contemporaneous text evidence is critical. Human memory is malleable, easily distorted by hindsight, anger, or tactical interest. When two people engage in a complex personal relationship, retrospective accounts offered months later under the pressure of litigation often reflect how the parties wish to frame the event rather than what actually occurred. Timestamped electronic messages, however, capture the raw reality of the moment. They show tone, mutual participation, immediate post-encounter sentiment, and continuous consent before and after the event. In this instance, the text log did not merely suggest consent; it established it beyond reasonable dispute, recording a friendly, familiar, and explicitly mutual exchange that contradicted any assertion of non-consensual conduct.</p>
<p>Crowder later reported it as non-consensual.</p>
<p>The shock of learning that a consensual encounter — documented in real time by written exchanges on my phone — had been transformed into a police complaint of sexual assault was profound. In the American legal system, a report of rape triggers an immediate, heavyweight law enforcement apparatus. For an accused individual, the mere initiation of a felony sexual assault investigation carries catastrophic personal, professional, and social consequences, regardless of ultimate guilt or innocence. I was suddenly facing the prospect of felony charges, potential indictment, public ruin, and decades in prison, all predicated on an event I knew to be entirely consensual and which my phone records clearly proved to be so.</p>
<p>The Olive Branch Police Department investigated. Detective Holladay — one of the few people in this whole story who belongs firmly on the right side of the ledger, precisely because of what happens next — conducted that investigation and concluded, based on the evidence available to him, that the report was false. In January 2019, the Olive Branch Police Department charged Crowder with misdemeanor false reporting.</p>
<p>Detective Holladay's approach to the case stood in sharp contrast to standard institutional inertia. Rather than accepting the initial report at face value or conducting a superficial inquiry designed simply to forward a felony file to the District Attorney's office, Holladay examined the actual physical and digital evidence. He reviewed the complete, unedited text thread between Crowder and me from November 25, 2018, and the days immediately following. He analyzed the timestamps, the context, and the explicit expressions of consent exchanged between both parties. Recognizing that the contemporaneous record directly disproved the complaint, Holladay took the unusual step of determining that the report itself constituted a criminal act. In January 2019, the department officially charged Crowder under Mississippi law with misdemeanor false reporting of a crime.</p>
<p>It is worth pausing on how rare this outcome is, in the broader landscape of American law enforcement's handling of sexual assault reports. The overwhelming, well-documented pattern nationally is one of under-investigation, not over-investigation — police departments that decline to pursue charges even where the evidence supporting a report is strong, out of a mix of resource constraints, cultural skepticism, and the genuine evidentiary difficulty inherent in prosecuting cases that often come down to one person's word against another's. Detective Holladay's willingness to look at contemporaneous text evidence, conclude a report was false, and refer for a false-reporting charge is not the ordinary institutional response. It is the exception, and it deserves credit as one: the alternative — an investigation that simply took Crowder's report at face value regardless of what the texts showed — is the far more common failure mode, and would have cost me a felony rape prosecution built on evidence that didn't hold up any better than the aggravated stalking charge detailed two chapters earlier.</p>
<p>The legal mechanisms governing false reporting reflect a delicate policy balance. Law enforcement agencies are understandably cautious about prosecuting individuals who make allegations, fearing that aggressive enforcement against false reports might deter genuine victims of sexual violence from coming forward. Because of this structural hesitation, police detectives rarely recommend criminal charges against a reporting witness unless the documentary proof of fabrication is overwhelming. Detective Holladay's decision to cross that threshold demonstrated an adherence to objective fact-finding that is far too rare in municipal police work. He evaluated the digital evidence without fear or favor, recognizing that a false rape allegation is not merely a private disagreement but a grave abuse of the criminal justice system that destroys innocent lives.</p>
<p>In January 2020, a recorded phone call revealed another troubling layer to this history: an unserved arrest warrant existed for Phyllis 'Liz' Crowder arising from a prior false rape charge. Furthermore, I claim that a recording exists in which Crowder explicitly admits that she fabricated that prior accusation, with her husband Dustin Kester's involvement referenced (her married name is Crowder-Kester, sometimes styled Crowder (Kester) in court filings). I present this here strictly as my own claim and recollection, and I must explicitly flag the evidentiary uncertainty surrounding it. While the recorded call of January 2020 and my recollection of Crowder's recorded admission regarding Dustin Kester reflect my sincere belief and recollection of events, they represent my personal assertions rather than facts established by an independent judicial finding or verified court document. I include this recollection because it shaped my understanding of the pattern I was facing, but its limits as an unverified personal claim must be acknowledged clearly.</p>
<p>The sense of vulnerability deepened as the dispute expanded beyond municipal police records into wider political and social networks. On a recorded call dated June 23, 2020, I claimed that Crowder was "friends with the mayor" — referring to Oxford Mayor Robyn Tannehill — and was actively leveraging or acting on that connection to pressure me and my family, including publishing my family's physical location. I must explicitly state that this was my own theory and subjective perception at the time. I flag it here explicitly as my own unverified theory: my belief that Crowder was using a personal relationship with Mayor Robyn Tannehill to target my family and publish our location represents my own internal interpretation of events during an intensely stressful period, rather than an established fact supported by official findings or external confirmation.</p>
<p>There is a contemporaneous record of what Madelyn and I ourselves believed was driving this pattern, captured not in hindsight but in a July 7, 2020 recording made during a Child Protective Services home visit — a visit prompted by yet another anonymous hotline report. On that recording, the two of us describe Crowder to the visiting caseworker as someone we believed had "multiple personality disorder," and state plainly that the accusations had recurred "three years in a row, each within a three-month window" — a pattern we told the caseworker, in real time, we had noticed lined up with pregnancies and miscarriages during that period. That characterization is recorded here exactly as Madelyn and I gave it, with two caveats attached plainly: it is our own lay diagnosis of Crowder's mental state, offered under the obvious pressure of defending ourselves against a recurring accusation, and it is not a clinical finding anyone has independently confirmed. What makes it worth including rather than discarding as simply self-serving is its contemporaneous nature — not a claim invented years later for a book manuscript, but a specific, dated, internally consistent pattern description given to a state investigator in the middle of the events it describes, a meaningfully different kind of evidence than a retrospective narrative built after the fact.</p>
<p>Sitting in our living room with a state caseworker during that July 7, 2020 CPS visit was an exhausting, demoralizing experience for Madelyn and me. Anonymous hotline reports force parents to open their private lives, their home, and their parenting to state scrutiny under the threat of losing custody of their children. Explaining to an investigator that these repeated hotline calls were not isolated incidents, but part of a predictable cyclic pattern linked to specific windows surrounding pregnancies and miscarriages, was our effort to provide context to an agency that saw only isolated snapshots. Even though our description of "multiple personality disorder" was an unconfirmed lay opinion formed under severe strain, recording that conversation provided a contemporaneous anchor proving that we were raising these exact concerns in real time to state authorities.</p>
<p>This is also the point in the story where the discipline of holding two things at once matters most. It would be easy — and it would flatter the broader narrative of institutional persecution built so far — to treat the Crowder false-reporting charge as simply more evidence that I am a target of a system determined to victimize me. That reading would be incomplete. What the record actually supports is narrower and, in its way, more useful: in this specific instance, an investigator did his job, followed the evidence rather than a presumption, and the system produced roughly the correct outcome — a rare enough occurrence in false-reporting cases generally that it deserves to be named as an institutional success story, inside an account that spends most of its pages documenting institutional failure.</p>
<p>It does not end there. What follows is the story of what happened after the charge was filed: a conviction obtained nearly two years later, in September 2020, in a different court than the one that filed the original charge; an appeal filed late; a judge who refused to enforce a sentence; and — running underneath all of it, in parallel, for years — a pattern of recurring accusations against me that Crowder brought to Child Protective Services three years running, each timed, by Madelyn's and my own contemporaneous account during that 2020 CPS home visit, to a roughly three-month window around a pregnancy or miscarriage.</p>
<p>I put dates and specifics to that "three years running" pattern in a sworn, notarized petition I filed with the Mississippi Supreme Court on October 11, 2021, so I will use those same three dates here rather than the vaguer version I have sometimes told. Around September 2017, Crowder told authorities I had sexually abused Lydia, then two years old; the Department of Child Protective Services investigated and found the claim unfounded. In November 2018 came the false rape report addressed above. In January 2020, while Madelyn and I were at LeBonheur Children's Hospital in Memphis with our newborn daughter McKenna, who was being treated for a rare illness, Crowder told CPS that Madelyn had struck the child — investigated, and again found unfounded. That third false report is also the origin of the thirteen-month DHS lie addressed in Chapter 11: Crowder's claim, made to both the Sheriff's Department and the Chancery Court, that DHS had instructed her to withhold Lydia from me entirely, a claim DHS's own records eventually disproved. I am also on record, in that same sworn petition, relaying something Crowder told me: that her husband Dustin Kester "playing a part" in the false rape report was, in her words, "a failed attempt by Rhea Tannehill." I want to be precise about what that is and is not: it is my own sworn account of something Crowder said to me, not an independent finding against Tannehill, and I have never produced a recording or document that corroborates his involvement specifically. I include it because I said it under oath and because a reader deserves the full claim, not a sanitized version — but it stays exactly what it is, an unverified secondhand claim, not an established fact.</p>
<p>That pattern, and the false-reporting conviction's own convoluted path through Olive Branch Municipal Court, DeSoto County Circuit Court, and a notary-fraud theory that will be presented carefully and with its evidentiary limits clearly marked, is the subject of the next several chapters. What belongs here, at the start of Part II, is the plain, documented fact that anchors everything that follows: a false report was made, an investigator found it false using contemporaneous evidence rather than assumption, and a charge was filed. Whatever comes next in the tangled two years between that January 2019 charge and its eventual September 2020 conviction, it starts from a point where the system, for once, worked roughly as it was supposed to.</p></section><section class="chapter"><p class="cnum">Chapter 8</p><h1>Conviction And Contempt</h1><p>Nearly two years passed between the January 2019 false-reporting charge against Phyllis Crowder and her eventual conviction. On September 22, 2020, Crowder was convicted in Olive Branch Municipal Court, entering a plea of nolo contendere — no contest, an admission that carries the legal consequences of a guilty plea without requiring the defendant to formally admit the underlying facts. The sentence, according to a hard detail confirmed through a recorded 2020 call to a county court clerk rather than through my account alone, was thirty days in jail and a $129.25 fine, with the sentence stayed pending an appeal deadline the clerk referenced only as "the 27th."</p>
<p>Living through those twenty months between the initial charge in January 2019 and the conviction in September 2020 was a trial of patience and emotional endurance. In misdemeanor criminal cases, two years is an extraordinarily long time for a simple charge to work its way through a municipal court docket. During that extended interim, I was left waiting in legal uncertainty, watching calendar pages turn while knowing that the charge remained unresolved on the court calendar. Every delay added to the background anxiety, as the threat of renewed allegations or procedural maneuvering hovered constantly over my daily life and my family.</p>
<p>For a lay reader unfamiliar with Mississippi jurisprudence, understanding municipal court procedures provides essential context for what unfolded on September 22, 2020. In Mississippi, municipal courts operate as courts of limited jurisdiction handling misdemeanor offenses and city ordinance violations. They are non-record courts, meaning proceedings are typically informal and not transcribed by official court reporters. When Crowder entered her plea of nolo contendere — no contest — she chose a legal posture that allowed her to accept the conviction and penalty without entering a formal admission of factual guilt on the court record. While a nolo contendere plea results in an immediate criminal conviction and sentence, it shields the pleading party from having their plea used as a direct factual admission in subsequent civil proceedings. The sentence imposed by the court was explicit: thirty days in jail and a $129.25 fine. However, as is common when a defendant indicates an intent to appeal, the municipal judge stayed execution of the sentence pending an appeal deadline that the county clerk later identified as "the 27th."</p>
<p>What happened next is where this chapter's title earns its second half. Crowder's appeal was filed late. When the matter came before DeSoto County Circuit Court, the county court denied it and remanded the case back to Olive Branch. The Olive Branch judge, for reasons the available record does not fully explain, then refused to enforce the sentence he himself had imposed.</p>
<p>The "filed late" characterization understates how irregular this appeal actually appears in the record. On October 30, 2020, in a recorded call to the DeSoto County Circuit Clerk's office, a clerk identified in the available record as Allison told me flatly: "there hasn't been anything filed in this office by that name." That statement — a circuit clerk's own office, on the record, stating that no appeal existed under Crowder's name — sits in direct tension with Olive Branch Municipal Court's own position that a last-minute appeal had been submitted before Crowder's surrender deadline. That tension cannot be resolved from the available record; it may reflect a filing that existed but hadn't yet been logged into the circuit clerk's system, a filing made in a different name or through a different mechanism than a standard circuit appeal, or something else entirely. What can be said is that the appeal process which ultimately allowed Crowder's thirty-day sentence to evaporate did not, on this specific piece of evidence, appear to follow the clean, verifiable paper trail that the words "filed an appeal" ordinarily imply.</p>
<p>To appreciate the depth of this procedural anomaly, it is helpful to examine standard appellate procedure in Mississippi misdemeanor cases. Under Mississippi law, appealing a misdemeanor conviction from a municipal court to a higher court requires strict compliance with statutory deadlines, typically governed by Rule 29 of the Mississippi Rules of Criminal Procedure. An appeal from a municipal court transfers the case to the County or Circuit Court for a trial de novo — a completely new trial as if no prior trial had occurred. However, filing a notice of appeal after the statutory deadline deprives the appellate court of jurisdiction. Ordinarily, when an appellate court determines that an appeal notice was filed late, the standard judicial action is a straightforward dismissal of the appeal for lack of jurisdiction. Such a dismissal immediately reinstates the finality of the lower court's judgment, returning the case to the municipal court solely for execution of the original sentence.</p>
<p>This is worth sitting with for a moment, because it is a genuinely unusual sequence, procedurally. A defendant convicted and sentenced; an appeal filed outside the window that would ordinarily preserve it; a reviewing court remanding rather than simply denying the late appeal outright, which sent the case back down rather than closing it; and then the sentencing court itself declining to carry out its own sentence once the case landed back in its hands. Late appeals in misdemeanor cases are ordinarily dismissed cleanly, not remanded into a kind of procedural limbo that leaves a validly imposed sentence sitting unenforced. Whether that irregularity reflects genuine judicial discretion exercised in Crowder's favor, administrative confusion, or something else cannot be said with certainty from the available record. What can be said is that a documented false-reporting conviction, obtained through the diligence of a police detective who took contemporaneous text evidence seriously, ultimately produced no consequence for Crowder at all.</p>
<p>For a citizen who had endured years of conflict and survived a false sexual assault allegation, watching a validly imposed thirty-day jail sentence and $129.25 fine evaporate into procedural ambiguity was profoundly demoralizing. The legal system had functioned correctly when Detective Holladay investigated the facts and when the municipal court entered a conviction. Yet at the final hurdle — the actual enforcement of punishment — the machinery stalled. The complete absence of enforcement conveyed a devastating message: that even when a false report is formally investigated, charged, and convicted, the perpetrator faces no actual penalty, while the victim is left to carry the ongoing burden of the ordeal.</p>
<p>I did not accept that outcome quietly, and what I did next is the second half of this chapter's title, and the point where the layered thesis running through everything I'm telling here becomes unavoidable. I was myself arrested for contempt in connection with my efforts to force enforcement of Crowder's sentence — specifically, in a records request where I referenced, in writing, that Crowder "falsely accused me of rape." A $500 bond followed. I subsequently filed a pro se lawsuit against the City of Olive Branch seeking $10 million in damages.</p>
<p>The psychological shift that occurred during this period was crucial. Refusing to accept that Crowder's sentence would vanish without explanation, I began submitting persistent public records requests and formal inquiries to court officials and municipal authorities. In my mind, stating in a written records request that Crowder "falsely accused me of rape" was not an act of defiance, but an assertion of documented, established fact — a truth verified by Detective Holladay's investigation and confirmed by Crowder's nolo contendere conviction. To be met not with cooperation or enforcement, but with an arrest for contempt of court and a $500 bond, was a surreal and destabilizing experience. Suddenly, I was the party in handcuffs, processed through the criminal justice apparatus over words written in pursuit of public records, while the individual convicted of filing a false felony report walked free without serving a day of her thirty-day sentence.</p>
<p>In response to what I perceived as systemic resistance and retaliation, I turned to the courts as a pro se litigant, filing a massive lawsuit against the City of Olive Branch seeking $10 million in damages. Navigating the legal system without legal representation is an arduous, overwhelming process. Drafted without benefit of counsel, pro se filings often blend formal legal claims with raw personal narrative and deep frustration. Seeking eight figures in damages was an expression of total alienation from the ordinary legal process — an attempt to force a municipal government to acknowledge the systemic breakdown by raising the stakes to an absolute extreme.</p>
<p>There is no way to write around what that sequence looks like from the outside, and no attempt is made to here. By this point in the timeline, having already spent three years absorbing one institutional setback after another, I was now the subject of a contempt arrest arising from my own pursuit of accountability for a conviction the system itself declined to enforce. Whether the contempt charge was itself justified — whether my conduct in pursuing enforcement crossed a genuine legal line, or whether it represents one more instance of a system responding disproportionately to a citizen who will not let a matter drop — is not a question the record available can resolve definitively. What can be said plainly is that a $10 million pro se lawsuit against a municipality, filed by a man representing himself without counsel, is not evidence of institutional persecution. It is evidence of how my relationship with the ordinary mechanisms of legal recourse had, by 2020, become adversarial in both directions — sometimes because those mechanisms failed me, and sometimes because I escalated past the point that a more patient litigant might have stopped.</p>
<p>Both of those things sit in this chapter at once. A detective did his job in 2019. A court failed to enforce its own sentence in 2020. And as the person at the center of both of those facts, I responded to the second one with a lawsuit seeking eight figures in damages over a matter that, whatever its underlying merit, was never going to be worth anywhere near that sum in any court in Mississippi. The next chapter follows me into the record-keeping fight that grew out of this same period — the 2020 post-conviction relief motion, the judge swap from Kent Smith to Kelly Luther that I would spend years trying to explain, and the notary-fraud theory presented with its evidentiary limits clearly marked, because that theory, more than almost anything else I claim here, sits at the edge of what the available record can actually support.</p></section><section class="chapter"><p class="cnum">Chapter 9</p><h1>The Battle For Evidence</h1><p>On July 7, 2020, I filed a post-conviction relief motion — docketed as L20-316 in the Circuit Court of Lafayette County — targeting my original 2017 Lynch aggravated stalking conviction, the criminal case built on the twelve-day impossibility detailed in Chapter 4. Under Mississippi’s Uniform Post-Conviction Collateral Relief Act, codified at Mississippi Code Annotated Section 99-39-1, a petitioner seeking to set aside an unlawful conviction faces a steep statutory climb. The law requires a petitioner to present sworn affidavits, documentary proof, and clear legal grounds showing that the underlying judgment suffered from a constitutional defect or newly discovered evidence that could not have been produced at trial. In my filing, I laid out the core factual contradiction that had haunted my defense from the beginning: the mathematical impossibility of the prosecution's timeline. Yet, on July 30, 2020, Circuit Court Judge John Kelly Luther denied the motion in a summary order without granting an evidentiary hearing. A subsequent Rule 59 motion for rehearing, which pressed the court to re-examine the factual omissions in the record, was denied on October 13, 2020.</p>
<p>The bare procedural facts of a denied post-conviction relief motion would not, on their own, merit extensive analysis here. Post-conviction motions are denied far more often than they are granted, in Mississippi and across every judicial district in the nation, and a summary denial without an evidentiary hearing is not automatically proof of administrative bias or official wrongdoing. It often reflects nothing more than a judge concluding, on the face of the moving papers alone, that the petitioner failed to overcome the formidable statutory hurdles required to open the courtroom doors for oral argument. What earns this episode its own place in the record is what I discovered during those summer months of 2020, and the procedural skirmishes that followed.</p>
<p>On August 12, 2020, I filed a formal motion to recuse Judge Luther. According to my recollection — framed explicitly as my personal observation, since the available court docket does not include independent administrative orders establishing precisely when or how judicial assignments were processed within the Third Circuit Court District — my case had originally been assigned to Circuit Court Judge Kent Smith. Without formal notice, written order, or recorded justification on the docket, the matter was transferred from Judge Smith to Judge Luther. I maintain that this was not an isolated or routine administrative adjustment. Rather, it was an unexplained judicial swap I observed happen twice in legal proceedings directly affecting my cases, with Judge Smith yielding to Judge Luther on both occasions without a single word of explanation entered into the public record.</p>
<p>This is a serious assertion, and it must be weighed with care. In Mississippi circuit courts, judicial reassignment is a routine administrative function. Cases are shifted between sitting judges for completely mundane reasons every day — docket rebalancing, scheduling conflicts, judicial recusals, or rotational duties across multi-county circuits. A transfer from Judge Smith to Judge Luther, even when observed a second time, does not in itself constitute evidence of improper influence or judicial manipulation. The Third Circuit Court District spans seven counties — Benton, Calhoun, Chickasaw, Lafayette, Marshall, Tippah, and Union — and managing docket loads across such a vast geographic footprint requires constant administrative flexibility. A two-judge rotation could easily represent nothing more than standard operating procedure in a rural circuit district.</p>
<p>There is one detail I can now put a date and a public source on, which I could not before.</p>
<p>Mississippi counties publish their dockets through a system called Delta Computer Systems. Anyone can look at it. I recorded myself going through my own case on it, and here is what I described seeing: on <strong>August 12, 2020</strong>, the judge listed of record was still <strong>Kent Smith</strong>. That is the same day I filed the motion to recuse Judge Luther. And when the clerk's office entered that motion — the 8/12 motion for recusal, with its exhibits — the assigned-judge field in the system <strong>changed to John Kelly Luther</strong>.</p>
<p>If that is right, then the docketing of my motion to remove a judge is the same event that put the case in front of him.</p>
<p>I am labeling that carefully, because it is my reading of a screen and I have not pulled the certified docket history to prove it. But it is not the kind of claim that has to stay unresolved. Delta's records are public and the assertion is date-specific: pull the assigned-judge field for that cause before and after August 12, 2020, and either it changed that day or it did not. <strong>I would rather someone check it than take my word for it</strong>, which is more than I could say about most of what happens in this chapter.</p>
<p>What transformed my suspicion from a passing concern into a formal recusal motion was the surrounding context. By August 2020, I had endured years of procedural anomalies, withheld records, and unaddressed factual contradictions. When a docket assignment shifted silently for the second time, I did not view it as routine court administration. Instead, in light of my prior experiences with local judicial authorities, I perceived it as another link in a chain of procedural irregularities. The recusal motion was ultimately unsuccessful; Judge Luther's July 30 denial remained in effect, and the October 13 order denying my motion for rehearing brought that specific post-conviction proceeding to a close.</p>
<p>Yet, alongside the formal judicial orders, an unexplained anomaly emerged in the public administrative record during the precise window when this judicial conflict was unfolding [CLAIM]. In early August 2020 — in the brief interval between Judge Luther's summary denial on July 30 and my filing of the recusal motion on August 12 — the electronic docket record for case L20-316 was abruptly pulled from public online access through the Mississippi Electronic Courts portal for approximately one week. During those days, an ordinary user searching the online public access portal could no longer view the substantive docket entries, procedural orders, or filed motions associated with L20-316. Strikingly, however, my accompanying affidavit of poverty remained fully visible on the public site.</p>
<p>This temporary disappearance of the electronic case index is presented here as my own unverified assertion [CLAIM], as I do not possess internal logs from the administrative office of the courts to document the technical status of the web server during that specific week. Technical glitches, server maintenance, and database re-indexing occur regularly in public electronic court filing systems, and the temporary invisibility of a single case record can easily result from a routine software update or a temporary database sync failure. However, from my perspective at the time, the selective nature of the missing data — where the substantive legal filings detailing the challenge to my conviction disappeared while the document establishing my indigent financial status remained publicly exposed — felt deeply unsettling. It reinforced my growing conviction that the administrative infrastructure handling my cases was operating under rules that were neither transparent nor predictable.</p>
<p>The battle over post-conviction evidence was not confined to the electronic docket or the circuit judge's bench. On August 10, 2020, a phone call revealed another critical piece of information regarding the suppression of investigative records. That call established that attorney David O'Donnell was directly tied to the Lafayette County Sheriff's Department withholding crucial information concerning an earlier communication dated May 24, 2017. </p>
