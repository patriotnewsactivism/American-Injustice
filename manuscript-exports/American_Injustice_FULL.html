<p>Understand what that recording is. That is not officers discovering a prior conviction and applying the law to it. That is officers who have already decided what they want the charge to be, working backward, trying to locate a fact that would justify it. The felony was the objective. The predicate was the thing they went looking for afterward — and could not find.</p>
<p>Two minutes later, at <strong>3:46</strong>, Galveston calls Lafayette County directly to go get it. The dispatcher explains the problem to Sergeant James and asks him to produce the court and the cause number. To his credit, and I will say so plainly even though it costs me the cleaner version of this story, James does not hand it over. He tells them: <em>"That is not something I have access to right now on my shift... I can make a note and I will have them contact you or I try to get them to respond at about seven or eight o'clock in the morning."</em> The Galveston dispatcher then states the purpose out loud, and this is the sentence that tells you what the night was actually about: <em>"just to kind of like figure out a time frame so that we can <strong>call the DA</strong>."</em></p>
<p>I am including James's refusal because it is on the tape. On that call he is an obstacle to the felony theory, not its engine. A book that quoted the first recording and buried the second would be doing to him exactly what I have spent nine years accusing the State of Mississippi of doing to me.</p>
<p>And then, at <strong>four minutes past four in the morning</strong>, there is a third call.</p>
<p>&gt; <em>"Hi, this is Deputy Beavers of the [Lafa]yette County Sheriff's Department in Mississippi."</em></p>
<p>She tells the Galveston dispatcher that her sergeant has been speaking with the officers "that were dealing with the subject from this county," that she has just been on the phone with the sergeant herself, and asks whether there is any way to get back in touch. The dispatcher checks: <em>"Was it Sergeant [Doraty], by chance?... Because I know I transferred him to <strong>Officer Osteen</strong>."</em> Beavers: <em>"Yeah, that's it... Can I speak with him?"</em> The dispatcher puts the call through, and asks Osteen whether he had just been talking to <em>"a female... from Mississippi."</em></p>
<p>Osteen: <em>"Yes, I was."</em></p>
<p>Nine months had passed since Kandi Beavers testified against me. One week had passed since I called her department to complain about that testimony and was told to come in person. And at 4:04 in the morning, in a different state, she was on the telephone asking for the officer who had just arrested me, by name.</p>
<p>I want to hold the line on what that does and does not establish, because I have just spent an entire book demanding that the state hold that line about me.</p>
<p>It establishes that a Lafayette County deputy — this specific deputy — affirmatively inserted herself into an out-of-state arrest at four in the morning and asked to speak to the arresting officer. That is not a theory. That is her voice, identifying herself by name and department, on a recorded line.</p>
<p>It does not establish what she said to Osteen. That conversation is not on these tapes. I do not know what was said and I am not going to write it as though I do.</p>
<p>But the sentence I used to have to write — <em>there is no direct evidence of communication between the Lafayette County Sheriff's Department and the police who arrested me</em> — is gone. There were at least three calls that night, from two Lafayette County officers, spanning eighty-three minutes, into an agency that was actively trying to turn a misdemeanor into a felony and could not find the conviction to do it with. Whether anything Beavers said caused what came next is still not something I can prove. That she reached for the telephone at all, at that hour, about me, is now simply a fact.</p>
<p>What happened on the ground in Galveston that night is serious enough to stand entirely on its own, without reference to any of it.</p>
<p>One correction I owe the record, because I have told this wrong for two years. <strong>Officer William Osteen did not stop me.</strong> The traffic stop was made by <strong>Officer L. Murph</strong>, at 1:52 in the morning, for allegedly running 47 in a 35 on Avenue J. Osteen was called to the scene afterward. The officer who wrote the affidavit describing my driving is not the officer who saw me drive.</p>
<p>Hold that against the clock in this chapter. Stopped at <strong>1:52</strong>. Sergeant Hoby James of the Lafayette County Sheriff's Office on the phone to Galveston Police at <strong>2:41</strong> — forty-nine minutes later. The warrant for my blood signed by a magistrate at <strong>2:49</strong>. Mississippi was calling Texas about me eight minutes before a judge authorized a needle.</p>
<p>Osteen then authored the sworn affidavit that produced that warrant. In it he swore he detected a <em>"moderate odor of alcohol"</em> — and marked it on the line for odor <strong>on my breath</strong>. On the strength of that single sworn assertion, I was booked into custody, charged with felony Driving While Intoxicated. Osteen's own report records the recommended bond as <strong>$10,000</strong>, and that is what was set. I made it about five days, bonded out — and was rearrested on August 17 on a Lafayette County hold, at which point the bond on this charge was reset to <strong>$100,000</strong> and made academic by a no-bond detainer. Chapter 24 gives that sequence in full.</p>
<p>Because I knew with absolute certainty that I had consumed no alcohol whatsoever, I insisted on a definitive forensic test to establish my complete sobriety. Officers transported me to UTMB Health for a forced blood draw. Sergeant Jack Doraty (spelled D-O-R-A-T-Y) was present during this entire procedure, supervising the officers and overseeing the operation. The physical blood draw was performed by UTMB Health medical staff, including a technician identified in court records as Defendant McDougle.</p>
<p>When the official state-administered forensic laboratory results returned from toxicology analysis, my blood alcohol concentration came back at 0.00.</p>
<p>Not 0.02. Not below the legal limit of 0.08. Zero—the precise, absolute scientific number produced by a human body with no alcohol whatsoever in its system.</p>
<p>A sworn affidavit alleging a "moderate odor of alcohol" had served as the sole legal justification to deprive me of my liberty, lock me in a jail cell, and impose a bond — ten thousand dollars at first, one hundred thousand after the August 17 rearrest — behind a Mississippi no-bond hold that kept me incarcerated for approximately eleven months. The state's own scientific test, conducted under its own strict chain of custody, completely demolished the physical premise of Officer Osteen's affidavit. That contradiction is not an inference, a theory, or a matter of subjective interpretation. It is the documented, objective outcome of a state-administered forensic test, measured against a sworn affidavit that formed the sole basis for nearly a year of my confinement.</p>
<p>The state did not immediately release me upon receiving the 0.00 BAC result. Instead, the felony charge hung over me for nearly a year until May 24, 2024, when prosecutors suddenly dismissed the felony DWI charge and refiled the case as a misdemeanor. As subsequent chapters will demonstrate in detail, this procedural downgrade was not a routine act of prosecutorial discretion or mercy. According to findings later made by <strong>United States Magistrate Judge Andrew M. Edison</strong> of the Southern District of Texas, it was a deliberate tactical maneuver designed to avoid a Franks hearing—a mandatory evidentiary proceeding that would have forced Officer Osteen onto the witness stand to answer under oath for the outright falsity of his affidavit.</p>
<p>I am naming that judge, here and every time he comes up, for a reason I would rather not have. <strong>Andrew Edison is also the judge who, on July 14, 2026, recommended dismissing my entire federal civil rights lawsuit</strong> — a recommendation the district court adopted in its entirety on August 10, 2026, entering final judgment against me. Chapter 37 gives that in full.</p>
<p>A reader is entitled to know that the judge whose finding I am about to lean on is the same judge who found my case legally insufficient. Both of those things are true at once, and they are not in conflict: a court can conclude that prosecutors maneuvered to avoid a hearing and also conclude that a civil complaint filed years afterward fails to state a claim. Quoting the first and quietly burying the second is precisely what I have spent this book accusing the State of Mississippi of doing to me, and I am not going to do it on my own behalf.</p>
<p>That finding, alongside an extraordinary on-camera concession buried in the government's own later federal court filings, forms the core of the next chapter.</p></section><section class="chapter"><p class="cnum">Chapter 24</p><h1>Osteen Lied Under Oath</h1><p>This chapter's title is not editorializing, nor is it a rhetorical flourish born of personal frustration or anger. It is, at this point in the formal legal record, an objective conclusion directly supported by the evidentiary findings of <strong>United States Magistrate Judge Andrew M. Edison</strong> and explicitly conceded in writing by the government's own legal representatives.</p>
<p>One caution before I go further, because it belongs at the front and not in a footnote. Edison's findings came inside a Report and Recommendation that <strong>recommended dismissing my entire lawsuit</strong>, and the district court adopted that recommendation and entered final judgment against me on August 10, 2026. Nothing in this chapter is a court ruling in my favor. What it is, is a record of what the documents say — and of what the government's own lawyers put in writing.</p>
<p>Galveston Police Officer William Osteen's sworn probable cause affidavit, detailed in the preceding chapter, alleged a "moderate odor of alcohol" coming from my person as the sole physical justification for my August 11, 2023 felony DWI arrest. That single sworn assertion served as the sole legal foundation for approximately eleven months of pretrial detention in Texas — held first on a $10,000 bond, then, after my August 17 rearrest on a Lafayette County hold, on a $100,000 bond that a Mississippi no-bond detainer made academic anyway. The forced blood draw administered that night at UTMB Health—conducted under the direct physical supervision of Sergeant Jack Doraty (spelled D-O-R-A-T-Y) and performed by hospital staff including a medical technician identified in court records as Defendant McDougle—returned a laboratory toxicology result of 0.00 blood alcohol content. That scientific result alone presents an insurmountable hurdle for an affidavit claiming a "moderate odor of alcohol," as ethyl alcohol odor correlates directly with the physiological presence of alcohol in a person's system, and the state's own laboratory found none.</p>
<p>What elevates this case from a routine evidentiary contradiction to a documented instance of official perjury is a specific, devastating admission buried in the government's own federal court filings. On June 10, 2026, attorneys representing Officer Osteen and the City of Galveston filed their Reply brief in our federal civil rights litigation, Reardon v. Osteen. In Docket 79, paragraph 14 of that federal filing, the defense explicitly conceded that Officer Osteen stated on camera, at the scene of the traffic stop, that he smelled no alcohol on me.</p>
<p>This is not my personal recollection of the traffic stop, filtered through memory, bias, or self-interest. It is not an assertion derived solely from my own livestream recordings. It is the defendants' own defense counsel, in a formal document submitted to a United States District Court, acknowledging what their client said into his own body-worn camera at the time of the arrest: that the physical odor his sworn affidavit would later claim as the sole legal basis for a felony arrest was not, by his own contemporaneous on-camera admission, actually present.</p>
<p>An officer who states on camera at the scene of a stop that he detects no odor of alcohol, and then swears under penalty of perjury in a probable cause affidavit hours later that he detected a "moderate odor of alcohol," has provided two flatly contradictory factual accounts of the exact same sensory observation made minutes apart. Both statements cannot be true. One of them is an intentional falsehood. The state's own laboratory blood test result of 0.00 leaves no doubt whatsoever about which statement was false.</p>
<p>The First Amended Complaint I filed in that same federal case lays out the specifics with more precision than a summary can capture, and the specifics matter, because they show the contradictions were not limited to the single "no odor" admission. The stop occurred at approximately 1:52 to 2:11 a.m. on August 11, 2023, after officers pulled me onto private property near the 4300 block of Broadway Avenue J in Galveston. Osteen's sworn "Affidavit for Search Warrant" asserted, among other things, that my speech was "Slurred &amp; Thick-Tongued," that my eyes were "Watery &amp; Dilated," and that I was "Heavy Footed" while walking. At my later revocation hearing — under oath, on the record, with a transcript — Osteen testified to the opposite on two of those same three points: he described my pupils as "very small" and "pinpoint" (Revocation Tr. p.24, line 10; p.35, line 7), the direct opposite of "dilated," and he testified I was "talking extremely fast" (Revocation Tr. p.35, line 8), the direct opposite of "slurred &amp; thick-tongued." An officer's own affidavit and his own later sworn testimony, describing the same person at the same encounter, cannot both be accurate when they describe literally opposite physical symptoms. I am not the one who created that discrepancy; his own two sworn statements did.</p>
<p>On February 25, 2025, my attorney Benjamin S. Campagna filed a Motion for a Franks Hearing in County Court No. 3 in Galveston County. It is the best piece of work anybody has ever done on my behalf, and I want to lay out what it did, line by line, because it is the moment this case stopped being my word against a police officer's.</p>
<p>A <em>Franks</em> motion is a narrow and difficult thing. Under <em>Franks v. Delaware</em>, if a defendant makes a substantial preliminary showing that an officer knowingly, intentionally, or with reckless disregard for the truth put a false statement in a warrant affidavit — and that the false statement was necessary to probable cause — the court must hold a hearing. In practice it means the officer takes the stand and answers for the document, under oath, with the recordings in the room.</p>
<p>Campagna took Osteen's affidavit and went through it one checkbox at a time.</p>
<p><strong>"An odor of an unknown alcoholic beverage."</strong> The toxicology report — Texas DPS Houston Crime Lab, case HOU-2308-10286 — showed no trace of alcohol. There were no alcoholic beverages and no open containers in the vehicle. And here is a fact I had never put in this book: <strong>Galveston disposed of the car.</strong> The motion says it plainly — <em>"Galveston has disposed of the vehicle, making it impossible for Defendant to exculpate himself."</em> The one physical thing that could have been examined for a source of that smell was gone.</p>
<p><strong>"Odor of Alcoholic Beverage on breath: Moderate."</strong> <em>Moderate</em> is the second-highest setting on that form. And Osteen said on his own body camera, more than once, that he did not smell alcohol on my breath — only from the vehicle. He later testified under oath that once I stepped out of the car he could not detect an odor coming from me at all. He marked <em>moderate on my breath</em> anyway.</p>
<p><strong>"Eyes: Watery &amp; Dilated."</strong> At the revocation hearing he testified my <em>"pupils were very small"</em> and that I had <em>"pinpoint pupils."</em> Dilated and pinpoint are opposites. Both were said under oath.</p>
<p><strong>"Walking: Heavy Footed."</strong> The bodycam shows he was not even facing me during the brief window I was walking. He later testified I was <em>"extremely jittery"</em> — which is the opposite of heavy-footed.</p>
<p><strong>"Speech: Slurred &amp; Thick-Tongued."</strong> On the footage I speak articulately, at a normal pace. He later testified I was <em>"talking extremely fast."</em> Thick-tongued and extremely fast are opposites too.</p>
<p><strong>"REFUSAL EVIDENCE."</strong> This is the one that still turns my stomach. The affidavit says I refused to provide a sample. What is on the bodycam is me <strong>offering to take a breathalyzer</strong> and agreeing to go into custody so it could be done. Campagna's language: Osteen <em>"intentionally omitted Defendant's willingness to take a breathalyzer so that he could use Defendant's 'refusal' as evidence supporting the Warrant."</em></p>
<p><strong>And then there is the document that needs no bodycam, no lab result, and no later testimony to do its work.</strong></p>
<p>Osteen wrote two things that night. One was the sworn affidavit that went to a magistrate at 2:49 a.m. to get a warrant for my blood. The other was his own DWI Case Report, Galveston PD case 2023-005559. Both are in the exhibits to Campagna's motion. Put them side by side.</p>
<p><strong>On the smell.</strong> The case report says: <em>"Affiant smelled a <strong>strong</strong> odor of an unknown alcoholic beverage emitting <strong>from the vehicle</strong>."</em> The affidavit checks the box for odor <strong>on breath</strong>, at <strong>moderate</strong>.</p>
<p>Read that twice. In his own narrative report, the smell is strong and it is coming from the car. In the document that had to convince a judge, the smell has moved out of the car and onto my breath — and dropped from strong to moderate, because "moderate on the breath" is what a form needs to justify taking blood.</p>
<p><strong>On my speech.</strong> The case report says <em>"slightly slurred."</em> The affidavit checks <strong>"Slurred"</strong> and adds <strong>"Thick-tongued."</strong></p>
<p><strong>On my eyes.</strong> The case report says <em>"watery, glossy."</em> The affidavit checks <strong>"Watering"</strong> and adds <strong>"Dilated."</strong></p>
<p><strong>The word "dilated" appears nowhere in his own report.</strong> It appears for the first time on the form that goes to the magistrate. Then, at my revocation hearing, he testified my pupils were <em>pinpoint.</em></p>
<p>Three observations. Three upgrades, every one of them in the direction that helps the warrant. Nothing here requires a jury to believe me over a police officer. It requires reading two pages he wrote himself, hours apart, on the same night.</p>
<p><strong>One more thing in that report, and it resolves something this book has been carrying wrong.</strong></p>
<p>The report records that Osteen contacted an assistant district attorney, that she agreed to charge me with DWI third-or-more, and that the case went to the jail <strong>"with a recommended bond of $10,000."</strong> The figure appears twice on the page.</p>
<p>I have said for two years that I sat in Galveston County Jail on a <strong>$100,000</strong> bond. Both numbers are true. They belong to different arrests.</p>
<p>Here is what actually happened, and it is the part of that August I have never written down properly.</p>
<p>The bond on August 11 was <strong>$10,000</strong>. About five days later — I believe the sixteenth — <strong>I bonded out.</strong> I was free.</p>
<p>When I got to my car, <strong>my keys were gone.</strong> I raised absolute hell about it. And then I did what I do: I stood in the lobby of the Galveston Police Department and held a press conference about a department that had arrested a sober man on a sworn affidavit and then lost his keys.</p>
<p>The next day, <strong>August 17</strong>, I was told the department had my keys and to come up and collect them.</p>
<p>They did not have my keys. What they had was a warrant. Lafayette County had lodged an extradition hold — Mississippi was moving to revoke my probation on the strength of the Galveston arrest — and the moment I walked in to pick up my property, I was arrested again.</p>
<p><strong>And on that rearrest the DWI bond was reset from ten thousand dollars to one hundred thousand.</strong></p>
<p>It made no practical difference. Lafayette County's hold was a <strong>no-bond hold</strong>. There was no number I could have paid.</p>
<p>I want to separate what I know from what I believe, because the difference matters here. <strong>What I know:</strong> the bond was ten thousand, I got out, my keys were missing, I held a press conference in their lobby, I was told to come collect my keys, and I was rearrested when I did — with the bond then set ten times higher. <strong>What I believe</strong> — and it is a belief, not a document — is that all of it was a way to reduce the headache they had made for themselves when I stood in their lobby with a camera. I cannot prove that, and I am not going to dress it up as proof.</p>
<p>There is one detail I would like a record for and do not have. Chapter 22 sets out that on <strong>August 17, 2023</strong> — the same day — the State of Mississippi filed a bench warrant and a Petition to Revoke Suspended Sentence, signed by Assistant District Attorney Steven Patrick Jubera, citing the Galveston arrest and asking the court to convert the whole remaining four years into real time.</p>
<p>Same date. I do not know whether the warrant I was taken on that morning is that instrument, or whether the hold was already lodged and Jubera's petition followed it, and I am not going to guess at the order of two documents I have not put side by side. What I can tell you is that on one day in August 2023 a Mississippi prosecutor moved to take four years of my life and a Texas department told me to come pick up my keys.</p>
<p>There is a further document in that same extradition chain worth flagging plainly as my own allegation, not a verified fact, because I have not put the underlying paperwork in front of a reader here and I am not going to claim more certainty than that allows. The formal extradition instrument — the Governor's Warrant that authorized moving me from Texas back into Mississippi custody — is, on my own reading of it at the time, wrong on its face in at least two places. It characterizes the probation I was allegedly violating as tied to a charge of "possession of a controlled substance." I have never been charged with possession of a controlled substance, in Mississippi or anywhere else. And the underlying petition to revoke, from which the warrant was drawn, cites a case number that does not correspond to any actual case number on my record. Mississippi's governor signed off on that document, authenticating it under the state's own extradition statute, without independently checking either detail against the court file it claimed to summarize. I have not resolved whether that is bureaucratic sloppiness, a paperwork template filled in carelessly, or something worse, and I am not going to guess between those in print. What I can say is that the two irregularities are checkable against the document itself, and that they sat underneath an interstate rendition that cost me months of my life before either was ever corrected on the record.</p>
<p>And there is one more line in that report worth holding, because of what was happening on the telephone at the same time. Osteen wrote that after reviewing my criminal history he found two prior DUI charges — one in Cobb County, Georgia in 2014, and one he lists as a <strong>February 2021 Lafayette County, Mississippi</strong> conviction. That prior is what turned this into a third-degree felony.</p>
<p>But Chapter 23 has the dispatch recordings from that same building on that same night. At <strong>3:44 in the morning</strong>, Galveston personnel are on tape hunting for exactly that Mississippi prior and failing to find it — <em>"there's no charge affiliated with that 2022 cycle six"</em> — and two minutes later they are on the phone to Lafayette County asking for the court and the cause number, and a Mississippi sergeant is telling them he cannot get it on his shift.</p>
<p>So the report states a specific Mississippi conviction, with a specific date, on a night when the people writing it were audibly still trying to find one. I am not going to tell you which way that cuts. I am telling you both documents exist and that they sit badly together, and that the Justice Court's own disposition record would resolve it in about five minutes.</p>
<p>Then Campagna put the whole thing together into the argument that I think is unanswerable. Between writing the affidavit and testifying at my revocation hearing, <strong>Osteen switched profiles.</strong> The affidavit describes a drunk: slurred, thick-tongued, heavy-footed, dilated pupils, alcohol on the breath. The testimony describes something else entirely: fast speech, pinpoint pupils, jittery. As the motion puts it:</p>
<p>&gt; <em>"Each observation was made under oath, but they obviously aren't both true. Such a fundamental shift in observations, under oath, suggests intentional misrepresentation rather than innocent mistake."</em></p>
<p>And underneath all of it, the motion documents when the decision to arrest me was actually made. <strong>Under one minute into the encounter</strong>, before any meaningful observation, Osteen tells Officer Larry Murph they can go ahead and arrest me — that he <em>"can go off of slurred speech and the smell."</em></p>
<p>Which brings me to the two sentences on that body camera that explain the entire night.</p>
<p>At <strong>2:48</strong> into the footage — within moments of walking up to me — one of the first things Osteen asks is:</p>
<p>&gt; <strong>"You an auditor man?"</strong></p>
<p>And sixteen seconds later, to another officer:</p>
<p>&gt; <strong>"Hey, I'm doing this one, this is an auditor."</strong></p>
<p><em>I'm doing this one.</em></p>
<p>I have spent this book carefully refusing to claim I know why people did things to me. I am not going to break that rule now, and I do not need to. Read those two sentences in order and decide for yourself what "I'm doing this one" means when it is said sixteen seconds after "you an auditor man," four minutes before the decision to arrest, on a night that ended with a blood draw that came back at 0.00.</p>
<p>Campagna's motion notes, pleaded on information and belief, that the City of Galveston has a contentious relationship with auditors.</p>
<p><strong>The State of Texas never answered any of it.</strong> There was no Franks hearing. Osteen never took that stand. Instead, as the next chapters set out, the case was disposed of — and <strong>Magistrate Judge Andrew M. Edison</strong> would later find that avoiding exactly this hearing is why.</p>
<p>The same judge recommended throwing my federal lawsuit out, and the district court did. Chapter 37 is that story, and I am not going to pretend the two rulings came from different men.</p>
<p>I want to say one thing plainly, because this book has been hard on a great many lawyers. <strong>Ben Campagna did his job.</strong> He read every page, he watched every second of the footage, he pulled the lab report and the case report and the revocation transcript, and he built a document so specific that the State's only viable move was to make the case go away rather than put its officer under oath. That is what a defense attorney is supposed to be. I had gone seven years without one.</p>
<p>There is a timing detail buried in the paperwork that deserves its own sentence rather than a footnote. The Texas DPS Houston Crime Lab's toxicology report — Laboratory Case HOU-2308-10286, finding "No alcohol detected" — was issued September 6, 2023, less than a month after my arrest, and its email distribution list included Osteen's own department address, wosteen@galvestontx.gov. That means Osteen had access to the lab result definitively clearing me of any alcohol at all by early September 2023. The felony charge did not get dismissed until May 24, 2024 — nearly eight more months during which I remained in pretrial custody on the $100,000 bond and the Mississippi hold behind it, while the officer whose sworn affidavit put me there had, by his own department's own records, already received the report contradicting it.</p>
<p>The complaint documents two phone calls in the middle of that same night, at 2:41 a.m. and 4:04 a.m., involving Lafayette County. When I drafted that complaint I described them as outgoing — Galveston reaching out to Mississippi. I have the recordings now, and I had the direction wrong. Both calls came the other way.</p>
<p>At 2:41 a.m. — roughly forty minutes after I was pulled over — Sgt. Hoby James of the Lafayette County Sheriff's Office called <em>in</em> to Galveston Police, and told them he had been watching my arrest on a YouTube livestream. At 4:04 a.m., Deputy Kandi Beavers called <em>in</em> to Galveston Police herself, identified herself by name and department, and asked to be connected to Officer Osteen.</p>
<p>I am correcting my own filing here because the corrected version is the more serious one. A Texas department phoning Mississippi to run a records check is ordinary police work; it happens a hundred times a night across the country. Two officers of a Mississippi sheriff's department telephoning into a Texas police station between two and four in the morning, about a man who had been in their county's crosshairs for six years and had tried to file a complaint against one of them a week earlier, is not ordinary anything.</p>
<p>What was said on the Beavers–Osteen call is not on the recording, and I am not going to tell you what I think it was. The call itself is on the recording. Chapter 23 sets out the rest of that night's sequence in full.</p>
<p>The physical reality of that lie was eleven long months spent inside a Galveston County jail cell. Held on a $100,000 bond I could not post, behind a no-bond hold that meant posting it would have changed nothing, I sat in pretrial confinement knowing with absolute mathematical certainty that I was completely sober, knowing that the blood drawn from my arm contained zero alcohol, and knowing that my incarceration rested entirely on a sworn statement that the arresting officer himself had contradicted on video moments after pulling me over. Week after week, month after month, the weight of that pretrial detention accrued, designed to grind down my resolve and force a plea before the forensic evidence could see the light of day.</p>
<p>The felony charge against me was abruptly dismissed on May 24, 2024, nearly a year after my arrest, and refiled as a misdemeanor. A decision to dismiss and recharge can occur for benign, routine administrative reasons—such as docket management, evidentiary reassessment, or changes in prosecutorial staffing—and a charge reduction does not automatically prove police misconduct. What makes this specific dismissal extraordinarily revealing is its precise timing relative to a major constitutional proceeding: a Franks hearing.</p>
<p>For a lay reader unfamiliar with criminal procedure, a Franks hearing—derived from the United States Supreme Court's landmark 1978 decision in Franks v. Delaware—is a vital constitutional mechanism designed to hold law enforcement accountable when they lie to courts to secure arrest warrants or justify warrantless detentions. Under the Fourth Amendment, any search or arrest warrant must be supported by probable cause established through truthful sworn statements. When a criminal defendant makes a substantial preliminary showing that a police officer included false statements in a sworn warrant or probable cause affidavit, either intentionally or with reckless disregard for the truth, the court is legally required to conduct an evidentiary Franks hearing.</p>
<p>At a Franks hearing, the protective judicial shield normally granted to official police affidavits is stripped away. The affiant officer is called to the witness stand under oath, subjected to direct, rigorous cross-examination by defense counsel, and forced to defend the truthfulness of their sworn claims line by line under penalty of perjury. If the presiding judge concludes by a preponderance of the evidence that the affidavit contained intentional perjury or reckless falsehoods necessary to the finding of probable cause, the court must void the warrant, declare the arrest unconstitutional, and suppress all evidence obtained as a direct result. A successful Franks hearing not only destroys the state's criminal prosecution but exposes the officer to direct personal civil liability and criminal prosecution for perjury.</p>
<p>By abruptly dismissing the felony DWI charge on May 24, 2024, immediately before the scheduled Franks hearing could take place, the prosecution effectively stripped the court of jurisdiction to hold the hearing. Re-charging the offense as a lower-level misdemeanor removed the immediate threat of a long felony prison sentence, significantly altering the procedural posture and reducing the practical incentive to litigate the affidavit's truthfulness with the same exhaustive resources. The practical effect of this tactical maneuver was unmistakable: Officer Osteen was shielded from taking the witness stand, protected from answering under oath about his on-camera contradiction, and spared from having his affidavit formally invalidated in open court. It took my subsequent federal civil rights lawsuit, Reardon v. Osteen, and the government's own June 2026 court filing, to force that contradiction into the permanent public record.</p>
<p>The complete Galveston police dispatch and bodycam archive for August 11, 2023—a 46-file digital archive that I obtained through discovery and reviewed in exhaustive detail—provides critical context that sharpens these findings and exposes the internal mechanics of the arrest.</p>
<p>First, the dispatch audio captures an independent bystander at the scene confirming that I myself proactively offered to take a field breathalyzer test. Certain police narratives and preliminary reports suggested I had flatly refused alcohol testing. The full record clarifies this vital nuance: I offered to take a breathalyzer test at the scene to demonstrate my immediate sobriety, but I specifically refused and declined field breathalyzer testing in favor of a formal blood draw instead. I insisted upon an indisputable scientific laboratory analysis performed by trained medical personnel rather than a portable field breathalyzer device that officers could miscalibrate, misread, or manipulate on scene. Both facts are true and coexist without contradiction: I offered a breathalyzer to show I had nothing to hide regarding alcohol, while specifically choosing a blood draw as the definitive, legally binding test. Officer Osteen's sworn affidavit completely omitted my offer to take a breathalyzer test, constructing instead a false narrative of total non-cooperation to justify a forced medical procedure.</p>
<p>Second, the dispatch recordings reveal Galveston police personnel telephoning UTMB Health hospital staff in advance of my arrival for the forced blood draw, explicitly warning medical personnel that "an auditor" was being brought in. This warning was not a routine medical heads-up or clinical preparation. It was a prejudicial framing delivered before I ever stepped foot into the emergency room, signaling to hospital staff that I was a hostile political agitator rather than a routine patient undergoing a forensic procedure. This pre-framing established my identity as a First Amendment auditor and independent journalist as the operative factor driving the department's handling of me—months before the systematic BOLO (Be On the Lookout) alert pattern detailed in Chapter 28 would formalize that exact framing at the federal level.</p>
<p>Third, the audio archive documents that a Galveston police supervisor, Sergeant Hoby James, was specifically called out to the scene only after officers began watching my own live internet stream of the traffic stop. Sitting in patrol cruisers, officers tuned into my YouTube broadcast in real time. Rather than responding to an objective traffic safety hazard or an erratic driver, senior command personnel were mobilized specifically because of my active broadcast and journalistic activity.</p>
<p>Fourth, the dispatch tape captures Galveston officers communicating with Mississippi authorities during the stop, attempting and failing in real time to confirm my prior conviction status. Despite being unable to verify my record or confirm whether I had any disqualifying priors, the officers proceeded to lodge high-bond felony charges based entirely on unverified assumptions about my past legal history, layered directly on top of Osteen's fabricated odor claim. An arrest built on an officer's contradicted claim of alcohol odor is one profound violation; an arrest additionally proceeding on cross-state record information nobody on scene could actually confirm in real time compounds it into a systemic failure.</p>
<p>Fifth, a specific rebuttal detail captured on the dispatch tape documents officers discussing my history of filing formal grievances. The recording records a reference to "17 police reports over 5 years"—a detail I used directly on scene to push back against officers attempting to characterize me as a "sudden complainer" or an unprovoked instigator. The tape proves that my pattern of documenting police misconduct was long-standing, formal, and well-known to law enforcement, completely refuting any attempt to portray my objections as an unprecedented or erratic outburst.</p>
<p>Throughout the forced blood draw at UTMB Health, Sergeant Jack Doraty (spelled D-O-R-A-T-Y) was present in a supervisory capacity. As the blood draw was performed by medical staff, including Defendant McDougle, Sergeant Doraty stood by and oversaw the operation. Per my own observations and formal account, Sergeant Doraty failed entirely to intervene or question the procedure, despite clear, visible irregularities and the lack of any credible physical indicia of intoxication. He allowed a forced medical procedure to go forward on the foundation of an affidavit built on an odor his subordinate had already admitted on camera did not exist.</p>
<p>Sergeant Doraty's involvement with my law enforcement encounters did not end on August 11, 2023. A separate, subsequent incident—the Galveston bank standoff at Coastal Community Federal Credit Union, recorded on a livestream transcript I preserved—names Officers Ball (#1026), Bass (#1078), and Griffin (#676), with Sergeant Doraty once again acting as the supervising officer on scene.</p>
<p>During that later bank standoff, as captured on the live audio transcript, my intense frustration with Doraty's repeated presence and supervisory oversight spilled out. On that tape, I referred to Sergeant Doraty as "a lying rat bastard"—a characterization that I present clearly and explicitly as my own personal opinion and emotional reaction at the time, born of surviving what I viewed as his blatant, recurring hostility toward my press activities. On that same recording, I expressed my firm belief that Doraty possesses an "obvious bias against First Amendment auditors"—again, presented here as my own characterization and belief regarding his operational mindset. I directly connected Doraty's supervisory presence at the credit union standoff back to his role overseeing my original August 2023 felony DWI frame-up, viewing his repeated involvement as part of a continuous pattern of targeted supervision.</p>
<p>On that same credit union livestream recording, I am heard mentioning a second vehicle being taken by police approximately a month prior due to an expired license tag. To ensure absolute clarity for the reader and prevent any misconception that a third separate vehicle seizure occurred, this reference has since been confirmed through court records to be the exact SAME event as the June 22, 2026 Mitsubishi Outlander seizure at a Galveston Walgreens, which is detailed fully later in Part V. It is not an additional, unrecorded vehicle towing event, but a contemporaneous verbal reference to the very Walgreens seizure litigated in my federal civil rights objections.</p>
<p>When all these documented elements are brought together—Officer Osteen's on-camera admission that he smelled no alcohol, the 0.00 BAC laboratory report, the strategic dismissal to dodge a Franks hearing, the hospital pre-framing of "an auditor," the mobilization of supervisors over a livestream, the unverified Mississippi record checks, the 17 police reports rebuttal, and Sergeant Doraty's supervisory oversight across multiple incidents—the conclusion is unavoidable. The felony DWI charge of August 11, 2023, was not a good-faith traffic stop that turned out to be a mistake. It was a calculated, sworn fabrication designed to remove an active journalist from the streets and silence a persistent critic of law enforcement.</p>
<p>A federal magistrate judge would later reach a version of that same conclusion himself, in writing, in the civil case that grew out of this arrest. Reviewing the same contradiction laid out above—Osteen's affidavit versus his own later testimony before Judge Tollison—Magistrate Judge Andrew M. Edison wrote in his July 14, 2026 Report and Recommendation: "I take no pleasure in this result. The record shows that Osteen lied to Judge Tollison. That is disturbing." A sitting federal judicial officer, reviewing the identical documents examined in this chapter, used the word "lied." Not "contradicted himself." Not "was inconsistent." Lied.</p>
<p>What that same federal judge did next with his own finding—and what a different federal judge did with the case after that—is its own story, and Chapter 37 tells it in full, including the doctrine that let the officer who was found to have lied walk away from the case anyway.</p></section><section class="chapter"><p class="cnum">Chapter 25</p><h1>The Long Fight For Vacatur</h1><p>By early 2024, I found myself fighting an exhausting, continuous two-front battle across two states, caught in simultaneous legal wars against two separate convictions that had both been constructed on compromised and discredited foundation: the Mississippi probation revocation grounded in Deputy Kandi Beavers's contradicted sworn testimony, and the Texas felony charge grounded in Officer William Osteen's affidavit, already contradicted by his own on-camera statements and a 0.00 laboratory blood test. Neither case would resolve swiftly, and neither would yield through my unassisted pro se efforts alone — a harsh reality that traced directly back to my dismissed 2022 federal civil rights lawsuit detailed in Chapter 18, where the vast chasm between a documented constitutional violation and a legally cognizable judicial remedy proved, time and again, to be defined almost entirely by the gap between standing alone as an unrepresented litigant and having skilled, institutional legal counsel.</p>
<p>Day after day, I was forced to navigate the staggering procedural demands of two distinct state court systems while living under the constant threat of re-incarceration and continuous banishment. Managing complex dockets, responding to procedural motions, tracking certified mail, and filing detailed evidentiary affidavits required an overwhelming expenditure of energy. Yet, despite assembling meticulous documentation — including video recordings, official toxicology reports showing zero alcohol content, and transcribed telephone calls — my pro se filings were routinely met with institutional inertia, procedural dismissals, or summary denials. The system seemed designed to ignore the plain substance of a pro se petitioner's evidence, treating documented official misconduct as mere unrepresented noise.</p>
<p>A note on chronology belongs here, stated plainly rather than smoothed over. An earlier draft of this chapter stated that a Mississippi court "formally vacated" the October 2022 probation-violation sentence in June 2024. Certified hearing transcripts obtained later — covered in full below — show the same court, in the same case, still actively enforcing that sentence's remaining suspended term in July 2024. Whatever happened in June 2024 was not a vacatur of the Beavers-based revocation; at most, on the documentary record now available, it may refer to the Galveston court's own May 24, 2024 dismissal of the underlying felony DUI charge, which I forwarded to the Mississippi prosecutor's office on June 7, 2024. I am correcting the record here rather than letting the earlier claim stand uncorrected, and I do not yet have a fully reconciled account of what, if anything, a Mississippi court actually did in June 2024 specific to the Beavers revocation itself.</p>
<p>What the certified transcripts do establish is this: the August 17, 2023 bench warrant and "Petition to Revoke Suspended Sentence," filed by Assistant District Attorney Steven Patrick Jubera under the same cause number, LK22-358, and citing the Galveston felony DUI arrest, did not simply sit unresolved until the 2025 vacatur mooted it. It proceeded to two hearings before Circuit Judge Grady Tollison — the same judge from the November 2022 revocation — on July 11 and July 18, 2024, and it produced a second Mississippi prison sentence.</p>
<h4>The July 11, 2024 hearing: continuance, and a due-process fight</h4>
<p>The July 11 hearing opened with District Attorney Benjamin F. Creekmore explaining that Officer Osteen could not appear by Zoom from Galveston because Hurricane Beryl had knocked out power and connectivity across the Texas coast. Before the court could simply continue the matter, I raised, pro se, a set of preliminary due-process arguments I had been trying to get in front of a judge for months: that Mississippi Rule of Criminal Procedure 27.2 and Mississippi Code Section 47-7-37(3) entitle a probationer to a preliminary hearing within seventy-two hours of arrest and detention on a warrant, and that the Mississippi Supreme Court's own precedent — <em>Ridley v. State</em>, 562 So.2d 406 (Miss. 1990); <em>Gagnon v. Scarpelli</em>, 411 U.S. 778; <em>Berdin v. State</em>, 648 So.2d 73 (Miss. 1994); and the Court of Appeals' <em>Rusche v. State</em>, 813 So.2d 787 (Miss. Ct. App. 2002) — required both a prompt preliminary probable-cause hearing and a separate, later, formal revocation hearing. I had never received the first of those.</p>
<p>I also raised, on the record, what I called a "completely fictitious" defect in the bench warrant itself: it commanded that I be brought before the court to answer for violating probation "on the original charge of possession of a controlled substance" and cited a Galveston case number, 2023-005559, tied to a felony DUI, third offense — I had never been charged with possession of a controlled substance in my life, and I told the court the warrant's own predicate description was simply wrong. The court called this point "moot," reasoning that any error in how the underlying Texas or Mississippi paperwork described the charge should have been raised earlier and did not affect the substance of the revocation. I disagreed with that ruling then and still do — a bench warrant authorizing a person's arrest and detention that misdescribes, on its face, the very offense it claims to be enforcing is not a harmless clerical slip, whatever a court later decides about mootness.</p>
<p>I also asked, on the record, whether Judge Tollison should recuse himself from presiding over this second revocation, "particularly after the last dealing back in November of 2022" — a reference to his role in the very revocation this new petition was built on top of. The court took the recusal request under advisement rather than ruling on it immediately, and ultimately continued the matter to July 18, appointing attorney Mark McClinton as my procedural advisor for that hearing, over my own objection that a further continuance would push the proceeding past the twenty-one-day window I argued Section 47-7-37 requires for reinstatement to probation absent a timely hearing.</p>
<h4>The July 18, 2024 revocation hearing</h4>
<p>At the July 18 hearing, I represented myself with McClinton serving as procedural advisor, cross-examining the state's own witnesses directly. The State called Katreena Thompson, a district attorney's office investigator, who introduced abstracts of my prior Lafayette County and Cobb County, Georgia DUI convictions and the Galveston toxicology paperwork. On cross-examination, McClinton got her to confirm that a Mississippi governor's interstate rendition request had referred to me as a fugitive who had "fled to Texas from Mississippi" — and separately introduced, over the State's lack of objection, the actual Galveston court order dismissing the underlying felony DUI, dated May 24, 2024, weeks before this hearing.</p>
<p>Officer William Osteen then testified by Zoom. Under my own cross-examination, he: denied receiving any advance phone call about me coming into Galveston that night, contradicting the coordination pattern documented in Chapter 23; admitted he told the arresting officer, Officer Murph, that "this guy's an auditor" and suggested stepping aside to take over the stop, though he said he could not be certain of his exact words without his body camera footage, which neither he nor, apparently, anyone else in the courtroom had access to that day; and confirmed, when I asked directly, that he was not a certified drug recognition expert and had never been one, including at the time of my arrest — a fact I argued undercut his own claim that my pinpoint pupils and rapid speech, rather than simple fatigue from a long drive, indicated impairment by something other than alcohol.</p>
<p>In closing, I argued — citing <em>Williams v. State</em> and <em>Elkins v. State</em>, 116 So.3d 185 (Miss. Ct. App. 2013), and analogizing to <em>Gagnon v. Scarpelli</em>'s parolee-probationer due-process parity — that once the underlying felony DUI had been dismissed before the revocation hearing concluded, "proof of the arrest alone is insufficient to prove that the defendant committed the act that violated" his probation, and that the proceeding should be dismissed outright. District Attorney Creekmore countered that the State had met its burden anyway, independent of the dismissed charge, through the Galveston toxicology report itself — Exhibit S-3, showing 0.13 milligrams per liter of methamphetamine in my blood the night of the Galveston stop — arguing that a positive drug test survives a later dismissal of the criminal charge built on the same traffic stop.</p>
<p>Judge Tollison ruled for the State. He found, "by a preponderance of the evidence," that the toxicology result alone was sufficient to establish a probation violation regardless of the underlying charge's dismissal, revoked the remaining four years of my suspended sentence, and sentenced me to four years in the custody of the Mississippi Department of Corrections, with two years suspended — leaving two years to actually serve — followed by two years of post-release supervision. The court noted, in passing, that I still owed $842.50 in unpaid court costs and fines from the original 2022 sentencing.</p>
<p>I am naming, plainly, the specific allegation I have made elsewhere about District Attorney Creekmore's conduct in this proceeding: that he knowingly pursued a revocation built on a bench warrant containing a fabricated predicate charge, and pressed forward on a toxicology result tied to an arrest whose underlying criminal case had already collapsed. The certified transcript supports the first half of that — the warrant's misdescription of the charge is there in black and white, and the court's own "moot" ruling did not deny that the description was wrong, only that it mattered procedurally. The second half — whether relying on a dismissed case's collateral blood-test result to revoke a suspended sentence is prosecutorial overreach or a legally defensible position — is a real legal dispute, one Mississippi's own appellate courts have not resolved cleanly in either direction on facts like these, and I present my own characterization of it as exactly that: my characterization, not a settled legal or factual finding against Creekmore beyond what the transcript itself shows.</p>
<p>This second Mississippi sentence — a fresh two years of custody, stacked on top of the year I had already served on the first revocation — is the sentence Chapter 26's January 21, 2025 vacatur ultimately swept away along with everything else tied to the 2022 conviction. I do not have a precise account, independent of my own memory, of exactly how much of those two years I actually served in Mississippi Department of Corrections custody between the July 18, 2024 sentencing and the January 21, 2025 vacatur — six months, roughly — and that gap in the documentary record is one I am flagging rather than filling in with an estimate I cannot support.</p>
<p>When news of the eventual vacatur reached me, it brought a surge of vindication tempered by profound frustration. It could not restore the year I had already lost after the first revocation, nor the additional months I lost after this second one. Moreover, whatever partial relief occurred earlier in 2024 — whatever the true nature of that June 2024 event turns out to have been — did not, on its own, address or undo the underlying September 30, 2022 guilty plea itself. </p>
<p>That plea — entered under immense pressure to the aggravated stalking charge derived from the duress-signed 2017-CV-217 civil restraining order detailed in Chapter 20 — remained fully active on the court books. Along with it remained the associated five-year banishment from Lafayette County, Mississippi. The underlying felony-adjacent conviction stood as an active legal barrier, restricting my movement, threatening my freedom, and requiring a far more comprehensive post-conviction relief effort to dismantle completely. It carried a further concrete cost I only fully appreciated once I tried to move past it: I believe the county reported the conviction to NCIC in a way that flagged me in the federal background-check system used for firearm purchases, meaning a wrongful conviction I have maintained from day one was impossible to have committed also functioned, in practice, as a bar on a constitutional right until the record was eventually cleared.</p>
<p>That necessary legal capability arrived on November 26, 2024, when attorney Jacob Howard of the MacArthur Justice Center filed a formal petition for post-conviction relief on my behalf in Mississippi state court. This filing marked a decisive turning point in my long fight against the Mississippi judicial apparatus, illuminating the stark contrast between pro se advocacy and represented litigation backed by a major civil rights institution.</p>
<p>For a lay reader, post-conviction relief — commonly referred to as PCR — is a specialized legal mechanism fundamentally distinct from a direct appeal. While a direct appeal reviews the trial transcript for legal errors committed by the judge during court proceedings, a post-conviction relief petition is a collateral attack on the judgment of conviction itself. It operates outside the narrow scope of the initial trial record, allowing a petitioner to introduce new physical or testimonial evidence, raise fundamental constitutional violations — such as coerced guilty pleas, ineffective assistance of counsel, or state reliance on false testimony — and request that a final judgment of conviction be set aside entirely.</p>
<p>Attorney Jacob Howard's November 26, 2024 PCR petition mounted a structured, multi-pronged attack that targeted both the November 2022 revocation and the underlying September 30, 2022 guilty plea. The petition systematically laid out four core arguments grounded in established constitutional law and state statutory standards:</p>
<p>First, it demonstrated that the underlying September 30, 2022 guilty plea was invalid and unconstitutional because it was derived directly from the 2017-CV-217 civil restraining order — an order that had been procured under severe duress while I was incarcerated in 2017, without fundamental procedural due process, making any subsequent criminal charge built upon it inherently defective.</p>
<p>Second, it established that the November 2022 probation revocation was fatally infected by the falsified testimony of Deputy Kandi Beavers, whose sworn trial statements claiming ignorance of my FBI report were directly impeached by the recorded telephone call proving her prior knowledge and deliberate misrepresentation.</p>
<p>Third, it argued that I had received ineffective assistance of trial counsel, as my previous defense attorneys failed to conduct a reasonable investigation into the Beavers recording, failed to challenge the duress surrounding the initial 2017 civil order, and allowed me to enter a guilty plea tied to an unconstitutional banishment provision.</p>
<p>Fourth, the petition challenged the five-year banishment from Lafayette County as an illegal, extra-statutory punishment that violated both the Mississippi Constitution and well-established public policy prohibiting judicial banishment.</p>
<p>The contrast between my years of pro se filing and the MacArthur Justice Center's intervention was immediate and profound. I had spent, by this point, roughly two years trying to get some court, somewhere, to look seriously at the duress under which the 2017-CV-217 order was signed, at Beavers's contradicted testimony, and at the disproportionate five-year county-wide banishment detailed in Chapter 20. My own 2022 federal lawsuit had been dismissed with prejudice. My own recusal motions, my own contempt fights, my own attempts to file internal affairs complaints, had gone nowhere or produced further escalation against me. </p>
<p>It took the MacArthur Justice Center — a nationally recognized civil rights litigation organization with institutional resources, litigation experience, and credibility that a pro se, financially strained litigant simply does not carry into a Mississippi courtroom — filing a single, properly constructed PCR petition to put the full weight of the record documented across twenty chapters in front of a court in a form that court could actually act on.</p>
<p>None of this is meant to overstate what that contrast proves. It does not mean my earlier pro se filings were meritless, and it does not mean every properly represented petition succeeds where an unrepresented one fails — represented litigants lose constantly, and pro se litigants occasionally win. What it does illustrate, cleanly, is the structural reality underlying nearly every chapter in Parts II and III: that access to competent counsel is not a minor procedural convenience in the American legal system, but frequently the entire difference between a documented grievance going nowhere and that same grievance producing an actual remedy — a reality that falls hardest, as it did on me for years, on people who cannot afford to hire it and lack the institutional connections to attract it pro bono until their case has already generated enough public attention or enough accumulated harm to draw an organization like MacArthur's notice.</p>
<p>The next chapter covers what Howard's petition produced: on January 21, 2025, a Mississippi court vacated the illegally long sentence from the July 2024 revocation and ordered my release — a real and important outcome, but a narrower one than I first understood it to be, corrected plainly in the next chapter.</p></section><section class="chapter"><p class="cnum">Chapter 26</p><h1>Released, But Not Vacated</h1><p>On January 21, 2025, a Mississippi circuit court granted the post-conviction relief petition Jacob Howard and the MacArthur Justice Center had filed two months earlier — but the actual order was narrower, and less complete, than an earlier draft of this chapter claimed. I am correcting that record plainly here rather than letting the more dramatic earlier version stand.</p>
<p>What the January 21, 2025 order vacated was the specific sentence imposed at the July 18, 2024 second revocation hearing detailed at the end of Chapter 25: the court found that Judge Tollison's four-year MDOC sentence, with two years to serve, exceeded the one-hundred-twenty-day statutory maximum Mississippi law allows for a "second revocation" based on a technical violation. A misdemeanor DUI is a technical violation under Miss. Code Ann. § 47-7-37(5)(a), and the felony DUI the revocation had originally been built on had already been dismissed in Galveston back in May 2024. The court resentenced me to the 120 days I had already served, ordered credit for any additional time served beyond that, and directed my immediate release from MDOC custody.</p>
<p>That is a real and meaningful legal outcome — it corrected an illegally long sentence and got me out of prison. It is not, however, a full vacatur of the underlying 2022 conviction. The same order explicitly reinstated me to the five-year term of unsupervised probation I had begun serving on September 30, 2022, and stated that all conditions of that probation "shall remain in force, including Mr. Reardon's banishment from Lafayette County." The September 30, 2022 guilty plea, the underlying conviction, and the banishment condition were not vacated, dissolved, or struck down by this order — they were reinstated, with only the illegal over-sentence corrected. Howard's petition itself only ever asked the court for relief from the July 2024 second-revocation sentence; it did not ask the court to disturb the 2022 plea.</p>
<p>I am correcting this because I would rather be right than dramatic, and because a reader who believed my conviction and my banishment had been wiped away would be believing something the court's own order does not say. What I actually walked out of custody with, on January 21, 2025, was freedom from an illegally long prison sentence — not freedom from Mississippi's court system, and not, on the documentary record now in front of me, freedom from the banishment order that had already shaped three years of my life by that point. If a later filing lifted that reinstated probation or banishment, it is not reflected in any document I have been able to locate, and I am not asserting that one exists.</p>
<p>Receiving word of the order still brought real relief — the alternative was continuing to serve an unlawfully long sentence — but it was narrower relief than I first understood it to be, and this chapter's title reflects that honestly rather than overclaiming.</p>
<p>I relocated to Layton, Utah on February 1, 2025, roughly ten days after my release. I want to be precise about what that move legally was and wasn't: it was not, contrary to what I believed and wrote in an earlier draft of this book, a move made free of any Lafayette County banishment or probation — those conditions had just been reinstated by the very order that released me. It was the move of a man who had just gotten out of prison and left the state, while a banishment order I did not fully realize was still active sat on the books behind him. Exactly why Layton specifically is not established in the available record, and nothing is speculated here on that point.</p>
<p>Packing my belongings and crossing state lines toward Utah on February 1, 2025 still felt, at the time, like an unprecedented kind of freedom after eight years of entanglement with Mississippi's court system — the day-to-day terror of a bond violation or a banishment infraction lifted the moment I was out of custody and out of the state. Whether that specific sense of legal freedom was accurate to my actual standing at that moment, given what the order I've now read actually says, is a separate question from how it felt.</p>
<p>The broader legal fight did not end here either way. Reardon v. Osteen, the federal civil rights suit against the Galveston officials and the Mississippi officials named alongside them, remained active and would go on to produce the magistrate's findings and the Osteen concession detailed in Chapter 24. And a separate Mississippi appellate matter — Reardon v. State, 2024-KM-00839-COA — was still working its way through the Mississippi Court of Appeals, and would produce, roughly thirteen months later, a reversal covered next, one that would sit in direct and pointed contradiction with a sworn federal affidavit Circuit Clerk Jeff Busby had filed just months earlier.</p>
<p>Layton itself was not the clean break I expected. I filed Reardon v. Layton City, et al. in the District of Utah, naming Layton City, the Layton Police Department, Lt. Richins, Mark Arrington, and — carried over from the Mississippi side of my life — Oxford Police Captain Hildon Sessums and Oxford Police Chief Jeff McCutchen. The suit alleged that Sessums, an Oxford Police Department captain and a graduate of the FBI's National Academy, had run what I characterized as illegal surveillance on me and had my personal address distributed — I was told, and believed, to as many as 139 different law enforcement officers around the country — carrying inaccurate information about who I was and what I had done. That characterization is mine; I have not independently documented the full distribution list, and I present it here as my own sworn allegation rather than an adjudicated fact.</p>
<p>What is on video, and what I can describe firsthand, is what happened at the FBI's Salt Lake City Field Office in the days after I filed that suit. I drove to the field office to hand-deliver a sworn declaration — already filed with the court — asking the FBI to treat the underlying conduct as a federal matter. Agents at the guard shack would not accept it without first running a background check on me. I stood on the same ground I had stood on for eight years in Mississippi: a victim reporting a crime should not have to surrender a background check as the price of being heard. So I stayed in the visitor parking lot, outside the gate, reading my own declaration aloud into my camera. I was on roughly the seventh page when two agents came out of the guard shack and told me, without any other exchange, that I had one warning to leave or I would be charged with trespassing. A third agent walked around my car and wrote down my license plate. I told him to get out of the way; he said he was just getting my tag number. All of it is on video.</p>
<p>I called the field office afterward to ask a simple, specific question: was the visitor parking lot — public-facing, outside the gate, where visitors are directed to park — private property the FBI could exclude a journalist and litigant from at will? Neither the operator who answered nor "Brett," the on-duty special agent who took the escalated call, would give me a straight answer. Brett told me he hadn't even heard about the Monday incident from his own colleagues. I asked to speak to a supervisor instead of another agent; the call went on for the better part of two hours without anyone ever answering the actual constitutional question I opened with. I released the full, unedited call publicly after an earlier, shorter clip was pulled from my channel — a decision I read as the platform, not the FBI, doing the censoring, though I note that distinction only because it is the honest one.</p>
<p>I include this scene not because I can prove what Sessums did or didn't distribute, or why two federal agents chose confrontation over simply taking a piece of paper out of my hands. I include it because the pattern by now should be familiar to anyone who has read this far: a citizen tries to put something on the record through the front door, and the front door treats the attempt itself as the threat.</p>
<h3>The Call to Oxford</h3>
<p>Three days after the confrontation in the FBI's Salt Lake City parking lot, I picked up the phone and called the Oxford Police Department directly. I wanted Captain Hildon Sessums on the line. I did not get him.</p>
<p>A dispatcher named Kayla told me Sessums was "in a meeting." I asked how long he'd been in that meeting, because he hadn't been answering his phone all day, and I told her exactly what I thought of a captain who apparently had time to run illegal surveillance on a private citizen but no time to answer for it. She offered to take a message. I asked for Chief Jeff McCutchen instead. He was in, on another line. I held.</p>
<p>When McCutchen finally picked up, I didn't waste the opening.</p>
<p>"Jeff, what the hell is wrong with your department? Y'all ought to be ashamed of yourselves. I didn't realize what a snake in the grass you were, for one — that came out clear enough with the records request I sent to MBI [the Mississippi Bureau of Investigation]. Now we've got your Captain Sessums running illegal surveillance. You want to ask me how I know it was illegal, and how I know y'all wasted city and state resources doing it? Just ask me."</p>
<p>"How do you know?" he said.</p>
<p>I told him: I dug up the emails. Less than four days after I moved into my house in Layton, Utah — before I had even signed the lease, before I had told a single soul where I lived — Sessums already had my address, and he disseminated it out to the Layton Police Department. I asked him how his captain got that address, reaching across state lines into a city and a state where Oxford PD had no case, no warrant, and no legitimate reason to be looking. I told him the Department of Justice had already been contacted, that a complaint had already gone to the Mississippi POST Board, and that another was going to the ACLU.</p>
<p>McCutchen didn't deny any of it. What he said was: "I mean, do you feel better now? Does it make you feel better?"</p>
<p>I told him I wasn't done. I told him I wanted to know how he slept at night, and he came back with the only real rejoinder he offered in the entire call: "You're calling me corrupt. I'm calling you corrupt. What are you going to do about it? Can you prove it?"</p>
<p>So I did. I went back to June 20, 2022 — a visit to Oxford City Hall to make a public-records request as a journalist, where I was told to leave, and warned that if I came back I'd be arrested for trespassing and for violating the Tannehill restraining order. I told him I said fine, I'd take that up with the court, the way it was supposed to be taken up. Instead, eight days later, Oxford PD went around the court entirely, opened an MBI investigation, and by the time it was over I was charged with aggravated stalking for a visit to a public building where I never touched the mayor's door, never asked to see her, and never saw her. I told him that arrest landed while my four-month-old son was in the hospital fighting for his life, and that my wife lost her job because she had to make his appointments alone — because her husband was sitting in jail on a charge I believe Jeff McCutchen set in motion.</p>
<p>Then I went back further, to the 2017 Tannehill restraining-order petition itself — paragraph 18, the line claiming "numerous people" had contacted Oxford PD to report that I was dangerous. I told him I'd requested every police report generated on me during the exact month that petition was filed, May 2017. There were three. One of the three has the responding officer's own words in it stating I was <em>not</em> a threat. Three reports, one of them affirmatively clearing me, is not "numerous people" reporting a dangerous man — it's the opposite of what the petition claimed under oath.</p>
<p>And then the detail that still sits with me more than any other from that call: May 26, 2017 — the day four senior officers ambushed me on the courthouse square and arrested me for aggravated stalking — has no police report at all. Not one. A restraining order can cite "numerous" phantom complaints from a month with three exculpatory reports in it, and the arrest that followed the very next day apparently generated no paperwork whatsoever. I said it to him plainly: why is there no report for the day you actually took me into custody?</p>
<p>McCutchen never answered that question. He never answered the address question either. What he offered, across seven minutes, was "do you feel better" and "prove it" — not a denial, not an explanation, not a single word accounting for how his captain had my new Utah address before I did. I don't know for certain what Sessums did with that information once he had it, or why. I know what the paper trail says: an address obtained days after a lease was signed, sent to a police department in a state where Oxford had no jurisdiction and no case. I include the call itself, word for word as it happened, because a recorded phone call speaks for itself in a way no summary can. McCutchen is a named defendant in <em>Reardon v. Layton City</em> alongside Sessums for exactly this reason.</p>
<h3>The Building on 200 East</h3>
<p>The Salt Lake City confrontations didn't stop at the FBI Field Office or a phone call to Oxford. A separate visit — same city, same general period, a different federal building entirely — turned into the longest standoff of them all.</p>
<p>The address is 660 S 200 E, Suite 400, in Salt Lake City. The building holds U.S. Citizenship and Immigration Services on the fourth floor, where people go to take their oath and become citizens. The ground floor, where I started, is a patient-access lobby for a healthcare unit. I walked in filming, the way I've filmed in public buildings for years.</p>
<p>A security guard stopped me almost immediately: "This is a state and federal building. Right now we don't allow that because of what happened with 9/11. You have to have permission from state or federal." I told him I had a First Amendment right to be there. He told me to stop filming. I told him no.</p>
<p>A woman who introduced herself as Monica, working the healthcare desk, was more reasonable about it than anyone else in the building that day. She explained that immigration was upstairs on the fourth floor — that's what I was actually there to document — and that the ground floor was patient-access space governed by HIPAA. I pointed out that HIPAA doesn't apply in a publicly accessible lobby, which she more or less conceded, and she told me I could stay right where I was as long as I didn't approach the desk itself. That should have been the end of it.</p>
<p>It wasn't. The security guard came back after a call to his supervisor and told me I could film in lobbies but not in "suites." I asked for his name. "Security guard number two, sir," he said, and threatened to call Salt Lake City PD if I kept it up. I told him to go ahead.</p>
<p>Eventually the building's manager got on the phone, then came out in person. He declined to give me his real name — "you can call me good citizen" — and told me flatly that the building was not public: "It's not funded by public funds. It's a privately owned building. And so you're trespassing." I pointed to the posted federal signage — the Rules and Regulations Governing Conduct on Federal Property notice — as proof the building was subject to federal public-access rules regardless of who technically owned the lease. He told me I was "actually getting ready to go to jail." I told him I'd have that conversation with the police when they arrived, and to go ahead and call them.</p>
<p>While I was talking with USCIS staff upstairs about the naturalization process — genuinely just trying to understand what happens on that floor — I mentioned, on camera, that I'd had "the same issue with the FBI over in Salt Lake City," where an agent wouldn't discuss a crime I wanted to report without my first submitting to a full background check. I bring that up here because it matters for the record: this was a different building, a different agency, and a different day from the FBI Field Office parking lot. Two separate federal-property confrontations, same city, same stretch of time.</p>
<p>Salt Lake City police showed up and the standoff ran for the better part of an hour and a half. At one point, close to an hour in, I asked the officers directly: "Am I being arrested for trespassing? Can I speak to the officer?" They spent much of the remaining time relaying back and forth with the building manager and, by their own account, checking with a supervisor. Near the end, an officer told me they'd be issuing "a notification of trespass" because the building was privately owned, and then demanded my identification. I told him I was already on my way out — which I was. I told him I intended to sue over it. He explained, evenly enough, that a private property owner can trespass someone for disrupting operations, whether or not the building happens to house a federal agency.</p>
<p>I don't know, and I'm not going to pretend to know, whether that guard, that manager, or those officers were right on the underlying public-versus-private-property question — the posted federal signage and the "leased, not owned, by the government" argument point in different directions, and it's exactly the kind of question a §1983 claim is built to resolve, not something I can settle by asserting it harder on camera. What I can say is what happened: ninety minutes, three separate people telling me three different things about who controlled that lobby, and a trespass notice at the end of it for standing in a building where, four floors up, strangers go every week to become citizens of this country.</p>
<h3>A Complaint Nobody Answered</h3>
<p>In February 2025, I filed a formal complaint with the U.S. Department of Justice's Office of the Inspector General in Washington. I read it into the camera in full, because I wanted a record of exactly what I'd said and exactly when I'd said it, independent of whatever the OIG chose to do with it.</p>
<p>The complaint was about the FBI's failure to investigate what happened around my October 2022 attempt to report public corruption. On October 28, 2022, I went to the FBI's field office in Oxford, Mississippi, to report misconduct involving the Holly Springs Police Department and the Lafayette County Sheriff's Department. I'd confirmed beforehand that I could walk in. When I got there, no agent was available. That visit — an actual attempt to report a crime — was later used against me in the probation revocation that put me in custody for a year.</p>
