<p>To understand the weight of that August 10 revelation, one must look back to May 24, 2017, during the initial investigative push that gave birth to the original stalking charges. On that day, Investigator Alex Bundren of the Lafayette County Sheriff's Department engaged in a telephone conversation during which he systematically reviewed my public Facebook page, scrutinizing my online posts, social connections, and public statements to assemble the evidentiary foundation for my arrest. That May 24 phone call was a pivotal moment in the investigation; it represented the exact point where law enforcement surveillance intersected with my digital footprint. Yet, despite repeated discovery requests and subpoenas issued throughout my criminal defense, all official logs, notes, and memorializations of that May 24, 2017 call were withheld by law enforcement authorities. The August 10, 2020 call exposed that David O'Donnell was actively involved in facilitating or supporting the Sheriff's Department's decision to keep those investigative records shielded from disclosure.</p>
<p>The withholding of the May 24, 2017 investigative notes was far from a technical oversight. In criminal practice, police logs detailing real-time social media monitoring provide vital context regarding investigator bias, the sequence of evidence gathering, and whether law enforcement acted upon verified facts or external pressure. By tying O'Donnell to the suppression of those notes, the August 10 call highlighted a persistent pattern: whenever my defense sought to examine the foundational records of the 2017 prosecution, key documents were either declared non-existent, held behind attorney-client privilege claims, or quietly withheld by law enforcement officials working in tandem with local legal counsel.</p>
<p>It was during these same summer weeks of 2020 — specifically within a series of text messages exchanged between June 25 and June 27, 2020 — that I laid out to Christi McCoy, Phyllis Crowder's own attorney in the custody matter, a detailed theory that demands careful, cautious examination: the notary-fraud theory [CLAIM].</p>
<p>As I have described it, Crowder's attorney at the time, Mona Pittman, filed a false or materially incomplete Chancery Court custody petition on August 26, 2017. That filing was executed with extraordinary haste, lacking proper statutory summons served upon me, and was specifically timed to serve a tactical purpose outside the Chancery Court: reducing Crowder's immediate criminal sentencing exposure in a separate, pending false-reporting case in Olive Branch, DeSoto County. Facing potential incarceration or heavy penalties in DeSoto County, Crowder needed to demonstrate to the sentencing judge that she was an active, responsible mother actively pursuing legal custody of her child in Lafayette County Chancery Court. A stamped custody petition provided immediate documentary proof of an open family law proceeding. According to my claim, Pittman fast-filed the incomplete petition on August 26, 2017, to secure that essential court stamp for the Olive Branch court, and later filed a corrected, "true" version of the custody petition while re-using the identical notary stamp and jurat block from the original filing.</p>
<p>This notary-fraud theory cannot be independently verified through a state bar disciplinary finding, an official notarial audit, or an explicit judicial ruling, and no such formal documentation exists within the public records available to me. It is included here, clearly labeled as an unverified claim [CLAIM], because an honest evaluation of this timeline requires examining the internal logic of the arguments raised during that period. What gives the notary theory its internal coherence is its precise alignment with external incentives and deadlines. The August 26, 2017 filing date directly corresponds with the critical window of Crowder's sentencing calendar in Olive Branch. The motive — establishing a legal custody footprint to mitigate criminal exposure in another jurisdiction — provides a rational explanation for expediting a defective filing without waiting for proper service of process. Re-using a previously executed notary block on a revised petition is a known procedural shortcut in busy law practices, even if it violates strict statutory notarization standards.</p>
<p>At the same time, an alternative, benign explanation exists that must be given equal weight. Family law practices routinely encounter procedural defects in initial pleadings. Attorneys frequently file amended or supplemental petitions to cure technical errors, update factual assertions, or correct jurisdictional defects identified by court clerks. What I perceived as a deliberate, fraudulent scheme to manipulate court records and influence a criminal sentencing hearing could just as plausibly have been an ordinary administrative correction by a busy practitioner, viewed through the lens of a litigant who had developed a deep, justifiable skepticism toward every procedural anomaly in Lafayette County.</p>
<p>The reader is entitled to weigh that theory independently, with its limitations clearly stated. Yet, to fully comprehend why I viewed these judicial and administrative irregularities with such intense skepticism, one must look beyond the immediate boundaries of my individual case files and examine the broader institutional framework governing Lafayette County law enforcement and court administration — an institutional ecosystem frequently described by local observers as 'The Oxford Machine.'</p>
<p>In April 2026, investigative reporting published by wtpnews.org brought to light a major financial scandal that illustrates the entrenched, self-policing dynamics of this local establishment: the $34,000 Metro Narcotics Unit scandal. The Metro Narcotics Unit, a multi-jurisdictional drug enforcement entity operating in Lafayette County and Oxford, was funded through municipal and county taxpayer allocations under the oversight of local elected officials. According to the investigative reporting by wtpnews.org, the financial irregularities began around 2014, when approximately $4,000 first disappeared from the unit's secure lockbox maintained at the First National Bank of Oxford. The Federal Bureau of Investigation conducted an inquiry into the missing funds, but federal prosecutors ultimately concluded there was insufficient evidence to bring formal criminal charges against any individual officer or administrator.</p>
<p>The financial drain, however, did not cease with the initial FBI inquiry. In late 2015, during a formal change-of-command inventory within the agency, an additional $30,000 was discovered missing from the unit's lockbox, bringing the total stolen sum to $34,000 in cash. The individuals who conducted that inventory and uncovered the $30,000 shortage were incoming Oxford Police Chief Joey East and Chief Deputy Scott Mills.</p>
<p>Here lies the critical structural conflict exposed by the wtpnews.org investigation: Joey East was not merely an independent investigator stepping in to audit a compromised agency. He was himself an authorized signatory on the First National Bank of Oxford lockbox from which the $34,000 had vanished, AND he was one of only two individuals who "discovered" the second $30,000 shortage during the internal inventory. In any standard law enforcement structure, an individual with direct signature authority over a compromised bank account cannot conduct a neutral, objective investigation into missing cash from that same account. Yet in Lafayette County, East oversaw the internal accounting process, effectively creating a self-investigation conflict of interest that insulated key local figures from external accountability.</p>
<p>The institutional connections ran even deeper across county government. Joey East was the son of F.D. "Buddy" East, who served as the long-time Sheriff of Lafayette County for nearly four decades, building one of the most powerful political dynasties in North Mississippi. Before running for Sheriff himself, Joey East sat on the Metro Narcotics Control Board, the governing body responsible for overseeing the unit's operations and financial accounts. Following his father's passing, Joey East ran for Lafayette County Sheriff, won the election, and was officially sworn into office in January 2020.</p>
<p>Simultaneously, Jeff Busby served for eight years as President of the Lafayette County Board of Supervisors, the primary county governing body responsible for approving municipal budgets and allocating local taxpayer funds to the Metro Narcotics Unit during the very years that the $34,000 went missing. In 2019, Busby ran for Circuit Clerk of Lafayette County — the chief administrative officer responsible for managing all Circuit Court records, dockets, and jury selection processes — and took office in January 2020, the exact same month Joey East assumed office as Sheriff.</p>
<p>This real, previously published reporting from wtpnews.org highlights the closed loop of authority that defined Lafayette County's legal and political landscape in 2020. The same public officials who funded law enforcement agencies as supervisors later managed the court records as Circuit Clerk; the same law enforcement figures who held signature authority over missing lockbox funds oversaw the internal audits and assumed the highest law enforcement office in the county. When I filed my post-conviction relief motion L20-316 in July 2020, challenged the unexplained judge swaps between Judge Smith and Judge Luther, questioned the disappearance of online docket entries, and confronted withheld police notes involving David O'Donnell and Investigator Alex Bundren, I was not operating in a vacuum. I was navigating a legal system governed by an interconnected political network where administrative discretion, court records, and law enforcement authority were tightly held within a small circle of long-tenured officials.</p>
<p>The next chapter shifts focus from the Circuit Court dockets and law enforcement leadership to a parallel, equally relentless pressure point: Child Protective Services, and a recurring series of anonymous allegations that Madelyn and I would confront directly during a recorded July 2020 home visit, describing them in our own words as happening "three years in a row."</p></section><section class="chapter"><p class="cnum">Chapter 10</p><h1>Three Years Running</h1><p>On July 7, 2020, a Child Protective Services caseworker arrived at Madelyn's and my home in Lafayette County to investigate an anonymous hotline report alleging child neglect and domestic instability. The entire interaction was recorded on audio, and that contemporaneous recording stands as one of the most significant evidentiary items preserved from this period of the conflict. Its value does not stem from being an objective or neutral tribunal finding — it is self-evidently not neutral, as both Madelyn and I were speaking in our own defense to a state investigator whose duty was to weigh our statements against allegations in an official case file. Its true evidentiary weight lies in its contemporaneous nature. It records exactly what Madelyn and I articulated to a state welfare investigator in real time in July 2020, years before these events were organized into a published narrative, making it distinct from a retrospective explanation constructed after the fact to support a specific legal position.</p>
<p>On that July 7 recording, Madelyn and I laid out a clear, recurring pattern to the caseworker: that Phyllis Crowder had instigated child welfare reports against us three years in a row. Each report occurred within a tight three-month calendar window, and each, according to our detailed observations, was directly correlated with a pregnancy or a miscarriage occurring in Crowder's own life. During that same recorded conversation, we characterized Crowder as an individual whom we believed suffered from "multiple personality disorder." That characterization is recorded here strictly as our own lay assessment offered during an intense, high-stakes home interview, rather than as a verified psychiatric diagnosis possessing medical or judicial standing.</p>
<p>This chapter approaches that July 2020 recording with the same rigorous evidentiary framework applied to the notary-fraud theory in the preceding chapter: treating it as valuable, highly relevant evidence while clearly establishing its inherent limitations. Statements made by interested parties defending their parental rights during an active child welfare investigation do not constitute conclusive proof of the facts asserted. However, dismissing contemporaneous statements merely because they originate from interested parties would create its own profound distortion — a distortion I have deliberately avoided when analyzing Phyllis Crowder's statements regarding the November 2018 incident, Chief Joey East's sworn deposition testimony, or Circuit Clerk Jeff Busby's administrative correspondence. Interested-party statements are recognized legal evidence. While they carry less probative weight than an official docket entry or a certified bank ledger, requiring the complete exclusion of every statement made by someone with a personal stake in the outcome would erase nearly the entire evidentiary foundation, as virtually every actor in this narrative had significant interests at stake.</p>
<p>Beyond our personal assertions on the recording, the structural reality of repeating investigations is established by the recurring administrative record itself: multiple Child Protective Services referrals originating from the same source across three consecutive years, none of which resulted in a substantiated finding of abuse or neglect against Madelyn or me. In child welfare practice, a single unsubstantiated report provides minimal evidence of malice or bad faith. State child protection frameworks, including the Mississippi Department of Child Protection Services operating under Mississippi Code Annotated Section 43-21-353, are intentionally designed with a low reporting threshold. Centralized hotline systems encourage immediate reporting of suspected child mistreatment, accepting a high rate of false positives as a necessary institutional cost to ensure genuine child abuse is detected and intercepted before harm occurs. Consequently, an unsubstantiated determination simply means the investigating caseworker found insufficient evidence to validate the allegation; it does not automatically prove the reporter acted in bad faith.</p>
<p>However, a pattern of annual, unsubstantiated reports originating from the same reporting source, adhering to a predictable seasonal schedule and coinciding with documented milestones in the reporter's personal life, represents a fundamentally different category of evidence. While still short of conclusive legal proof of bad faith, such a pattern demonstrates a systemic failure within the child welfare apparatus. A functioning child protection system ought to possess administrative mechanisms to identify recurring, unverified reports from a single source, allowing caseworkers to weigh the credibility of subsequent allegations rather than processing each intake as an isolated, unweighted emergency.</p>
<p>A separate audio recording, created during the same summer window of 2020, introduces another specific evidentiary element into this picture, though it requires the same careful qualification. The recording captures a tense conversation inside an automobile, where I am heard speaking directly with Christi McCoy — Crowder's attorney in the ongoing custody litigation, and a figure consistently recognized throughout this narrative as an ethical advocate operating squarely within professional boundaries. On that tape, I state directly to McCoy that I have secured "two police reports where Crowder told deputies CPS said I couldn't see Lydia," and further assert that I possess "two recordings speaking to CPS where they flat out say she is lying and the reports have been closed out as lies."</p>
<p>If those two specific recordings exist in the exact form described during that conversation — featuring state child welfare caseworkers explicitly confirming on tape that Crowder's reports were unfounded and closed due to fabrication — they would constitute considerably stronger objective evidence than the pattern-based inferences drawn from the July 2020 home visit. However, those two specific audio recordings have not been independently located or verified within the available case archive. That evidentiary gap is acknowledged directly here, rather than treating oral references on a phone call as equivalent to reviewing the primary audio files themselves.</p>
<p>There is no indication in the available state records that the Mississippi Department of Child Protection Services, or the specific county caseworkers in DeSoto and Lafayette counties, ever formally flagged this three-year sequence of unsubstantiated reports or modified their investigative protocols when handling subsequent hotline calls concerning our family. That administrative inaction does not necessarily demonstrate official bias or corrupt intent on the part of CPS staff. It frequently reflects the rigid, compartmentalized nature of state welfare bureaucracies, where individual caseworkers handle heavy caseloads and process each incoming intake as an isolated event, bound by statutory mandates that prioritize immediate child safety assessments over historical cross-referencing. While that design choice has obvious child-protection justifications — preventing caseworkers from dismissing a valid abuse report simply because a reporter has repeatedly filed unverified claims in the past — it imposes an extraordinary, ongoing toll on targeted parents who must repeatedly open their homes to state scrutiny.</p>
<p>This chapter does not resolve whether Crowder's recurring CPS reports were driven by genuine, albeit mistaken, concern, by calculated tactical maneuvering to gain leverage in Chancery Court, or by a complex psychological state encompassing elements of both. What the contemporaneous July 2020 recording conclusively establishes is that Madelyn and I were detailing this precise pattern — three years running, three-month windows, aligned with pregnancies and miscarriages — to a state investigator years before any formal written narrative was constructed. The consistency of those assertions across contemporaneous audio files demonstrates that our claims were not retrospective fabrications, but real-time responses to a continuous pattern of administrative interference.</p>
<p>By the close of 2020, the struggle over evidence had expanded across every level of local government. In the Circuit Court, my post-conviction relief motion L20-316 had been summarily denied by Judge Luther, the docket record had briefly vanished from public online view, and judicial assignments had shifted without explanation. In the Chancery Court and child welfare system, recurring anonymous hotline reports and contested custody filings created constant domestic friction, backed by attorney involvement that touched upon suppressed law enforcement notes involving David O'Donnell and Investigator Alex Bundren. Dominating all of it was the institutional backdrop of Lafayette County governance — where figures like Sheriff Joey East and Circuit Clerk Jeff Busby operated within an entrenched political structure shaped by past financial scandals like the $34,000 Metro Narcotics Unit lockbox shortage.</p>
<p>As 2020 turned into 2021, the focus of this conflict shifted away from domestic custody disputes, child welfare visits, and post-conviction court filings. The battleground moved directly onto the roads and highways of Lafayette County, where my growing confrontations with local law enforcement would escalate dramatically — beginning with a February 2021 traffic stop by Deputy Kandi Beavers that would become one of the most pivotal and consequential events in this entire account.</p></section><section class="chapter"><p class="cnum">Chapter 11</p><h1>The February 2021 Dui Setup</h1><p>On February 21, 2021, Deputy Kandi Beavers stopped me and claimed to smell marijuana in my vehicle, initiating what she characterized as a DUI investigation. Emergency blue lights flashed in my rearview mirror on a dark Lafayette County road, cutting through the chilly night air as I pulled over to the gravel shoulder. When Deputy Beavers approached my driver-side window, her flashlight beam swept across the car interior before she demanded my driver's license, vehicle registration, and proof of insurance. Almost immediately, she asserted that she detected the odor of burning or raw marijuana emanating from inside the cabin. I knew instantly what that assertion signified in Mississippi law enforcement practice. An officer's statement that she smells marijuana is the ultimate unchallengeable pretext: under state law, it establishes immediate, warrantless probable cause to search a vehicle's passenger compartment and provides reasonable suspicion to detain a driver for an extended roadside sobriety investigation. I stepped out onto the cold asphalt under the bright glare of cruiser spotlights, watching Beavers prepare to conduct roadside physical tests while I stood on the shoulder, acutely aware that whatever transpired would form the foundation of a criminal prosecution. That stop is the origin point of a conviction — I would be found guilty of DUI and related misdemeanors in Lafayette County Justice Court on November 24, 2021 — and it is also the origin point of the single most consequential piece of testimony against Beavers's own credibility I have, testimony that would not surface until nearly two years later and would ultimately help unravel a much larger prosecution than this one.</p>
<p>To understand the procedural and legal mechanics of that night, a lay reader must understand what a DUI stop investigation legally requires under Fourth Amendment jurisprudence and Mississippi statutory law. A constitutionally valid traffic stop begins with reasonable, articulable suspicion that a traffic violation or crime has occurred. Once a vehicle is stopped, an officer cannot arbitrarily prolong the detention without developing additional reasonable suspicion. However, under long-standing Mississippi precedent — such as Townsend v. State — an officer's sworn assertion of smelling marijuana instantly unlocks the legal authority to search the entire passenger compartment without a search warrant and prolong the stop. In standard DUI practice, officers then administer National Highway Traffic Safety Administration (NHTSA) Standardized Field Sobriety Tests (SFSTs), including the Horizontal Gaze Nystagmus (HGN), Walk-and-Turn, and One-Leg Stand tests. While these physical agility tests were validated primarily to detect alcohol impairment, officers routinely apply them to alleged drug impairment, despite the absence of scientific consensus linking physical balance tests directly to specific blood concentrations of tetrahydrocannabinol (THC). For alleged drug DUI enforcement, advanced protocols typically require a certified Drug Recognition Expert (DRE) to conduct a multi-step evaluation. Furthermore, under Mississippi Code § 63-11-5, the state's implied consent law, drivers face administrative license suspensions for refusing chemical testing, though drug testing requires blood or urine draws performed by certified medical personnel following strict chain-of-custody protocols. In cases where no chemical breath test indicates elevated blood alcohol concentration, the entire prosecution hinges on officer observations, field agility performance, and alleged physical evidence — making objective video recording the single most vital piece of evidence in the entire case.</p>
<p>This chapter is deliberately titled with the word "setup," and that word deserves scrutiny before it's used, since loaded language should be reserved for places the record actually supports it. Here is what the record supports, and it is not the version I have told for years. I have long said Sheriff Joey East testified that the footage from this stop was "gone forever." Having now listened to the November 2021 trial audio in full, he never used those words, and neither did anyone else — that was my paraphrase, repeated until I mistook it for a quotation. Chapter 14 sets out the correction at length. In short: there was no dashcam and no bodycam; the field sobriety test was performed indoors in the detention center sallyport, where cameras do exist and where no one activates them on request; sallyport footage is withheld from the public as a matter of stated policy — "we don't give them out" — and survives about <strong>seven days</strong> unless someone asks or a judge orders it. And at that same trial, the department's own parking-lot video from another charge had been preserved and produced, prompting the question of how one could be preserved and not the other, and the answer, from the stand, that the sallyport video "could have been" preserved too.</p>
<p>A sheriff who tells a court that evidence is irretrievably lost, and later testifies under oath in a different proceeding that his department's video retention practice is actually selective rather than uniformly automatic, has said two things that cannot both be fully true in the way each was originally presented. That does not prove the February 2021 stop was fabricated. It does mean that when my account of that stop and Beavers's account of it diverge, and the footage that might have resolved the dispute is unavailable, the unavailability itself carries a credibility cost — one that lands on the department's own testimony, not on my version of events by default. Under the legal doctrine of evidentiary spoliation, when law enforcement agencies fail to preserve mandatory dash-camera or body-worn camera recordings that are central to a criminal prosecution, courts and observers are entitled to scrutinize what those missing tapes would have revealed. When selective preservation replaces uniform archiving, the missing video is no longer a neutral administrative error; it becomes a structural evidentiary defect that undermines the government's burden of proof beyond a reasonable doubt.</p>
<p>Kandi Beavers's role does not end with this traffic stop, worth flagging clearly here at her introduction into this narrative, so a reader encounters her name in Chapter 11 already primed for what recurs in Chapter 22: in November 2022, Beavers's testimony would be the central evidence supporting a probation-revocation finding against me in the second, separate stalking case detailed later — testimony examined against the certified transcript in Chapter 21 -- where a prosecutor asked her whether I had lied and she answered yes, on hearsay, while her own cross-examination confirmed I had given the Sheriff's Department the advance notice my order required, contradict what she told the court. That episode is fully addressed in its own chapter. It belongs here only as a marker: the deputy who initiated this February 2021 stop is the same deputy whose sworn testimony would, a year and a half later, send me into Mississippi custody for approximately a year, on testimony treated here as false.</p>
<p>None of that retroactively proves the February 2021 stop itself was improper. Traffic stops based on an officer's claimed odor of marijuana are common, legally sufficient under Mississippi law to justify further investigation, and not inherently suspicious on their own terms — officers make this kind of stop constantly, and most of the time it is exactly what it appears to be. What makes this particular stop worth its own chapter is not the stop itself but everything that surrounds it: the officer who conducted it would later be found to have given false testimony in a related matter; the footage that might have settled any factual dispute about the stop is unavailable, under circumstances the sheriff himself has described in two mutually contradictory ways; and the resulting conviction feeds directly into the aggravated-stalking sentencing enhancement structure detailed in Chapter 17, because Mississippi's repeat-offense stalking statute looks at a defendant's record within a lookback window, and a DUI conviction sitting on that record in 2021 is part of the broader picture a court would weigh when the second stalking case arrived in 2022.</p>
<p>The November 2021 trial that grew out of this stop is covered in full in Chapter 15, alongside the eight other charges I faced that same day — three separate events, nine charges, an outcome that split cleanly down a line hard to read as coincidental: guilty on every charge brought by the Lafayette County Sheriff's Department, not guilty on every charge Phyllis Crowder herself brought.</p>
<p>Between the February 2021 DUI stop and the confrontations of mid-summer 2021, my personal life was straining under the weight of unrelenting legal pressure and official conflict. In July 2021, while Madelyn and I were living in Bruce, Mississippi, a huge fight between us escalated to the point that the police were called out to the house. What followed was an arrest for family disturbance. On their own initiative, and on our own property, officers searched my car without my consent and reported finding drug paraphernalia inside it — a search I have maintained from the start was never consented to, and that came against a vehicle whose window had already been knocked out, leaving it without any real security. I spent two to three days in jail on those two charges before being transferred to the Tupelo Crisis Center, where I stayed for roughly two weeks by my best recollection, for observation and evaluation during a period of severe emotional exhaustion. When I returned to Bruce, both charges — the family disturbance charge and the paraphernalia charge — were retired to my file, conditioned on staying out of further trouble, domestic or otherwise, in Bruce. Retired is not dismissed and not dropped outright; it is a file marked inactive, held in reserve.</p>
<p>That distinction mattered more than I expected, because months later the Lafayette County Chancery Court — cause CV2016-422(W), Crowder v. Reardon, Chancellor Robert Q. Whitwell presiding — reached back into that retired, inactive file and used it as a basis to act against me anyway. I have both a recording of the actual hearing and the written order the court entered. Crowder's attorney, Mona Pittman, told the judge, on the record, that because "the minor child is involved and Mr. Reardon was arrested in Bruce for possession of paraphernalia" — Bruce sits in Calhoun County, and the charge itself was a Calhoun County matter — they wanted me court-ordered into a nail-bed drug test before any further custody proceeding. I told the court directly there were no open charges, that it had been a family disturbance and everything had been retired to the file. Chancellor Whitwell's own written order, entered September 14, 2021, confirms I was right about that: the charge "has been retired to the file pending Mr. Reardon's good behavior in Calhoun County," and the order states plainly the test was ordered "not to prove that charge or incriminate him of that charge." That did not stop the court from ordering the nail-bed test anyway and suspending my visitation pending the results — the order I was contesting as, in substance, the state using a closed, inactive file to force me into a test in a still-open, separate Justice Court matter, which I argued violated my Fourth and Fifth Amendment rights. On the hearing recording, I told the judge plainly that I had not had visitation with my daughter Lydia since May of that year — Crowder had kept her from me over a Father's Day weekend, in what I argued was already a contempt of the court's own existing order. I want to be exact here rather than approximate: by my own account, on the record, in open court, May 2021 was the last time I saw or spoke to my daughter Lydia.</p>
<p>I fought that order. I filed a Motion for Dismissal, or in the alternative for Recusal, on September 28, 2021, arguing double jeopardy and a Fourth and Fifth Amendment violation. Chancellor Whitwell denied it on September 30, 2021, ruling that "innocence and guilt have no place in Chancery Court" and that ordering the test was within the court's discretion to protect the child's best interest, regardless of whether it also touched a separate, retired criminal matter. I then filed, pro se, an Emergency Notice of Appeal and Petition for Writ of Mandamus to the Mississippi Supreme Court on October 11, 2021, and a Petition for Writ of Prohibition on November 2, 2021, both arguing Whitwell should have recused once my notice of appeal shifted jurisdiction to the state Supreme Court, and both citing his October 29, 2021 denial of my pauper's oath — denied without any written reason given — as evidence of the same bias.</p>
<p>I want to be precise about what "authority" actually meant in that moment, rather than just asserting he had none, because the fuller answer is more useful than the simpler one. Under ordinary Mississippi appellate practice, a party seeking to proceed without paying costs on an appeal is generally expected to ask the trial court — the same court whose ruling is being appealed — first; filing a notice of appeal does not, by itself, strip a trial judge of authority over that kind of ancillary, administrative question the way it does over the actual merits under review. So the pure jurisdictional version of my objection — that Whitwell had no business ruling on my pauper's oath at all once I'd noticed an appeal against him — does not hold up cleanly under general practice, and I am not going to claim it does just because it would flatter the argument. Mississippi's own appellate rule that spells out this trial-court-first sequence, M.R.A.P. 6, is written specifically for criminal cases; the civil path I was actually on runs instead off Mississippi Code §§ 11-53-17 and 11-53-19 and M.R.C.P. 3(c), and I never located — nor has anyone since — a clean, explicit civil-appellate rule spelling out the same sequence for a case like mine. That is a real gap in the analysis, not a point in my favor, and I'd rather name it than paper over it.</p>
<p>The sharper problem is not jurisdiction. It is what the denial was actually built on. Chancery staff attorney Samantha Weathersbee told me directly, in a February 2022 email I still have, that Lafayette County's practice reserves in forma pauperis status on appeal "solely" for termination-of-parental-rights cases, and that mine — a custody and visitation matter, not a termination case — did not qualify. Section 11-53-17 says the opposite on its face: a citizen may proceed without prepaying costs "in any civil action... in any court," with no such carve-out written into it anywhere. If that email accurately describes what actually happened, it means the denial rested on an unwritten local practice that conflicts with the plain text of the controlling statute — a specific, citable problem, distinct from and stronger than the broader claim that the judge simply lacked authority to rule at all. Layered on top of that: the October 29, 2021 denial itself came with no written reasoning whatsoever, just a checked box, from the same judge I had already moved, in writing, to recuse. Mississippi's civil rule does not explicitly require a stated reason the way the federal analog for federal appeals does; its total absence here is still a fair, specific thing to flag, not an invented one.</p>
<p>I want to correct my own record here rather than tell the cleaner version. The Mississippi Supreme Court did initially dismiss the appeal on December 17, 2021, for failure to pay costs — but that dismissal was recalled five days later, on December 22, 2021, "upon further review." The case stayed alive. Chancery staff attorney Samantha Weathersbee told me by email in February 2022 that Lafayette County's practice was to allow in forma pauperis status only in parental-termination cases — a reading I disputed and still dispute, since Mississippi Code § 11-53-17 says a citizen may proceed without prepaying costs "in any court" without carving out an exception. I filed a fresh IFP motion directly with the Supreme Court on February 8, 2022, raising that conflict along with the specific question of whether a trial judge whose own ruling is under appeal should be the one deciding whether the appellant can afford to appeal it. On March 7, 2022, a three-justice panel — Chief Justice Michael Randolph, Justice Coleman, and Justice Griffis — ruled directly on the substance. They denied the writ of mandamus, holding that a challenge to a recusal denial must be filed within fourteen days under Rule 48(b), that mine was untimely, and that in any event Chancellor Whitwell had not abused his discretion in denying the motion to recuse. They denied the new IFP motion in the same order. With no path left to pay the appellate costs, the Supreme Court issued its final mandate on March 29, 2022, dismissing the appeal for failure to pay costs and taxing those costs to me.</p>
<p>So the honest accounting is this: my constitutional argument about the nail-bed test itself — the Fourth and Fifth Amendment substance — was never ruled on by anyone at any level. But the recusal question was reviewed and decided against me, on the merits, by three sitting justices of the Mississippi Supreme Court, who found no abuse of discretion in Whitwell's handling of my case. I am not going to soften that by pretending the whole matter died quietly on a technicality; it didn't. Part of it did — my underlying Fourth and Fifth Amendment claim about the drug test and visitation suspension never got a ruling — but the recusal fight I built around it was actually heard, and I lost it.</p>
<p>The same hearing is also where I raised, and the court did not meaningfully engage with, the pattern I believed should have mattered at least as much as a retired paraphernalia charge: that Crowder had twice falsely accused me, of rape and of molestation, and that DHS's own records had already disproven her sworn thirteen-month claim that the agency told her to withhold our daughter from me. I asked the court, on the record, who was to say Crowder herself hadn't had the opportunity to plant what officers found in an unlocked, broken-windowed car. I am not asserting that as established fact — I have no proof she did it, only that the opportunity existed and that the court weighed a retired misdemeanor file against me far more heavily than it weighed a documented pattern of false accusation against her. From a legal and procedural perspective, warrantless searches of personal property on private residential grounds, absent consent, exigent circumstances, or a warrant, raise serious Fourth Amendment issues under established precedent — including South Dakota v. Opperman's limits on inventory searches — and using a file both sides agreed was inactive as leverage to compel a drug test in a separate proceeding sits uneasily next to the Fifth Amendment protection against self-incrimination I invoked on the record that day. I do not hide from my domestic struggles or the painful arguments that occurred with my wife Madelyn during those high-pressure months, and I do not pretend the Tupelo stay wasn't real or that I wasn't in genuine crisis that night. But legally and procedurally, what happened next — a retired file resurrected months later to justify court-ordered self-incrimination and a suspension of contact with my own daughter — is its own separate injury, distinct from whatever judgment anyone wants to make about the night itself.</p>
<p>Before reaching that November 2021 trial, though, the next three chapters follow me through the summer and fall of 2021 — a confrontation outside the Oxford U.S. Attorney's Office, a drone crash with a minor present, and the Circuit Court re-confrontation over the still-unexplained Smith-to-Luther judge swap — the one I say I watched happen twice — first raised in Chapter 9.</p></section><section class="chapter"><p class="cnum">Chapter 12</p><h1>The Oxford U.S. Attorney'S Office Confrontation</h1><p>Between July 19 and July 21, 2021, I filmed outside the Oxford office of the United States Attorney for the Northern District of Mississippi, located along South Lamar Boulevard near the historic city square. This was not, by itself, an unusual thing for me to have done by this point in my life. By mid-2021, roughly four years into the conflict with Lafayette County institutions that had traced continuously since Chapter 3, I had settled into the regular practice that would eventually earn me, in official government correspondence and court filings, the label "First Amendment auditor" — standing in public spaces to film government buildings, security personnel, and public officials, testing and documenting how those officials responded to being recorded. Whatever a reader thinks of the practice as a genre — no position is taken here on whether First Amendment auditing is a wise or generous way to spend one's time, only on whether it is lawful, which it firmly and demonstrably is — the Oxford USAO confrontation is worth its own dedicated chapter for two distinct, load-bearing reasons.</p>
<p>To understand why filming outside a federal facility is protected under the law requires examining the baseline constitutional framework governing public space. Under well-established Supreme Court precedent extending from Hague v. CIO (1939) and Schneider v. State (1939) to Perry Education Association v. Perry Local Educators' Association (1983), public sidewalks surrounding public buildings are designated as traditional public forums. In a traditional public forum, citizen expression occupies its highest level of constitutional protection. That protection extends directly to the gathering of information and the visual recording of government operations. Multiple federal appellate courts across the nation have explicitly recognized that recording police and government officials in public view is a clearly established First Amendment right — including the First Circuit in Glik v. Cunniffe (2011), the Third Circuit in Fields v. City of Philadelphia (2017), and the Fifth Circuit, which governs Mississippi, in Turner v. Driver (2017).</p>
<p>Furthermore, the United States Department of Justice Civil Rights Division has issued formal guidance to law enforcement agencies nationwide confirming that citizens possess a First Amendment right to record public officials engaged in official duties in public places. Federal Protective Service policies similarly distinguish between secured interior federal spaces and exterior areas visible from public thoroughfares, affirming that members of the public do not require a permit or official clearance to photograph or videotape federal building exteriors from public sidewalks. While government agencies retain the narrow authority to enforce reasonable, content-neutral time, place, and manner regulations — such as preventing physical obstruction of doorways or maintaining clear emergency egress — they cannot prohibit peaceful video recording on a public sidewalk simply because a federal building, official logo, or law enforcement officer appears within the camera's frame. Standing on a public sidewalk with a handheld camera is an exercise of foundational constitutional liberty, not a municipal infraction or a federal offense.</p>
<p>The first reason the July 2021 Oxford confrontation earns its place in this narrative is Police Chief Jeff McCutchen's handling of the incident, which belongs in a small but real column of institutional actors who did their jobs correctly even while dealing with a citizen many of them found exhausting. McCutchen provided me a same-day copy of the official police report generated from the encounter — a level of transparency and administrative speed that stands in sharp contrast to the FOIA stonewalling, missing video footage, altered logs, and seven-day-window evidentiary vanishings that recur throughout the Lafayette County side of this timeline. In a law enforcement environment where basic public records were routinely delayed for months or denied outright, McCutchen's immediate, unprompted production of the incident report without forcing me into administrative litigation was a notable exception.</p>
<p>It is necessary to be explicit about Chief McCutchen's role in the broader landscape of this dossier. McCutchen is not a bad actor in this narrative, and he should not be lumped indiscriminately into the broader apparatus of official hostility described in surrounding chapters. His overall record across my years in Oxford is admittedly mixed, not uniformly favorable, and this narrative does not launder or sanitize that history; McCutchen would later refer my auditing and social media activity to state investigative authorities, as detailed in subsequent proceedings. But when an institutional figure acts with professional restraint, adheres to public records mandates, and treats a challenging citizen with basic procedural fairness, that conduct must be recognized plainly. Same-day police report production to the subject of an active law enforcement encounter, delivered without a fight or an administrative hurdle, is a small, genuine data point in McCutchen's favor, and it is worth crediting exactly as much as it deserves — no more, no less.</p>
<p>The second reason this chapter earns its place is a recorded remark, caught on my own audio and video footage from the encounter, in which Chief McCutchen referred to Assistant U.S. Attorney Bob Norman as "blowhard Bob." It was a small, candid, almost throwaway line, spoken in the unvarnished tone one local law enforcement official uses when discussing a federal prosecutor, assuming the exchange is private or that its context will never travel beyond the sidewalk. It traveled. The microphone recorded it clearly, preserving a rare glimpse into the internal perceptions of local law enforcement officers coordinating with federal prosecutors in Oxford.</p>
<p>The remark matters here for a narrow, highly specific, and load-bearing reason: Assistant U.S. Attorney Bob Norman is the exact same federal prosecutor whose office arranged the May 25, 2017 FBI interview referenced in Chapter 6 — the pre-arrest interview whose official FBI Form 302 later vanished from the public record. Norman's professional email address (bob.norman@usdoj.gov) appears repeatedly across official correspondence, including late 2020 and early 2021 communications in which I sought federal civil rights intervention regarding local law enforcement abuses in Lafayette County. A local police chief's private, recorded assessment of that same federal prosecutor as a "blowhard" does not legally prove corruption or misconduct regarding Norman's handling of the 2017 missing 302 or his handling of my subsequent civil rights complaints. It does, however, provide crucial context. It reveals that Norman's domineering style, posturing, and aggressive disposition toward citizens were not viewed as measured or professional even by his own law enforcement colleagues in Oxford.</p>
<p>The confrontation itself, captured in detail on my recording from July 19–21, 2021, shows Norman stepping out of the federal building to engage directly with me on the public sidewalk, rather than remaining inside, referring me to a subordinate, or issuing a routine "no comment" through a public information officer. For a sitting Assistant U.S. Attorney, personally confronting a citizen holding a camera outside his own office building is an extraordinary departure from standard federal protocol. Federal prosecutors are trained to avoid street-level verbal altercations, to maintain institutional insulation, and to let court filings or federal law enforcement agents handle public interactions.</p>
<p>Instead of maintaining that prosecutorial distance, Norman chose direct, visible engagement. On the recorded tape, Norman stepped into the encounter with evident agitation, arguing directly with me on camera about my presence, my recording, and my ongoing grievances against his office and local officials. Rather than de-escalating the situation or ignoring a citizen exercising First Amendment rights on a public sidewalk, the region's top federal prosecutor allowed himself to be drawn into a sharp, personal exchange in full view of my camera lens. Whatever was said during that verbal back-and-forth, the bare fact that an Assistant U.S. Attorney personally confronted a First Amendment auditor outside a federal facility tells its own compelling story. It demonstrates how deeply my persistent documentation had rattled federal and local officials in Oxford by mid-2021 — seriously enough that a senior federal prosecutor felt compelled to step onto the pavement and personally attempt to manage or confront a citizen with a camera.</p>
<p>Before the pattern, though, one recording from that same spring belongs here, and it belongs here on both ledgers at once — because it documents the federal non-response I have spent this chapter describing, and it documents me becoming someone I would not have recognized in 2016.</p>
<p>On May 3, 2021, I called the Mississippi Bureau of Investigation for the fifth time. I recorded it. A staff member took my name and number, politely, the way you take a name and number from a man who has called four times already.</p>
<p>A word on that agency name, because I nearly got it wrong in this book and the way I nearly got it wrong is instructive. The machine transcription of this call renders the agency as "MBI" in places, and somebody working on my material at some point decided that must be an error and cleaned it up to "FBI" throughout. It was not an error. It was the tape being right and the annotation being wrong. The tell is in what the staffer says next: she tells me that complaints about her agency go to the attorney general's office, which is where you send a complaint about a <em>state</em> investigative bureau, not a federal one. I had already called that attorney general's office too, which is why my answer to her lands the way it does.</p>
<p>What I said to her was this:</p>
<p>&gt; <em>"I've called five times, this is the fifth time now... I've described the scandal to the T. I've produced unsurpassed amounts of evidence. At this point, the only explanation for [them] not getting in touch with me, like I've been told every time, is that they are complicit in the scandal, and I'm making the direct accusation of [the bureau] being complicit in everything going on for the simple fact of they have neglected their own duties."</em></p>
<p>She answered the only way she could: <em>"I apologize that no one has called you back."</em> And then, when I kept going: <em>"If you have any issues with our agency, it can be reported to the attorney general's office."</em> I told her the attorney general's office was just as complicit, because I had reached out there too. She said, plainly and I think truthfully, <em>"There's nothing that I can do to help you other than providing this information to someone to have them return your call. Now, at what point they do that, I have no control over that stuff."</em></p>
<p>Read that call twice, because it has two readings and they are both correct.</p>
<p>The first reading is the one I would have led with a few years ago: a citizen with documentary evidence of local corruption called his state's investigative bureau five separate times, described the allegations in detail, and never once received a call back. Not a declination letter. Not a referral. Not an agent taking twenty minutes to tell him he was wrong. Five calls into a void. Whatever else is true, that is a real thing that happened, and the referral to the attorney general's office — an office I had already contacted with the same result — is the bureaucratic equivalent of pointing at a door that is also locked.</p>
<p>The second reading is the one I owe you. By the fifth call I was accusing a state law enforcement agency, on a recorded line, of criminal complicity in a conspiracy — not on evidence that they were complicit, but on the fact that they had not returned my calls. That is not an inference. That is a man converting institutional silence into institutional guilt, out loud, to a receptionist. I want to be fair to myself and say I was careful to separate her from it — <em>"It's not you, you've passed the message along"</em> — and I want to be fairer still and admit that a person who has to say that sentence has already gone somewhere he should not be.</p>
<p>Both things are in the recording. The agency did not call back, five times. And I was, by May of 2021, a man who called a state investigative bureau to tell them they were in on it. Neither fact cancels the other, and I have stopped trying to make one of them do so.</p>
<p>This chapter closes with a necessary note about structural pattern, because pattern is what elevates an isolated sidewalk confrontation into an essential piece of institutional evidence. This exact same dynamic — a federal facility, a camera operating in public space, and an escalating confrontation with federal law enforcement personnel who choose direct engagement over de-escalation — recurs almost four years later in Lafayette, Louisiana, during the events of August 2025 detailed in Chapters 27 and 28. The Oxford U.S. Attorney's Office confrontation of July 2021 is not proof, on its own, of a coordinated multi-state campaign against me. It is, however, clear evidence that the underlying operational pattern that would eventually result in my federal arrest in Lafayette in 2025 had already executed its dry run four years earlier and four hundred miles away in Oxford, Mississippi — with identical institutional instincts, but with lower stakes and a local police chief whose professional restraint ensured it ended without an arrest.</p>
<p>The next chapter turns from federal court plazas to a far lower-stakes but more personally troubling episode from this same summer period: a drone crash near the Lafayette County Justice Court, with my young stepdaughter standing by my side.</p></section><section class="chapter"><p class="cnum">Chapter 13</p><h1>The Drone And Growing Tensions</h1><p>On September 29, 2021, I flew a drone near the Lafayette County Justice Court. It crashed into the building. My young stepdaughter was present at the time.</p>
<p>Up to this point, I've tried to reserve my harshest judgment for institutional actors — sheriffs, clerks, judges, prosecutors — precisely because they hold power a private citizen does not, and because the entire argument I'm making depends on holding power accountable to a higher standard than it holds itself. This chapter is one of the places where that same standard has to be applied to me, without softening, because the alternative — quietly minimizing an episode that reflects poorly on me while dwelling at length on every institutional failure — would be exactly the kind of one-sided advocacy I promised, from the start, not to produce.</p>
<p>There is no institutional misconduct to weigh against this one, and no need to reach for one. I flew a drone in the vicinity of a government building, with a minor present, and it crashed into that building. This was not part of my documentation or accountability-filming practice — it did not grow out of the same First Amendment auditing I describe elsewhere, and it should not be read that way. It was, on the available record, simply a drone flight that went wrong, near a courthouse, with a child nearby. That is a legitimate safety concern entirely on its own terms, independent of any legal consequence that did or didn't follow, and a fair reader is entitled to weigh it as evidence that my judgment, by this point in the conflict, was not always sound when it came to balancing the risks I was willing to take against the presence and safety of the children in my life.</p>
<p>It is worth being precise about what regulatory framework, if any, governs a moment like this, since precision about the rules is part of the discipline this account has tried to hold to throughout. The FAA regulates drone flight generally — altitude limits, airspace restrictions near airports, registration requirements — but does not categorically prohibit flying a small recreational drone near a county courthouse the way it does near, say, a military installation or a major airport's controlled airspace. Mississippi state law and local ordinances can add further restrictions, and a drone striking a government building could plausibly implicate reckless-endangerment or property-damage statutes depending on the specific facts, none of which are established here beyond the bare fact of the crash itself. None of that legal framework changes the more basic point already made: whatever the technical regulatory status of the flight, flying near a public building with a minor present, in a way that ended in a crash into that building, was not a considered decision, and it does not need a specific statute attached to it to be worth naming as a lapse in judgment.</p>
<p>Chief Deputy Scott Mills and Oxford Police Department personnel arrived at the scene. There is no independent record here of what citation, if any, resulted from the incident, and none is speculated. What is documented is the response itself — a multi-agency arrival at a drone crash near a courthouse — which is, on its face, a proportionate law enforcement reaction to an aircraft striking a government building, regardless of who was piloting it or why.</p>
<p>It would be easy to read this chapter as a minor episode, a single bad afternoon sandwiched between the more consequential events on either side of it in this timeline — the July 2021 Oxford U.S. Attorney's Office confrontation before it, the November 2021 trial after it. It earns its own chapter anyway, because of what it represents rather than what it produced: a pattern, evident by the fall of 2021, of my activities increasingly intersecting with risk to the people closest to me, not just to myself. The Facebook Live boycott in Chapter 3 risked nothing but a business relationship. The rifle purchase in Chapter 4 risked nothing on its own; it became dangerous only in the state's retroactive framing of it. By September 2021, though, the pattern has shifted. A minor stepdaughter is present at a drone crash into a courthouse. Earlier chapters document me coaching my young daughter Lydia about custody matters during recorded conversations at her mother's home — behavior that deserves to be named plainly here, not buried in a footnote, alongside everything else documented in this chapter.</p>
<p>None of this cancels out the institutional misconduct detailed in the surrounding chapters. A sheriff's department that loses exculpatory footage, a judge who won't hear a bill of sale, a prosecutor confronted on camera by a citizen he apparently took seriously enough to engage personally — none of that becomes less real or less documented because I, on the other end of those encounters, also made choices, involving the children in my life, that a careful and honest reader is entitled to find troubling. Both things are true, and this chapter's job is only to make sure both are said, clearly, in the same account, rather than one being emphasized at the expense of the other.</p>
<p>The next chapter turns to the reckoning that these several years of escalating conflict were building toward: the November 4, 2021 trial, in which I faced nine charges arising from three separate events — and in which the outcome, when it finally came, split so cleanly along institutional lines that it is difficult to read as coincidence.</p></section><section class="chapter"><p class="cnum">Chapter 14</p><h1>The November 2021 Trial</h1><p>On November 4, 2021, I went to trial on nine charges arising from three separate events accumulated over the preceding roughly nine months: the February 2021 Beavers DUI stop detailed in Chapter 11, the ongoing friction with Lafayette County Sheriff's Department personnel documented across Chapters 8 through 12, and a set of charges Phyllis Crowder had separately brought against me in the course of our long-running custody conflict.</p>
<p>The outcome split cleanly along a line flagged before and returned to now with the full record in view: I was found guilty on every charge brought by the Lafayette County Sheriff's Department. I was found not guilty on every charge Crowder herself had brought.</p>
<p>Recovered audio from the trial itself fills in some of what the bare charge sheet cannot. Deputy Wilford testified about the February 2021 Beavers stop detailed in Chapter 11, corroborating the sequence of events Beavers herself described. Deputy Dixon testified separately about the December 28, 2020 arrest referenced earlier in this account — the door-kick and the resisting-arrest allegation that followed it, an arrest I have said elsewhere, on camera, ended with deputies putting me on the ground. Dixon was not alone that day; Deputy Ethan Tidwell was present as well, and both are named in the charging paperwork this trial resolved. I do dispute one specific piece of Dixon's account, and I said so on camera at the time rather than inventing the dispute after the fact: his written statement, and his testimony, both say I told him three separate times that I would not move my vehicle. I recorded that encounter myself, on a device in my pocket, and I maintain — based on that recording — that I never said the word "no" once. I have not had that recording independently transcribed and compared against his statement word-for-word in the years since, so I am presenting this as my own contemporaneous claim, not an independently verified transcript match. Deputy Wilford's testimony about the February 2021 stop is not disputed here on its specific factual content; both officers are included because a reader trying to understand what evidence the jury actually heard, beyond the bare fact of a guilty verdict, deserves to know what the department's witnesses said and where I say the record itself contradicts one of them. By my own account, the presiding judge that day was a Justice Court judge normally seated in Union County rather than Lafayette — an unusual cross-county assignment I have not independently verified through the docket, and which is flagged here as my own recollection rather than a confirmed record.</p>
<p>It is worth sitting with how unusual that split is, statistically and structurally, before drawing any conclusion from it. A single trial, resolving nine charges from three different sources, in which every charge from one source results in conviction and every charge from a second, entirely separate source results in acquittal, is not the pattern one would expect from a docket of genuinely independent, randomly distributed allegations. It is, instead, exactly the pattern one would expect if the charges brought by Crowder — filed by a private individual with a documented history, established in Chapters 6 through 9, of unsubstantiated accusations recurring on a roughly annual cycle — were weaker on their evidentiary merits than the charges brought by a law enforcement agency with subpoena power, forensic resources, and institutional credibility a private citizen's allegations simply do not carry into a courtroom.</p>
<p>That is the charitable reading, and it may well be the correct one: courts convict on strong evidence and acquit on weak evidence, and a law enforcement agency's charges being, on average, better evidenced than a private litigant's charges is not itself suspicious. It is the ordinary operation of an adversarial system doing exactly what it is designed to do. I do not want to overclaim the significance of the LCSD-guilty/Crowder-not-guilty split beyond what it can support, and I explicitly decline to read it as proof of a coordinated frame — the far more mundane explanation, that institutional prosecutions tend to be built on stronger foundations than one ex-partner's accusations against another, fits the facts at least as well.</p>
<p>What this chapter can say with more confidence, because it does not depend on inferring intent from an acquittal pattern, is what happened to the evidence in the DUI portion of the case. Sheriff Joey East testified at this trial that footage from the February 2021 Beavers stop was "gone forever." This is the same claim examined in Chapter 11, and its significance compounds here: East's testimony at this trial is the on-the-record moment when "gone forever" entered the sworn transcript, not merely my account of an informal conversation. Roughly a year later, in testimony connected to an entirely different proceeding, East would testify that jail parking-lot video from his department is, in fact, selectively preserved — a direct and irreconcilable contradiction with what he told this court in November 2021 about a different but related category of the same department's video evidence.</p>
<p>A sheriff testifying under oath that evidence is "gone forever," and later testifying under oath in a separate matter that his department's practice is actually selective preservation rather than uniform, non-recoverable loss, has given two courts two different and incompatible accounts of how his department handles video evidence. That contradiction does not retroactively prove the DUI stop was fabricated, or that the November 2021 convictions were unjust on their merits. It does mean that whatever this trial concluded about the DUI charge, it concluded it without access to footage that a sheriff's own later, contradictory testimony suggests may not have actually been "gone forever" at all.</p>
<p>The convictions from this trial — most consequentially, the DUI conviction on the record when Mississippi's aggravated-stalking enhancement provisions came into play the following year — are not vacated, reversed, or otherwise disturbed by anything in the available record. They stand. What this chapter adds to them is context: a sheriff's own later words casting doubt on whether the jury that convicted me in November 2021 had access to all the evidence it should have had, and a charge-outcome pattern that, while explicable on entirely innocent grounds, sits uncomfortably close to what institutional overreach against a private citizen would look like if it were happening.</p>
<p>The month after this trial, in December 2021, my fight with Lafayette County's court system reached its most direct confrontation yet — not in a courtroom, but in a parking lot, where Sheriff East himself blocked my car from leaving. That confrontation, and the judge-swap discovery that provoked it, is the subject of the next chapter.</p></section><section class="chapter"><p class="cnum">Chapter 15</p><h1>Circuit Court Chess Game</h1><p>On December 6, 2021, I confronted Circuit Clerk Jeff Busby over the Smith-to-Luther judge swap first raised in Chapter 9 — the unexplained substitution of Judge John Kelly Luther for Judge Kent Smith on my 2020 post-conviction relief matter, a swap I say I watched happen not once but twice, with no stated reason on the record either time.</p>
<p>What happened in the Busby confrontation itself is not captured on any recording I have. What is captured, on a phone call I placed that same day to Judge Luther's own court administrator, Kathy, is a version of events close enough in time to the confrontation to serve as a real-time account rather than a reconstructed one. On that call, I raised the judge-swap issue directly, and pressed the point that a Rule 59 rehearing motion I had filed just days earlier, on December 3, had been assigned to Judge Kent Smith and then silently reassigned to Judge Luther over the following weekend — the exact substitution pattern first raised in Chapter 9, now confirmed happening a second time, with no explanation entered on the record either time. Busby, per my account and per what the recording captures me saying contemporaneously, told his deputy clerk — I have her name from a later recording as China Snervo, though I flag that spelling as phonetic rather than document-confirmed — not to answer my questions, then got on his cell phone, presumably to call Sheriff Joey East directly. What is documented after that, because it happened in a way that left its own physical trace in the timeline and was captured on video, is what came immediately after it: within approximately five minutes, East pulled up, got out of his car, physically blocked my car from leaving the courthouse premises, and told me not to go back into Circuit Court unless I had something to file, because I was, in his words, disturbing their business.</p>
<p>This is worth pausing on as its own discrete fact, separate from whatever was said in the Busby confrontation that preceded it. A sheriff physically blocking a private citizen's vehicle, and barring that citizen from a public courthouse's circuit court, is an extraordinary escalation — the kind of action that ordinarily requires either an active safety threat or a specific court order restricting the person's access, neither of which the available record establishes as having existed at that moment. Whatever I said to Busby about the judge swap, and whatever Busby's response was, the sheriff's response — physical obstruction of a vehicle and an exclusion from a public court — is a response to a citizen's question about judicial assignment irregularities that goes well beyond what any legitimate law-enforcement interest in the exchange could plausibly justify.</p>
<p>This is also the moment in the timeline where two threads from earlier chapters need to be held together, because the following day's events, detailed in the next chapter, cannot be understood without both of them. The first thread is the years-long pattern of conflict traced since Chapter 4 — a pattern in which nearly every significant escalation between Lafayette County's institutions and me traces back, in one way or another, to my raising a documented irregularity the institution in question had no clean answer for, this judge swap now among them. The second thread is the pattern, developing in real time by December 2021, of those same institutions responding to inconvenient questions not with answers but with escalation — a pattern that reaches, in this chapter, its most physically direct form yet: a car blocked, a courthouse barred, on the strength of a clerk confrontation nobody outside the two men involved actually witnessed.</p>
<p>None of this is offered as proof that Busby's own explanation, or lack of one, for an unexplained judicial substitution on my case should be dismissed outright — only as context for how seriously to weigh it.</p>
<p>It would be irresponsible to assert, without more direct evidence than currently exists, that East's December 7 decision to seek my commitment (detailed fully in the next chapter) was retaliation for the December 6 Busby confrontation rather than a good-faith response to a genuine mental-health concern East believed he was observing. Sheriffs do have a legitimate, sometimes life-saving role in initiating psychiatric holds for people in genuine crisis, and nothing here suggests, glibly, that every commitment sought by a law enforcement official in this story was necessarily pretextual. What can be said, based on the documented sequence alone, is that the timing is close enough — a confrontation over a judicial irregularity on December 6, followed within twenty-four hours by the same sheriff who had just blocked my car seeking my commitment — that a reasonable reader is entitled to ask the question, even if the available record cannot answer it with certainty.</p>
<p>The next chapter follows that commitment in full: Judge Lawrence Little's signed affidavit, the roughly two-week detention that followed, and what it meant for me as someone who, by December 2021, had spent four and a half years accumulating documented reasons to distrust nearly every official who now held the power to decide whether I was well.</p></section><section class="chapter"><p class="cnum">Chapter 16</p><h1>Commitment</h1><p>On December 7, 2021, one day after Sheriff Joey East blocked my car and barred me from Circuit Court in the confrontation detailed in the previous chapter, East sought my involuntary psychiatric commitment. Judge Lawrence Little signed the supporting affidavit. I was committed from December 9 to December 23, 2021 — a detention of roughly two weeks.</p>
<p>I have audio of the actual moment it happened, and I include it here because it captures something the bare procedural summary cannot: how ordinary and almost apologetic the machinery of a commitment can sound while it is being carried out. At approximately 5 p.m. that day, I had just returned home from a doctor's appointment for one of my children when a deputy I knew, Joe Gould, arrived at my residence with the writ. "We've got some papers for you," he told me. When I asked what it was, he said someone had signed a writ on me for "bringing you in for mental treatment." I asked to see the affidavit that was supposed to accompany the writ. He didn't have one — the paperwork he was holding had, in his own words, "a red sign on it" and didn't say who had signed it. I asked him to call his supervisor. "I am the supervisor," he told me. I asked for a cigarette first. The exchange was not hostile on either side; Gould told me plainly, more than once, that he wanted to be cordial, and he was. That is worth naming precisely because it complicates any simple villain-and-victim reading of this chapter: the deputy standing on my porch that afternoon was not the architect of what was happening to me, and by every indication in the recording, he did not relish carrying it out. He was executing a writ that, on his own account, lacked the affidavit state law says should accompany it — and I was taken into custody, in front of my wife and one of my children, on paperwork even the man serving it could not fully explain.</p>
<p>This commitment did not happen in a vacuum, and I owe the record the fuller picture rather than the simpler version I believed at the time. I later recorded a call — uploaded roughly ten months afterward, in October 2022 — with Rachel Alcorn, the Communicare employee supervising my case, and pressed her directly on whether Sheriff East had fed her the information behind the affidavit. She would not confirm it. Every time I asked how the information reached her, or whether East had called or come to her office, she deflected to the affidavit itself and declined to describe the process further.</p>
<p>What she did tell me, and what I did not know before that call, is that I was already under a pre-existing outpatient commitment order out of Calhoun County, and that Communicare's outpatient treatment team had been trying, without success, to engage me in mandated treatment since at least September 2021 — including a letter to that county's circuit clerk documenting the non-compliance. Alcorn's stated position was that this commitment was not invented out of nothing: it was an escalation of an existing order, triggered by newly reported "concerning behavior" — my recording people in public places, and an incident she characterized as "provoking people with a minor child," which I understood to mean the September 2021 drone incident described in Chapter 13, where my stepdaughter was present for what was in fact an accident, not a provocation. I dispute that characterization on the call, and I dispute it here.</p>
<p>I still believe, and said so on that same call, that the timing — a commitment beginning the day after I confronted Sheriff East over the judge-swap discovery — is more than coincidence, and that East had some hand in what reached Communicare. But I want to be precise about what the record actually shows: Alcorn never admitted that on tape, the affidavit's stated basis was an existing outpatient order I had genuinely not complied with, and my suspicion about East's specific role remains my own belief, not something Alcorn confirmed. This is the same institutional pairing — East and Communicare — that would recur two months later under circumstances detailed in Chapter 17, and I named that pattern myself, on camera, before I knew it would repeat. That pattern is real. The precise mechanism behind this first instance of it is less certain than I originally believed.</p>
<p>Mississippi's civil commitment process, as a procedural matter, typically runs like this: an affiant — often a family member or a law enforcement officer — signs a sworn statement before a chancery or county judge alleging the statutory grounds for commitment, the judge can issue an order for the person to be taken into custody for an emergency evaluation, and a subsequent commitment hearing, usually before a special master or chancellor, determines whether continued confinement is warranted based on examining physicians' findings. Mississippi's civil commitment statute, like those of most states, requires an affiant to attest that the person in question presents a substantial likelihood of physical harm to themselves or others, or is otherwise unable to care for themselves, as a result of mental illness. The underlying affidavit's specific factual allegations are not accessible here, so whether the standard was met on its own terms, independent of the surrounding context already laid out, cannot be said with certainty. What can be said is that the sequence — a confrontation over a documented judicial irregularity, followed within twenty-four hours by the same law enforcement official who had just physically obstructed the citizen's vehicle initiating a two-week involuntary detention — sits at the very center of the central, unresolved tension running through this whole period of my life.</p>
<p>It is worth being explicit about why this tension cannot simply be resolved by picking a side. Involuntary commitment exists, as a legal and clinical mechanism, because some people genuinely are in acute psychiatric crisis and genuinely do need to be protected from themselves or from harming others, and family members, doctors, and law enforcement officers who initiate that process in good faith are performing a difficult and sometimes life-saving function. It is also true, as a matter of well-documented history that long predates any of this and extends far beyond Lafayette County, Mississippi, that psychiatric commitment has been used, in other times and places, as a tool of convenience by officials who found a particular person's ongoing legal challenges, public accusations, or simple persistence inconvenient — a mechanism that offers the appearance of care while producing the practical effect of silencing and removing someone from circulation, without the due-process protections that would attach to a criminal detention for the same underlying conduct.</p>
