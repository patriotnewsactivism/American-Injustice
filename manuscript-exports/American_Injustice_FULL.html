<p>That same call, Talbot read me the written judgment's special condition verbatim, and it matched — almost word for word — the language I'd struggled to pin down live on the video call at sentencing. It reads that I may not be physically present at the John M. Shaw Federal Courthouse in Lafayette, or any other federal courthouse in the state of Louisiana, or on any adjacent grounds owned or leased by the United States, unless I have "legitimate business" with an occupant of the courthouse, in which case I have to notify the U.S. Marshals Service at least two business days ahead of time. Talbot's own reading is that it's confined to Louisiana, that it reaches the land around a courthouse — parking lots, and by his account probably the public sidewalk out front, since that's routinely government-owned or leased — but that it stops there and doesn't extend to a federal building that isn't part of a courthouse complex. He was careful to tell me that's his best professional judgment, not a settled ruling, and that both "legitimate business" and the adjacent-grounds language are exactly what he intends to attack as unconstitutionally vague and overbroad on appeal. I asked him what happens if I ever wanted to sue the Marshals themselves — would I have to notify the people I'm suing that I'm coming to file against them? He confirmed: yes, the condition as written doesn't carve out an exception for that, and doesn't require their permission, only notice. I'll let the irony of that speak for itself.</p>
<p>The most concrete new piece of the call was Talbot's answer to the question the judge wouldn't give me at sentencing — how a two-year probationary term squares with a thirty-day statutory maximum, if that maximum is ever actually tested. His answer: it can't, not lawfully. The underlying offense carries a hard thirty-day ceiling, full stop, no matter how the time gets divided across a case. If I'm ever revoked, his position is that the revocation itself ends the probation — there's no legal mechanism to sentence me a third time on the same charge once thirty total days, minus whatever credit I've already served, have been exhausted. He told me that at the sentencing sidebar, the judge himself had said, in essence, "I can't give him time served and probation" — then decided to impose probation anyway and said he'd "go back and clean it up" in the written order. Whether that cleanup actually resolved the tension, or just buried it in language that still doesn't add up on paper, is one of the questions this appeal exists to answer.</p>
<p>Talbot flagged a real-world version of the same problem that has nothing to do with legal theory: if I'm ever arrested anywhere on an alleged violation, transport delays between jurisdictions — Galveston to Lake Charles is the exact route he named — could easily put me in custody past that thirty-day ceiling before I ever see a judge again. He called it "a real concern," the kind of gap where the Constitution says you're entitled to release and the actual machinery of moving a prisoner across two states doesn't care. I don't have a way to fix that in advance. I can only put it on the record now, the way Talbot suggested, so that if it happens, there's a written trail showing I said so first.</p>
<p>He closed the call comparing this case, petty offense or not, to <em>Cohen v. California</em> — a single-word T-shirt case from 1971 that nobody thought mattered until it became the law everyone cites. I don't know if history will treat this case the same way. I know the government spent real money and real institutional weight pursuing a man with a camera, and Talbot's read — shared, evidently, by the government's own conduct — is that they know exactly why a petty offense like this one is worth that much effort.</p></section><section class="chapter"><p class="cnum">Chapter 39</p><h1>The Financial Warfare Of Constitutional Litigation</h1><p>Across the previous thirty-five chapters, I have documented a legal and institutional conflict spanning eight years, two states, and more than a dozen separate courts, agencies, and departments. I step back now from the narrative to ask a question none of the preceding chapters could fully answer while staying inside the story: what did all of this actually cost, and who was built to survive that cost?</p>
<p>Start with the bond amounts alone, because they are the plainest, most quantifiable measure of it. The original 2017 Lynch charge carried a $150,000 bond, set by Justice Court Judge Carolyn Bell. The 2023 Galveston felony DWI charge — the one built on a contradicted affidavit, corroborated by a federal magistrate's later findings — carried a $100,000 bond, and held me in pretrial custody for approximately eleven months before the felony was quietly downgraded. A person facing $250,000 in cumulative bond exposure across two proceedings, years apart, in two different states, is not a person the system expected to be able to simply post bond and walk. Bond amounts of this size function, whatever their stated purpose, as a form of pretrial punishment for anyone who cannot immediately produce them — and I, a veteran discharged under other-than-honorable conditions, working as an independent journalist without institutional backing, was never going to be able to produce them.</p>
<p>I have said plainly, on camera, what the cumulative effect of eight years of this litigation was on my actual housing situation: I lost four houses over four years, fighting this without an attorney for most of it. I am not going to reconstruct a property-by-property accounting here that I cannot document to the standard the rest of this book holds itself to — I don't have deeds, mortgage statements, or foreclosure filings assembled for each one. What I can state, because I have said it consistently and it is consistent with everything else in this chapter, is the shape of the loss: a homeowner, over the same eight years documented across the preceding thirty-five chapters, became a man living out of his car, and the legal bills, lost work, and repeated pretrial detentions detailed throughout this account are the most obvious explanation available for how that happened.</p>
<p>Then count the towing and impoundment fees, the small-dollar charges that recur across 2025 and 2026 almost as a background hum beneath the larger legal drama: the June 2026 seizure of my 2016 Mitsubishi Outlander in Galveston, held twenty-two hours and towed to a lot charging $373.94 for two days, on top of a base impound fee Galveston's own municipal code caps — a cap a private towing company appears, per a June 2026 temporary restraining order, to have stacked additional daily storage and surcharge fees on top of, in what that TRO itself characterized as a profit-motive argument. A single tow-and-impound cycle costing several hundred dollars is a rounding error against a $100,000 bond. It is also, for a homeless veteran living out of my car — my own documented living situation across large stretches of this timeline — potentially the difference between having a functioning vehicle and not having one, a distinction that matters enormously to me, a person whose work requires me to travel between courthouses, file records requests in person, and simply survive.</p>
<p>In Chapter 25, I already identified the single most consequential financial variable in this entire eight-year story: the presence or absence of counsel. My 2022 pro se federal lawsuit against Lafayette County, filed without a lawyer, was dismissed with prejudice. The 2024 post-conviction relief petition that produced the January 2025 full vacatur of my 2022 stalking conviction was filed by Jacob Howard of the MacArthur Justice Center — a nationally recognized civil rights litigation organization with institutional resources no individual pro se litigant can replicate. The difference between those two outcomes is not, primarily, a difference in the strength of my underlying grievances; the underlying facts supporting both filings were substantially the same facts documented since Chapter 5. The difference is the presence of institutional legal resources in one case and their absence in the other.</p>
<p>This is where this chapter's title earns its place. "Financial warfare" is a strong phrase, used deliberately rather than lightly. It is not a claim that any specific official set out, consciously, to bankrupt me into submission — there is no evidence supporting that specific intent, and none is alleged here. It is a claim about structure and effect, independent of intent: a system in which $150,000 and $100,000 bonds, stacked towing fees, and the sheer multi-year duration of parallel litigation across multiple states functions, in its cumulative effect, as a mechanism that favors institutional defendants — counties, cities, federal agencies, all backed by public budgets and government attorneys who are paid regardless of outcome — over an individual plaintiff who must personally absorb every dollar of bond, every towing fee, every filing cost, and every hour of unpaid labor spent drafting my own pro se motions, while also trying to survive day to day.</p>
<p>My own pro se litigation sophistication grew considerably over this period — the nine motions citing thirty-two Supreme Court cases filed in Union County Justice Court in May 2026, detailed in Chapter 36, reflect a considerably more sophisticated litigant than I was when I filed the dismissed 2022 federal complaint four years earlier. That growth is itself telling: it took years of forced, unpaid legal self-education, conducted while homeless and while fighting parallel cases in multiple states, for me to develop the litigation skill that institutional defendants could simply purchase from day one, with public money, without having to personally live through a single day of what they were defending against.</p>
<p>No policy solution to this asymmetry is offered here — that isn't the point of this chapter. What follows instead is documentation: a decade-long record of exactly what it costs, in dollars and in years, for one individual to hold a set of local, state, and federal institutions accountable through the American legal system's own designated channels — and a clear-eyed accounting of how much of that cost fell on me personally, rather than on the institutions whose conduct I have examined across these thirty-five chapters. The epilogue that follows closes not with a verdict, because my story does not yet have one, but with where things stand as of this writing, and what remains unresolved.</p></section><section class="chapter"><p class="cnum">Epilogue</p><h1>The Fight Continues</h1><p>I began with a flag petition in September 2016 — a small, unremarkable act of civic participation, 4,486 signatures gathered under my name, Matt Reardon, that would spend the next decade becoming synonymous, across two states and more than a dozen courts, with one of the more sustained individual confrontations with local and federal institutional power this country's recent history has documented. Both of the two proceedings that were still pending when I drafted my last chapter have since resolved, within three days of each other, and I close this book with both outcomes in hand rather than in anticipation.</p>
<p>On August 7, 2026, I was sentenced in the federal courthouse case to time served — roughly thirteen days — plus two years of unsupervised probation, no fine, and a restriction barring me from entering the John M. Shaw federal courthouse or any federal courthouse in Louisiana without giving the U.S. Marshals Service two business days' notice of legitimate business. It was not the outcome an outside observer might have expected given everything documented in Chapters 27 through 29 — the BOLO alerts predating any charge by two months, the spoliated lobby footage, a magistrate who recused herself months earlier over the appearance of bias created by the Marshals' own pre-charge communications. It was, in the sentence itself, a comparatively light outcome. It was not, in what the sentencing court told me at sidebar, a clean ending: "time served" is credit against a future revocation, not unconditional discharge, and if the two years of probation are ever revoked, I face resentencing on the original charge with credit for time already served, not a closed book. The fourteen-day clock to appeal that judgment is one of two appellate deadlines I am now living inside simultaneously.</p>
<p>The second is Reardon v. Osteen. On August 10, 2026 — three days after the sentencing above — this federal civil rights case, the one that had spent thirteen months documenting a Galveston police officer's own department conceding, on the record, that he lied about smelling alcohol on my breath, was dismissed in its entirety. Judge Jeffrey Vincent Brown adopted Magistrate Judge Edison's recommendation "in its entirety," granted the three pending motions to dismiss, sua sponte dismissed the remaining defendants for failure to state a claim, declined jurisdiction over my state-law claims, and denied my request for injunctive relief. Final judgment followed the same day, one paragraph long. Beyond the amendment issue — the court noting I had already been given leave for a second amended complaint five months late, and would not be given a third — the order does not individually address any of my nine objections. I have filed a protective notice of appeal. The clock runs thirty days from August 10, 2026.</p>
<p>This is not the shape a conventional book chooses for its ending, and the reason for that has been plain since the prologue: my story is not over, even now, with both remaining threads from my last chapter formally resolved. Nothing in the thirty-six chapters that precede this epilogue represents a closed case in the ordinary sense, and neither of the two rulings that arrived in the first two weeks of August 2026 closes it either. The federal courthouse conviction stands, appeal window running. The Osteen case stands dismissed, appeal window running, its actual reasoning still withheld from me by the same court that issued it. The gag order stands, pending my own planned post-sentencing challenge to it. Even the fully vacated 2022 stalking conviction and the reversed 2024 dismissal — the two clearest institutional acknowledgments of error documented in Chapters 25 and 26 — arrived only after years of litigation, and only for two of the many separate proceedings I have traced across these chapters. The pattern holds even at the very end: a citizen's right to know why he lost a federal case, secured on paper by a rule with no ambiguity in its text, still had to be fought for separately from the case itself.</p>
<p>What can be said with confidence, having tried across every chapter to hold two things true at once rather than choosing the simpler, one-sided version of my story, is this: my decade-long conflict with the institutions of Lafayette County, Mississippi, and later with institutions in Louisiana, Texas, and beyond, contains real, documented, and in several instances judicially confirmed institutional misconduct — spoliated evidence, contradicted sworn testimony, a duress-signed order that metastasized five years later into a felony conviction, a sheriff who told two courts two incompatible things about the same category of video evidence, a Galveston officer whose own department's later court filing conceded he lied about what he smelled. It also contains, documented with the same honesty applied to every institutional failure, a pattern of my own conduct that a fair reader is entitled to find troubling: confrontations that escalated past documentation into provocation, children present at moments of real risk, a livestream caption suggesting I understood I was inviting the very confrontation that followed, and choices about my own safety and judgment that were never uniformly sound.</p>
<p>Both of these things are true, in the same man, across the same decade, and my central argument — my layered thesis, named explicitly in my earliest pages and honored, chapter by chapter, through my last — is that neither fact cancels the other out. A person can behave in ways that invite scrutiny and criticism, and the institutions responding to that person can still, independently, behave unlawfully, unfairly, or dishonestly in how they respond. American constitutional protections do not exist only for citizens whose conduct is beyond reproach; they exist, if they mean anything at all, precisely for citizens whose conduct is imperfect, confrontational, and sometimes genuinely difficult for the officials tasked with responding to it. Measuring whether those officials met their own legal and constitutional obligations, independent of whether their subject was easy to like, is what I have tried to do across every one of these thirty-six chapters.</p>
<p>Whatever the courts still deciding my fate ultimately conclude — about the courthouse conviction now on appeal, about the Osteen dismissal now on appeal, about the gag order I intend to challenge once I am no longer bound by it — the documentary record I have assembled here will not change. The bill of sale still postdates the alleged threat by twelve days. The FBI form is still missing. The judge swap still happened twice with no stated reason. The sheriff still told two courts two different things about the same evidence. The Galveston officer's own department's filing still concedes he lied about what he smelled. The BOLO alerts still predate the arrest they eventually produced by two months. None of this is argued on my behalf. These are facts found in the record, sourced as carefully as the available material allowed, and reported honestly alongside every place where that same record required equal honesty about my own conduct.</p>
<p>I chose the title American Injustice, not Reardon's Injustice, because the belief underlying it — earned, hopefully, through documentation rather than assertion — is that what happened to me across Lafayette County, Mississippi, and the institutions that followed me beyond it, is not only my personal story. It is a case study in what happens when a citizen without money, without a law degree, and without institutional backing tries to hold local and federal power accountable through the very legal channels that power designed for exactly that purpose — and in how long, how expensive, and how uncertain that fight remains, even when the underlying facts, eventually, in enough instances to matter, are found to support me.</p>
<p>The fight continues. I will update as it does.</p></section><section class="chapter"><h1>Legal Analysis</h1><p><em>A note on what this section is. It is an analysis of the legal architecture this story runs through — written for a reader, not for a court, and not legal advice to anyone, including me. Where the law cuts against me, it says so. Several of the doctrines below are the reason I lost cases I still believe I should have won, and a reader who does not understand them will misread this book as a story about villains when a great deal of it is a story about rules.</em></p>
<hr>
<p><strong>I. THE CENTRAL PROBLEM: PROBABLE CAUSE SWALLOWS RETALIATION</strong></p>
<p>The through-line of this book is retaliation — that I was arrested, charged, surveilled, and prosecuted because of what I said, filmed, and published. The law has a specific and largely unforgiving answer to that claim.</p>
<p>Under <em>Nieves v. Bartlett</em> (2019), a plaintiff bringing a First Amendment retaliatory-arrest claim must generally plead and prove the <strong>absence of probable cause</strong> for the arrest. If probable cause existed, the claim usually fails no matter how retaliatory the officer's actual motive was, and no matter how well documented that motive is. The Court left a narrow exception: where a plaintiff shows objective evidence that he was arrested when <strong>otherwise similarly situated individuals not engaged in the same protected speech had not been</strong>.</p>
<p>That exception is where my strongest federal claim died. The record reflects that my retaliation claim failed on comparator evidence — I could not produce the proof that others doing what I did, without the camera and the criticism, were left alone. That is not a technicality. It is the whole ballgame, and it explains an outcome that otherwise looks inexplicable: a documented two-month surveillance record, and a claim that still loses.</p>
<p>The practical lesson runs the other way from the intuition. <strong>A well-documented motive is worth less than a boring spreadsheet of who else got arrested.</strong> If I had spent a fraction of the energy I spent filming on gathering comparator data — arrest logs for the same ordinance, the same lobby, the same conduct — the analysis would have been different.</p>
<p><strong>II. QUALIFIED IMMUNITY, AND THE CLAIM I WON AND LOST AT THE SAME TIME</strong></p>
<p>The most instructive thing that ever happened to me in federal court is that I <strong>won a Fourth Amendment seizure claim on the merits and lost the case anyway.</strong></p>
<p>Qualified immunity shields a government official from damages unless the plaintiff shows the official violated a right that was <strong>clearly established</strong> at the time — meaning, in practice, that some prior case with closely similar facts had already held the same conduct unconstitutional. It is entirely possible, and routine, for a court to find that your rights <em>were</em> violated and that nobody owes you anything.</p>
<p>Two things compounded it in my case. First, the doctrine itself. Second, and worse: part of the claim was <strong>not briefed</strong>. A pro se litigant who wins a legal point and fails to brief its companion has forfeited it as surely as if he had lost it. Courts do read pro se filings liberally — <em>Haines v. Kerner</em> (1972) requires that — but liberal construction is not a substitute for argument, and it will not raise an issue you did not raise.</p>
<p><strong>III. WHY THE 2020 FEDERAL SUIT NEVER HAD A CHANCE</strong></p>
<p>In late 2020 I filed a §1983 complaint over the Olive Branch contempt arrest, read it aloud on camera before filing it, and lost it to a dismissal for failure to state a claim. I have spent years describing that dismissal as part of the pattern. It was not. It was a pleading failure, and the defects are visible on the face of what I read into my own camera.</p>
<ul><li><strong>I sued the State of Mississippi.</strong> The <strong>Eleventh Amendment</strong> bars suits against a state in federal court. That defendant was gone before the clerk stamped it.</li><li><strong>I sued the City of Olive Branch as an entity</strong> without pleading a policy or custom. Under <em>Monell v. Department of Social Services</em> (1978), a municipality is not liable for its employees' acts on a respondeat superior theory. You must identify a policy, a custom, or a final policymaker's decision. I identified none.</li><li><strong>I described the defendants as "federal corporations."</strong> That theory has no basis in law, is associated with sovereign-citizen filing practice, and does nothing but tell a judge not to take the rest of the document seriously.</li></ul>
<p>I include this because the book is worthless if it only reports the losses that flatter me. <strong>The system did not take that case from me. I gave it away.</strong></p>
<p><strong>IV. JUDICIAL IMMUNITY: THE WALL AROUND THE CONTEMPT ARREST</strong></p>
<p>The Olive Branch contempt arrest is, to me, the single most outrageous thing in this book — I was summoned by a judge, warned for appearing, asked a question, and jailed for answering it.</p>
<p>It is also close to unsuable. Under <em>Stump v. Sparkman</em> (1978) and <em>Mireles v. Waco</em> (1991), judges have <strong>absolute immunity</strong> from damages for judicial acts, even acts alleged to be malicious, corrupt, or in excess of authority. Immunity fails only for non-judicial acts, or acts taken in the complete absence of all jurisdiction. Holding a person in contempt in a courtroom is the paradigm of a judicial act.</p>
<p>The meaningful remedy was never damages. It was the one I actually got: <strong>the contempt charge was dismissed outright</strong>, and the recording is public.</p>
<p>There is a separate and better argument I did raise at the time, and it has real doctrinal support. Where a judge is personally the object of the contempt, due process can require that <strong>a different judge</strong> try it — the concern in <em>In re Murchison</em> (1955) and <em>Mayberry v. Pennsylvania</em> (1971), that no man may be judge in his own case. On the record of that initial appearance, I argued I could not get a fair trial "before my accuser as my jury." The judge answered the jury question and never reached the same-judge question. That was the strongest point available and it went unanswered.</p>
<p><strong>V. THE FOURTH AMENDMENT AND THE GALVESTON BLOOD DRAW</strong></p>
<p>The blood draw is governed by a clear line of authority. <em>Missouri v. McNeely</em> (2013) held that the natural dissipation of alcohol does not create a per se exigency justifying a warrantless blood draw. <em>Birchfield v. North Dakota</em> (2016) held that while a <strong>breath</strong> test may be taken incident to a lawful DWI arrest, a <strong>blood</strong> test may not — blood requires a warrant or an exception. <em>Mitchell v. Wisconsin</em> (2019) carved out a narrow allowance for unconscious drivers.</p>
<p>Against that framework, the salient facts are: I demanded a breath test repeatedly and was refused; I was taken to a hospital instead of a station; I was told a warrant was being sought; and <strong>I was never shown a warrant</strong>. Roughly eight officers held me face-down while blood was drawn.</p>
<p>Whether that violated the Fourth Amendment turns on one question the book cannot yet answer: <strong>did a warrant exist?</strong> A warrant that existed but was never shown to me is lawful and merely discourteous. A blood draw with no warrant and no applicable exception, over an express demand for the less intrusive test the law prefers, is a different matter entirely. That document is an outstanding item, and I will not assert the conclusion before I have it.</p>
<p>The related Fifth Amendment question — whether compelled production of a phone passcode is testimonial — remains genuinely unsettled and split across jurisdictions. It was never litigated in my case because the phone came back and the charge went to my accuser.</p>
<p><strong>VI. THE ENHANCEMENT THAT COULD NOT ARITHMETICALLY BE RIGHT</strong></p>
<p>Texas grades driving while intoxicated as a third-degree felony on a <strong>third or subsequent</strong> offense. I swore, and repeat here, that I have one final DWI conviction. I was booked for <strong>"Felony DWI (3 or more)."</strong></p>
<p>This is the cleanest claim in the book precisely because it requires nobody to believe me about anything. Criminal histories are documents. Charging instruments either allege two prior convictions or they do not. An attorney standing in at my magistrate hearing the next morning caught it and said so on the record. If the enhancement paragraph alleged priors I do not have, that is not a judgment call about an officer's state of mind — it is a countable error, on paper, within hours.</p>
<p><strong>VII. THE COVENANT NOT TO SUE</strong></p>
<p>The 2017 plea was conditioned on my signing a covenant not to sue the county, the city, their officials, their deputies, and the private complainants — for everything up to and including the arrest.</p>
<p>These are called <strong>release-dismissal agreements</strong>, and they are not automatically void. <em>Town of Newton v. Rumery</em> (1987) held that such an agreement may be enforceable, but only after a case-specific inquiry into whether it was <strong>voluntary</strong>, whether there is evidence of <strong>prosecutorial overreaching</strong>, and whether enforcing it would harm the <strong>public interest</strong>. The burden is on the party seeking enforcement.</p>
<p>Every fact I have described about how that plea was obtained — the $150,000 bond, the counsel who had gone to law school with the opposing petitioner and appeared in a matter he was not retained for, the warning that the county would stack charges if I went to trial — goes directly to the <em>Rumery</em> factors. Whether the covenant would survive that inquiry is not something this book can decide, and it is genuinely uncertain. What is not uncertain is that <strong>a criminal disposition delivered civil immunity to the same institution that brought the charge</strong>, and that this is a structural feature of American plea practice rather than a quirk of my case.</p>
<p><strong>VIII. NOTICE: THE PATTERN THAT REPEATS ACROSS THREE COURTS</strong></p>
<p>The Sixth Amendment guarantees the accused the right "to be informed of the nature and cause of the accusation." Texas guarantees it independently at Article I, §10.</p>
<p>Three times, in three jurisdictions, across two states and six years, I was made to defend an accusation I had not been permitted to read:</p>
<ul><li><strong>2017, Lafayette County</strong> — I received the charging affidavit only by demanding it at the jail.</li><li><strong>December 2020, Olive Branch</strong> — I told a judge on the record that I had asked three times and been ignored. He directed the prosecutor to respond.</li><li><strong>2023, Galveston</strong> — sworn, in a filed affidavit: the affidavits "have yet to be provided and the motions have not been responded to or ruled upon."</li></ul>
<p>I have come to think this is the most defensible systemic claim in the book, and I did not recognize it as a claim for years because each instance felt like an isolated frustration. It is more universal than any individual conspiracy alleged here, it does not depend on anyone's motive, and unlike almost everything else in these pages <strong>it is corroborated across three separate courts that had no connection to one another.</strong></p>
<p><strong>IX. EVIDENCE THAT WAS NEVER PRODUCED</strong></p>
<p>A recurring feature of these cases is footage that should exist and does not arrive: one of two requested security cameras produced after the December 2020 parking-lot arrest; no sallyport video and no dashcam after the February 2021 field sobriety test; and the lobby-footage preservation issue that a court addressed in the federal case.</p>
<p>The governing frameworks differ and the distinction matters. <em>Brady v. Maryland</em> (1963) requires disclosure of <strong>material exculpatory</strong> evidence in the prosecution's possession. <em>Arizona v. Youngblood</em> (1988) holds that failure to preserve <strong>potentially useful</strong> evidence is not a due process violation <strong>unless the defendant shows bad faith</strong> — a demanding standard that is the reason most spoliation arguments fail.</p>
<p>I want to be precise about something, because the temptation runs the other way. <strong>Missing video does not prove what the video showed.</strong> I have written for years that the sallyport camera would have exonerated me. I do not know that. Nobody does. The honest version is narrower and still damning: I asked for it, it was never produced, and the absence of the record means the only account of that test is the account of the officer who administered it.</p>
<p><strong>X. WHAT A READER SHOULD TAKE FROM THIS</strong></p>
<p>Five things, and none of them are the thing I believed when I started.</p>
<ol><li><strong>Motive is cheap; comparators are expensive.</strong> <em>Nieves</em> means the documented retaliation is often legally inert without proof about everyone who was not arrested.</li><li><strong>Winning the constitutional question is not winning.</strong> Qualified immunity routinely separates the two, and an unbriefed claim is a lost claim.</li><li><strong>Immunities are structural, not conspiratorial.</strong> Judicial immunity, Eleventh Amendment immunity, and <em>Monell</em> dispose of an enormous share of civil rights claims before any fact is examined. When my cases died on these grounds, no one had to conspire.</li><li><strong>The unglamorous claims are the strong ones.</strong> A miscounted enhancement, an unproduced camera, an unserved affidavit — these survive contact with an adversary. Grand theories do not.</li><li><strong>Pro se litigants lose on procedure, not merits, and the system is largely indifferent to that.</strong> The right to represent yourself is not a right to be taught the rules. That, more than any individual official in this book, is what actually cost me.</li></ol>
<p>None of that makes what happened to me acceptable. It makes it <em>legal</em>, in most instances — and the gap between those two words is the reason I wrote this book.</p></section><section class="chapter"><h1>Appendix</h1><p><em>A reference apparatus for the preceding chapters. Everything here traces to a primary-source document, a court record, or a recording in the evidence archive. Where a fact is my own account and nothing more, it is marked. Where a document is referenced but has not been obtained, it is listed in Section F rather than quietly omitted — an appendix that hides its gaps is worse than no appendix.</em></p>

<ol><li><strong>The May 2017 charging affidavit (LK17-295).</strong> The "on or before May 8, 2017" date — which precedes both my purchase of the rifle and my quarrel with the Lynches — rests on my recollection alone. <strong>The date-collision argument is not proved in these pages.</strong></li><li><strong>The signed covenant not to sue, and the LK17-295 plea petition.</strong> The term is described from memory; the instrument has never been produced.</li><li><strong>The Texas DPS licence-suspension letter</strong> stating I refused to provide a sample. Against a blood sample drawn under a warrant, this proves itself on paper — and it is not here.</li><li><strong>The blood-draw warrant.</strong> Officer Osteen testified under oath in July 2024 that he obtained one, signed by a judge. I was never shown it, and <strong>the instrument itself has still never been produced.</strong></li><li><strong>The recorded call</strong> in which Crowder is said to admit the false report was a joint effort.</li><li><strong>The Lafayette County records production</strong> listing roughly fifteen reports filed by Crowder over four years.</li><li><strong>The second security camera</strong> from December 28, 2020; the sallyport and dashcam video from February 20, 2021.</li><li><strong>Deputy John Hill's incident report</strong>, May 30, 2017.</li><li><strong>The Oxford municipal record</strong> for the flag-removal measure. That Mayor Tannehill authored it is my account, twice given, and not yet a document.</li><li><strong>The FOIA production</strong> said to connect a named marshal to the BOLOs.</li><li><strong>The full record of the appeal in 21-cv-494</strong> — initiated nine days after conviction, dismissed thirty months later for failing to perfect, in a matter where a judge had already found me indigent.</li><li><strong>The sealed record in the federal criminal case</strong>, which is subject to a court order and is not discussed in this book beyond the public docket.</li></ol></
